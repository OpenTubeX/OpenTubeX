services:
  sync-server:
    image: ghcr.io/opentubex/sync-server:latest-sqlite
    environment:
      DATABASE_URL: ./data/db.sqlite
      SECRET_KEY: opentubex-local-sync-server-test-secret
      ALLOW_REGISTRATION: "true"
      TRUST_FORWARDED_FOR: "true"
      VALIDATE_SUBMITTED_METADATA: "false"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - sync-server-data:/app/data

volumes:
  sync-server-data: {}
