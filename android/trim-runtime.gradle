import java.util.zip.ZipEntry
import java.util.zip.ZipFile
import java.util.zip.ZipOutputStream
import java.nio.file.Files
import java.nio.file.FileSystems
import org.apache.commons.compress.archivers.zip.ZipArchiveEntry
import org.apache.commons.compress.archivers.zip.ZipArchiveOutputStream
import org.apache.commons.compress.utils.SeekableInMemoryByteChannel
import org.gradle.api.artifacts.transform.CacheableTransform
import org.gradle.api.artifacts.transform.InputArtifact
import org.gradle.api.artifacts.transform.TransformAction
import org.gradle.api.artifacts.transform.TransformOutputs
import org.gradle.api.artifacts.transform.TransformParameters

buildscript {
    repositories { mavenCentral() }
    dependencies {
        // Build-only ZIP support: java.util.zip cannot preserve Unix symlinks.
        classpath 'org.apache.commons:commons-compress:1.28.0'
    }
}

// Keep the downloaded dependency intact. Gradle caches this derived AAR and
// invalidates it when the dependency or transformation changes.
interface RuntimePackerParameters extends TransformParameters {
    @Input
    Property<String> getPackerVersion()

    @Input
    Property<String> getPackerExecutable()
}

@CacheableTransform
abstract class PackNativeRuntime implements TransformAction<RuntimePackerParameters> {
    @InputArtifact
    @PathSensitive(PathSensitivity.NAME_ONLY)
    abstract Provider<FileSystemLocation> getInputArtifact()

    void transform(TransformOutputs outputs) {
        File input = inputArtifact.get().asFile
        new ZipFile(input).withCloseable { archive ->
            def runtimeEntries = archive.entries().findAll {
                it.name.startsWith('jni/') &&
                    (it.name.endsWith('/libpython.zip.so') || it.name.endsWith('/libffmpeg.zip.so'))
            }
            if (runtimeEntries.isEmpty()) {
                outputs.file(input)
                return
            }
            new ZipOutputStream(new FileOutputStream(outputs.file(input.name))).withCloseable { output ->
                archive.entries().each { entry ->
                    ZipEntry copy = new ZipEntry(entry.name)
                    copy.time = 0
                    output.putNextEntry(copy)
                    archive.getInputStream(entry).withCloseable { content ->
                        if (runtimeEntries.any { it.name == entry.name }) {
                            output.write(PackNativeRuntime.repackRuntime(content,
                                entry.name.endsWith('/libpython.zip.so'), parameters.packerExecutable.get()))
                        } else {
                            content.transferTo(output)
                        }
                    }
                    output.closeEntry()
                }
            }
        }
    }

    static byte[] repackRuntime(InputStream input, boolean python, String packerExecutable) {
        byte[] source = input.readAllBytes()
        if (packerExecutable == 'none') return copyRuntime(source, python)
        File staging = Files.createTempDirectory('opentubex-runtime-').toFile()
        File packedDir = null
        try {
            // Read the central directory: local ZIP headers omit Unix modes.
            new org.apache.commons.compress.archivers.zip.ZipFile(
                new SeekableInMemoryByteChannel(source)
            ).withCloseable { archive ->
                archive.entries.each { ZipArchiveEntry entry ->
                    // QuickJS executes via libqjs.so. This static archive is
                    // only needed when linking a new executable at build time.
                    if (python && entry.name == 'usr/lib/quickjs/libquickjs.a') return
                    File target = new File(staging, entry.name)
                    if (!target.canonicalPath.startsWith(staging.canonicalPath + File.separator)) {
                        throw new GradleException("Unsafe runtime path: ${entry.name}")
                    }
                    if (entry.isDirectory()) {
                        target.mkdirs()
                    } else {
                        target.parentFile.mkdirs()
                        if (entry.isUnixSymlink()) {
                            def link = archive.getInputStream(entry).withCloseable {
                                new String(it.readAllBytes(), 'UTF-8')
                            }
                            Files.createSymbolicLink(target.toPath(), new File(link).toPath())
                        } else {
                            archive.getInputStream(entry).withCloseable { content ->
                                Files.copy(content, target.toPath())
                            }
                            if (entry.platform == ZipArchiveEntry.PLATFORM_UNIX) {
                                Files.setAttribute(target.toPath(), 'unix:mode', entry.unixMode & 0777)
                            }
                        }
                    }
                }
            }
            packedDir = Files.createTempDirectory('opentubex-packed-').toFile()
            File packed = new File(packedDir, 'runtime.zip')
            def command = [packerExecutable, 'a', '-tzip', '-mm=Deflate', '-mx=9', '-mfb=258',
                '-mpass=5', '-snl', '-mtm=off', '-bd', packed.absolutePath] +
                staging.list().sort().collect { "./${it}".toString() }
            def process = new ProcessBuilder(command).directory(staging)
                .redirectErrorStream(true).start()
            String log = new String(process.inputStream.readAllBytes(), 'UTF-8')
            if (process.waitFor() != 0) {
                throw new GradleException("${packerExecutable} failed to pack the native runtime:\n${log}")
            }
            return packed.bytes
        } finally {
            staging.deleteDir()
            packedDir?.deleteDir()
        }
    }

    static byte[] copyRuntime(byte[] source, boolean python) {
        def buffer = new ByteArrayOutputStream()
        new ZipArchiveOutputStream(buffer).withCloseable { output ->
            new org.apache.commons.compress.archivers.zip.ZipFile(
                new SeekableInMemoryByteChannel(source)
            ).withCloseable { archive ->
                archive.entries.each { ZipArchiveEntry entry ->
                    if (python && entry.name == 'usr/lib/quickjs/libquickjs.a') return
                    output.putArchiveEntry(new ZipArchiveEntry(entry))
                    archive.getInputStream(entry).withCloseable { it.transferTo(output) }
                    output.closeArchiveEntry()
                }
            }
        }
        return buffer.toByteArray()
    }
}

def availablePackerVersion = 'none'
def availablePackerExecutable = 'none'
if (FileSystems.default.supportedFileAttributeViews().contains('posix')) {
    for (def candidate : ['7zz', '7z']) {
        try {
            def process = new ProcessBuilder(candidate, 'i').redirectErrorStream(true).start()
            def output = new String(process.inputStream.readAllBytes(), 'UTF-8')
            if (process.waitFor() == 0) {
                availablePackerVersion = output.readLines().find { it.startsWith('7-Zip') } ?: 'none'
                if (availablePackerVersion != 'none') {
                    availablePackerExecutable = candidate
                    break
                }
            }
        } catch (IOException ignored) {
            // Keep regular Android builds working where this packer is unavailable.
        }
    }
}

def trimmedRuntime = Attribute.of('org.opentubex.packedNativeRuntime', Boolean)
dependencies {
    artifactTypes.maybeCreate('aar').attributes.attribute(trimmedRuntime, false)
    registerTransform(PackNativeRuntime) {
        from.attribute(trimmedRuntime, false)
        to.attribute(trimmedRuntime, true)
        parameters {
            packerVersion.set(availablePackerVersion)
            packerExecutable.set(availablePackerExecutable)
        }
    }
}
configurations.configureEach {
    attributes.attribute(trimmedRuntime, true)
}
