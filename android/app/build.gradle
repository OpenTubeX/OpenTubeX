apply plugin: 'com.android.application'

def releaseKeystorePath = System.getenv("ANDROID_RELEASE_KEYSTORE")
def releaseStorePassword = System.getenv("ANDROID_RELEASE_STORE_PASSWORD")
def releaseSigningConfigured = releaseKeystorePath?.trim() && releaseStorePassword?.trim()

gradle.taskGraph.whenReady { graph ->
    def releaseTaskScheduled = graph.allTasks.any { task ->
        task.project == project && task.name.toLowerCase().contains("release")
    }
    if (releaseTaskScheduled && !releaseSigningConfigured) {
        throw new GradleException(
            "Release signing is not configured. Set ANDROID_RELEASE_KEYSTORE and " +
            "ANDROID_RELEASE_STORE_PASSWORD."
        )
    }
}

android {
    namespace = "org.opentubex.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "org.opentubex.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode = (System.getenv("ANDROID_VERSION_CODE") ?: "1").toInteger()
        versionName = System.getenv("ANDROID_VERSION_NAME") ?: "0.33.0-dev"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        nightly {
            // This public testing key keeps preview APK updates installable.
            // Never use it for a distributable release APK.
            storeFile rootProject.file("nightly.keystore")
            storePassword "opentubex-nightly"
            keyAlias "opentubex-nightly"
            keyPassword "opentubex-nightly"
        }
        if (releaseSigningConfigured) {
            production {
                storeFile rootProject.file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias "opentubex-android-release"
                keyPassword releaseStorePassword
            }
        }
    }
    buildTypes {
        debug {
            // The public nightly key must never be trusted for the production
            // package identity. Keep preview builds isolated and installable
            // alongside official releases.
            applicationIdSuffix ".nightly"
            signingConfig signingConfigs.nightly
        }
        release {
            minifyEnabled false
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.production
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
