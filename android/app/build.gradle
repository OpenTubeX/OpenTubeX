apply plugin: 'com.android.application'

def releaseKeystorePath = System.getenv("ANDROID_RELEASE_KEYSTORE")
def releaseStorePassword = System.getenv("ANDROID_RELEASE_STORE_PASSWORD")
def releaseSigningConfigured = releaseKeystorePath?.trim() && releaseStorePassword?.trim()

gradle.taskGraph.whenReady { graph ->
    def releaseTaskScheduled = graph.allTasks.any { task ->
        task.project == project && task.name.toLowerCase().contains("release")
    }
    if (releaseTaskScheduled && !releaseSigningConfigured) {
        throw new GradleException(
            "Release signing is not configured. Set ANDROID_RELEASE_KEYSTORE and " +
            "ANDROID_RELEASE_STORE_PASSWORD."
        )
    }
}

def appIconOutput = rootProject.file('../build/generated/app-icons')
def generateAppIconPresets = tasks.register('generateAppIconPresets', Exec) {
    workingDir rootProject.file('..')
    commandLine 'node', '_scripts/brand/generate-app-icon-presets.mjs'
    inputs.files(
        rootProject.file('../src/appIconPresets.js'),
        rootProject.file('../src/constants.js'),
        rootProject.file('../_scripts/brand/generate-app-icon-presets.mjs'),
        file('src/main/AndroidManifest.xml'),
        file('src/main/res/drawable/ic_launcher_monochrome.xml'),
        file('src/dev/res/drawable/ic_launcher_dev_monochrome.xml'),
        file('src/debug/res/drawable/ic_launcher_nightly_monochrome.xml')
    )
    inputs.files(rootProject.fileTree('../_scripts/brand') { include 'icon-*.svg' })
    outputs.dir(appIconOutput)
}
tasks.named('preBuild').configure { dependsOn(generateAppIconPresets) }

android {
    namespace = "org.opentubex.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "org.opentubex.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode = (System.getenv("ANDROID_VERSION_CODE") ?: "1").toInteger()
        versionName = System.getenv("ANDROID_VERSION_NAME") ?: "0.33.0-dev"
        ndk { abiFilters.addAll((project.findProperty('testAbi') ?: 'arm64-v8a,armeabi-v7a,x86_64,x86').split(',')) }
        testInstrumentationRunner(project.findProperty('testBuildType') == 'nightly'
            ? "org.opentubex.app.OptimizedApkInstrumentation"
            : "androidx.test.runner.AndroidJUnitRunner")
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // CI publishes a standalone APK for each CPU plus a universal fallback.
    // Keep local debug/instrumentation builds as one APK.
    splits {
        abi {
            enable project.hasProperty('splitApks') && !project.hasProperty('testAbi')
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'
            universalApk true
        }
    }
    testBuildType project.findProperty('testBuildType') ?: 'debug'
    signingConfigs {
        nightly {
            // This public testing key keeps preview APK updates installable.
            // Never use it for a distributable release APK.
            storeFile rootProject.file("nightly.keystore")
            storePassword "opentubex-nightly"
            keyAlias "opentubex-nightly"
            keyPassword "opentubex-nightly"
        }
        if (releaseSigningConfigured) {
            production {
                storeFile rootProject.file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias "opentubex-android-release"
                keyPassword releaseStorePassword
            }
        }
    }
    sourceSets {
        main.manifest.srcFile new File(appIconOutput, 'AndroidManifest.xml')
        main.res.srcDirs += [new File(appIconOutput, 'android/main/res')]
        debug.res.srcDirs = ['src/dev/res', new File(appIconOutput, 'android/dev/res')]
        nightly.res.srcDirs = ['src/debug/res', new File(appIconOutput, 'android/debug/res')]
        androidTest.assets.srcDirs += ['../../e2e/fixtures/media']
        androidTest.assets.srcDirs += ['../../e2e/fixtures/player-scripts']
    }
    if (project.findProperty('testBuildType') == 'nightly') {
        sourceSets.androidTest {
            java.srcDirs = ['src/optimizedAndroidTest/java']
            manifest.srcFile 'src/optimizedAndroidTest/AndroidManifest.xml'
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/libpython.zip.so', '**/libffmpeg.zip.so']
        }
    }
    buildTypes {
        debug {
            // Local test builds must not receive published nightly updates.
            // Both preview identities stay separate from production because
            // the preview signing key is public.
            applicationIdSuffix ".dev"
            resValue "string", "app_name", "OpenTubeX Dev"
            resValue "string", "title_activity_main", "OpenTubeX Dev"
            signingConfig signingConfigs.nightly
        }
        release {
            // Capacitor and its plugins discover code and resources at runtime.
            // Preserve them without maintaining an incomplete set of keep rules.
            minifyEnabled false
            shrinkResources false
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.production
            }
        }
        nightly {
            initWith release
            applicationIdSuffix ".nightly"
            resValue "string", "app_name", "OpenTubeX Nightly"
            resValue "string", "title_activity_main", "OpenTubeX Nightly"
            signingConfig signingConfigs.nightly
            matchingFallbacks = ['release']
        }
    }
}

apply from: '../trim-runtime.gradle'

// Pairing uses ZXing; exclude the plugin's unused proprietary ML Kit dependency.
configurations.configureEach {
    exclude group: 'com.google.mlkit', module: 'barcode-scanning'
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    testImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"
    implementation "io.github.junkfood02.youtubedl-android:library:0.18.1"
    implementation "io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1"
    implementation "androidx.documentfile:documentfile:1.0.1"
    testImplementation "org.json:json:20240303"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.2.0"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "androidx.work:work-runtime:$androidxWorkVersion"
    implementation "androidx.media3:media3-exoplayer:1.9.2"
    implementation "androidx.media3:media3-exoplayer-dash:1.9.2"
    implementation "androidx.media3:media3-exoplayer-hls:1.9.2"
    implementation "androidx.media3:media3-datasource-okhttp:1.9.2"
    implementation "androidx.media3:media3-ui:1.9.2"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    if (project.findProperty('testBuildType') != 'nightly') {
        androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
        androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
        // Match the barcode plugin to control CameraX initialization in tests.
        androidTestImplementation "androidx.camera:camera-camera2:1.5.1"
        androidTestImplementation "androidx.camera:camera-lifecycle:1.5.1"
    }
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
