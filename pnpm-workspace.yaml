dedupePeers: true

# https://pnpm.io/next/settings#allowbuilds
allowBuilds:
  '@parcel/watcher': true
  electron: true
  electron-winstaller: false # We build NSIS installers on Windows, not squirrel ones
  lefthook: true # Installing git hooks
  unrs-resolver: false # Works around an npm specific optional dependencies bug, so we don't need it with pnpm

overrides:
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  uuid@<11.1.1: '>=11.1.1'
  yauzl: '>=3.3.1'

minimumReleaseAgeExclude:
  - "youtubei.js"

patchedDependencies:
  '@capacitor/android@8.5.2': patches/@capacitor__android@8.5.2.patch
  '@capacitor/barcode-scanner@3.1.2': patches/@capacitor__barcode-scanner@3.1.2.patch
  '@capawesome/capacitor-app-shortcuts@8.0.2': patches/@capawesome__capacitor-app-shortcuts@8.0.2.patch
  '@capawesome/capacitor-clipboard@0.1.2': patches/@capawesome__capacitor-clipboard@0.1.2.patch
  shaka-player@5.1.12: patches/shaka-player@5.1.12.patch
  vue-sonner@2.0.9: patches/vue-sonner@2.0.9.patch
  youtubei.js@18.0.0: patches/youtubei.js@18.0.0.patch
