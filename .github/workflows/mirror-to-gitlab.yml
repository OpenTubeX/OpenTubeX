name: Mirror to GitLab

# Every run mirrors all refs, so there is nothing to gain from starting one per
# pushed branch. Listening on '**' only made the mirror a check on every pull
# request, because GitHub reports push runs against the head commit.
on:
  push:
    branches:
      - development
    tags:
      - '**'
  delete:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: gitlab-repository-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'OpenTubeX/OpenTubeX'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SOURCE_URL: https://github.com/OpenTubeX/OpenTubeX.git
      TARGET_URL: https://gitlab.com/opentubex/OpenTubeX.git

    steps:
      - name: Validate mirror credentials
        env:
          GITLAB_MIRROR_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${GITLAB_MIRROR_TOKEN}" ]]; then
            echo "::error::The GITLAB_MIRROR_TOKEN repository secret is missing."
            exit 1
          fi

      - name: Mirror and verify branches and tags
        env:
          GITLAB_MIRROR_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
        run: |
          set -euo pipefail

          echo "::add-mask::${GITLAB_MIRROR_TOKEN}"

          mirror_dir="$(mktemp -d "${RUNNER_TEMP}/gitlab-mirror.XXXXXX")"
          netrc_file="${HOME}/.netrc"

          cleanup() {
            rm -f "${netrc_file}"
            rm -rf "${mirror_dir}"
          }
          trap cleanup EXIT

          cat > "${netrc_file}" <<EOF
          machine gitlab.com
            login oauth2
            password ${GITLAB_MIRROR_TOKEN}
          EOF
          chmod 600 "${netrc_file}"

          git init --bare "${mirror_dir}/repository.git"

          git -C "${mirror_dir}/repository.git" fetch \
            --prune \
            --force \
            "${SOURCE_URL}" \
            '+refs/heads/*:refs/heads/*' \
            '+refs/tags/*:refs/tags/*'

          git -C "${mirror_dir}/repository.git" push \
            --prune \
            --force \
            "${TARGET_URL}" \
            'refs/heads/*:refs/heads/*' \
            'refs/tags/*:refs/tags/*'

          # Verify against the snapshot that was just pushed, not against a
          # fresh look at GitHub: branches are deleted there while the mirror
          # runs (auto-delete on merge), and re-reading the source made those
          # deletions look like refs the mirror had failed to prune. The next
          # run reconciles whatever moved in the meantime.
          git -C "${mirror_dir}/repository.git" for-each-ref \
            --format='%(objectname) %(refname)' refs/heads refs/tags \
            | LC_ALL=C sort > "${mirror_dir}/expected-refs.txt"

          # ls-remote reports an extra '^{}' line per annotated tag, which
          # for-each-ref does not, so drop the peeled entries on both sides.
          git ls-remote --heads --tags "${TARGET_URL}" \
            | sed '/\^{}$/d' \
            | awk '{ print $1, $2 }' \
            | LC_ALL=C sort > "${mirror_dir}/target-refs.txt"

          if ! diff --unified \
            "${mirror_dir}/expected-refs.txt" \
            "${mirror_dir}/target-refs.txt"; then
            echo "::error::GitLab branch or tag refs do not match the mirrored GitHub snapshot."
            exit 1
          fi

          echo "GitLab mirror matches GitHub."
