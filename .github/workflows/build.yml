# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Build

on:
  push:
    branches: [ master, development, '**-RC' ]
    paths-ignore:
      - '.editorconfig'
      - '.gitignore'
      - '.vscode/**'
      - '.whitesource'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'README.md'
      - 'docs/**'
      - 'e2e/**'
      - 'test/**'
      - 'tests/**'
      - '**/__tests__/**'
      - '**/*.spec.*'
      - '**/*.test.*'
      - 'jsconfig.json'
      - 'lefthook-local.yml.example'
      - 'lefthook.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/auto-merge.yml'
      - '.github/dependabot.yml'
      - '.github/**/*.md'
      - '.github/issue-labeler.yml'
      - '.github/pr-labeler.yml'
      - '.github/pull.yml'
      - '.github/workflows/autoMerge.yml'
      - '.github/workflows/calibreapp-image-actions.yml'
      - '.github/workflows/codeql.yml'
      - '.github/workflows/conflicts.yml'
      - '.github/workflows/e2e.yml'
      - '.github/workflows/enableAutoMerge.yml'
      - '.github/workflows/flatpak.yml'
      - '.github/workflows/label-issue.yml'
      - '.github/workflows/label-pr.yml'
      - '.github/workflows/linter.yml'
      - '.github/workflows/nightly.yml'
      - '.github/workflows/no-response.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/remove-outdated-labels.yml'
      - '.github/workflows/stale.yml'
      - '.github/workflows/updateSite.yml'

  workflow_dispatch:
    inputs:
      publishNightly:
        description: Publish and distribute this development build as a nightly release
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  build:
    name: Build

    # As this action runs on every push to the default branch and uses quite a lot of resources (both minutes and caches),
    # only run it in the OpenTubeX/OpenTubeX repository to avoid unnecessary GitHub Actions usage/billing in forks.
    # Still allow manually triggering the workflow.
    # If a fork does need this workflow to run on every push to the default branch, they can change this condition in their fork to include their repository.
    if: github.repository == 'OpenTubeX/OpenTubeX' || github.event_name == 'workflow_dispatch'

    permissions:
      actions: write
      contents: read

    strategy:
      matrix:
        node-version: [24.x]
        runtime:
          - linux-x64
          - linux-armv7l
          - linux-arm64
          - win-x64
          - win-arm64
          - osx-x64
          - osx-arm64
        include:
        - runtime: linux-x64
          os: ubuntu-latest

        - runtime: linux-armv7l
          os: ubuntu-latest

        - runtime: linux-arm64
          os: ubuntu-24.04-arm

        - runtime: osx-x64
          os: macOS-latest

        - runtime: osx-arm64
          os: macOS-latest

        - runtime: win-x64
          os: windows-latest

        - runtime: win-arm64
          os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ matrix.node-version }}
        package-manager-cache: false

    - name: Install pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        version: 11
        cache: false

    - name: Get pnpm cache directory
      id: cache_dir
      shell: bash
      run: |
        {
          echo 'cache_dir<<EOF'
          pnpm store path
          echo EOF
        } >> "$GITHUB_OUTPUT"

    - name: Restore pnpm cache
      id: restore_cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ format('node-cache-{0}-{1}-pnpm-{2}', runner.os, runner.arch, hashFiles('pnpm-lock.yaml')) }}
        path: ${{ steps.cache_dir.outputs.cache_dir }}

    - run: pnpm run ci
      shell: bash
    - run: pnpm run lint
      shell: bash
    - name: Set version number
      id: versionNumber
      shell: bash
      run: |
        original_version="$(jq -r '.version' package.json)"
        version="$original_version"

        lower_case_ref="$(echo -E "$GITHUB_REF" | tr '[:upper:]' '[:lower:]')"

        if [[ "$lower_case_ref" == *development* ]]; then
          version="${original_version}-nightly-${GITHUB_RUN_NUMBER}"
        elif [[ "$lower_case_ref" == *rc* ]]; then
          version="${original_version}-RC-${GITHUB_RUN_NUMBER}"
        fi

        package_json="$(jq --arg version "$version" '.version = $version' package.json)"

        printf '%s\n' "$package_json" > package.json
        printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

    - name: Install Linux packaging dependencies
      if: startsWith(matrix.os, 'ubuntu')
      shell: bash
      run: |
        sudo apt update
        apt_package() {
          for package_name in "$@"; do
            if apt-cache show "$package_name" >/dev/null 2>&1; then
              printf '%s\n' "$package_name"
              return 0
            fi
          done

          return 1
        }
        sudo apt -y install \
          binutils dbus-x11 desktop-file-utils file gcc libarchive-tools libasound2t64 \
          "$(apt_package libatk-bridge2.0-0t64 libatk-bridge2.0-0)" \
          "$(apt_package libatspi2.0-0t64 libatspi2.0-0)" \
          "$(apt_package libgtk-3-0t64 libgtk-3-0)" \
          libnotify4 libnss3 libsecret-1-0 libxss1 libxtst6 patchelf strace wget xauth xdg-utils xvfb

    - name: Build x64 with Node.js ${{ matrix.node-version}}
      if: contains(matrix.runtime, 'x64')
      shell: bash
      run: pnpm run build

    - name: Build ARMv7l with Node.js ${{ matrix.node-version}}
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-armv7l')
      shell: bash
      run: pnpm run build:arm32

    - name: Build ARM64 with Node.js ${{ matrix.node-version}}
      if: contains(matrix.runtime, 'arm64')
      shell: bash
      run: pnpm run build:arm64

    - name: Convert x64 AppImage to Anylinux AppImage
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-x64')
      shell: bash
      env:
        VERSION: ${{ steps.versionNumber.outputs.version }}
      run: |
        docker run --rm -v "$PWD":/work -w /work ghcr.io/pkgforge-dev/archlinux:latest \
          sh _scripts/package-anylinux-appimage.sh "build/opentubex_${VERSION}_amd64.deb"

    - name: Convert ARM64 AppImage to Anylinux AppImage
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-arm64')
      shell: bash
      env:
        VERSION: ${{ steps.versionNumber.outputs.version }}
      run: |
        docker run --rm -v "$PWD":/work -w /work ghcr.io/pkgforge-dev/archlinux:latest \
          sh _scripts/package-anylinux-appimage.sh "build/opentubex_${VERSION}_arm64.deb"

    - name: Upload Linux .zip x64 Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-x64')
      with:
        name: opentubex-${{ steps.versionNumber.outputs.version }}-linux-x64-portable.zip
        path: build/opentubex-${{ steps.versionNumber.outputs.version }}.zip

    - name: Upload Linux .7z x64 Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-x64')
      with:
        name: opentubex-${{ steps.versionNumber.outputs.version }}-linux-x64-portable.7z
        path: build/opentubex-${{ steps.versionNumber.outputs.version }}.7z

    - name: Upload Linux .zip ARMv7l Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-armv7l')
      with:
        name: opentubex-${{ steps.versionNumber.outputs.version }}-linux-armv7l-portable.zip
        path: build/opentubex-${{ steps.versionNumber.outputs.version }}-armv7l.zip

    - name: Upload Linux .7z ARMv7l Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-armv7l')
      with:
        name: opentubex-${{ steps.versionNumber.outputs.version }}-linux-armv7l-portable.7z
        path: build/opentubex-${{ steps.versionNumber.outputs.version }}-armv7l.7z

    - name: Upload Linux .zip ARM64 Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-arm64')
      with:
        name: opentubex-${{ steps.versionNumber.outputs.version }}-linux-arm64-portable.zip
        path: build/opentubex-${{ steps.versionNumber.outputs.version }}-arm64.zip

    - name: Upload Linux .7z ARM64 Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-arm64')
      with:
        name: opentubex-${{ steps.versionNumber.outputs.version }}-linux-arm64-portable.7z
        path: build/opentubex-${{ steps.versionNumber.outputs.version }}-arm64.7z

    - name: Upload .deb x64 Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-x64')
      with:
        name: opentubex_${{ steps.versionNumber.outputs.version }}_amd64.deb
        path: build/opentubex_${{ steps.versionNumber.outputs.version }}_amd64.deb

    - name: Upload .deb ARMv7l Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-armv7l')
      with:
        name: opentubex_${{ steps.versionNumber.outputs.version }}_armv7l.deb
        path: build/opentubex_${{ steps.versionNumber.outputs.version }}_armv7l.deb

    - name: Upload .deb ARM64 Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-arm64')
      with:
        name: opentubex_${{ steps.versionNumber.outputs.version }}_arm64.deb
        path: build/opentubex_${{ steps.versionNumber.outputs.version }}_arm64.deb

    - name: Upload AppImage x64 Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-x64')
      with:
        name: opentubex-${{ steps.versionNumber.outputs.version }}-amd64.AppImage
        path: build/opentubex-${{ steps.versionNumber.outputs.version }}-amd64.AppImage

    - name: Upload AppImage ARMv7l Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-armv7l')
      with:
        name: opentubex-${{ steps.versionNumber.outputs.version }}-armv7l.AppImage
        path: build/OpenTubeX-${{ steps.versionNumber.outputs.version }}-armv7l.AppImage

    - name: Upload AppImage ARM64 Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-arm64')
      with:
        name: opentubex-${{ steps.versionNumber.outputs.version }}-arm64.AppImage
        path: build/opentubex-${{ steps.versionNumber.outputs.version }}-arm64.AppImage

    - name: Upload .rpm x64 Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-x64')
      with:
        name: opentubex-${{ steps.versionNumber.outputs.version }}.amd64.rpm
        path: build/opentubex-${{ steps.versionNumber.outputs.version }}.x86_64.rpm

    # rpm are not built for armv7l

    - name: Upload .rpm ARM64 Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-arm64')
      with:
        name: opentubex-${{ steps.versionNumber.outputs.version }}.arm64.rpm
        path: build/opentubex-${{ steps.versionNumber.outputs.version }}.aarch64.rpm

    - name: Upload Pacman .pacman x64 Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-x64')
      with:
        name: opentubex-${{ steps.versionNumber.outputs.version }}-amd64.pacman
        path: build/opentubex-${{ steps.versionNumber.outputs.version }}.pacman

    - name: Upload Windows x64 .exe Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: startsWith(matrix.os, 'windows') && startsWith(matrix.runtime, 'win-x64')
      with:
        name: opentubex-${{ steps.versionNumber.outputs.version }}-setup-x64.exe
        path: build/opentubex Setup ${{ steps.versionNumber.outputs.version }}.exe

    - name: Upload Windows x64 Portable Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: startsWith(matrix.os, 'windows') && startsWith(matrix.runtime, 'win-x64')
      with:
        name: opentubex-${{ steps.versionNumber.outputs.version }}-win-x64-portable.exe
        path: build/opentubex ${{ steps.versionNumber.outputs.version }}.exe

    - name: Upload Windows x64 .zip Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: startsWith(matrix.os, 'windows') && startsWith(matrix.runtime, 'win-x64')
      with:
        name: opentubex-${{ steps.versionNumber.outputs.version }}-win-x64-portable.zip
        path: build/opentubex-${{ steps.versionNumber.outputs.version }}-win.zip

    - name: Upload Windows x64 .7z Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: startsWith(matrix.os, 'windows') && startsWith(matrix.runtime, 'win-x64')
      with:
        name: opentubex-${{ steps.versionNumber.outputs.version }}-win-x64-portable.7z
        path: build/opentubex-${{ steps.versionNumber.outputs.version }}-win.7z

    - name: Upload Windows arm64 .exe Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: startsWith(matrix.os, 'windows') && startsWith(matrix.runtime, 'win-arm64')
      with:
        name: opentubex-${{ steps.versionNumber.outputs.version }}-setup-arm64.exe
        path: build/opentubex Setup ${{ steps.versionNumber.outputs.version }}.exe

    - name: Upload Windows arm64 Portable Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: startsWith(matrix.os, 'windows') && startsWith(matrix.runtime, 'win-arm64')
      with:
        name: opentubex-${{ steps.versionNumber.outputs.version }}-win-arm64-portable.exe
        path: build/opentubex ${{ steps.versionNumber.outputs.version }}.exe

    - name: Upload Windows arm64 .zip Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: startsWith(matrix.os, 'windows') && startsWith(matrix.runtime, 'win-arm64')
      with:
        name: opentubex-${{ steps.versionNumber.outputs.version }}-win-arm64-portable.zip
        path: build/opentubex-${{ steps.versionNumber.outputs.version }}-arm64-win.zip

    - name: Upload Windows arm64 .7z Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: startsWith(matrix.os, 'windows') && startsWith(matrix.runtime, 'win-arm64')
      with:
        name: opentubex-${{ steps.versionNumber.outputs.version }}-win-arm64-portable.7z
        path: build/opentubex-${{ steps.versionNumber.outputs.version }}-arm64-win.7z

    - name: Upload Mac x64 .dmg Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: startsWith(matrix.os, 'macos') && startsWith(matrix.runtime, 'osx-x64')
      with:
        name: opentubex-${{ steps.versionNumber.outputs.version }}-mac-x64.dmg
        path: build/opentubex-${{ steps.versionNumber.outputs.version }}.dmg

    - name: Upload Mac x64 .zip Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: startsWith(matrix.os, 'macos') && startsWith(matrix.runtime, 'osx-x64')
      with:
        name: opentubex-${{ steps.versionNumber.outputs.version }}-mac-x64.zip
        path: build/opentubex-${{ steps.versionNumber.outputs.version }}-mac.zip

    - name: Upload Mac x64 .7z Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: startsWith(matrix.os, 'macos') && startsWith(matrix.runtime, 'osx-x64')
      with:
        name: opentubex-${{ steps.versionNumber.outputs.version }}-mac-x64.7z
        path: build/opentubex-${{ steps.versionNumber.outputs.version }}-mac.7z

    - name: Upload Mac arm64 .dmg Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: startsWith(matrix.os, 'macos') && startsWith(matrix.runtime, 'osx-arm64')
      with:
        name: opentubex-${{ steps.versionNumber.outputs.version }}-mac-arm64.dmg
        path: build/opentubex-${{ steps.versionNumber.outputs.version }}-arm64.dmg

    - name: Upload Mac arm64 .zip Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: startsWith(matrix.os, 'macos') && startsWith(matrix.runtime, 'osx-arm64')
      with:
        name: opentubex-${{ steps.versionNumber.outputs.version }}-mac-arm64.zip
        path: build/opentubex-${{ steps.versionNumber.outputs.version }}-arm64-mac.zip

    - name: Upload Mac arm64 .7z Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: startsWith(matrix.os, 'macos') && startsWith(matrix.runtime, 'osx-arm64')
      with:
        name: opentubex-${{ steps.versionNumber.outputs.version }}-mac-arm64.7z
        path: build/opentubex-${{ steps.versionNumber.outputs.version }}-arm64-mac.7z

    - name: Save pnpm cache
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      # Only save the cache if we weren't able to restore an existing one above
      if: steps.restore_cache.outputs.cache-primary-key != steps.restore_cache.outputs.cache-matched-key
      with:
        key: ${{ steps.restore_cache.outputs.cache-primary-key }}
        path: ${{ steps.cache_dir.outputs.cache_dir }}

  android:
    name: Build Android APK
    if: github.repository == 'OpenTubeX/OpenTubeX' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Use Node.js 24
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.x
        package-manager-cache: false

    - name: Install pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        version: 11
        cache: false

    - name: Use Java 21
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
      with:
        distribution: temurin
        java-version: 21

    - name: Set up Android SDK
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

    - run: pnpm run ci
      shell: bash

    - name: Build signed universal APK
      id: apk
      shell: bash
      run: |
        set -euo pipefail
        base_version="$(jq --raw-output .version package.json)"
        lower_case_ref="${GITHUB_REF,,}"
        version="$base_version"
        if [[ "$lower_case_ref" == *development* ]]; then
          version="${base_version}-nightly-${GITHUB_RUN_NUMBER}"
        elif [[ "$lower_case_ref" == *rc* ]]; then
          version="${base_version}-RC-${GITHUB_RUN_NUMBER}"
        fi

        ANDROID_VERSION_CODE="$(git rev-list --count HEAD)"
        ANDROID_VERSION_NAME="$version"
        export ANDROID_VERSION_CODE ANDROID_VERSION_NAME

        apk_path=android/app/build/outputs/apk/debug/app-debug.apk
        pnpm run capacitor:sync:android
        ./android/gradlew --project-dir android assembleDebug
        cp "$apk_path" android/app/build/outputs/apk/opentubex-android-universal.apk
        printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

    - name: Upload Android APK
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: opentubex-${{ steps.apk.outputs.version }}-android-universal.apk
        path: android/app/build/outputs/apk/opentubex-android-universal.apk

  publish-nightly:
    name: Publish nightly release
    needs: [build, android]
    if: github.event_name == 'workflow_dispatch' && inputs.publishNightly && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: write
      issues: read
      pull-requests: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Download build artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: opentubex*
        path: artifacts

    - name: Prepare release assets
      shell: bash
      run: |
        set -euo pipefail
        mkdir release-assets

        for artifact_directory in artifacts/*; do
          artifact_name="$(basename "$artifact_directory")"
          mapfile -t files < <(find "$artifact_directory" -type f -print)

          if (( ${#files[@]} != 1 )); then
            echo "Expected one file in $artifact_directory, found ${#files[@]}" >&2
            exit 1
          fi

          cp "${files[0]}" "release-assets/$artifact_name"
        done

    - name: Generate nightly release notes
      env:
        GH_TOKEN: ${{ github.token }}
        TARGET_BRANCH: development
        TARGET_SHA: ${{ github.sha }}
      shell: bash
      run: |
        set -euo pipefail

        releases="$(
          gh release list --limit 100 \
            --json isDraft,isPrerelease,tagName
        )"

        previous_tag=''
        while IFS= read -r tag; do
          if git merge-base --is-ancestor "$tag" "$TARGET_SHA"; then
            previous_tag="$tag"
            break
          fi
        done < <(
          jq --raw-output '.[] | select(
            .isDraft == false and .isPrerelease == false
          ) | .tagName' <<< "$releases"
        )

        if [[ -z "$previous_tag" ]]; then
          echo 'Could not find a previous release tag.' >&2
          exit 1
        fi

        PREVIOUS_TAG="$previous_tag" \
          node _scripts/releaseNotes.mjs generate-nightly nightly-changelog.md

        {
          printf '> [!WARNING]\n'
          printf '> This nightly build is intended for testing only and may be unstable. Regular users should use the [latest non-prerelease](https://github.com/OpenTubeX/OpenTubeX/releases/latest).\n\n'
          printf 'Automated development build from commit %s.\n\n' "$TARGET_SHA"
          printf '<details>\n<summary>Changelog since the latest stable release (%s)</summary>\n\n' "$previous_tag"
          cat nightly-changelog.md
          printf '\n</details>\n'
        } > release-notes.md

    - name: Create nightly release
      id: release
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        base_version="$(jq --raw-output .version package.json)"
        version="${base_version}-nightly-${GITHUB_RUN_NUMBER}"
        tag="v${version}"

        gh release create "$tag" release-assets/* \
          --prerelease \
          --target "$GITHUB_SHA" \
          --title "v${version}" \
          --notes-file release-notes.md

        {
          echo "tag=$tag"
          echo "version=$version"
        } >> "$GITHUB_OUTPUT"

    - name: Trigger nightly package repositories
      env:
        GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        TAG: ${{ steps.release.outputs.tag }}
        VERSION: ${{ steps.release.outputs.version }}
      shell: bash
      run: |
        set -euo pipefail

        for repository in apt rpm flatpak snap; do
          gh api "repos/OpenTubeX/${repository}/dispatches" \
            --method POST \
            -f event_type=opentubex-nightly \
            -f "client_payload[tag]=$TAG" \
            -f "client_payload[version]=$VERSION" \
            || echo "::warning title=Nightly dispatch failed::${repository}"
        done

    - name: Remove expired nightly releases
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail

        gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
          --jq '.[] | select(.prerelease and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-nightly-[0-9]+$"))) | [.created_at, .tag_name] | @tsv' \
          | sort --reverse \
          | tail --lines=+31 \
          | cut --fields=2- \
          | while IFS= read -r tag; do
              gh release delete "$tag" --cleanup-tag --yes
            done
