name: E2E Tests

on:
  pull_request:
    branches: [ master, development, '**-RC' ]
  schedule:
    # Nightly full suite, including network tests against the real YouTube servers
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      project:
        description: 'Playwright project to run'
        required: false
        default: 'all'
        type: choice
        options: [ all, offline, network ]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare-e2e:
    name: Prepare E2E tests
    if: ${{ github.event_name != 'pull_request' || github.head_ref != 'weblate-translations' }}
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Use Node.js 24.x
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.x
        package-manager-cache: false

    - name: Install pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        version: 11
        cache: false

    - name: Get pnpm cache directory
      id: cache_dir
      shell: bash
      run: |
        {
          echo 'cache_dir<<EOF'
          pnpm store path
          echo EOF
        } >> "$GITHUB_OUTPUT"

    - name: Cache pnpm store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ format('node-cache-{0}-{1}-pnpm-{2}', runner.os, runner.arch, hashFiles('pnpm-lock.yaml')) }}
        path: ${{ steps.cache_dir.outputs.cache_dir }}

    - run: pnpm run ci
      shell: bash

    - name: Create E2E shard matrix
      id: shards
      env:
        SELECTED_PROJECT: ${{ github.event_name == 'workflow_dispatch' && inputs.project || 'all' }}
      run: |
        # JavaScript template literals belong to Node.
        # shellcheck disable=SC2016
        pnpm exec playwright test -c e2e/playwright.config.mjs --list --reporter=json |
          node --input-type=module -e '
            let input = ""
            for await (const chunk of process.stdin) input += chunk

            const counts = {}
            const visit = (value) => {
              if (Array.isArray(value)) {
                value.forEach(visit)
              } else if (value && typeof value === "object") {
                if (value.projectName) {
                  counts[value.projectName] = (counts[value.projectName] ?? 0) + 1
                } else {
                  Object.values(value).forEach(visit)
                }
              }
            }

            visit(JSON.parse(input).suites)

            const projects = process.env.SELECTED_PROJECT === "all"
              ? ["offline", "network"]
              : [process.env.SELECTED_PROJECT]
            const testsPerShard = 200
            const maxShards = 8
            const include = projects.flatMap((project) => {
              const testCount = counts[project]
              if (!testCount) throw new Error(`No tests found for project ${project}`)

              const shardTotal = Math.min(maxShards, Math.ceil(testCount / testsPerShard))
              return Array.from({ length: shardTotal }, (_, index) => ({
                project,
                shard: index + 1,
                shardTotal
              }))
            })

            console.log(`matrix=${JSON.stringify({ include })}`)
          ' >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Get Electron version
      id: electron
      run: printf 'version=%s\n' "$(node -p "require('./node_modules/electron/package.json').version")" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Cache Electron binary
      id: electron_cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ format('electron-{0}-{1}-{2}', runner.os, runner.arch, steps.electron.outputs.version) }}
        path: |
          node_modules/.pnpm/electron@*/node_modules/electron/dist
          node_modules/.pnpm/electron@*/node_modules/electron/path.txt

    - name: Install Electron binary
      if: steps.electron_cache.outputs.cache-hit != 'true'
      run: pnpm exec install-electron
      shell: bash

    - run: pnpm run test:e2e:pack
      shell: bash

    - name: Upload E2E build
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dist-e2e
        path: dist-e2e/
        retention-days: 1

  e2e-shard:
    name: e2e (${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.shardTotal }})
    if: ${{ github.event_name != 'pull_request' || github.head_ref != 'weblate-translations' }}
    needs: prepare-e2e
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-e2e.outputs.matrix) }}
    env:
      OPENTUBEX_SYNC_SERVER_URL: http://127.0.0.1:8080

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Playwright needs the base branch history to identify tests changed by a PR.
        fetch-depth: 0
        persist-credentials: false

    - name: Use Node.js 24.x
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.x
        package-manager-cache: false

    - name: Install pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        version: 11
        cache: false

    - name: Get pnpm cache directory
      id: cache_dir
      shell: bash
      run: |
        {
          echo 'cache_dir<<EOF'
          pnpm store path
          echo EOF
        } >> "$GITHUB_OUTPUT"

    - name: Restore pnpm cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ format('node-cache-{0}-{1}-pnpm-{2}', runner.os, runner.arch, hashFiles('pnpm-lock.yaml')) }}
        path: ${{ steps.cache_dir.outputs.cache_dir }}

    - run: pnpm run ci
      shell: bash

    - name: Get Electron version
      id: electron
      run: printf 'version=%s\n' "$(node -p "require('./node_modules/electron/package.json').version")" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Restore Electron binary
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ format('electron-{0}-{1}-{2}', runner.os, runner.arch, steps.electron.outputs.version) }}
        path: |
          node_modules/.pnpm/electron@*/node_modules/electron/dist
          node_modules/.pnpm/electron@*/node_modules/electron/path.txt

    - name: Download E2E build
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: dist-e2e
        path: dist-e2e

    - name: Start sync server
      if: ${{ matrix.project == 'network' }}
      run: docker compose -f e2e/sync-server/compose.yml up -d --wait --pull always
      shell: bash

    # The network project talks to the real YouTube servers on the first
    # attempt and automatically falls back to recorded fixtures on retry.
    - name: Run E2E tests
      run: |
        test_args=("--shard=${{ matrix.shard }}/${{ matrix.shardTotal }}")
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          test_args+=("--only-changed=origin/${GITHUB_BASE_REF}" "--pass-with-no-tests")
        fi

        xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' pnpm run test:e2e:${{ matrix.project }} "${test_args[@]}"
      shell: bash

    - name: Stop sync server
      if: ${{ always() && matrix.project == 'network' }}
      run: docker compose -f e2e/sync-server/compose.yml down -v
      shell: bash

    # Upload on flaky-but-green runs too, so first-attempt failures
    # (e.g. YouTube bot checks before the fixture fallback) can be inspected.
    - name: Upload Playwright report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: playwright-report-${{ matrix.project }}-${{ matrix.shard }}
        path: |
          e2e/report/
          e2e/results/
        retention-days: 14

  # Keep a stable required-check name while the test suite runs as a matrix.
  e2e:
    if: ${{ always() && (github.event_name != 'pull_request' || github.head_ref != 'weblate-translations') }}
    needs: e2e-shard
    runs-on: ubuntu-latest
    steps:
    - name: Check E2E shards
      env:
        SHARD_RESULT: ${{ needs.e2e-shard.result }}
      run: test "$SHARD_RESULT" = success
