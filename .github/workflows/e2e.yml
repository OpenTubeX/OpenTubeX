name: E2E Tests

on:
  pull_request:
    branches: [ master, development, '**-RC' ]
  schedule:
    # Nightly full suite, including network tests against the real YouTube servers
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      project:
        description: 'Playwright project to run'
        required: false
        default: 'all'
        type: choice
        options: [ all, offline, network ]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: ${{ github.event_name != 'pull_request' || github.head_ref != 'weblate-translations' }}
    runs-on: ubuntu-latest
    env:
      OPENTUBEX_SYNC_SERVER_URL: http://127.0.0.1:8080

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Use Node.js 24.x
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.x
        package-manager-cache: false

    - name: Install pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        version: 11
        cache: false

    - name: Get pnpm cache directory
      id: cache_dir
      shell: bash
      run: |
        {
          echo 'cache_dir<<EOF'
          pnpm store path
          echo EOF
        } >> "$GITHUB_OUTPUT"

    - name: Restore pnpm cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ format('node-cache-{0}-{1}-pnpm-{2}', runner.os, runner.arch, hashFiles('pnpm-lock.yaml')) }}
        path: ${{ steps.cache_dir.outputs.cache_dir }}

    - run: pnpm run ci
      shell: bash

    - run: pnpm run test:e2e:pack
      shell: bash

    - name: Determine test project
      id: project
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "project=${{ inputs.project }}" >> "$GITHUB_OUTPUT"
        else
          echo "project=all" >> "$GITHUB_OUTPUT"
        fi

    - name: Start sync server
      if: ${{ steps.project.outputs.project != 'offline' }}
      run: docker compose -f e2e/sync-server/compose.yml up -d --wait --pull always
      shell: bash

    # The network project talks to the real YouTube servers on the first
    # attempt and automatically falls back to recorded fixtures on retry.
    - name: Run E2E tests
      run: |
        if [ "${{ steps.project.outputs.project }}" = "all" ]; then
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' pnpm run test:e2e
        else
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' pnpm run test:e2e:${{ steps.project.outputs.project }}
        fi
      shell: bash

    - name: Stop sync server
      if: ${{ always() && steps.project.outputs.project != 'offline' }}
      run: docker compose -f e2e/sync-server/compose.yml down -v
      shell: bash

    # Upload on flaky-but-green runs too, so first-attempt failures
    # (e.g. YouTube bot checks before the fixture fallback) can be inspected.
    - name: Upload Playwright report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: playwright-report
        path: |
          e2e/report/
          e2e/results/
        retention-days: 14
