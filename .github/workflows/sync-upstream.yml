name: Sync upstream

# The sync branch carries upstream's workflow files, so it lives in a fork with
# Actions disabled. Pushed here, they would run with this repository's secrets
# before the PR is reviewed; a fork's PR runs without them.
# UPSTREAM_SYNC_FORK_SSH_KEY is a write deploy key of SYNC_FORK.
# UPSTREAM_SYNC_TOKEN needs Pull requests write access plus Checks and Commit
# statuses read access. A separate token lets PRs run CI.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'OpenTubeX/OpenTubeX'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
      SYNC_FORK: OpenTubeX/OpenTubeX-upstream-sync
    defaults:
      run:
        shell: bash
    steps:
      - name: Check authentication
        env:
          SSH_KEY: ${{ secrets.UPSTREAM_SYNC_FORK_SSH_KEY }}
        run: |
          if [[ -z "$GH_TOKEN" || -z "$SSH_KEY" ]]; then
            echo "::error::Set the UPSTREAM_SYNC_TOKEN and UPSTREAM_SYNC_FORK_SSH_KEY repository secrets before running upstream sync."
            exit 1
          fi

      - name: Checkout fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: development
          fetch-depth: 0
          persist-credentials: false

      # The PR branch is upstream's development itself; merging it preserves fork
      # changes and upstream commit history, including on conflicting PRs.
      - name: Push upstream to the sync fork
        id: push
        env:
          SSH_KEY: ${{ secrets.UPSTREAM_SYNC_FORK_SSH_KEY }}
        run: |
          git fetch --no-tags https://github.com/FreeTubeApp/FreeTube.git development
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "development already contains upstream development."
            exit 0
          fi
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$RUNNER_TEMP/known_hosts"
          install -m 600 /dev/null "$RUNNER_TEMP/sync_key"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/sync_key"
          GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/sync_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts" \
            git push --force "git@github.com:$SYNC_FORK.git" FETCH_HEAD:refs/heads/upstream-sync
          rm "$RUNNER_TEMP/sync_key"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Create upstream pull request
        id: pull_request
        if: steps.push.outputs.pushed == 'true'
        env:
          BODY: |
            Sync [FreeTubeApp/FreeTube:development](https://github.com/FreeTubeApp/FreeTube/tree/development) into `development`.

            Merge with a **merge commit** to preserve fork changes and shared upstream history.

            @coderabbitai ignore
        run: |
          # Pushing to the fork already updated an open PR.
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --base development --head upstream-sync --state open \
            --json headRepository --jq "[.[] | select(.headRepository.name == \"${SYNC_FORK#*/}\")] | length")
          if [[ "$open" -eq 0 ]]; then
            # head_repo selects the fork, which has the same owner as this repository
            number=$(gh api "repos/$GITHUB_REPOSITORY/pulls" -f base=development -f head=upstream-sync \
              -f head_repo="${SYNC_FORK#*/}" -f title="chore: sync development from FreeTubeApp/FreeTube" \
              -f body="$BODY" --jq .number)
            echo "number=$number" >> "$GITHUB_OUTPUT"
          fi

      # Assignment by the PAT owner is self-activity and does not notify them.
      - name: Assign new upstream pull request as the Actions bot
        if: steps.pull_request.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pull_request.outputs.number }}
        run: gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-assignee D3SOX
