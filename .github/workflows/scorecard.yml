name: Scorecard

on:
  # For the Branch-Protection check. Only the default branch is supported.
  branch_protection_rule:
  # Runs after the Gradle wrapper validation instead of on push. The
  # Binary-Artifacts check only accepts android/gradle/wrapper/gradle-wrapper.jar
  # when the latest commit already has a successful validation run.
  workflow_run:
    workflows: [ "Gradle Wrapper" ]
    types: [ completed ]
    branches: [ "development" ]
  schedule:
    - cron: '17 4 * * 1'

permissions: {}

jobs:
  analysis:
    # Results are only published for the default branch of OpenTubeX/OpenTubeX.
    if: >-
      github.repository == 'OpenTubeX/OpenTubeX' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'))
    name: Scorecard analysis
    runs-on: ubuntu-latest

    permissions:
      # Upload the results to code scanning
      security-events: write
      # Publish the results and get a badge
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        # Pinned to v2.5.0 because the v2.6.0 image can't be pulled from GHCR:
        # https://github.com/ossf/scorecard-action/issues/1752
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Fine-grained token with read-only Administration access, needed for the Branch-Protection check.
          repo_token: ${{ secrets.SCORECARD_TOKEN }}
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
