name: Linter

on:
  pull_request:
    branches: [ master, development, '**-RC' ]

cache-mode: none
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Each check runs in its own job so they finish in parallel. The required `lint` check
  # at the end only passes when all of them do.
  code:
    runs-on: ubuntu-latest

    cache-mode: read
    permissions:
      contents: read

    steps:
    - &checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - &setup-node
      name: Use Node.js 24.x
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24.x
        package-manager-cache: false

    - &install-pnpm
      name: Install pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        cache: false

    - &pnpm-cache-dir
      name: Get pnpm cache directory
      id: cache_dir
      shell: bash
      run: |
        {
          echo 'cache_dir<<EOF'
          pnpm store path
          echo EOF
        } >> "$GITHUB_OUTPUT"

    - &restore-pnpm-cache
      name: Restore pnpm cache
      id: restore_cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ format('node-cache-{0}-{1}-pnpm-{2}', runner.os, runner.arch, hashFiles('pnpm-lock.yaml')) }}
        path: ${{ steps.cache_dir.outputs.cache_dir }}

    - &pnpm-install
      run: pnpm install --frozen-lockfile
      shell: bash
    # The eslint-lint script's automatic concurrency uses half the cores,
    # which is slower on the 4-core runners than one worker per core.
    - run: pnpm run eslint-lint --concurrency=4
      shell: bash
    - run: pnpm run lint-style
      shell: bash
    - run: pnpm run lint-release-notes
      shell: bash
    - run: pnpm run lint-json
      shell: bash
    - run: pnpm run lint-yml
      shell: bash
    - run: pnpm run typecheck
      shell: bash

  unit-tests:
    runs-on: ubuntu-latest

    cache-mode: read
    permissions:
      contents: read

    steps:
    - *checkout
    - *setup-node
    - *install-pnpm
    - *pnpm-cache-dir
    - *restore-pnpm-cache
    - *pnpm-install
    - name: Run unit tests
      run: pnpm run test:unit
      shell: bash

  native-tests:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - *checkout
    - &setup-go
      name: Set up Go for the Cast sender
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: _scripts/cast-sender/go.mod
        cache: false
    - name: Test Android MP3 cover-art helper
      run: |
        # Test against the yt-dlp release Android bundles, which vendored-dependencies.yml keeps
        # current, and the mutagen release in youtubedl-android 0.18.1's Python runtime.
        ytdlp=$(grep -oP "^def ytDlpVersion = '\K[0-9.]+(?='$)" android/app/build.gradle)
        python3 -m venv "$RUNNER_TEMP/android-mp3-tests"
        "$RUNNER_TEMP/android-mp3-tests/bin/python" -m pip install "yt-dlp==$ytdlp" mutagen==1.47.0
        "$RUNNER_TEMP/android-mp3-tests/bin/python" -m unittest discover -s tests -p 'android_*_test.py'
    - name: Test Cast sender transport
      run: go test -race ./...
      working-directory: _scripts/cast-sender
    - name: Test Android Rumble HTTP transport
      run: go test -race ./...
      working-directory: _scripts/yt-dlp-http

  pack:
    runs-on: ubuntu-latest

    cache-mode: read
    permissions:
      contents: read

    steps:
    - *checkout
    - *setup-node
    # pack:main builds the Cast sender
    - *setup-go
    - *install-pnpm
    - *pnpm-cache-dir
    - *restore-pnpm-cache
    - *pnpm-install
    # let's verify that Rspack is able to package the project
    - run: pnpm run pack
      shell: bash
    # verify that Rspack is able to package the project using the web config
    - run: pnpm run pack:web
      shell: bash

  lint:
    needs: [code, unit-tests, native-tests, pack]
    # Branch protection treats a skipped check as passed, so always run and fail explicitly
    if: always()
    runs-on: ubuntu-latest

    permissions: {}

    steps:
    - name: Check results
      if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
      run: exit 1
