name: Update Download Site Release

on:
  workflow_dispatch:
    inputs:
      releaseTag:
        type: string
        required: false
        description: Release tag to publish on the download site, for example v0.25.5-beta

permissions: {}

jobs:
  update-site:
    name: Update download site release
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - name: Resolve release version
      id: release
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        INPUT_TAG: ${{ inputs.releaseTag }}
      run: |
        tag="$INPUT_TAG"

        if [ -z "$tag" ]; then
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
        fi

        version="${tag# v}"
        version="${version%-beta}"

        {
          echo "tag=$tag"
          echo "version=$version"
        } >> "$GITHUB_OUTPUT"

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: OpenTubeX/opentubex.github.io
        token: ${{ secrets.PUSH_TOKEN }}
        persist-credentials: true

    - name: Update release data
      shell: bash
      env:
        VERSION: ${{ steps.release.outputs.version }}
      run: |
        node --input-type=module <<'EOF'
        import { readFileSync, writeFileSync } from 'node:fs';

        const file = 'src/data/release.ts';
        const version = process.env.VERSION;
        const source = readFileSync(file, 'utf8');
        const updated = source.replace(
          /export const releaseVersion = '[^']+';/,
          `export const releaseVersion = '${version}';`,
        );

        if (updated === source) {
          console.log(`releaseVersion is already ${version}`);
        } else {
          writeFileSync(file, updated);
          console.log(`Updated releaseVersion to ${version}`);
        }
        EOF

    - name: Commit and push
      shell: bash
      env:
        VERSION: ${{ steps.release.outputs.version }}
      run: |
        git add src/data/release.ts

        if git diff --cached --quiet; then
          echo "No site release update needed."
          exit 0
        fi

        git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Update download release to v$VERSION-beta" \
            --signoff
        git push --set-upstream origin master
