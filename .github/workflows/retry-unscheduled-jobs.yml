name: Retry Unscheduled Jobs

# Hosted macOS arm64 runners are sometimes unavailable, and GitHub cancels the job
# after failing to acquire one. Rerun runs that failed only for that reason.
on:
  workflow_run:
    workflows: [Build, iOS and iPadOS]
    types: [completed]

permissions: {}

jobs:
  rerun:
    name: Rerun jobs without a runner
    if: >-
      github.repository == 'OpenTubeX/OpenTubeX' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-slim

    permissions:
      actions: write
      checks: read

    steps:
    - name: Rerun failed jobs
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RUN_ID: ${{ github.event.workflow_run.id }}
        RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        RUN_EVENT: ${{ github.event.workflow_run.event }}
        HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
      shell: bash
      run: |
        set -euo pipefail

        # A job that never got a runner has runner_id 0. Its "not acquired by
        # Runner" annotation is not reliably visible to this token.
        runner_ids="$(
          gh api --paginate "repos/${GH_REPO}/actions/runs/${RUN_ID}/attempts/${RUN_ATTEMPT}/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | .runner_id // 0'
        )"
        [[ -n "$runner_ids" ]] || exit 0

        if grep --quiet --invert-match --line-regexp 0 <<< "$runner_ids"; then
          echo "A job failed after acquiring a runner; not retrying."
          exit 0
        fi

        # A rerun joins the run's concurrency group, so it would cancel or take
        # the place of a newer run. Compare runs, not commits: pushes that only
        # change ignored paths move the branch without starting a newer run.
        latest_run="$(gh api "repos/${GH_REPO}/actions/workflows/${WORKFLOW_ID}/runs?branch=${HEAD_BRANCH}&event=${RUN_EVENT}&per_page=1" --jq '.workflow_runs[0].id')"
        if [[ "$latest_run" != "$RUN_ID" ]]; then
          echo "Run $latest_run is newer; not retrying."
          exit 0
        fi

        gh run rerun "$RUN_ID" --failed
