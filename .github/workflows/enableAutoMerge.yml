name: Enable Auto Merge
on:
  workflow_run:
    workflows: [Auto Merge PR]
    types: [completed]

permissions: {}

jobs:
  enable-auto-merge:
    if: github.event.workflow_run.event == 'pull_request_review'
    runs-on: ubuntu-slim

    permissions:
      actions: read
      contents: write
      pull-requests: write

    steps:
    - name: Validate admin approval
      id: approval
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.PUSH_TOKEN || github.token }}
        REPOSITORY: ${{ github.repository }}
        RUN_ID: ${{ github.event.workflow_run.id }}
        REVIEWER: ${{ github.event.workflow_run.actor.login }}
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      run: |
        TRUSTED_BOTS=('coderabbitai[bot]' 'greptile-apps[bot]')

        is_trusted_bot() {
          local candidate
          for candidate in "${TRUSTED_BOTS[@]}"; do
            if [[ "$1" == "$candidate" ]]; then
              return 0
            fi
          done
          return 1
        }

        job_name="$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs" \
          --jq '.jobs[] | select(.name | startswith("authorize-auto-merge-")) | select(.conclusion == "success") | .name')"
        pr_number="${job_name#authorize-auto-merge-}"

        if [[ ! "$pr_number" =~ ^[0-9]+$ ]]; then
          echo "The triggering review did not authorize auto-merge."
          exit 0
        fi

        pr="$(gh api "repos/$REPOSITORY/pulls/$pr_number")"
        state="$(jq -r '.state' <<< "$pr")"
        pr_head_sha="$(jq -r '.head.sha' <<< "$pr")"
        head_ref="$(jq -r '.head.ref' <<< "$pr")"
        head_repository="$(jq -r '.head.repo.full_name' <<< "$pr")"
        base_ref="$(jq -r '.base.ref' <<< "$pr")"
        draft="$(jq -r '.draft' <<< "$pr")"
        author="$(jq -r '.user.login' <<< "$pr")"

        if [[ "$state" != "open" || "$pr_head_sha" != "$HEAD_SHA" || "$draft" == "true" ]]; then
          echo "Pull request #$pr_number is closed, draft, or its head commit changed."
          exit 0
        fi

        if [[ "$base_ref" != "development" && "$base_ref" != RC* ]]; then
          echo "Pull request #$pr_number does not target an auto-merge branch."
          exit 0
        fi

        reviews="$(gh api --paginate "repos/$REPOSITORY/pulls/$pr_number/reviews" | jq -cs '[.[][]]')"
        latest_review="$(jq -c \
          '[.[] | select(.user.login == env.REVIEWER and .commit_id == env.HEAD_SHA)] | sort_by(.submitted_at) | last // {}' \
          <<< "$reviews")"
        latest_review_state="$(jq -r '.state // empty' <<< "$latest_review")"
        if [[ "$latest_review_state" != "APPROVED" ]]; then
          echo "The latest review from $REVIEWER for $HEAD_SHA is not an approval."
          exit 0
        fi

        reviewer_permission="$(gh api "repos/$REPOSITORY/collaborators/$REVIEWER/permission" --jq '.permission' 2>/dev/null || true)"
        reviewer_type="$(jq -r '.user.type // empty' <<< "$latest_review")"
        author_permission="$(gh api "repos/$REPOSITORY/collaborators/$author/permission" --jq '.permission' 2>/dev/null || true)"

        if [[ "$reviewer_permission" == "admin" ]]; then
          echo "Admin approval by $REVIEWER authorized."
        elif [[ "$reviewer_type" == "Bot" ]] && is_trusted_bot "$REVIEWER" && [[ "$author_permission" == "admin" ]]; then
          missing_bots=()

          for bot in "${TRUSTED_BOTS[@]}"; do
            bot_review_state="$(BOT="$bot" jq -r \
              '[.[] | select(.user.login == env.BOT and .commit_id == env.HEAD_SHA)] | sort_by(.submitted_at) | last | .state // empty' \
              <<< "$reviews")"

            if [[ "$bot_review_state" != "APPROVED" ]]; then
              missing_bots+=("$bot")
            fi
          done

          if [[ ${#missing_bots[@]} -gt 0 ]]; then
            echo "Bot approvals only authorize auto-merge once every trusted bot has approved $HEAD_SHA. Still waiting for: ${missing_bots[*]}."
            exit 0
          fi

          echo "Trusted bot approvals for admin author $author authorized."
        else
          echo "Approval by $REVIEWER does not authorize auto-merge."
          exit 0
        fi

        echo "pr_url=$(jq -r '.html_url' <<< "$pr")" >> "$GITHUB_OUTPUT"
        if [[ "$author" == "pull[bot]" && "$head_repository" == "FreeTubeApp/FreeTube" && "$head_ref" == "development" && "$base_ref" == "development" ]]; then
          echo "merge_method=merge" >> "$GITHUB_OUTPUT"
        else
          echo "merge_method=squash" >> "$GITHUB_OUTPUT"
        fi
        echo "authorized=true" >> "$GITHUB_OUTPUT"

    - name: Enable auto-merge
      if: steps.approval.outputs.authorized == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.PUSH_TOKEN || github.token }}
        PR_URL: ${{ steps.approval.outputs.pr_url }}
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        MERGE_METHOD: ${{ steps.approval.outputs.merge_method }}
      run: gh pr merge "$PR_URL" --auto "--$MERGE_METHOD" --match-head-commit "$HEAD_SHA"
