name: Enable Auto Merge
on:
  workflow_run:
    workflows: [Auto Merge PR]
    types: [completed]

permissions: {}

jobs:
  enable-auto-merge:
    if: github.event.workflow_run.event == 'pull_request_review'
    runs-on: ubuntu-slim

    permissions:
      actions: read
      contents: write
      pull-requests: write

    steps:
    - name: Validate admin approval
      id: approval
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.PUSH_TOKEN || github.token }}
        REPOSITORY: ${{ github.repository }}
        RUN_ID: ${{ github.event.workflow_run.id }}
        REVIEWER: ${{ github.event.workflow_run.actor.login }}
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      run: |
        TRUSTED_BOTS=('coderabbitai[bot]' 'greptile-apps[bot]')

        is_trusted_bot() {
          local candidate
          for candidate in "${TRUSTED_BOTS[@]}"; do
            if [[ "$1" == "$candidate" ]]; then
              return 0
            fi
          done
          return 1
        }

        # A COMMENTED review does not supersede an approval, so only APPROVED and
        # CHANGES_REQUESTED count when deciding where a reviewer currently stands.
        latest_decisive_review() {
          LOGIN="$1" jq -c \
            '[.[] | select(.user.login == env.LOGIN and .commit_id == env.HEAD_SHA and (.state == "APPROVED" or .state == "CHANGES_REQUESTED"))] | sort_by(.submitted_at) | last // {}' \
            <<< "$reviews"
        }

        bot_approved() {
          local bot="$1"
          local review_state
          review_state="$(latest_decisive_review "$bot" | jq -r '.state // empty')"

          if [[ "$review_state" == "APPROVED" ]]; then
            return 0
          fi

          if [[ "$review_state" == "CHANGES_REQUESTED" ]]; then
            return 1
          fi

          if [[ "$bot" == "greptile-apps[bot]" ]]; then
            jq -e --arg head_sha "$HEAD_SHA" \
              '[.[] | select(.user.login == "greptile-apps[bot]")] | sort_by(.updated_at) | last |
              ((.body // "") | contains("<h3>Confidence Score: 5/5</h3>") and contains("/commit/" + $head_sha))' \
              <<< "$comments" > /dev/null
          else
            return 1
          fi
        }

        job_name="$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs" \
          --jq '.jobs[] | select(.name | startswith("authorize-auto-merge-")) | select(.conclusion == "success") | .name')"
        pr_number="${job_name#authorize-auto-merge-}"

        if [[ ! "$pr_number" =~ ^[0-9]+$ ]]; then
          echo "The triggering review did not authorize auto-merge."
          exit 0
        fi

        pr="$(gh api "repos/$REPOSITORY/pulls/$pr_number")"
        state="$(jq -r '.state' <<< "$pr")"
        pr_head_sha="$(jq -r '.head.sha' <<< "$pr")"
        head_ref="$(jq -r '.head.ref' <<< "$pr")"
        head_repository="$(jq -r '.head.repo.full_name' <<< "$pr")"
        base_ref="$(jq -r '.base.ref' <<< "$pr")"
        draft="$(jq -r '.draft' <<< "$pr")"
        author="$(jq -r '.user.login' <<< "$pr")"

        if [[ "$state" != "open" || "$pr_head_sha" != "$HEAD_SHA" || "$draft" == "true" ]]; then
          echo "Pull request #$pr_number is closed, draft, or its head commit changed."
          exit 0
        fi

        if [[ "$base_ref" != "development" && "$base_ref" != RC* ]]; then
          echo "Pull request #$pr_number does not target an auto-merge branch."
          exit 0
        fi

        reviews="$(gh api --paginate "repos/$REPOSITORY/pulls/$pr_number/reviews" | jq -cs '[.[][]]')"
        comments="$(gh api --paginate "repos/$REPOSITORY/issues/$pr_number/comments" | jq -cs '[.[][]]')"
        latest_review="$(latest_decisive_review "$REVIEWER")"
        latest_review_state="$(jq -r '.state // empty' <<< "$latest_review")"

        reviewer_permission="$(gh api "repos/$REPOSITORY/collaborators/$REVIEWER/permission" --jq '.permission' 2>/dev/null || true)"
        author_permission="$(gh api "repos/$REPOSITORY/collaborators/$author/permission" --jq '.permission' 2>/dev/null || true)"

        if [[ "$reviewer_permission" == "admin" && "$latest_review_state" == "APPROVED" ]]; then
          echo "Admin approval by $REVIEWER authorized."
        elif is_trusted_bot "$REVIEWER" && [[ "$author_permission" == "admin" ]] && bot_approved "$REVIEWER"; then
          missing_bots=()

          for bot in "${TRUSTED_BOTS[@]}"; do
            if ! bot_approved "$bot"; then
              missing_bots+=("$bot")
            fi
          done

          if [[ ${#missing_bots[@]} -gt 0 ]]; then
            echo "Trusted bot reviews do not authorize auto-merge yet for $HEAD_SHA. Still waiting for: ${missing_bots[*]}."
            exit 0
          fi

          echo "Trusted bot reviews for admin author $author authorized."
        else
          echo "Approval by $REVIEWER does not authorize auto-merge."
          exit 0
        fi

        echo "pr_url=$(jq -r '.html_url' <<< "$pr")" >> "$GITHUB_OUTPUT"
        if [[ "$author" == "pull[bot]" && "$head_repository" == "FreeTubeApp/FreeTube" && "$head_ref" == "development" && "$base_ref" == "development" ]]; then
          echo "merge_method=merge" >> "$GITHUB_OUTPUT"
        else
          echo "merge_method=squash" >> "$GITHUB_OUTPUT"
        fi
        echo "authorized=true" >> "$GITHUB_OUTPUT"

    - name: Enable auto-merge
      if: steps.approval.outputs.authorized == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.PUSH_TOKEN || github.token }}
        PR_URL: ${{ steps.approval.outputs.pr_url }}
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        MERGE_METHOD: ${{ steps.approval.outputs.merge_method }}
      run: gh pr merge "$PR_URL" --auto "--$MERGE_METHOD" --match-head-commit "$HEAD_SHA"
