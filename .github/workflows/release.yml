# This is a basic workflow that is manually triggered

name: Upload Release

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
# Get release ID: gh api repos/OpenTubeX/OpenTubeX/releases/tags/<tagname> --jq .id
on:
  workflow_dispatch:
    inputs:
      releaseId:
        type: string
        required: true
        description: Release ID
      publishRelease:
        type: boolean
        required: true
        default: true
        description: Publish release after uploading assets

permissions: {}

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:

    permissions:
      contents: write

    strategy:
      matrix:
        node-version: [24.x]
        runtime:
          - linux-x64
          - linux-armv7l
          - linux-arm64
          - win-x64
          - win-arm64
          - osx-x64
          - osx-arm64
        include:
        - runtime: linux-x64
          os: ubuntu-latest
          appimage-arch: amd64

        - runtime: linux-armv7l
          os: ubuntu-latest
          appimage-arch: armv7l

        - runtime: linux-arm64
          os: ubuntu-24.04-arm
          appimage-arch: arm64

        - runtime: osx-x64
          os: macOS-latest

        - runtime: osx-arm64
          os: macOS-latest

        - runtime: win-x64
          os: windows-latest

        - runtime: win-arm64
          os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Do not restore the pnpm cache, to avoid cache poisoning affecting releases
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ matrix.node-version }}
        package-manager-cache: false

    - name: Install pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        version: 11
        cache: false

    - run: pnpm run ci
      shell: bash
    - run: pnpm run lint
      shell: bash

    - name: Get Version Number
      id: getPackageInfo
      shell: bash
      run: |
        jq --raw-output '"version=" + .version' package.json >> "$GITHUB_OUTPUT"

    - name: Install Linux packaging dependencies
      if: startsWith(matrix.os, 'ubuntu')
      shell: bash
      run: |
        sudo apt update
        apt_package() {
          for package_name in "$@"; do
            if apt-cache show "$package_name" >/dev/null 2>&1; then
              printf '%s\n' "$package_name"
              return 0
            fi
          done

          return 1
        }
        sudo apt -y install \
          binutils dbus-x11 desktop-file-utils file gcc libarchive-tools libasound2t64 \
          "$(apt_package libatk-bridge2.0-0t64 libatk-bridge2.0-0)" \
          "$(apt_package libatspi2.0-0t64 libatspi2.0-0)" \
          "$(apt_package libgtk-3-0t64 libgtk-3-0)" \
          libnotify4 libnss3 libsecret-1-0 libxss1 libxtst6 patchelf strace wget xauth xdg-utils xvfb

    - name: Build x64 with Node.js ${{ matrix.node-version}}
      if: contains(matrix.runtime, 'x64')
      shell: bash
      run: pnpm run build

    - name: Build ARMv7l with Node.js ${{ matrix.node-version}}
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-armv7l')
      shell: bash
      run: pnpm run build:arm32

    - name: Build ARM64 with Node.js ${{ matrix.node-version}}
      if: contains(matrix.runtime, 'arm64')
      shell: bash
      run: pnpm run build:arm64

    - name: Convert x64 AppImage to Anylinux AppImage
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-x64')
      shell: bash
      env:
        VERSION: ${{ steps.getPackageInfo.outputs.version }}
        UPINFO: 'gh-releases-zsync|OpenTubeX|OpenTubeX|latest-all|opentubex-*-amd64.AppImage.zsync'
      run: |
        docker run --rm -v "$PWD":/work -w /work -e UPINFO ghcr.io/pkgforge-dev/archlinux:latest \
          sh _scripts/package-anylinux-appimage.sh "build/opentubex_${VERSION}_amd64.deb"

    - name: Convert ARMv7l AppImage to static runtime and add update information
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-armv7l')
      shell: bash
      env:
        VERSION: ${{ steps.getPackageInfo.outputs.version }}
      run: |
        cd build
        appimage="OpenTubeX-${VERSION}-armv7l.AppImage"
        wget "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -O ./appimagetool.AppImage
        wget "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64" -O runtime
        chmod +x ./"$appimage" ./appimagetool.AppImage ./runtime
        update_information='gh-releases-zsync|OpenTubeX|OpenTubeX|latest-all|opentubex-*-armv7l.AppImage.zsync'
        TARGET_APPIMAGE="$appimage" ./runtime --appimage-extract && rm -f ./"$appimage"
        ARCH=armhf ./appimagetool.AppImage --comp zstd --mksquashfs-opt -Xcompression-level --mksquashfs-opt 20 \
          -u "$update_information" -n ./squashfs-root ./"$appimage"
        rm -rf ./squashfs-root ./appimagetool.AppImage ./runtime

    - name: Convert ARM64 AppImage to Anylinux AppImage
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-arm64')
      shell: bash
      env:
        VERSION: ${{ steps.getPackageInfo.outputs.version }}
        UPINFO: 'gh-releases-zsync|OpenTubeX|OpenTubeX|latest-all|opentubex-*-arm64.AppImage.zsync'
      run: |
        docker run --rm -v "$PWD":/work -w /work -e UPINFO ghcr.io/pkgforge-dev/archlinux:latest \
          sh _scripts/package-anylinux-appimage.sh "build/opentubex_${VERSION}_arm64.deb"

    - name: Resolve release tag
      id: release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_ID: ${{ inputs.releaseId }}
      shell: bash
      run: |
        set -euo pipefail
        tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq .tag_name)"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

    - name: Prepare release assets
      env:
        RUNTIME: ${{ matrix.runtime }}
        VERSION: ${{ steps.getPackageInfo.outputs.version }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir release-assets

        case "$RUNTIME" in
          linux-x64)
            cp "build/opentubex-${VERSION}.zip" \
              "release-assets/opentubex-${VERSION}-beta-linux-x64-portable.zip"
            cp "build/opentubex-${VERSION}.7z" \
              "release-assets/opentubex-${VERSION}-beta-linux-x64-portable.7z"
            cp "build/opentubex_${VERSION}_amd64.deb" \
              "release-assets/opentubex_${VERSION}_beta_amd64.deb"
            cp "build/opentubex-${VERSION}-amd64.AppImage" \
              "release-assets/opentubex-${VERSION}-beta-amd64.AppImage"
            cp "build/opentubex-${VERSION}-amd64.AppImage.zsync" \
              "release-assets/opentubex-${VERSION}-beta-amd64.AppImage.zsync"
            cp "build/opentubex-${VERSION}.x86_64.rpm" \
              "release-assets/opentubex-${VERSION}-beta.amd64.rpm"
            cp "build/opentubex-${VERSION}.pacman" \
              "release-assets/opentubex-${VERSION}-beta-amd64.pacman"
            ;;
          linux-armv7l)
            cp "build/opentubex-${VERSION}-armv7l.zip" \
              "release-assets/opentubex-${VERSION}-beta-linux-armv7l-portable.zip"
            cp "build/opentubex-${VERSION}-armv7l.7z" \
              "release-assets/opentubex-${VERSION}-beta-linux-armv7l-portable.7z"
            cp "build/opentubex_${VERSION}_armv7l.deb" \
              "release-assets/opentubex_${VERSION}_beta_armv7l.deb"
            cp "build/OpenTubeX-${VERSION}-armv7l.AppImage" \
              "release-assets/opentubex-${VERSION}-beta-armv7l.AppImage"
            cp "build/OpenTubeX-${VERSION}-armv7l.AppImage.zsync" \
              "release-assets/opentubex-${VERSION}-beta-armv7l.AppImage.zsync"
            ;;
          linux-arm64)
            cp "build/opentubex-${VERSION}-arm64.zip" \
              "release-assets/opentubex-${VERSION}-beta-linux-arm64-portable.zip"
            cp "build/opentubex-${VERSION}-arm64.7z" \
              "release-assets/opentubex-${VERSION}-beta-linux-arm64-portable.7z"
            cp "build/opentubex_${VERSION}_arm64.deb" \
              "release-assets/opentubex_${VERSION}_beta_arm64.deb"
            cp "build/opentubex-${VERSION}-arm64.AppImage" \
              "release-assets/opentubex-${VERSION}-beta-arm64.AppImage"
            cp "build/opentubex-${VERSION}-arm64.AppImage.zsync" \
              "release-assets/opentubex-${VERSION}-beta-arm64.AppImage.zsync"
            cp "build/opentubex-${VERSION}.aarch64.rpm" \
              "release-assets/opentubex-${VERSION}-beta.arm64.rpm"
            ;;
          win-x64)
            cp "build/opentubex Setup ${VERSION}.exe" \
              "release-assets/opentubex-${VERSION}-beta-setup-x64.exe"
            cp "build/OpenTubeX ${VERSION}.exe" \
              "release-assets/opentubex-${VERSION}-beta-win-x64-portable.exe"
            cp "build/opentubex-${VERSION}-win.zip" \
              "release-assets/opentubex-${VERSION}-beta-win-x64-portable.zip"
            cp "build/opentubex-${VERSION}-win.7z" \
              "release-assets/opentubex-${VERSION}-beta-win-x64-portable.7z"
            ;;
          win-arm64)
            cp "build/opentubex Setup ${VERSION}.exe" \
              "release-assets/opentubex-${VERSION}-beta-setup-arm64.exe"
            cp "build/OpenTubeX ${VERSION}.exe" \
              "release-assets/opentubex-${VERSION}-beta-win-arm64-portable.exe"
            cp "build/opentubex-${VERSION}-arm64-win.zip" \
              "release-assets/opentubex-${VERSION}-beta-win-arm64-portable.zip"
            cp "build/opentubex-${VERSION}-arm64-win.7z" \
              "release-assets/opentubex-${VERSION}-beta-win-arm64-portable.7z"
            ;;
          osx-x64)
            cp "build/opentubex-${VERSION}.dmg" \
              "release-assets/opentubex-${VERSION}-beta-mac-x64.dmg"
            cp "build/opentubex-${VERSION}-mac.zip" \
              "release-assets/opentubex-${VERSION}-beta-mac-x64.zip"
            cp "build/opentubex-${VERSION}-mac.7z" \
              "release-assets/opentubex-${VERSION}-beta-mac-x64.7z"
            ;;
          osx-arm64)
            cp "build/opentubex-${VERSION}-arm64.dmg" \
              "release-assets/opentubex-${VERSION}-beta-mac-arm64.dmg"
            cp "build/opentubex-${VERSION}-arm64-mac.zip" \
              "release-assets/opentubex-${VERSION}-beta-mac-arm64.zip"
            cp "build/opentubex-${VERSION}-arm64-mac.7z" \
              "release-assets/opentubex-${VERSION}-beta-mac-arm64.7z"
            ;;
        esac

    - name: Upload release assets
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      env:
        GITHUB_TOKEN: ${{ github.token }}
      with:
        tag_name: ${{ steps.release.outputs.tag }}
        draft: true
        files: release-assets/*
        fail_on_unmatched_files: true

  publish-release:
    name: Publish draft release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Publish release if it is a draft
      if: inputs.publishRelease
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_ID: ${{ inputs.releaseId }}
      shell: bash
      run: |
        set -euo pipefail

        draft="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq .draft)"
        if [[ "$draft" == true ]]; then
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false \
            --silent
        fi

  trigger-flatpak:
    name: Trigger Flatpak build
    needs: publish-release
    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: read

    steps:
    - name: Resolve release tag
      id: release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_ID: ${{ inputs.releaseId }}
      shell: bash
      run: |
        set -euo pipefail

        tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq .tag_name)"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

    - name: Trigger flatpak workflow
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.release.outputs.tag }}
      shell: bash
      run: |
        set -euo pipefail

        gh workflow run flatpak.yml \
          --repo "$GITHUB_REPOSITORY" \
          --ref "$GITHUB_REF_NAME" \
          -f "releaseTag=$TAG"

  trigger-aur-update:
    name: Trigger AUR repository update
    needs: publish-release
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - name: Resolve release tag
      id: release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_ID: ${{ inputs.releaseId }}
      shell: bash
      run: |
        set -euo pipefail

        tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq .tag_name)"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

    - name: Trigger AUR repository workflow
      env:
        GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        TAG: ${{ steps.release.outputs.tag }}
      shell: bash
      run: |
        set -euo pipefail

        gh api repos/OpenTubeX/aur/dispatches \
          --method POST \
          -f event_type=opentubex-release \
          -f "client_payload[tag]=$TAG"

  trigger-rpm-update:
    name: Trigger RPM repository update
    needs: publish-release
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - name: Resolve release tag
      id: release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_ID: ${{ inputs.releaseId }}
      shell: bash
      run: |
        set -euo pipefail

        tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq .tag_name)"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

    - name: Trigger RPM repository workflow
      env:
        GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        TAG: ${{ steps.release.outputs.tag }}
      shell: bash
      run: |
        set -euo pipefail

        gh api repos/OpenTubeX/rpm/dispatches \
          --method POST \
          -f event_type=opentubex-release \
          -f "client_payload[tag]=$TAG"

  trigger-apt-update:
    name: Trigger APT repository update
    needs: publish-release
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - name: Resolve release tag
      id: release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_ID: ${{ inputs.releaseId }}
      shell: bash
      run: |
        set -euo pipefail

        tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq .tag_name)"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

    - name: Trigger APT repository workflow
      env:
        GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        TAG: ${{ steps.release.outputs.tag }}
      shell: bash
      run: |
        set -euo pipefail

        gh api repos/OpenTubeX/apt/dispatches \
          --method POST \
          -f event_type=opentubex-release \
          -f "client_payload[tag]=$TAG"

  trigger-snap-update:
    name: Trigger Snap package update
    needs: publish-release
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - name: Resolve release tag
      id: release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_ID: ${{ inputs.releaseId }}
      shell: bash
      run: |
        set -euo pipefail

        tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq .tag_name)"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

    - name: Trigger Snap package workflow
      env:
        GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        TAG: ${{ steps.release.outputs.tag }}
      shell: bash
      run: |
        set -euo pipefail

        gh api repos/OpenTubeX/snap/dispatches \
          --method POST \
          -f event_type=opentubex-release \
          -f "client_payload[tag]=$TAG"

  trigger-website-update:
    name: Trigger website update
    needs: publish-release
    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: read

    steps:
    - name: Resolve release tag
      id: release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_ID: ${{ inputs.releaseId }}
      shell: bash
      run: |
        set -euo pipefail

        tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq .tag_name)"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

    - name: Trigger website update workflow
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.release.outputs.tag }}
      shell: bash
      run: |
        set -euo pipefail

        gh workflow run updateSite.yml \
          --repo "$GITHUB_REPOSITORY" \
          --ref "$GITHUB_REF_NAME" \
          -f "releaseTag=$TAG"
