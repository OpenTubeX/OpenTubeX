    - name: Upload Windows arm64 .7z Release
      uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 #v1.0.2
      if: startsWith(matrix.os, 'windows') && startsWith(matrix.runtime, 'win-arm64')
