name: Auto Merge PR
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  disable-auto-merge:
    if: |
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.state == 'open' &&
      (github.event.pull_request.base.ref == 'development' || startsWith(github.event.pull_request.base.ref, 'RC'))
    runs-on: ubuntu-slim

    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Disable auto-merge until admin approval
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.PUSH_TOKEN || github.token }}
        PR_URL: ${{ github.event.pull_request.html_url }}
      run: gh pr merge "$PR_URL" --disable-auto || true

  enable-auto-merge:
    if: |
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      github.event.pull_request.state == 'open' &&
      !github.event.pull_request.draft &&
      (github.event.pull_request.base.ref == 'development' || startsWith(github.event.pull_request.base.ref, 'RC'))
    runs-on: ubuntu-slim

    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Verify reviewer is repository admin
      id: reviewer
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.PUSH_TOKEN || github.token }}
        REPOSITORY: ${{ github.repository }}
        REVIEWER: ${{ github.event.review.user.login }}
      run: |
        permission="$(gh api "repos/$REPOSITORY/collaborators/$REVIEWER/permission" --jq '.permission' 2>/dev/null || true)"

        if [[ "$permission" != "admin" ]]; then
          echo "Reviewer $REVIEWER has '$permission' permission, not admin. Auto-merge will not be enabled."
          echo "is_admin=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "is_admin=true" >> "$GITHUB_OUTPUT"

    - name: Enable auto-merge
      if: steps.reviewer.outputs.is_admin == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.PUSH_TOKEN || github.token }}
        PR_URL: ${{ github.event.pull_request.html_url }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: gh pr merge "$PR_URL" --auto --squash --match-head-commit "$HEAD_SHA"
