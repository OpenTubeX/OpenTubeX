name: Auto Merge PR
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  disable-auto-merge:
    if: |
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.state == 'open' &&
      (github.event.pull_request.base.ref == 'development' || startsWith(github.event.pull_request.base.ref, 'RC'))
    runs-on: ubuntu-slim

    permissions:
      pull-requests: write
    steps:
    - name: Disable auto-merge until admin approval
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.PUSH_TOKEN || github.token }}
        PR_URL: ${{ github.event.pull_request.html_url }}
      run: gh pr merge "$PR_URL" --disable-auto || true

  authorize-auto-merge:
    name: authorize-auto-merge-${{ github.event.pull_request.number }}
    if: |
      github.event_name == 'pull_request_review' &&
      (
        github.event.review.state == 'approved' ||
        (
          github.event.review.state == 'commented' &&
          github.event.review.user.login == 'greptile-apps[bot]'
        )
      ) &&
      github.event.pull_request.state == 'open' &&
      !github.event.pull_request.draft &&
      (github.event.pull_request.base.ref == 'development' || startsWith(github.event.pull_request.base.ref, 'RC'))
    runs-on: ubuntu-slim

    permissions:
      contents: read
      pull-requests: read

    steps:
    - name: Verify approval can authorize auto-merge
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        REVIEWER: ${{ github.event.review.user.login }}
        REVIEWER_TYPE: ${{ github.event.review.user.type }}
        AUTHOR: ${{ github.event.pull_request.user.login }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        TRUSTED_BOTS=('coderabbitai[bot]' 'greptile-apps[bot]' 'macroscopeapp[bot]')

        is_trusted_bot() {
          local candidate
          for candidate in "${TRUSTED_BOTS[@]}"; do
            if [[ "$1" == "$candidate" ]]; then
              return 0
            fi
          done
          return 1
        }

        # A COMMENTED review does not supersede an approval, so only APPROVED and
        # CHANGES_REQUESTED count when deciding where a reviewer currently stands.
        latest_decisive_review() {
          LOGIN="$1" jq -c \
            '[.[] | select(.user.login == env.LOGIN and .commit_id == env.HEAD_SHA and (.state == "APPROVED" or .state == "CHANGES_REQUESTED"))] | sort_by(.submitted_at) | last // {}' \
            <<< "$reviews"
        }

        coderabbit_has_findings() {
          jq -e --arg head_sha "$HEAD_SHA" \
            'any(.[]; .user.login == "coderabbitai[bot]" and .commit_id == $head_sha and .state == "COMMENTED")' \
            <<< "$reviews" > /dev/null
        }

        bot_approved() {
          local bot="$1"
          local review_state
          review_state="$(latest_decisive_review "$bot" | jq -r '.state // empty')"

          if [[ "$bot" == "coderabbitai[bot]" ]] && coderabbit_has_findings; then
            return 1
          fi

          if [[ "$review_state" == "APPROVED" ]]; then
            return 0
          fi

          if [[ "$review_state" == "CHANGES_REQUESTED" ]]; then
            return 1
          fi

          if [[ "$bot" == "greptile-apps[bot]" ]]; then
            jq -e --arg head_sha "$HEAD_SHA" \
              '[.[] | select(.user.login == "greptile-apps[bot]")] | sort_by(.updated_at) | last |
              ((.body // "") | contains("<h3>Confidence Score: 5/5</h3>") and contains("/commit/" + $head_sha))' \
              <<< "$comments" > /dev/null
          else
            return 1
          fi
        }

        reviewer_permission="$(gh api "repos/$REPOSITORY/collaborators/$REVIEWER/permission" --jq '.permission' 2>/dev/null || true)"

        if [[ "$reviewer_permission" == "admin" ]]; then
          echo "Admin approval authorized. A trusted follow-up workflow will enable auto-merge."
          exit 0
        fi

        author_permission="$(gh api "repos/$REPOSITORY/collaborators/$AUTHOR/permission" --jq '.permission' 2>/dev/null || true)"
        if [[ "$REVIEWER_TYPE" == "Bot" ]] && is_trusted_bot "$REVIEWER" && [[ "$author_permission" == "admin" ]]; then
          reviews="$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/reviews" | jq -cs '[.[][]]')"
          comments="$(gh api --paginate "repos/$REPOSITORY/issues/$PR_NUMBER/comments" | jq -cs '[.[][]]')"
          missing_bots=()

          for bot in "${TRUSTED_BOTS[@]}"; do
            if ! bot_approved "$bot"; then
              missing_bots+=("$bot")
            fi
          done

          if [[ ${#missing_bots[@]} -gt 0 ]]; then
            echo "Trusted bot reviews do not authorize auto-merge yet for $HEAD_SHA. Still waiting for: ${missing_bots[*]}."
            exit 0
          fi

          echo "Trusted bot reviews for admin author $AUTHOR authorized."
          exit 0
        fi

        echo "Approval by $REVIEWER does not authorize auto-merge."
