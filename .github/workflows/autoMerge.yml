name: Auto Merge PR
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  disable-auto-merge:
    if: |
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.state == 'open' &&
      (github.event.pull_request.base.ref == 'development' || startsWith(github.event.pull_request.base.ref, 'RC'))
    runs-on: ubuntu-slim

    permissions:
      pull-requests: write
    steps:
    - name: Disable auto-merge until admin approval
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.PUSH_TOKEN || github.token }}
        PR_URL: ${{ github.event.pull_request.html_url }}
      run: gh pr merge "$PR_URL" --disable-auto || true

  authorize-auto-merge:
    name: authorize-auto-merge-${{ github.event.pull_request.number }}
    if: |
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      github.event.pull_request.state == 'open' &&
      !github.event.pull_request.draft &&
      (github.event.pull_request.base.ref == 'development' || startsWith(github.event.pull_request.base.ref, 'RC'))
    runs-on: ubuntu-slim

    permissions:
      contents: read
      pull-requests: read

    steps:
    - name: Verify approval can authorize auto-merge
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        REVIEWER: ${{ github.event.review.user.login }}
        REVIEWER_TYPE: ${{ github.event.review.user.type }}
        AUTHOR: ${{ github.event.pull_request.user.login }}
      run: |
        reviewer_permission="$(gh api "repos/$REPOSITORY/collaborators/$REVIEWER/permission" --jq '.permission' 2>/dev/null || true)"

        if [[ "$reviewer_permission" == "admin" ]]; then
          echo "Admin approval authorized. A trusted follow-up workflow will enable auto-merge."
          exit 0
        fi

        author_permission="$(gh api "repos/$REPOSITORY/collaborators/$AUTHOR/permission" --jq '.permission' 2>/dev/null || true)"
        if [[ "$REVIEWER_TYPE" == "Bot" &&
          ( "$REVIEWER" == "coderabbitai[bot]" || "$REVIEWER" == "greptile-apps[bot]" ) &&
          "$author_permission" == "admin" ]]; then
          echo "Trusted bot approval for admin author $AUTHOR authorized."
          exit 0
        fi

        echo "Approval by $REVIEWER does not authorize auto-merge."
