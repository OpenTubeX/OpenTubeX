name: Build Flatpak

on:
  workflow_dispatch:
    inputs:
      releaseTag:
        type: string
        required: false
        description: Release tag to build, for example v0.25.5-beta

permissions: {}

jobs:
  trigger-flatpak:
    name: Trigger Flatpak build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.releaseTag }}
        run: |
          tag="$INPUT_TAG"

          if [ -z "$tag" ]; then
            echo "No release tag provided."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Trigger flatpak build
        env:
          GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh api repos/OpenTubeX/flatpak/dispatches \
            --method POST \
            -f event_type=opentubex-release \
            -f "client_payload[tag]=$TAG"
