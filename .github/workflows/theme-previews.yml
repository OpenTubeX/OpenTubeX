name: Theme previews

on:
  discussion:
    types: [ created, edited, category_changed ]
  workflow_dispatch:
    inputs:
      discussion:
        description: Theme discussion number to capture or refresh
        required: true
        type: number

permissions: {}

concurrency:
  group: theme-preview-${{ github.event.discussion.number || inputs.discussion }}
  # Let publication finish before the next edit checks the existing comment.
  cancel-in-progress: false

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' || github.event.discussion.category.slug == 'themes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      discussions: write
    env:
      THEME_PREVIEW_DIR: .tmp/theme-preview
      DISCUSSION_NUMBER: ${{ github.event.discussion.number || inputs.discussion }}
    steps:
    - name: Check out trusted capture code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.repository.default_branch }}
        persist-credentials: false

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.x
        package-manager-cache: false

    - name: Set up Go for the Cast sender
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: _scripts/cast-sender/go.mod
        cache: false

    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 11
        cache: false

    - run: pnpm run ci

    - name: Enforce theme description and link limits
      id: moderation
      env:
        # Editing another author's discussion requires the user token.
        GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
      run: node _scripts/themePreview.mjs moderate "$THEME_PREVIEW_DIR"

    - name: Notify the author as github-actions[bot]
      if: steps.moderation.outputs.changed == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh api graphql --input "$THEME_PREVIEW_DIR/moderation-comment.json"

    - name: Check whether previews are needed
      id: request
      env:
        GH_TOKEN: ${{ github.token }}
      run: node _scripts/themePreview.mjs prepare "$THEME_PREVIEW_DIR"

    - name: Install Electron
      if: steps.request.outputs.enabled == 'true'
      run: pnpm exec install-electron

    - name: Install live screenshot playback dependencies
      if: steps.request.outputs.enabled == 'true'
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends ffmpeg
        pipx install 'yt-dlp[default]'
        mkdir -p "$HOME/.config/yt-dlp"
        printf '%s\n' '--js-runtimes node' > "$HOME/.config/yt-dlp/config"

    - name: Pack the capture app
      if: steps.request.outputs.enabled == 'true'
      run: pnpm run test:e2e:pack

    - name: Capture three previews
      if: steps.request.outputs.enabled == 'true'
      env:
        LANG: en_US.UTF-8
        LC_ALL: en_US.UTF-8
        LANGUAGE: en_US
      run: xvfb-run -a -s '-screen 0 1920x1080x24' pnpm exec playwright test -c e2e/theme-previews/playwright.config.mjs

    - name: Upload discussion attachments
      if: steps.request.outputs.enabled == 'true'
      env:
        # Native attachments require a user token with write access to this repo.
        # GitHub does not support attachment uploads with GITHUB_TOKEN.
        GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
      run: node _scripts/themePreview.mjs upload "$THEME_PREVIEW_DIR"

    - name: Fill the Screenshots section in the discussion
      if: steps.request.outputs.enabled == 'true'
      env:
        # GITHUB_TOKEN cannot edit another author's discussion body.
        GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
      run: node _scripts/themePreview.mjs publish "$THEME_PREVIEW_DIR"

    - name: Keep failed capture diagnostics
      if: failure() && steps.request.outputs.enabled == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: theme-preview-diagnostics
        path: e2e/results/theme-previews/
        retention-days: 7
