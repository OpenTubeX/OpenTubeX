name: Sync GitLab issues

on:
  issues:
    types: [closed, reopened]
  issue_comment:
    types: [created, edited]
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: gitlab-issue-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.repository == 'OpenTubeX/OpenTubeX' &&
      (github.event_name == 'schedule' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) &&
      ((github.event_name != 'issues' && github.event_name != 'issue_comment') ||
      (!github.event.issue.pull_request &&
      github.event.issue.user.login == 'github-actions[bot]' &&
      startsWith(github.event.issue.body, '<!-- opentubex-sync:issue:') &&
      github.actor != 'github-actions[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Synchronize reports and comments
        env:
          GH_TOKEN: ${{ github.token }}
          GITLAB_ISSUE_SYNC_TOKEN: ${{ secrets.GITLAB_ISSUE_SYNC_TOKEN }}
          # Copies GitLab images to release assets in OpenTubeX/media.
          MEDIA_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: node _scripts/gitlabIssueSync.mjs
