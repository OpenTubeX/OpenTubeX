name: Sync GitLab issues

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: gitlab-issue-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'OpenTubeX/OpenTubeX'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Synchronize reports and comments
        env:
          GH_TOKEN: ${{ github.token }}
          GITLAB_ISSUE_SYNC_TOKEN: ${{ secrets.GITLAB_ISSUE_SYNC_TOKEN }}
        run: node _scripts/gitlabIssueSync.mjs
