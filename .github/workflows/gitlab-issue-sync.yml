name: Sync GitLab issues

on:
  issues:
    types: [closed, reopened]
  issue_comment:
    types: [created, edited]
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitlab-issue-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.repository == 'OpenTubeX/OpenTubeX' &&
      (github.event_name == 'schedule' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) &&
      ((github.event_name != 'issues' && github.event_name != 'issue_comment') ||
      (!github.event.issue.pull_request &&
      (github.event.issue.user.login == 'opentubex-gitlab-sync[bot]' ||
      github.event.issue.user.login == 'github-actions[bot]') &&
      startsWith(github.event.issue.body, '<!-- opentubex-sync:issue:') &&
      github.actor != 'opentubex-gitlab-sync[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The sync posts as its own app instead of github-actions[bot].
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          client-id: ${{ vars.GITLAB_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITLAB_SYNC_APP_PRIVATE_KEY }}
          repositories: OpenTubeX
      - name: Synchronize reports and comments
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITLAB_ISSUE_SYNC_TOKEN: ${{ secrets.GITLAB_SYNC_BOT_TOKEN }}
          # Copies GitLab images to release assets in OpenTubeX/media.
          MEDIA_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: node _scripts/gitlabIssueSync.mjs
