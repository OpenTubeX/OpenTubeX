name: Create Draft Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: New release tag (for example, v0.30.0-beta)
        required: true
        type: string
      previousTag:
        description: Previous release tag
        required: true
        type: string
      target:
        description: Target branch
        required: true
        default: development
        type: string

permissions: {}

jobs:
  create:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: read
      pull-requests: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ inputs.target }}

    - name: Resolve release target
      id: target
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Generate release notes
      env:
        GH_TOKEN: ${{ github.token }}
        PREVIOUS_TAG: ${{ inputs.previousTag }}
        TARGET_BRANCH: ${{ inputs.target }}
        TARGET_SHA: ${{ steps.target.outputs.sha }}
      run: node _scripts/releaseNotes.mjs generate release-notes.md

    - name: Create draft release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}
        TARGET_BRANCH: ${{ inputs.target }}
      run: |
        set -euo pipefail

        release_title="$TAG"
        if [[ "$release_title" == *-beta ]]; then
          release_title="${release_title%-beta} Beta"
        fi

        release="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
          -f tag_name="$TAG" \
          -f target_commitish="$TARGET_BRANCH" \
          -f name="$release_title" \
          -F draft=true \
          -F body=@release-notes.md)"
        release_id="$(jq --raw-output .id <<< "$release")"
        release_url="$(jq --raw-output .html_url <<< "$release")"

        {
          echo "## Draft release created"
          echo
          echo "- Release: ${release_url}"
          echo "- Release ID for the Upload Release workflow: \`${release_id}\`"
        } >> "$GITHUB_STEP_SUMMARY"
