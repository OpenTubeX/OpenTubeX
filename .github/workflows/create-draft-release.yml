name: Create Draft Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: New package version (for example, 0.33.0)
        required: true
        type: string
      previousTag:
        description: Previous release tag (defaults to the latest non-nightly release)
        required: false
        type: string
      target:
        description: Target branch
        required: true
        default: development
        type: string

permissions: {}

jobs:
  create:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: read
      pull-requests: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: true
        ref: ${{ inputs.target }}

    - name: Resolve previous release tag
      id: previous
      env:
        GH_TOKEN: ${{ github.token }}
        PREVIOUS_TAG: ${{ inputs.previousTag }}
      shell: bash
      run: |
        set -euo pipefail

        previous_tag="$PREVIOUS_TAG"
        if [[ -z "$previous_tag" ]]; then
          previous_tag="$(
            gh release list --limit 100 --json isDraft,tagName \
              --jq 'first(.[] | select(
                .isDraft == false and
                (.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-nightly-[0-9]+$") | not)
              ) | .tagName)'
          )"
        fi

        if [[ -z "$previous_tag" ]]; then
          echo 'Could not find a previous non-nightly release tag.' >&2
          exit 1
        fi

        echo "tag=$previous_tag" >> "$GITHUB_OUTPUT"

    - name: Bump package version
      id: release
      env:
        VERSION: ${{ inputs.version }}
      shell: bash
      run: |
        set -euo pipefail

        if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
          echo 'Version must use the x.y.z format, for example 0.33.0.' >&2
          exit 1
        fi

        node --input-type=module <<'EOF'
        import { readFileSync, writeFileSync } from 'node:fs';

        const file = 'package.json';
        const packageJson = JSON.parse(readFileSync(file, 'utf8'));
        packageJson.version = process.env.VERSION;
        writeFileSync(file, `${JSON.stringify(packageJson, null, 2)}\n`);
        EOF

        git add package.json
        if ! git diff --cached --quiet; then
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "chore(release): bump to $VERSION"
        fi

        echo "tag=v${VERSION}-beta" >> "$GITHUB_OUTPUT"

    - name: Resolve release target
      id: target
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Generate release notes
      env:
        GH_TOKEN: ${{ github.token }}
        PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        TARGET_BRANCH: ${{ inputs.target }}
        TARGET_SHA: ${{ steps.target.outputs.sha }}
      run: node _scripts/releaseNotes.mjs generate release-notes.md

    - name: Push package version
      env:
        TARGET_BRANCH: ${{ inputs.target }}
      run: git push origin "HEAD:$TARGET_BRANCH"

    - name: Create draft release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.release.outputs.tag }}
        TARGET_SHA: ${{ steps.target.outputs.sha }}
      run: |
        set -euo pipefail

        release_title="$TAG"
        if [[ "$release_title" == *-beta ]]; then
          release_title="${release_title%-beta} Beta"
        fi

        release="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
          -f tag_name="$TAG" \
          -f target_commitish="$TARGET_SHA" \
          -f name="$release_title" \
          -F draft=true \
          -F body=@release-notes.md)"
        release_id="$(jq --raw-output .id <<< "$release")"
        release_url="$(jq --raw-output .html_url <<< "$release")"

        {
          echo "## Draft release created"
          echo
          echo "- Release: ${release_url}"
          echo "- Release ID for the Upload Release workflow: \`${release_id}\`"
        } >> "$GITHUB_STEP_SUMMARY"
