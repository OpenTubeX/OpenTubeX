name: Bug Report
description: Report an issue or unexpected behavior that occurs within the application
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        **README: Before You Submit Your Issue**
        - Issues are not a place to go ask support questions or start discussions. Please ask support questions or start discussions on the [discussions page](https://github.com/OpenTubeX/OpenTubeX/discussions).
  - type: checkboxes
    attributes:
      label: Guidelines
      description: Please ensure you've completed all of the following.
      options:
        - label: I have encountered this bug in the [latest release of OpenTubeX](https://github.com/OpenTubeX/OpenTubeX/releases).
          required: true
        - label: I have encountered this bug in the [official downloads](https://github.com/OpenTubeX/OpenTubeX#official-downloads) or [official web app image](https://opentubex.org/docs/self-hosting/) of OpenTubeX.
          required: true
        - label: I have [searched the issue tracker for **open and closed** issues](https://github.com/OpenTubeX/OpenTubeX/issues?q=is%3Aissue+sort%3Arelevance-desc) that are similar to the bug report I want to file, without success.
          required: true
        - label: I have searched the [documentation](https://opentubex.org/docs/) for information that matches the description of the bug I want to file, without success.
          required: true
        - label: This issue contains only one bug.
          required: true
  - type: textarea
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: |
          1. Go to '...'
          2. Click on '....'
          3. Scroll down to '....'
          4. See error
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: dropdown
    attributes:
      label: 'Issue Labels'
      description: Please select a label that fits this bug report. Choose multiple, if applicable.
      multiple: true
      options:
        - accessibility issue
        - API issue
        - causes crash
        - content not loading
        - data loss
        - feature stopped working
        - inconsistent behavior
        - keyboard control not working
        - only happens in developer mode
        - race condition
        - text/string issue
        - usability issue
        - visual bug
    validations:
      required: true
  - type: input
    attributes:
      label: OpenTubeX Version
      description: |
        If using releases, enter the version.
        If using nightly builds, enter the commit hash shown on the About page in the OpenTubeX application.
      placeholder: e.g. v1.2.3, or 8c4278f for a nightly build
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Operating System
      description: Which operating system does this issue concern?
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
        - Android
        - iOS
        - iPadOS
        - Web
        - Other
    validations:
      required: true
  - type: input
    attributes:
      label: Operating System Version
      description: What operating system version are you using? On Windows, click Start button > Settings > System > About. On macOS, click the Apple Menu > About This Mac. On Linux, use lsb_release or uname -a. On Android, open Settings > About phone > Android version. On iOS or iPadOS, open Settings > General > About.
      placeholder: "e.g. Windows 11 version 24H2, macOS Sequoia 15.7, Ubuntu 24.04, Android 15, iOS 18.6, or iPadOS 18.6"
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Installation Method
      description: When you select an unofficial installation method, you must have verified that the bug is also present in one of the official installation methods. Please make sure you uninstall the unofficial installation before installing one of the official installations. If you can't reproduce this in one of the official installation methods, you should report the bug to the maintainer of the unofficial installation method you used.
      options:
        - .AppImage
        - .deb
        - APT repository
        - Flatpak (OpenTubeX remote)
        - Flatpark
        - Snap
        - Nix
        - .dmg
        - Homebrew
        - .apk (Android)
        - F-Droid repository
        - Obtainium
        - OpenTubeX Lite (.apk / F-Droid / Obtainium)
        - .ipa (iOS / iPadOS)
        - SideStore
        - iloader
        - AltStore Classic
        - .exe installer
        - WinGet
        - Scoop
        - .pacman
        - Arch repository
        - .rpm
        - COPR repository
        - RPM repository
        - Portable .zip / .7z
        - AUR
        - Web app (Docker / Podman)
        - other
    validations:
      required: true
  - type: input
    attributes:
      label: Browser (Web App Only)
      description: If using the web app, which browser and version are you using, and is the OpenTubeX Local API browser extension installed?
      placeholder: e.g. Firefox 138 (with Local API extension), Chromium 136, or Safari 18.4
    validations:
      required: false
  - type: dropdown
    attributes:
      label: Architecture
      description: Which CPU architecture is your OpenTubeX build for? It is part of the downloaded file name.
      options:
        - x64 / amd64 / x86_64
        - arm64 / arm64-v8a (including Apple Silicon)
        - armv7l / armeabi-v7a
        - x86
        - I don't know
  - type: dropdown
    attributes:
      label: Primary API used
      description: Which backend is selected as "Preferred API Backend" in Settings > Advanced > Video and metadata providers?
      multiple: false
      options:
        - Local API
        - Invidious API
        - Yattee Server
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Stream Extraction Method
      description: Which stream extraction method is selected in Settings > Advanced > Video and metadata providers? OpenTubeX Lite and the web app do not show this setting; select Built-in.
      multiple: false
      options:
        - Built-in
        - yt-dlp
    validations:
      required: true
  - type: input
    attributes:
      label: 'Last Known Working OpenTubeX Version (If Any)'
      description: What is the last version of OpenTubeX this worked in, if applicable?
      placeholder: e.g. v1.2.3
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or videos
      description: If applicable, drag and drop or paste screenshots or videos here to help explain your problem.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Diagnostic report
      description: |
        Open Settings > Advanced > Diagnostics, turn on "Enable diagnostic logging", reproduce the bug, then save or copy the report.
        Paste the report between the backticks, or replace them with the attached file if the report is too long. Check it for anything you do not want to share before posting.
      value: |
        ```text

        ```
  - type: textarea
    attributes:
      label: Additional Information
      description: |
        Add additional information here.
        You may drag-and-drop log files here, or paste the log file in code blocks.
  - type: checkboxes
    attributes:
      label: Nightly Build
      description: Please ensure you've completed the following, if applicable.
      options:
        - label: I have encountered this bug in the latest **official** [nightly build](https://opentubex.org/downloads/#development), do not check this box if you are using an unofficial or custom build.
          required: false
