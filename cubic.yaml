# yaml-language-server: $schema=https://cubic.dev/schema/cubic-repository-config.schema.json

version: 1
reviews:
  # Review only on request (`@cubic-dev-ai review`); see .github/MAINTAINER_AGENT_INSTRUCTIONS.md for when to ask
  incremental_commits: false
  ultrareview: manual
  ignore:
    # Skips every automatic review; manual requests bypass this threshold
    max_changed_lines: 1
    files:
      - "tests/**"
      - "e2e/tests/**"
      - "static/locales/**"
    head_branches:
      - "upstream-sync"
      - "weblate-opentubex-application"
      - "dependabot/**"
    pr_labels:
      - "translations"
    pr_titles:
      - "*Translations update from Hosted Weblate*"
