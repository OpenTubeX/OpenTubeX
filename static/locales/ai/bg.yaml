  Next: Напред
  Finish: Завършване
  Got It: Разбрах
  Welcome:
    Title: Добре дошли в OpenTubeX
    Description: Ето няколко контроли, които ще ви помогнат да се ориентирате.
  Navigation:
    Title: Библиотеката ви е винаги наблизо
    Description: Чрез навигацията стигате до абонаментите, плейлистите, хронологията и още много.
  Search:
    Title: Търсене или поставяне на връзка
    Description: Намерете видеоклипове и канали или поставете URL адрес на поддържан видеоклип директно в полето за търсене.
  Tabs:
    Title: Дръжте страниците отворени в раздели
    Description: Отворете няколко страници едновременно, без да губите мястото си. Изберете разположението на разделите, което е най-удобно за вас.
  Quick Settings:
    Title: Направете го по свой вкус
    Description: Изберете тема и стандартно качество на видеоклиповете. Можете да промените тези и други предпочитания по всяко време от менюто на профила си или да щракнете върху него с десния бутон, за да смените профила.
  Import Data:
    Title: Вземете данните си със себе си
    Description: По желание импортирайте абонаменти, хронология, плейлисти, хронология на търсенията или настройки от друго поддържано приложение или резервно копие.
    Action: Импортиране на данни
    Not Now: Не сега
  Settings Moved:
    Title: Настройките са преместени
    Description: Изберете профила си горе вдясно за достъп до бързите контроли. Щракнете върху него с десния бутон, за да отворите директно избора на профил. Зъбното колело в това меню отваря всички настройки, а „Относно“ и „Изтегляния“ също са преместени тук.
