    Settings And Sessions Description: Съхранява предпочитанията на приложението, разделите, които могат да бъдат възстановени, и напомнянията за предавания на живо. Отворете папката на профила, за да прегледате или архивирате тези файлове. Тази страница не ги изтрива.
