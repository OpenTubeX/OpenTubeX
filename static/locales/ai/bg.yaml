    Other Profile Files Hint: Резервни копия, временни файлове и записи в профила, които OpenTubeX все още не разпознава.
    Subscriptions And Profiles: Абонаменти и профили
    Subscriptions And Profiles Description: Съхранява абонираните канали, имената на профилите и принадлежността към профили.
    Subscriptions And Profiles Effect: Всички абонаменти и допълнителни профили ще бъдат изтрити завинаги. Данните в кеша на емисията също ще бъдат изчистени.
    Playlists Description: Съхранява имената и описанията на плейлистите и запазените видеоклипове.
    Playlists Effect: Всеки плейлист и списъкът му със запазени видеоклипове ще бъдат изтрити завинаги. Изтеглените файлове ще останат.
