  Privacy Settings:
    Internet Connectivity Checks: "Проверки на интернет връзката"
    Internet Connectivity Checks Tooltip: "Изпраща малки заявки до сървър, хостван от GrapheneOS, за проверка на достъпа до интернет."
    Automatic History Retention: Автоматично съхраняване на историята (дни)
    Automatic History Retention Placeholder: Оставете празно за безсрочно съхраняване
    Automatic History Retention Tooltip: Оставете полето празно, за да пазите историята безсрочно. Ако въведете число, по-старите записи ще бъдат премахнати веднага, а занапред ще се премахват автоматично, докато приложението е отворено.
    Automatic Search History Retention: Автоматично съхраняване на историята на търсенията (дни)
    Automatic Search History Retention Tooltip: Оставете полето празно, за да пазите историята на търсенията безсрочно. Ако въведете число, по-старите търсения ще бъдат премахнати веднага, а занапред ще се премахват автоматично, докато приложението е отворено.
    History Retention Saved: Срокът за съхраняване на историята е запазен
    Invalid History Retention Days: Въведете цяло число дни, по-голямо от нула
    Enable Watch Statistics: Включване на статистиката за гледане
    Week Starts On: Начало на седмицата
    Cache Video Metadata: История на метаданните
    Cache Video Metadata Tooltip: Съхранява всяка версия на поддържаните метаданни за посетените видеоклипове, включително заглавия, миниатюри и описания. Съхранява и заглавията, показвани в абонаментите ви. По подразбиране е изключено, тъй като съхраняването на историята на метаданните заема повече дисково пространство.
    Watched Percentage Threshold: Праг за отбелязване като гледан
    Watched Percentage Threshold Tooltip: Видеоклиповете се отбелязват като гледани, след като достигнат избрания процент и до края им остават не повече от 2 минути. При 0% се отбелязват при започване на възпроизвеждането. При 100% се отбелязват в края му.
    Clear Video Metadata Cache: Изчистване на кеша с метаданни за видеоклипове
    Are you sure you want to clear the video metadata cache?: Сигурни ли сте, че искате да изчистите кешираните заглавия, миниатюри и описания на видеоклиповете?
