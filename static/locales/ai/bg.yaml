    Clear Session Search Cache: Изчистване на сесийния кеш за търсене
    Clear Session Search Cache Confirmation: Да се изчисти ли сесийният кеш за търсене?
    Session Search Cache Effect: Кешираните страници с резултати ще бъдат премахнати. Запазената хронология на търсенията няма да бъде променена.
    HTTP Cache: HTTP кеш
    HTTP Cache Description: Electron съхранява мрежовите отговори на диска, за да може повторните заявки да се зареждат, без същите данни да се изтеглят отново. OpenTubeX създава този кеш отново при нужда.
    Managed By Electron: Управлява се от Electron
    Clear HTTP Cache: Изчистване на HTTP кеша
    Clear HTTP Cache Confirmation: Да се изчисти ли HTTP кешът на Electron?
    HTTP Cache Effect: Изображенията и другите мрежови ресурси може еднократно да се заредят по-бавно, докато кешът се създаде отново.
    Tab Image Cache: Миниатюри на разделите и аватари на каналите
    Tab Image Cache Description: Съхранява изображенията за предварителен преглед и аватарите на каналите за отворени и възстановени раздели. OpenTubeX ги създава отново при използване на разделите.
    Clear Tab Image Cache: Изчистване на кеша с изображения на разделите
    Clear Tab Image Cache Confirmation: Да се изчистят ли миниатюрите на разделите и аватарите на каналите?
    Tab Image Cache Effect: Изображенията на разделите може да изчезнат за кратко и ще бъдат създадени отново при използване на съответните раздели.
    Playback Caches: Кешове за възпроизвеждане
    Playback Caches Description: Съхранява URL адресите на потоците от yt-dlp между сесиите на приложението, както и файловете на плейъра на YouTube. Кешът за URL адреси се отнася само за потоци, заредени чрез yt-dlp.
    Playback URL Cache Entry Size: Ограничение за кеша на URL адресите на потоци от yt-dlp
    Playback URL Cache Entry Size Tooltip: Задава максималния размер на всеки кеширан запис за поток от yt-dlp. Задайте 0 MB, за да изключите постоянното кеширане на потоците от yt-dlp.
    Clear Playback Caches: Изчистване на кешовете за възпроизвеждане
    Clear Playback Caches Confirmation: Да се изчистят ли кешовете на yt-dlp и плейъра?
    Playback Caches Effect: Следващата заявка за локално възпроизвеждане може да отнеме повече време, докато данните за потока и плейъра се заредят отново.
    Clear Cache: Изчистване на кеша
    History Data: Съхранени хронологии
    Video Metadata Description: Съхранява предишни заглавия, миниатюри и описания за поддържаните видеоклипове. Старите версии не могат да бъдат възстановени след изтриване.
    Video Metadata Effect: Запазените версии на метаданните ще бъдат изтрити завинаги. Текущите подробности за видеоклипа могат да бъдат заредени отново.
    Watch History: Хронология и статистика на гледанията
    Watch History Description: Хронологията на гледанията записва гледаните видеоклипове и напредъка. Статистиката на гледанията съхранява дневните общи стойности. Периодът на съхранение важи само за хронологията на гледанията.
    Clear Watch Statistics: Изчистване на статистиката на гледанията
    Watch History Effect: Записите за гледани видеоклипове и запазеният напредък ще бъдат изтрити. Статистиката на гледанията ще остане.
    Clear Watch Statistics Confirmation: Да се изтрие ли цялата статистика на гледанията?
    Watch Statistics Effect: Дневните общи стойности за гледанията ще бъдат изтрити. Хронологията на гледанията ще остане.
    Search History: Хронология на търсенията
    Search History Description: Съхранява търсенията, които сте избрали да бъдат запомнени.
    Delete Search History: Изтриване на хронологията на търсенията
    Delete Search History Confirmation: Да се изтрие ли цялата запазена хронология на търсенията?
    Search History Effect: Запазените предложения от предишните ви търсения ще изчезнат. Кешът на текущата сесия ще остане.
