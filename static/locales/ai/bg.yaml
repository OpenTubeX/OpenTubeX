Tooltips:
  YouTube Account Settings:
    Subscribe on YouTube: "Абонирането за канал или отписването от него в OpenTubeX прави същото и в профила ви в YouTube."
    Add to YouTube Watch History: "Видеата, които пускате, се добавят към историята на гледанията ви в YouTube, така че препоръките на YouTube се учат от тях. Нищо не се добавя, докато историята е на пауза в YouTube."
  General Settings:
    Built-in Streams: |
      Автоматичният режим възпроизвежда повечето видеоклипове чрез клиента visionOS на YouTube, който стартира по-бързо и поддържа автоматично качество. Излъчванията на живо и видеоклиповете, които той не може да възпроизведе, използват SABR.
      „Само SABR“ винаги използва уеб клиента на YouTube, който стартира по-бавно и няма автоматично качество.
    Title Lines: "Съкращава заглавията на видеоклипове и плейлисти в списъци и решетки до избрания брой редове с многоточие за по-еднакви карти. Задръжте курсора върху заглавие, за да го видите изцяло."
    Close Window With Last Tab: 'Когато е изключено, затварянето на последния раздел отваря нов раздел, така че прозорецът остава отворен, докато не го затворите.'
    Preferred Video Codec: |
      Автоматичният режим предпочита кодеци, които устройството ви може да декодира хардуерно.
      AV1: най-доброто качество при най-малко данни, но не всяко видео го има. Без хардуерно декодиране може да изтощава батерията или да пропуска кадри.
      VP9: баланс между ефективност и съвместимост, обикновено наличен до най-високата резолюция.
      H.264: най-лесен за декодиране почти на всяко устройство, но използва повече данни и обикновено стига до 1080p.
      Промените важат от следващото видео. Ако предпочитаният кодек не е наличен, се използва друг.
    Always Use Backup Media Server: "Зарежда видеоклиповете от резервния сървър, посочен от YouTube, вместо от зададения, например когато кешът на интернет доставчика ви често е бавен. Иначе OpenTubeX превключва само когато зададеният сървър не отговаря."
    Automatically switch stream extraction methods: "Опитайте yt-dlp, ако вграденото възпроизвеждане не успее, или вграденото възпроизвеждане, ако yt-dlp не успее."
    Enable Tabs: "Текущата страница остава отворена. Другите раздели се запазват до рестартиране на приложението; включете разделите отново, за да ги възстановите."
    Data Saver Thumbnails: "Използвайте миниатюри с по-ниска разделителна способност, за да намалите потреблението на данни."
    Use AI Translation Completions: Попълва липсващите части в човешките преводи с текст, създаден от ИИ. Човешките преводи винаги са с предимство.
    Update Relative Timestamps: Обновява относителните времеви отметки в цялото приложение, докато страницата е отворена. Когато е изключено, те се обновяват само след презареждане или повторно отваряне на страницата.
    Stream Extraction Method: |
      Изберете как OpenTubeX да получава потоците с видеоклипове. При избор на yt-dlp той трябва да е наличен.
      При използване на yt-dlp стартирането на видеоклиповете може да отнема повече време.
    Avoid translation: |
      Изключва автоматичния превод от YouTube на заглавието, описанието и главите на видеоклипа.
      „В цялото приложение“ показва и имената и описанията на каналите на оригиналния им език.
      Твърде многото заявки, например за извличане на заглавията на видеоклипове в списъци, могат временно
      да нарушат надеждността на приложението.
    Show Thumbnail Previews: Показва анимирани визуализации при посочване на миниатюрите на видеоклиповете.
    Startup Behavior: |
      Изберете какво да прави OpenTubeX при стартиране.
      Зареждане на всички раздели възстановява веднага всеки запазен раздел, но видеоклиповете във фоновите раздели няма да се пускат автоматично.
      Зареждане на предишно заредените раздели презарежда разделите, които са били заредени при затварянето на OpenTubeX, а останалите остават незаредени.
      Зареждане на последния активен раздел възстановява предишната сесия, като другите раздели са отворени, но незаредени. Те се зареждат, когато щракнете върху тях.
      Стартиране с празна сесия пропуска запазените раздели и отваря нов прозорец.
    Remember Tab Navigation History: Историята за придвижване назад и напред във всеки раздел се запазва и възстановява при рестартиране на OpenTubeX.
    Yattee Server: Сървърът с yattee-server, от който OpenTubeX зарежда видеа, канали, плейлисти и резултати от търсене. Потребителското име и паролата се съхраняват само на това устройство.
    Proxy Videos Through Yattee Server: Прекарва видео и аудио потоците през сървъра. Оставете това включено, освен ако сървърът не използва същата интернет връзка като вас, защото YouTube предоставя потоците само на адреса, който ги е заявил. Миниатюрите винаги се зареждат директно от YouTube.
    Notifications: Изберете как OpenTubeX да ви известява за предавания на живо, нови качвания и автоматични изтегляния. При „Системни и в приложението“ известията се показват в OpenTubeX, докато го използвате, иначе като системни известия, а камбанката ги запазва. „Изключени“ скрива и настройките за известия.
    Ignore System Haptics Setting: Вибриране при продължително натискане и жестове, дори когато обратната връзка при докосване е изключена в настройките на Android.
  Proxy Settings:
    IP Block Recovery Script Path: Път до скрипта, който да се изпълни при установено блокиране на IP адреса. OpenTubeX изчаква завършването му и след това презарежда видеоклипа. Ако резервният метод е включен, скриптът се изпълнява само когато и той е неуспешен.
  Player Settings:
    Rewind on Resume: "Връща толкова секунди назад, когато продължите спряно видео, за да видите отново последните моменти. Задайте 0, за да го изключите."
    Minimum Pause Before Rewinding: "Превърта назад само ако видеото е било на пауза поне толкова дълго. Задайте 0, за да се превърта след всяка пауза."
    Mono Audio: 'Възпроизвежда левия и десния аудиоканал и в двете уши. Използвайте го, когато звукът на видеоклипа идва само от едната страна на слушалките.'
    Normalize Loudness: 'Намалява звука на видеоклиповете, които са по-силни от повечето, за да не се променя рязко силата на звука между тях. Тихите видеоклипове запазват силата си. Работи само за видеоклипове, заредени чрез локалния API.'
    Pause on Stream Recovery: "Когато видео потокът се провали и плейърът го презареди или превключи към друг формат или двигател, възпроизвеждането се поставя на пауза и грешката остава в горната част на плейъра, докато не я скриете. Когато е изключено, възпроизвеждането продължава и грешката се показва за кратко като известие."
    Continue Playback When Screen Is Locked: 'Продължава възпроизвеждането на звук във фонов режим и предоставя медийни контроли на Android. Изключете, за да поставяте на пауза, когато приложението вече не се вижда.'
    Enable Caption Translations: Когато е включено и видеоклипът няма оригинални субтитри на съответния език, бутонът за субтитри и клавишът C избират с предимство автоматичния превод на предпочитания език.
    Use Quick Playback Speed Bar: Показва лента за бърз избор на скоростта на възпроизвеждане вдясно при контролите на плейъра. Ако е включено ръчното запазване на скоростта по канали, лентата съдържа и бутон за запазване на скоростта за текущия канал.
    Multiply Seek Interval by Playback Rate: Когато е включено, интервалите за превъртане (клавишите със стрелки и J/L) се умножават по текущата скорост на възпроизвеждане. Когато е изключено, интервалите остават постоянни независимо от скоростта.
    Show Playback Rate Adjusted Timestamp: Когато е включено и скоростта на възпроизвеждане е различна от 1x, плейърът показва след обичайната времева отметка и времето, съобразено със скоростта, оградено в скоби.
    Use YouTube-style Shorts: Показва Shorts във вертикална решетка на страниците с абонаменти и канали и използва плейъра за Shorts в стила на YouTube.
    Loop Shorts: Когато е включено, Shorts се стартират отначало автоматично. Когато е изключено, те спират в края и показват бутон за повторно пускане.
    Show Skip Silence Toggle: Показва превключвател за пропускане на тишината в менюто с настройки на плейъра.
    Enable Skip Silence by Default: Включва пропускането на тишината за новите раздели. Промяната в един раздел не засяга останалите.
    Enable Video Zoom: Показва контролата за мащабиране в менюто с настройки на плейъра и включва клавишните комбинации и контролите за придвижване на картината.
    Enable Seek History: Запомня откъде сте превъртели във всеки видеоклип до затварянето на приложението. Показва списъка с историята на превъртанията в менюто с настройки на плейъра и включва клавишните ѝ комбинации.
    Show Seek Bar Filmstrip: "Плъзгането на плъзгача на лентата за превъртане показва лента с кадри около мястото, където ще попаднете, а плъзгането нагоре върху нея превърта прецизно. Когато е изключено, плъзгането показва една миниатюра, както при посочване."
    Voice-over Translation: При заявка за превод изпраща идентификатора и продължителността на видеоклипа и избрания език до неофициалната услуга за гласов превод на Yandex. По подразбиране е изключено.
    Hold to Speed Up: Задръжте клавиша за интервал или левия бутон на мишката върху плейъра, за да умножите временно текущата скорост на възпроизвеждане по избраната стойност.
    Ambient Mode: Прелива цветовете на видеоклипа в областта около плейъра.
    Default Volume: Не е достъпно, докато е включено запомнянето на силата на звука. Изключете го, за да зададете една и съща начална сила на звука за всеки видеоклип.
    Parallel Segment Loading: |
      Броят сегменти с видео и звук, които да се зареждат наведнъж предварително.
      По-високите стойности може да помогнат при бавна или нестабилна връзка, но използват повече трафик и памет.
      Те може също да накарат автоматичния режим да подцени скоростта на връзката и да избере по-ниско качество.
      Потоците, ограничени до една заявка наведнъж, пренебрегват тази настройка.
    Preload Upcoming Videos: "Извлича и кешира yt-dlp адресите за следващите видеа. Опашката е с приоритет пред плейлистите и препоръките."
    Upcoming Videos to Preload: "Максималният брой предстоящи видеа, чиито yt-dlp адреси се извличат във фонов режим."
    Concurrent Preloads: "Максималният брой процеси на yt-dlp, използвани за предварително зареждане на видеоклипове едновременно. По-високите стойности използват повече процесор, памет и мрежова пропускателна способност."
    Ignore System Rotation Lock for Fullscreen: Завъртайте физически устройството за влизане и излизане от цял екран, дори когато автоматичното завъртане в Android е изключено.
    Ask Before Preloading Large Playlists: "Изисква потвърждение преди предварително зареждане на всички видеа от плейлист с повече от {count} видеа."
  Download Settings:
    Download Folder: Видеоклиповете се запазват в тази папка. Оставете празно, за да използвате системната папка за изтегляния.
    Global Additional yt-dlp Arguments: Допълнителни аргументи от командния ред, подавани на yt-dlp при всяко изтегляне, например --cookies-from-browser firefox.
    Concurrent Downloads: Максималният брой задачи на yt-dlp, които могат да се изпълняват едновременно.
    Bandwidth Limit: Ограничава общата скорост на прехвърляне на опашката, като разпределя ограничението между едновременните задачи. Въведете 0 за неограничена скорост.
  External Software Settings:
    yt-dlp Source: OpenTubeX може да използва инсталирания в системата yt-dlp или да изтегля и управлява собствено копие, което се съхранява в папката с потребителски данни.
    yt-dlp Channel: Изберете кой канал за издания на yt-dlp да изтегля и управлява OpenTubeX. Стабилният канал се препоръчва за повечето потребители.
    FFmpeg Source: OpenTubeX може да използва инсталираните в системата FFmpeg и FFprobe или да изтегля и управлява собствени статични версии, които се съхраняват в папката с потребителски данни.
    Managed Tool Updates: Изберете дали управляваните инструменти да се обновяват автоматично, да питат преди обновяване или да се обновяват само чрез бутоните за ръчно действие. Липсващите инструменти продължават да се изтеглят при нужда.
    yt-dlp Executable Path: По подразбиране OpenTubeX приема, че yt-dlp може да бъде намерен чрез променливата на средата PATH. При нужда тук може да зададете друг път.
    Cookie Source: Изберете дали yt-dlp да чете файл с бисквитки във формат Netscape или бисквитки от инсталиран браузър за удостоверено възпроизвеждане.
    Cookie File: Изберете файл с бисквитки във формат Netscape за удостоверено възпроизвеждане.
    Browser for Cookies: Списъкът с поддържани браузъри се получава от избрания изпълним файл на yt-dlp. При заявка за удостоверено възпроизвеждане OpenTubeX кара yt-dlp да прочете бисквитките от този браузър.
    Browser Profile: Незадължително име или папка на браузърен профил. Оставете празно, за да използвате последния използван профил.
    Always Use Cookies: "Използвайте настроените бисквитки за изтегляния, субтитри и когато yt-dlp извлича потоци. Това не превключва метода за извличане на потоци към yt-dlp. Когато е избран yt-dlp, може да станат достъпни формати само за потребители с профил, включително повишената побитова скорост на YouTube Premium, ако профилът има достъп."
    FFmpeg Executable Path: FFmpeg е необходим за сливането на отделни потоци с видео и звук и за преобразуването на звук. По подразбиране OpenTubeX приема, че FFmpeg може да бъде намерен чрез променливата на средата PATH. При нужда тук може да зададете друг път.
    Use cookies for subtitles: "Използвайте настроените бисквитки за субтитри и автоматични преводи. Активира се и от „Винаги използвай бисквитки“."
  Distraction Free Settings:
    Hide Playlist Stats: Скрива броя на видеоклиповете, броя на гледанията, датата на последната актуализация и общата продължителност на страниците на плейлистите.
    Count Watch Time From: "„Всички устройства“ отчита всяко устройство, което синхронизира статистиката за гледане. „Това устройство“ отчита само това, което гледате тук."
    When a Limit Is Reached: "„Пауза на възпроизвеждането“ ви позволява да добавите 15 минути или да пренебрегнете лимита за днес. Когато е зададена парола за настройките, можете да увеличите лимит само в настройките."
    Grayscale: "Показва приложението в сиви нюанси, за да привлича по-малко внимание. „Във времето за сън“ следва графика на напомнянето за време за сън."
    Apply Grayscale To: "„Видеа и изображения“ запазва интерфейса цветен и прави сиво съдържание като видеа, миниатюри и аватари."
    Daily Watch Time Limit: "Отчита изгледаното от вас днес на всички устройства, които синхронизират статистиката за гледане, включително Shorts."
    Daily Shorts Limit: "Отчита Shorts, които сте изгледали днес на това устройство."
    Take a Break Reminder: "Поставя видеото на пауза след толкова време гледане. Почивка от 10 минути или повече започва отчитането отначало."
    Bedtime Reminder: "Поставя видеото на пауза и ви напомня да спрете да гледате между началния и крайния час."
    Shorten View Counts: Показва съкратения брой гледания, коментари и харесвания на коментарите, вече закръглен от YouTube, например 14 хил. вместо 14 000. Точните стойности винаги се показват изцяло.
  Subscription Settings:
    Fetch Feed on Startup: Когато е включено, OpenTubeX автоматично извлича емисията ви с абонаменти при стартиране и при отваряне на нов прозорец.
    Show New Content Feed: Показва раздел „Нови“ с елементи от емисията с абонаменти, които не са присъствали при предишното извличане.
    Enable RSS Feeds: Показва раздел RSS в страницата с абонаменти с елементите на RSS или Atom емисии, за да можете да следвате автори от други платформи. Елементите му се отварят с yt-dlp.
    Show New Content Indicators: Показва малка точка до елементите от емисията с абонаменти, които не са присъствали при предишното извличане.
    Show Scheduled Live Streams / Premieres First: Задържа предстоящите предавания на живо и премиери най-отгоре в емисията с абонаменти. Когато е изключено, те остават на позицията от обявяването си, докато започнат. След изключване обновете веднъж емисията с абонаменти, за да получите датите на обявяване за съществуващите насрочени елементи.
    Auto Refresh Interval: "Колко често OpenTubeX автоматично обновява емисията ви с абонаменти, докато приложението е отворено. В Android ненулевият интервал обновява емисията и когато приложението е затворено."
    Refresh Subscriptions While App Is Closed: "Обновява емисиите с избраните настройки. На компютър OpenTubeX остава в системната област докато не излезете. Android определя кога се изпълняват фоновите обновявания."
    Notify About New Uploads: Показва системни известия на това устройство за канали, чиито известия сте включили в настройките им за абонамента. OpenTubeX проверява за ново съдържание при опресняване на абонаментите, затова изберете интервал за автоматично опресняване. За да получавате известия, докато приложението е затворено, включете и опресняването при затворено приложение.
    RSS Feeds Auto Refresh Interval: Колко често OpenTubeX автоматично опреснява вашите RSS емисии, докато приложението е отворено.
    Faster Subscription Refresh: "Първо проверява RSS емисията на всеки канал и зарежда видеоклиповете, Shorts и предаванията на живо само от канали с нови качвания. Автоматичните опреснявания също пропускат канали, заредени през последните 10 минути. За канали без нови качвания броят гледания, премахнатите видеоклипове и променените заглавия се обновяват само на няколко часа, а новите качвания може да се появят по-късно, когато RSS емисията изостава. Не е налично с Invidious API."
    Platforms Auto Refresh Interval: Колко често OpenTubeX автоматично опреснява каналите, които следвате в други платформи, докато приложението е отворено.
    Twitch Notify When Live: Известява ви, когато някой от следваните от вас канали в Twitch започне предаване. OpenTubeX проверява на всеки няколко минути, докато е отворен, а също и докато е затворен, ако тогава обновява абонаментите.
  Theme Settings:
    Only Show Important Notifications: Скрива известията в приложението, които само потвърждават действие или съобщават състояние, включително тези, които предлагат „Отмени“. Грешките, предупрежденията, зададените от вас напомняния и известията, които изискват решение, като подканите за актуализация, продължават да се показват. Напредъкът на фоновите операции, като опресняването на абонаментите, се показва в общата лента за напредък вместо като известие. Системните известия не се засягат.
    Visible Search Suggestions: "Задава колко записа от историята на търсенето и предложения показва лентата за търсене, преди списъкът ѝ да започне да се превърта. Списъкът никога не излиза извън долния край на прозореца."
    Thumbnail Size: "Мащабира миниатюрите на видеоклиповете в мрежи и списъци. Мрежите с фиксиран брой колони или изгледът „Пълна ширина“ вместо това запълват всеки ред, така че там плъзгачът променя само миниатюрите в списъци и Shorts. В прозорци с размер на телефон миниатюрите в мрежа са ограничени до 100%."
    Playlist Thumbnail Size: "Мащабира миниатюрите на видеоклиповете в страниците на плейлисти. Мрежите с фиксиран брой колони или изгледът „Пълна ширина“ вместо това запълват всеки ред, така че там плъзгачът променя само миниатюрите в списъци и Shorts. В прозорци с размер на телефон миниатюрите в мрежа са ограничени до 100%."
    Compact Settings Categories: "Скрива описанията и намалява височината на категориите настройки."
    Show Progress as Notification: Показва постоянно известие с текущия напредък на фоновите операции, като обновяване на абонаментите и изтегляне на управлявани инструменти, вместо общата лента за напредък.
    Always Show Scrollbars: Лентите за превъртане остават видими през цялото време. Когато е изключено, те избледняват малко след като спрете да движите мишката и се появяват отново веднага щом я раздвижите.
    Scroll Speed: Променя разстоянието за превъртане с колелцето на мишката и жестовете с колелце на тъчпада.
    Use Fixed Tab Width: Задава еднаква ширина на всеки раздел в хоризонталната лента вместо ширина според заглавието му.
    Use Custom Title Bar: Заменя системната заглавна лента с лентата с раздели или с горната навигация, когато разделите не са отгоре, за да спести вертикално пространство. Бутоните за управление на прозореца се показват в ъгъла на тази лента.
    Use Grid Player Menu: Подрежда менюто с настройки на плейъра като решетка от плочки вместо списък с редове.
    Modal Backdrop: "Определя как изглежда приложението зад диалозите и менютата. Размазването може да е бавно на по-слаби устройства."
    Click Scrollbar Track to Scroll: "Щракването върху лента за превъртане извън плъзгача ѝ превърта около една страница в посоката на щракването. Докато това е включено, видимата лента за превъртане прихваща щракванията върху елементите под нея. Лентата за превъртане на лентата с раздели винаги работи така."
  Experimental Settings:
    Disable Hardware Acceleration: Изключва хардуерното ускорение на графичния процесор. Може да отстрани графични проблеми, но вероятно ще намали производителността.
  SponsorBlock Settings:
    Always Show DeArrow Badge: Бутонът DeArrow да остава видим при видеа, чието заглавие или миниатюра е заменено от DeArrow, а не само при посочване с мишката.
