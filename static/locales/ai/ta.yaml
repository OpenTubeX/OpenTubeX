    Hold to Double Playback Speed: தற்போதைய இயக்க வேகத்தைத் தற்காலிகமாக இரட்டிப்பாக்க, இயக்கியின் மேல் Spacebar அல்லது இடது சுட்டிப் பொத்தானை அழுத்திப் பிடிக்கவும்.
