    Show Playback Rate Adjusted Timestamp: இயக்கப்பட்டு இயக்க வேகம் 1x-இலிருந்து வேறுபட்டால், இயல்பான நேரக் குறிப்புக்குப் பிறகு அடைப்புக்குறிக்குள் இயக்க வேகத்திற்கேற்பச் சரிசெய்த நேரக் குறிப்பை இயக்கி காட்டும்.
    Use YouTube-style Shorts: சந்தா மற்றும் சேனல் பக்கங்களில் Shorts-ஐ செங்குத்துக் கட்டத்தில் காட்டி, YouTube பாணி Shorts இயக்கியைப் பயன்படுத்தும்.
    Loop Shorts: இயக்கப்பட்டால் Shorts தானாக மீண்டும் தொடங்கும். முடக்கப்பட்டால் முடிவில் நின்று, மறுஇயக்கப் பொத்தானைக் காட்டும்.
    Show Skip Silence Toggle: இயக்கி அமைப்பு மெனுவில் அமைதியைத் தவிர்ப்பதற்கான இயக்கு/முடக்கு நிலைமாற்றியைக் காட்டும்.
    Enable Skip Silence by Default: புதிய தாவல்களுக்கு அமைதியைத் தவிர்ப்பதை இயக்கும். ஒரு தாவலில் மாற்றுவது மற்ற தாவல்களைப் பாதிக்காது.
    Enable Video Zoom: இயக்கி அமைப்பு மெனுவில் பெரிதாக்கக் கட்டுப்பாட்டைக் காட்டி, அதன் விசைப்பலகைக் குறுக்குவழிகளையும் நகர்த்தல் கட்டுப்பாடுகளையும் இயக்கும்.
