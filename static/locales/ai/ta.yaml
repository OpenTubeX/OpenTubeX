    Default Volume: ஒலியளவை நினைவில் கொள் இயக்கப்பட்டிருக்கும்போது இது முடக்கப்படும். ஒவ்வொரு காணொளிக்கும் நிலையான தொடக்க ஒலியளவை அமைக்க ஒலியளவை நினைவில் கொள் என்பதை முடக்கவும்.
