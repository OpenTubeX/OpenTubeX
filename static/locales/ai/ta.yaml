    Title: பக்கங்களைத் தாவல்களில் திறந்து வைத்திருங்கள்
    Description: இருந்த இடத்தை இழக்காமல் ஒரே நேரத்தில் பல பக்கங்களைத் திறக்கலாம். உங்கள் தளவமைப்பில் தாவல்களுக்கு ஏற்ற இடத்தைத் தேர்ந்தெடுக்கவும்.
  Quick Settings:
    Title: உங்கள் விருப்பப்படி அமைத்துக்கொள்ளுங்கள்
    Description: அலங்காரத்தையும் இயல்புநிலைக் காணொளித் தரத்தையும் தேர்ந்தெடுக்கவும். இவற்றையும் பிற விருப்பங்களையும் எப்போது வேண்டுமானாலும் சுயவிவர மெனுவிலிருந்து மாற்றலாம். சுயவிவரங்களை மாற்ற அதை வலது கிளிக் செய்யவும்.
