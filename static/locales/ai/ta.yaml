Tooltips:
  General Settings:
    Use AI Translation Completions: மனித மொழிபெயர்ப்புகளில் உள்ள இடைவெளிகளை AI உருவாக்கிய உரையால் நிரப்பும். மனித மொழிபெயர்ப்புகளுக்கே எப்போதும் முன்னுரிமை.
    Update Relative Timestamps: ஒரு பக்கம் திறந்திருக்கும் வரை செயலி முழுவதும் சார்புநேரக் குறிப்புகளைப் புதுப்பிக்கும். முடக்கியிருந்தால், பக்கத்தை மீண்டும் ஏற்றிய அல்லது பார்வையிட்ட பிறகே அவை புதுப்பிக்கப்படும்.
    Stream Extraction Method: |
      OpenTubeX காணொளி ஸ்ட்ரீம்களை எவ்வாறு பெற வேண்டும் என்பதைத் தேர்ந்தெடுக்கவும். yt-dlp-ஐத் தேர்ந்தெடுத்தால் அது கிடைக்க வேண்டும்.
      yt-dlp-ஐப் பயன்படுத்தும்போது காணொளிகள் தொடங்க அதிக நேரமாகலாம்.
      உள்ளமைந்த முறை நேரலைகளிலும் முதல் காட்சிகளிலும் நேரத்தை நகர்த்துவதை ஆதரிக்காது.
    Avoid translation: |
      காணொளியின் தலைப்பு, விளக்கம் மற்றும் அத்தியாயங்களை YouTube தானாக மொழிபெயர்ப்பதை முடக்கும்.
      பட்டியல்கள் முழுவதும் காணொளித் தலைப்புகளைப் பெறுவது போன்ற மிக அதிகக் கோரிக்கைகள் செயலியின்
      நம்பகத்தன்மையைத் தற்காலிகமாகப் பாதிக்கலாம்.
    Show Thumbnail Previews: காணொளிச் சிறுபடங்களின் மேல் சுட்டியை வைக்கும்போது அசையும் முன்னோட்டங்களைக் காட்டு.
    Startup Behavior: |
      OpenTubeX தொடங்கும்போது என்ன செய்ய வேண்டும் என்பதைத் தேர்ந்தெடுக்கவும்.
      எல்லாத் தாவல்களையும் ஏற்று என்பது சேமித்த ஒவ்வொரு தாவலையும் உடனே மீட்டெடுக்கும். பின்னணித் தாவல்களில் காணொளிகள் தானாக இயங்காது.
      முன்பு ஏற்றிய தாவல்களை ஏற்று என்பது OpenTubeX மூடப்பட்டபோது ஏற்றப்பட்டிருந்த தாவல்களை மீண்டும் ஏற்றி, மற்றவற்றை இறக்கியபடி வைத்திருக்கும்.
      கடைசியாகச் செயலிலிருந்த தாவலை ஏற்று என்பது மற்ற தாவல்களைத் திறந்து ஆனால் இறக்கிய நிலையில் வைத்து முந்தைய அமர்வை மீட்டெடுக்கும். அவற்றைக் கிளிக் செய்யும்போது ஏற்றப்படும்.
      காலியான அமர்வுடன் தொடங்கு என்பது சேமித்த தாவல்களைத் தவிர்த்துப் புதிய சாளரத்தைத் திறக்கும்.
    Remember Tab Navigation History: ஒவ்வொரு தாவலின் பின் மற்றும் முன் வழிசெலுத்தல் வரலாறும் சேமிக்கப்பட்டு, OpenTubeX மீண்டும் தொடங்கும்போது மீட்டெடுக்கப்படும்.
  Proxy Settings:
    IP Block Recovery Script Path: IP தடுப்பு கண்டறியப்படும்போது இயக்க வேண்டிய நிரலாக்கக் கோப்புப் பாதை. அது முடியும் வரை OpenTubeX காத்திருந்து, காணொளியை மீண்டும் ஏற்றும். மாற்றுவழி இயக்கப்பட்டிருந்தால் அதுவும் தோல்வியடையும்போது மட்டுமே நிரலாக்கம் இயங்கும்.
  Player Settings:
    Enable Caption Translations: இதை இயக்கியதும், காணொளியில் பொருந்தும் அசல் தடம் இல்லாதபோது வசன வரிப் பொத்தானும் C குறுக்குவழியும் விரும்பும் வசன வரி மொழிக்கு தானாக மொழிபெயர்த்த தடத்துக்கு முன்னுரிமை அளிக்கும்.
