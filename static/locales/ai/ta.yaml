    Action: தரவை இறக்குமதி செய்
    Not Now: இப்போது வேண்டாம்
  Settings Moved:
    Title: அமைப்புகள் இடம் மாறியுள்ளன
    Description: விரைவுக் கட்டுப்பாடுகளுக்கு மேல் வலப்புறத்திலுள்ள உங்கள் சுயவிவரத்தைத் தேர்ந்தெடுக்கவும். நேரடியாகச் சுயவிவரத் தேர்வுக்குச் செல்ல அதை வலது கிளிக் செய்யவும். அந்த மெனுவிலுள்ள பற்சக்கரம் எல்லா அமைப்புகளையும் திறக்கும். அறிமுகம் மற்றும் பதிவிறக்கங்களும் இந்த மெனுவுக்கு மாற்றப்பட்டுள்ளன.
