Tooltips:
  General Settings:
    Use AI Translation Completions: Isi bagian yang belum diterjemahkan manusia dengan teks buatan AI. Terjemahan manusia selalu diutamakan.
    Update Relative Timestamps: Memperbarui stempel waktu relatif di seluruh aplikasi selama halaman tetap terbuka. Jika dinonaktifkan, stempel waktu hanya diperbarui setelah halaman dimuat ulang atau dikunjungi kembali.
    Stream Extraction Method: |
      Pilih cara OpenTubeX memperoleh stream video. yt-dlp harus tersedia jika dipilih.
      Video mungkin membutuhkan waktu lebih lama untuk dimulai saat menggunakan yt-dlp.
      Metode bawaan tidak mendukung pencarian posisi pada siaran langsung dan premiere.
    Avoid translation: |
      Nonaktifkan terjemahan otomatis YouTube untuk judul, deskripsi, dan bab video.
      Terlalu banyak permintaan, seperti mengambil judul video dari berbagai daftar, dapat
      mengurangi keandalan aplikasi untuk sementara.
    Show Thumbnail Previews: Tampilkan pratinjau animasi saat penunjuk berada di atas gambar mini video.
    Startup Behavior: |
      Pilih tindakan OpenTubeX saat dimulai.
      Muat semua tab langsung memulihkan setiap tab tersimpan, tetapi tab latar belakang tidak memutar video secara otomatis.
      Muat tab yang sebelumnya dimuat akan memuat ulang tab yang aktif saat OpenTubeX ditutup dan membiarkan tab lain dibongkar dari memori.
      Muat tab yang terakhir aktif memulihkan sesi sebelumnya dengan tab lain terbuka tetapi dibongkar dari memori. Tab tersebut dimuat saat Anda mengekliknya.
      Mulai dengan sesi kosong mengabaikan tab tersimpan dan membuka jendela baru.
    Remember Tab Navigation History: Riwayat navigasi mundur dan maju setiap tab disimpan lalu dipulihkan saat OpenTubeX dimulai ulang.
  Proxy Settings:
    IP Block Recovery Script Path: Jalur berkas skrip yang dijalankan saat blokir IP terdeteksi. OpenTubeX menunggu skrip selesai, lalu memuat ulang video. Jika metode cadangan diaktifkan, skrip hanya berjalan ketika metode cadangan juga gagal.
  Player Settings:
    Enable Caption Translations: Jika diaktifkan, tombol takarir dan pintasan C akan memilih trek yang diterjemahkan otomatis ke bahasa takarir pilihan jika video tidak menyediakan trek asli yang cocok.
    Use Quick Playback Speed Bar: Menampilkan bilah kecepatan pemutaran cepat di sisi kanan kontrol pemutar. Jika penyimpanan kecepatan pemutaran manual per saluran diaktifkan, bilah juga memuat tombol untuk menyimpan kecepatan bagi saluran saat ini.
    Multiply Seek Interval by Playback Rate: Jika diaktifkan, interval pencarian posisi (tombol panah dan J/L) dikalikan dengan kecepatan pemutaran saat ini. Jika dinonaktifkan, interval tetap sama pada kecepatan pemutaran apa pun.
    Show Playback Rate Adjusted Timestamp: Jika diaktifkan dan kecepatan pemutaran bukan 1x, pemutar menampilkan stempel waktu yang disesuaikan dengan kecepatan pemutaran dalam tanda kurung setelah stempel waktu biasa.
    Use YouTube-style Shorts: Menampilkan Shorts dalam kisi potret pada halaman langganan dan saluran, serta menggunakan pemutar Shorts bergaya YouTube.
    Loop Shorts: Jika diaktifkan, Shorts dimulai ulang secara otomatis. Jika dinonaktifkan, Shorts berhenti di akhir dan menampilkan tombol putar ulang.
    Show Skip Silence Toggle: Menampilkan tombol aktif/nonaktif untuk melewati bagian hening dalam menu pengaturan pemutar.
    Enable Skip Silence by Default: Mengaktifkan fitur lewati bagian hening untuk tab baru. Mengubahnya di satu tab tidak memengaruhi tab lain.
    Enable Video Zoom: Menampilkan kontrol Zoom dalam menu pengaturan pemutar dan mengaktifkan pintasan papan ketik serta kontrol gesernya.
    Voice-over Translation: Mengirim ID video, durasi, dan bahasa yang dipilih ke layanan tidak resmi terjemahan sulih suara Yandex saat Anda meminta terjemahan. Nonaktif secara bawaan.
    Hold to Double Playback Speed: Tahan tombol Spasi atau tombol kiri tetikus di atas pemutar untuk menggandakan sementara kecepatan pemutaran saat ini.
    Ambient Mode: Memadukan warna video dengan area di sekitar pemutar.
    Default Volume: Dinonaktifkan selama Ingat Volume aktif. Nonaktifkan Ingat Volume untuk menetapkan volume awal yang tetap bagi setiap video.
    Parallel Segment Loading: |
      Jumlah segmen video dan audio yang dimuat sekaligus sebelum pemutaran.
      Nilai yang lebih tinggi dapat membantu pada koneksi lambat atau tidak stabil, tetapi menggunakan lebih banyak lebar pita dan memori.
      Nilai tersebut juga dapat membuat Otomatis memperkirakan kecepatan koneksi terlalu rendah dan memilih kualitas yang lebih rendah.
      Stream yang dibatasi satu permintaan pada satu waktu mengabaikan pengaturan ini.
    Preload Upcoming Videos: "Mengambil dan menyimpan URL yt-dlp untuk video berikutnya. Antrean didahulukan dari daftar putar dan rekomendasi."
    Upcoming Videos to Preload: "Jumlah maksimum video berikutnya yang URL yt-dlp-nya diambil di latar belakang."
  Download Settings:
    Download Folder: Video disimpan ke folder ini. Biarkan kosong untuk menggunakan folder Unduhan sistem.
    Global Additional yt-dlp Arguments: Argumen baris perintah tambahan yang diteruskan ke yt-dlp untuk setiap unduhan, misalnya --cookies-from-browser firefox.
    Concurrent Downloads: Jumlah maksimum tugas yt-dlp yang dapat berjalan sekaligus.
    Bandwidth Limit: Membatasi total laju transfer antrean dengan membagi batas ini di antara tugas yang berjalan serentak. Masukkan 0 untuk tanpa batas.
  External Software Settings:
    yt-dlp Source: OpenTubeX dapat menggunakan yt-dlp yang terpasang di sistem atau mengunduh dan mengelola salinan yt-dlp sendiri yang disimpan di direktori data pengguna.
    yt-dlp Channel: Pilih kanal rilis yt-dlp yang akan diunduh dan dikelola OpenTubeX. Stabil disarankan untuk sebagian besar pengguna.
    FFmpeg Source: OpenTubeX dapat menggunakan FFmpeg dan FFprobe yang terpasang di sistem atau mengunduh dan mengelola build statis sendiri yang disimpan di direktori data pengguna.
    Managed Tool Updates: Pilih apakah alat terkelola diperbarui secara otomatis, meminta konfirmasi sebelum diperbarui, atau hanya diperbarui melalui tombol manual. Alat yang hilang tetap diunduh saat diperlukan.
    yt-dlp Executable Path: Secara bawaan, OpenTubeX menganggap yt-dlp dapat ditemukan melalui variabel lingkungan PATH. Jika perlu, tentukan jalur khusus di sini.
    Cookie Source: Pilih apakah yt-dlp harus membaca berkas kuki Netscape atau kuki dari peramban yang terpasang untuk pemutaran terautentikasi.
    Cookie File: Pilih berkas kuki berformat Netscape untuk pemutaran terautentikasi.
    Browser for Cookies: Dukungan peramban dibaca dari program yt-dlp yang dipilih. OpenTubeX meminta yt-dlp membaca peramban ini saat pemutaran terautentikasi diminta.
    Browser Profile: Nama atau folder profil peramban opsional. Biarkan kosong untuk menggunakan profil yang terakhir diakses.
    Always Use Cookies: Gunakan kuki yang telah dikonfigurasi setiap kali yt-dlp mengekstrak stream. Opsi ini tidak mengubah metode ekstraksi stream menjadi yt-dlp. Jika yt-dlp dipilih, format khusus akun mungkin tersedia, termasuk laju bit lebih tinggi YouTube Premium jika akun memiliki akses.
    FFmpeg Executable Path: FFmpeg diperlukan untuk menggabungkan stream video dan audio terpisah serta mengonversi audio. Secara bawaan, OpenTubeX menganggap FFmpeg dapat ditemukan melalui variabel lingkungan PATH. Jika perlu, tentukan jalur khusus di sini.
  Distraction Free Settings:
    Shorten View Counts: Menampilkan jumlah penayangan dan suka komentar yang telah dibulatkan YouTube dalam bentuk singkat, misalnya 14 rb, bukan 14.000. Jumlah persis selalu ditampilkan penuh.
  Subscription Settings:
    Fetch Feed on Startup: Jika diaktifkan, OpenTubeX otomatis mengambil umpan langganan saat aplikasi dimulai dan ketika jendela baru dibuka.
    Show New Content Feed: Menampilkan tab Baru yang berisi item umpan langganan yang belum ada saat pengambilan sebelumnya.
    Show New Content Indicators: Menampilkan titik kecil di sebelah item umpan langganan yang belum ada saat pengambilan sebelumnya.
    Show Scheduled Live Streams / Premieres First: Mempertahankan siaran langsung dan premiere mendatang di bagian atas umpan langganan. Jika dinonaktifkan, item tetap pada posisi pengumuman hingga dimulai. Perbarui umpan langganan satu kali setelah menonaktifkannya untuk mengambil tanggal pengumuman entri terjadwal yang sudah ada.
    Auto Refresh Interval: Frekuensi OpenTubeX memperbarui umpan langganan secara otomatis selama aplikasi terbuka.
  Theme Settings:
    Show Progress as Notification: Menampilkan notifikasi tetap dengan progres langsung untuk operasi latar belakang, seperti pembaruan langganan dan unduhan alat terkelola, sebagai pengganti bilah progres global.
    Always Show Scrollbars: Mempertahankan bilah gulir agar selalu terlihat. Jika dinonaktifkan, bilah memudar sesaat setelah Anda berhenti menggerakkan tetikus dan muncul kembali begitu tetikus digerakkan.
    Scroll Speed: Mengubah jarak gulir gestur roda tetikus dan panel sentuh.
    Use Fixed Tab Width: Memberi setiap tab pada bilah tab horizontal lebar yang sama, bukan menyesuaikan lebar dengan judulnya.
    Use Grid Player Menu: Menyusun menu pengaturan pemutar video sebagai kisi ubin, bukan daftar baris.
