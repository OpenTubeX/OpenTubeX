Tooltips:
  General Settings:
    Use AI Translation Completions: املأ الفجوات في الترجمات البشرية بنصوص تم إنشاؤها بواسطة الذكاء الاصطناعي. الترجمات البشرية لها الأولوية دائمًا.
    Update Relative Timestamps: يقوم بتحديث الطوابع الزمنية النسبية في جميع أنحاء التطبيق بينما تظل الصفحة مفتوحة. عند تعطيلها، يتم تحديثها فقط بعد إعادة تحميل الصفحة أو إعادة زيارتها.
    Stream Extraction Method: "اختر كيفية حصول OpenTubeX على تدفقات الفيديو. يجب أن يكون yt-dlp متاحًا عند تحديده.\nقد يستغرق تشغيل مقاطع الفيديو وقتًا أطول عند استخدام yt-dlp.\nالمدمج في لا يدعم البحث عن البث المباشر والعروض الأولى."
    Avoid translation: "قم بتعطيل الترجمة التلقائية على YouTube لعنوان الفيديو ووصفه وفصوله.\nقد يتم مؤقتًا تقديم عدد كبير جدًا من الطلبات، مثل جلب عناوين الفيديو عبر القوائم\nتأثير موثوقية التطبيق."
    Show Thumbnail Previews: عرض معاينات متحركة عند المرور فوق الصور المصغرة للفيديو.
    Startup Behavior: "اختر ما يفعله OpenTubeX عند بدء تشغيله.\nيؤدي تحميل جميع علامات التبويب إلى استعادة كل علامة تبويب محفوظة على الفور، لكن علامات تبويب الخلفية لن تقوم بتشغيل مقاطع الفيديو تلقائيًا.\nيؤدي تحميل علامات التبويب المحملة مسبقًا إلى إعادة تحميل علامات التبويب التي تم تحميلها عند إغلاق OpenTubeX ويحافظ على إلغاء تحميل علامات التبويب الأخرى.\nيؤدي تحميل آخر علامة تبويب نشطة إلى استعادة الجلسة السابقة مع فتح علامات التبويب الأخرى ولكن بدون تحميلها؛ يتم تحميلها عند النقر فوقها.\nالبدء بجلسة فارغة يتخطى علامات التبويب المحفوظة ويفتح نافذة جديدة."
    Remember Tab Navigation History: يتم حفظ سجل التنقل ذهابًا وإيابًا لكل علامة تبويب واستعادته عند إعادة تشغيل OpenTubeX.
  Proxy Settings:
    IP Block Recovery Script Path: مسار ملف البرنامج النصي الذي سيتم تشغيله عند اكتشاف حظر IP. ينتظر OpenTubeX انتهاء الفيديو، ثم يعيد تحميله. إذا تم تمكين الإجراء الاحتياطي، فسيتم تشغيله فقط عند فشل الإجراء الاحتياطي أيضًا.
  Player Settings:
    Use Document Picture-in-Picture: "يعرض عناصر تحكم المشغل والترجمات المصاحبة للتطبيق في وضع صورة داخل صورة. عطّل هذا الخيار لاستخدام نافذة صورة داخل صورة الخاصة بفيديو النظام بدلاً من ذلك."
    Continue Playback When Screen Is Locked: 'يبقي الصوت قيد التشغيل في الخلفية ويوفر عناصر تحكم وسائط Android. عطّل هذا الخيار لإيقاف التشغيل مؤقتًا عندما لا يعود التطبيق مرئيًا.'
    Enable Caption Translations: عند التمكين، يفضل زر التسميات التوضيحية واختصار C المسار المترجم تلقائيًا بلغة التسميات التوضيحية المفضلة عندما لا يوفر الفيديو مسارًا أصليًا مطابقًا.
    Use Quick Playback Speed Bar: يُظهر شريط سرعة التشغيل السريع في عناصر تحكم المشغل على الجانب الأيمن. إذا تم تمكين توفير سرعة التشغيل اليدوي لكل قناة، فسيتضمن الشريط أيضًا زرًا لحفظ السرعة للقناة الحالية.
    Multiply Seek Interval by Playback Rate: عند التمكين، يتم ضرب الفواصل الزمنية للبحث (مفاتيح الأسهم وJ/L) بمعدل التشغيل الحالي. عند التعطيل، تظل فترات البحث ثابتة بغض النظر عن معدل التشغيل.
    Show Playback Rate Adjusted Timestamp: عند التمكين وتختلف سرعة التشغيل عن 1x، يعرض المشغل الطوابع الزمنية المعدلة حسب معدل التشغيل بين قوسين بعد عرض الطابع الزمني العادي.
    Use YouTube-style Shorts: يعرض فيديوهات Shorts في شبكة عمودية على صفحات الاشتراك والقناة ويستخدم مشغّل Shorts على غرار YouTube.
    Loop Shorts: عند التفعيل، تتم إعادة تشغيل Shorts تلقائيًا. عند إيقاف ميزة Shorts، تتوقف عند النهاية وتعرض زر إعادة التشغيل.
    Show Skip Silence Toggle: يعرض مفتاح تشغيل/إيقاف لتخطي الصمت في قائمة إعدادات المشغل.
    Enable Skip Silence by Default: تمكن الصمت تخطي علامات التبويب الجديدة. ولا يؤثر تغييره في علامة تبويب واحدة على علامات التبويب الأخرى.
    Enable Video Zoom: يعرض عنصر التحكم في التكبير/التصغير في قائمة إعدادات المشغل ويمكّن اختصارات لوحة المفاتيح وعناصر التحكم في التحريك.
    Voice-over Translation: يرسل معرف الفيديو ومدته واللغة المحددة إلى خدمة الترجمة الصوتية غير الرسمية لـ Yandex عندما تطلب ترجمة. معطل افتراضيا.
    Hold to Double Playback Speed: اضغط باستمرار على مفتاح المسافة أو زر الماوس الأيسر فوق المشغل لمضاعفة سرعة التشغيل الحالية بشكل مؤقت.
    Ambient Mode: يمزج ألوان الفيديو في المنطقة المحيطة بالمشغل.
    Default Volume: تم تعطيله أثناء تمكين تذكر مستوى الصوت. قم بإيقاف تشغيل تذكر مستوى الصوت لتعيين مستوى صوت ثابت لبدء التشغيل لكل فيديو.
    Parallel Segment Loading: "عدد مقاطع الفيديو والصوت التي سيتم تحميلها مرة واحدة قبل التشغيل.\nقد تساعد القيم الأعلى في الاتصالات البطيئة أو غير المستقرة، ولكنها تستخدم المزيد من النطاق الترددي والذاكرة.\nوقد يجعلون أيضًا Auto يقلل من سرعة الاتصال ويحدد جودة أقل.\nتتجاهل التدفقات التي تقتصر على طلب واحد في كل مرة هذا الإعداد."
    Preload Upcoming Videos: "يجلب روابط بث yt-dlp للفيديوهات التالية ويخزنها مؤقتًا. لقائمة الانتظار الأولوية على قوائم التشغيل والاقتراحات."
    Upcoming Videos to Preload: "الحد الأقصى لعدد الفيديوهات القادمة التي تُجلب روابط بثها في الخلفية."
    Concurrent Preloads: "الحد الأقصى لعدد عمليات yt-dlp المستخدمة لتحميل مقاطع الفيديو مسبقًا في الوقت نفسه. تستخدم القيم الأعلى مزيدًا من وحدة المعالجة المركزية والذاكرة وعرض النطاق الترددي للشبكة."
  Download Settings:
    Download Folder: يتم حفظ مقاطع الفيديو في هذا المجلد. اتركه فارغًا لاستخدام مجلد التنزيلات الخاص بنظامك.
    Global Additional yt-dlp Arguments: يتم تمرير وسيطات سطر الأوامر الإضافية إلى yt-dlp لكل عملية تنزيل، على سبيل المثال --cookies-from-browser Firefox.
    Concurrent Downloads: الحد الأقصى لعدد مهام yt-dlp التي يمكن تشغيلها مرة واحدة.
    Bandwidth Limit: يحدد معدل النقل المدمج لقائمة الانتظار عن طريق تقسيم هذا الحد بين المهام المتزامنة. أدخل 0 بلا حدود.
  External Software Settings:
    yt-dlp Source: يمكن لـ OpenTubeX إما استخدام yt-dlp المثبت على نظامك أو تنزيل نسخته الخاصة من yt-dlp وإدارتها، والمخزنة في دليل بيانات المستخدم.
    yt-dlp Channel: حدد قناة إصدار yt-dlp التي يقوم OpenTubeX بتنزيلها وإدارتها. يوصى بالاستقرار لمعظم المستخدمين.
    FFmpeg Source: يمكن لـ OpenTubeX إما استخدام FFmpeg وFFprobe المثبتين على نظامك أو تنزيل وإدارة إصداراته الثابتة، والتي يتم تخزينها في دليل بيانات المستخدم.
    Managed Tool Updates: اختر ما إذا كنت تريد تحديث الأدوات المُدارة تلقائيًا، أو السؤال قبل التحديث، أو التحديث فقط من خلال الأزرار اليدوية. لا يزال يتم تنزيل الأدوات المفقودة عند الحاجة.
    yt-dlp Executable Path: افتراضيًا، سيفترض OpenTubeX أنه يمكن العثور على yt-dlp عبر متغير البيئة PATH. إذا لزم الأمر، يمكن تعيين مسار مخصص هنا.
    Cookie Source: اختر ما إذا كان يجب على yt-dlp قراءة ملف تعريف الارتباط Netscape أو ملفات تعريف الارتباط من متصفح مثبت للتشغيل المعتمد.
    Cookie File: حدد ملف تعريف الارتباط بتنسيق Netscape للتشغيل المعتمد.
    Browser for Cookies: تتم قراءة دعم المتصفح من الملف القابل للتنفيذ yt-dlp المحدد. يطلب OpenTubeX من yt-dlp قراءة هذا المتصفح عند طلب التشغيل المعتمد.
    Browser Profile: اسم أو مجلد ملف تعريف المتصفح الاختياري. اتركه فارغًا لاستخدام أحدث ملف تعريف تم الوصول إليه.
    Always Use Cookies: استخدم ملفات تعريف الارتباط التي تم تكوينها عندما يقوم yt-dlp باستخراج التدفقات. لا يؤدي هذا إلى تبديل طريقة استخراج الدفق إلى yt-dlp. عند تحديد yt-dlp، قد تصبح التنسيقات المخصصة للحساب فقط متاحة، بما في ذلك معدل البت المحسّن لـ YouTube Premium عندما يكون للحساب حق الوصول.
    FFmpeg Executable Path: مطلوب FFmpeg لدمج تدفقات الفيديو والصوت المنفصلة ولتحويل الصوت. افتراضيًا، سيفترض OpenTubeX أنه يمكن العثور على FFmpeg عبر متغير البيئة PATH. إذا لزم الأمر، يمكن تعيين مسار مخصص هنا.
  Distraction Free Settings:
    Shorten View Counts: يعرض عدد المشاهدات والتعليقات التي قام YouTube بتقريبها بالفعل في شكل مختصر، على سبيل المثال. 14 الف بدلاً من 14000. يتم عرض الأعداد الدقيقة دائمًا بالكامل.
  Subscription Settings:
    Fetch Feed on Startup: عند تمكينه، سيقوم OpenTubeX تلقائيًا بجلب موجز اشتراكك عند بدء التشغيل وعند فتح نافذة جديدة.
    Show New Content Feed: تعرض علامة تبويب جديدة تحتوي على عناصر موجز الاشتراك التي لم تكن موجودة أثناء عملية الجلب السابقة.
    Show New Content Indicators: يُظهر نقطة صغيرة بجوار عناصر موجز الاشتراك التي لم تكن موجودة أثناء عملية الجلب السابقة.
    Show Scheduled Live Streams / Premieres First: يحتفظ بأحداث البث المباشر والعروض الأولى القادمة في الجزء العلوي من خلاصة الاشتراك. عند تعطيلها، تظل في موضع الإعلان الخاص بها حتى تبدأ. قم بتحديث موجز الاشتراك مرة واحدة بعد التعطيل لاسترداد تواريخ الإعلان للإدخالات المجدولة الموجودة.
    Auto Refresh Interval: "عدد المرات التي يقوم فيها OpenTubeX بتحديث موجز اشتراكك تلقائيًا أثناء فتح التطبيق. على أندرويد، يؤدي اختيار فاصل زمني غير صفري أيضًا إلى تحديث الخلاصة عندما يكون التطبيق مغلقًا."
    Refresh Subscriptions While App Is Closed: "يسمح لنظام Android بتحديث خلاصات الاشتراكات وفق الفواصل الزمنية المحددة أثناء إغلاق OpenTubeX. عطّل هذا الخيار لقصر التحديثات التلقائية على وقت فتح التطبيق."
  Theme Settings:
    Show Progress as Notification: يعرض إشعارًا مستمرًا بالتقدم المباشر لعمليات الخلفية، مثل تحديثات الاشتراك وتنزيلات الأدوات المُدارة، بدلاً من استخدام شريط التقدم العام.
    Always Show Scrollbars: يبقي أشرطة التمرير مرئية في جميع الأوقات. عند تعطيلها، فإنها تتلاشى بعد وقت قصير من التوقف عن تحريك الماوس وتعاود الظهور بمجرد تحريكه مرة أخرى.
    Scroll Speed: يغيّر مسافة التمرير بإيماءات عجلة الفأرة ولوحة اللمس.
    Use Fixed Tab Width: يمنح كل علامة تبويب في شريط علامات التبويب الأفقي نفس العرض بدلاً من تغيير حجمها حسب عنوانها.
    Use Grid Player Menu: يقوم بترتيب قائمة إعدادات مشغل الفيديو كشبكة من المربعات بدلاً من قائمة الصفوف.
The playlist is at the beginning. Enable loop to continue playing: قائمة التشغيل في البداية. تمكين الحلقة لمواصلة اللعب
