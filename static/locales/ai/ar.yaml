    Watch History Description: سجل المشاهدة يسجل مقاطع الفيديو التي تم مشاهدتها والتقدم. مشاهدة الإحصائيات تخزن إجماليات المشاهدة اليومية. ينطبق الاحتفاظ فقط على سجل المشاهدة.
