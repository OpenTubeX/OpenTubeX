Tooltips:
  General Settings:
    Use AI Translation Completions: Complète les traductions humaines avec du texte généré par l’IA. Les traductions humaines sont toujours prioritaires.
    Update Relative Timestamps: Actualise les horodatages relatifs dans toute l’application tant qu’une page reste ouverte. Lorsque cette option est désactivée, ils ne sont actualisés qu’après le rechargement ou une nouvelle visite de la page.
    Stream Extraction Method: |
      Choisissez comment OpenTubeX obtient les flux vidéo. yt-dlp doit être disponible lorsqu’il est sélectionné.
      Le démarrage des vidéos peut prendre plus de temps avec yt-dlp.
      La méthode intégrée ne permet pas de se déplacer dans les diffusions en direct et les premières.
    Avoid translation: |
      Désactivez la traduction automatique par YouTube du titre, de la description et des chapitres d’une vidéo.
      Un trop grand nombre de requêtes, par exemple lors de la récupération des titres de vidéos dans des listes, peut temporairement
      nuire à la fiabilité de l’application.
    Show Thumbnail Previews: Affiche des aperçus animés au survol des miniatures vidéo.
    Startup Behavior: |
      Choisissez le comportement d’OpenTubeX au démarrage.
      Charger tous les onglets restaure immédiatement chaque onglet enregistré, mais les onglets en arrière-plan ne lancent pas automatiquement les vidéos.
      Charger les onglets précédemment chargés recharge les onglets qui l’étaient à la fermeture d’OpenTubeX et laisse les autres déchargés.
      Charger le dernier onglet actif restaure la session précédente en ouvrant les autres onglets sans les charger ; ils se chargent lorsque vous cliquez dessus.
      Démarrer avec une session vide ignore les onglets enregistrés et ouvre une nouvelle fenêtre.
    Remember Tab Navigation History: L’historique de navigation avant et arrière de chaque onglet est enregistré et restauré au redémarrage d’OpenTubeX.
  Proxy Settings:
    IP Block Recovery Script Path: Chemin du script à exécuter lorsqu’un blocage d’IP est détecté. OpenTubeX attend la fin de son exécution, puis recharge la vidéo. Si le recours à une autre source est activé, le script ne s’exécute que si cette solution échoue également.
  Player Settings:
    Enable Caption Translations: Lorsque cette option est activée et que la vidéo ne propose aucune piste d’origine correspondante, le bouton des sous-titres et le raccourci C privilégient une piste traduite automatiquement dans la langue préférée des sous-titres.
    Use Quick Playback Speed Bar: Affiche une barre de vitesse de lecture rapide dans les commandes situées à droite du lecteur. Si l’enregistrement manuel de la vitesse de lecture par chaîne est activé, la barre comprend aussi un bouton permettant d’enregistrer la vitesse de la chaîne actuelle.
    Multiply Seek Interval by Playback Rate: Lorsque cette option est activée, les intervalles de déplacement, avec les touches fléchées et J/L, sont multipliés par la vitesse de lecture actuelle. Lorsqu’elle est désactivée, ils restent constants quelle que soit la vitesse de lecture.
    Show Playback Rate Adjusted Timestamp: Lorsque cette option est activée et que la vitesse de lecture diffère de 1x, le lecteur affiche entre parenthèses des horodatages ajustés à cette vitesse après les horodatages normaux.
    Use YouTube-style Shorts: Affiche les Shorts dans une grille verticale sur les pages d’abonnements et de chaînes, et utilise le lecteur de Shorts de style YouTube.
    Loop Shorts: Lorsque cette option est activée, les Shorts redémarrent automatiquement. Lorsqu’elle est désactivée, ils s’arrêtent à la fin et affichent un bouton de relecture.
    Show Skip Silence Toggle: Affiche un bouton pour activer ou désactiver les silences ignorés dans le menu des paramètres du lecteur.
    Enable Skip Silence by Default: Active les silences ignorés pour les nouveaux onglets. Toute modification dans un onglet reste sans effet sur les autres.
    Enable Video Zoom: Affiche la commande Zoom dans le menu des paramètres du lecteur et active ses raccourcis clavier ainsi que ses commandes de déplacement.
    Voice-over Translation: Envoie l’identifiant de la vidéo, sa durée et la langue sélectionnée au service non officiel de traduction vocale Yandex lorsque vous demandez une traduction. Cette option est désactivée par défaut.
    Hold to Double Playback Speed: Maintenez la barre d’espace ou le bouton gauche de la souris sur le lecteur pour doubler temporairement la vitesse de lecture actuelle.
    Ambient Mode: Diffuse les couleurs de la vidéo dans la zone qui entoure le lecteur.
    Default Volume: Désactivé lorsque Mémoriser le volume est activé. Désactivez Mémoriser le volume pour définir un volume de démarrage fixe pour chaque vidéo.
    Parallel Segment Loading: |
      Nombre de segments vidéo et audio à charger simultanément avant la lecture.
      Des valeurs élevées peuvent améliorer les connexions lentes ou instables, mais utilisent davantage de bande passante et de mémoire.
      Elles peuvent aussi amener le mode Auto à sous-estimer la vitesse de connexion et à sélectionner une qualité inférieure.
      Les flux limités à une requête à la fois ignorent ce paramètre.
  Download Settings:
    Download Folder: Les vidéos sont enregistrées dans ce dossier. Laissez ce champ vide pour utiliser le dossier Téléchargements de votre système.
    Global Additional yt-dlp Arguments: Arguments de ligne de commande supplémentaires transmis à yt-dlp pour chaque téléchargement, par exemple --cookies-from-browser firefox.
    Concurrent Downloads: Nombre maximal de tâches yt-dlp pouvant s’exécuter simultanément.
    Bandwidth Limit: Limite le débit de transfert total de la file d’attente en répartissant cette valeur entre les tâches simultanées. Saisissez 0 pour ne définir aucune limite.
  External Software Settings:
    yt-dlp Source: OpenTubeX peut utiliser le programme yt-dlp installé sur votre système ou télécharger et gérer sa propre copie, stockée dans le dossier des données utilisateur.
    yt-dlp Channel: Sélectionnez le canal de publication de yt-dlp qu’OpenTubeX doit télécharger et gérer. Le canal Stable est recommandé pour la plupart des utilisateurs.
    FFmpeg Source: OpenTubeX peut utiliser les programmes FFmpeg et FFprobe installés sur votre système ou télécharger et gérer ses propres versions statiques, stockées dans le dossier des données utilisateur.
    Managed Tool Updates: Choisissez si les outils gérés doivent se mettre à jour automatiquement, demander votre accord avant la mise à jour ou être mis à jour uniquement au moyen des boutons manuels. Les outils manquants sont toujours téléchargés lorsqu’ils sont requis.
    yt-dlp Executable Path: Par défaut, OpenTubeX suppose que yt-dlp est accessible au moyen de la variable d’environnement PATH. Vous pouvez définir ici un chemin personnalisé si nécessaire.
    Cookie Source: Choisissez si yt-dlp doit lire un fichier de cookies Netscape ou les cookies d’un navigateur installé pour la lecture authentifiée.
    Cookie File: Sélectionnez un fichier de cookies au format Netscape pour la lecture authentifiée.
    Browser for Cookies: La compatibilité avec les navigateurs est déterminée par l’exécutable yt-dlp sélectionné. OpenTubeX demande à yt-dlp de lire les cookies de ce navigateur lorsque la lecture authentifiée est requise.
    Browser Profile: Nom ou dossier facultatif du profil du navigateur. Laissez ce champ vide pour utiliser le dernier profil consulté.
    Always Use Cookies: Utilise les cookies configurés chaque fois que yt-dlp extrait des flux. Cette option ne remplace pas la méthode d’extraction des flux par yt-dlp. Lorsque yt-dlp est sélectionné, des formats réservés aux comptes peuvent devenir disponibles, notamment le débit amélioré de YouTube Premium si le compte y a accès.
    FFmpeg Executable Path: FFmpeg est nécessaire pour fusionner des flux vidéo et audio distincts, ainsi que pour convertir le son. Par défaut, OpenTubeX suppose que FFmpeg est accessible au moyen de la variable d’environnement PATH. Vous pouvez définir ici un chemin personnalisé si nécessaire.
  Distraction Free Settings:
    Shorten View Counts: Affiche sous forme abrégée le nombre de vues et de mentions J’aime sur les commentaires que YouTube a déjà arrondi, par exemple 14 k au lieu de 14 000. Les nombres exacts sont toujours affichés en entier.
  Subscription Settings:
    Fetch Feed on Startup: Lorsque cette option est activée, OpenTubeX récupère automatiquement votre flux d’abonnements au démarrage et à l’ouverture d’une nouvelle fenêtre.
    Show New Content Feed: Affiche un onglet Nouveau contenant les éléments du flux d’abonnements qui n’étaient pas présents lors de la récupération précédente.
    Show New Content Indicators: Affiche un petit point à côté des éléments du flux d’abonnements qui n’étaient pas présents lors de la récupération précédente.
    Show Scheduled Live Streams / Premieres First: Maintient les prochaines diffusions en direct et premières en haut du flux d’abonnements. Lorsque cette option est désactivée, elles restent à la position de leur annonce jusqu’à leur démarrage. Actualisez une fois le flux d’abonnements après la désactivation pour récupérer les dates d’annonce des éléments planifiés existants.
    Auto Refresh Interval: Fréquence à laquelle OpenTubeX actualise automatiquement votre flux d’abonnements tant que l’application est ouverte.
  Theme Settings:
    Show Progress as Notification: Affiche une notification persistante indiquant en temps réel la progression des opérations en arrière-plan, comme l’actualisation des abonnements et le téléchargement des outils gérés, au lieu d’utiliser la barre de progression globale.
    Always Show Scrollbars: Maintient les barres de défilement visibles en permanence. Lorsque cette option est désactivée, elles disparaissent peu après l’arrêt du mouvement de la souris et réapparaissent dès que vous la déplacez.
    Scroll Speed: Modifie la distance de défilement des gestes de la molette de la souris et du pavé tactile.
    Use Fixed Tab Width: Attribue la même largeur à tous les onglets de la barre horizontale au lieu d’adapter leur taille à leur titre.
    Use Grid Player Menu: Organise le menu des paramètres du lecteur vidéo sous forme de grille de vignettes au lieu d’une liste de lignes.
