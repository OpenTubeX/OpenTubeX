    Video Metadata Description: Stocke les anciens titres, miniatures et descriptions des vidéos prises en charge. Les anciennes versions ne peuvent pas être recréées après leur suppression.
    Video Metadata Effect: Les versions de métadonnées enregistrées seront supprimées définitivement. Les informations actuelles des vidéos pourront toujours être récupérées.
    Watch History: Historique et statistiques de visionnage
    Watch History Description: L’historique de visionnage enregistre les vidéos regardées et la progression. Les statistiques de visionnage conservent les totaux quotidiens. La durée de conservation s’applique uniquement à l’historique.
    Clear Watch Statistics: Effacer les statistiques de visionnage
    Watch History Effect: Les entrées des vidéos regardées et la progression enregistrée seront supprimées. Les statistiques de visionnage seront conservées.
    Clear Watch Statistics Confirmation: Supprimer toutes les statistiques de visionnage ?
    Watch Statistics Effect: Les totaux quotidiens de visionnage seront supprimés. L’historique de visionnage sera conservé.
