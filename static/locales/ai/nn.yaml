Tooltips:
  General Settings:
    Use AI Translation Completions: Fyll ut det som manglar i menneskelagde omsetjingar med KI-generert tekst. Menneskelagde omsetjingar vert alltid brukte fyrst.
    Update Relative Timestamps: Oppdaterer relative tidsstempel i heile appen medan ei side er open. Når dette er slått av, vert dei berre oppdaterte når sida vert lasta inn på nytt eller opna att.
    Stream Extraction Method: |
      Vel korleis OpenTubeX hentar videostraumar. yt-dlp må vere tilgjengeleg når det er valt.
      Videoar kan bruke lengre tid på å starte med yt-dlp.
      Den innebygde metoden støttar ikkje spoling i direktesendingar og premierar.
    Avoid translation: |
      Slå av den automatiske YouTube-omsetjinga av tittel, skildring og kapittel i ein video.
      For mange førespurnader, til dømes ved henting av videotitlar frå fleire lister, kan mellombels
      gjere appen mindre påliteleg.
    Show Thumbnail Previews: Vis animerte førehandsvisingar når peikaren er over videominiatyrar.
    Startup Behavior: |
      Vel kva OpenTubeX skal gjere ved oppstart.
      Last inn alle fanene gjenopprettar alle lagra faner med ein gong, men videoar vert ikkje spela av automatisk i bakgrunnsfaner.
      Last inn tidlegare innlastne faner lastar inn att fanene som var innlastne då OpenTubeX vart lukka, og lèt dei andre vere utlasta.
      Last inn den sist aktive fana gjenopprettar den førre økta med dei andre fanene opne, men utlasta. Dei vert lasta inn når du klikkar på dei.
      Start med ei tom økt hoppar over dei lagra fanene og opnar eit nytt vindauge.
    Open Deep Links In New Window: URL-ar som vert sende til OpenTubeX, til dømes frå nettlesarutvidingar for vidaresending eller kommandolinjeargument, vert opna i eit nytt vindauge.
    Remember Tab Navigation History: Historikken for fram- og tilbakenavigering i kvar fane vert lagra og gjenoppretta når OpenTubeX startar på nytt.
  Proxy Settings:
    IP Block Recovery Script Path: Filstien til skriptet som skal køyrast når ei IP-sperre vert oppdaga. OpenTubeX ventar til det er ferdig og lastar deretter inn videoen på nytt. Dersom reserveløysinga er slått på, køyrer skriptet berre når ho òg slår feil.
  Player Settings:
    Enable Caption Translations: Når dette er slått på, føretrekkjer teksteknappen og C-hurtigtasten eit automatisk omsett spor på det føretrekte tekstespråket dersom videoen ikkje har eit samsvarande originalspor.
    Use Quick Playback Speed Bar: Viser ei snøgglinje for avspelingsfart til høgre i spelarkontrollane. Dersom manuell lagring av avspelingsfart for kvar kanal er slått på, har linja òg ein knapp for å lagre farten for den gjeldande kanalen.
    Multiply Seek Interval by Playback Rate: Når dette er slått på, vert hoppeintervalla med piltastane og J/L multipliserte med den gjeldande avspelingsfarten. Når det er slått av, er hoppeintervalla dei same uavhengig av avspelingsfarten.
    Show Playback Rate Adjusted Timestamp: Når dette er slått på og avspelingsfarten ikkje er 1x, viser spelaren tidsstempel justerte etter avspelingsfarten i parentes etter den vanlege tidsvisinga.
    Use YouTube-style Shorts: Viser Shorts i eit ståande rutenett på abonnements- og kanalsider og brukar Shorts-spelaren i YouTube-stil.
    Loop Shorts: Når dette er slått på, startar Shorts automatisk på nytt. Når det er slått av, stoppar Shorts på slutten og viser ein knapp for ny avspeling.
    Show Skip Silence Toggle: Viser ein av/på-brytar for å hoppe over stille parti i innstillingsmenyen til spelaren.
    Enable Skip Silence by Default: Hoppar som standard over stille parti i nye faner. Endringar i éi fane påverkar ikkje andre faner.
    Enable Video Zoom: Viser zoomkontrollen i innstillingsmenyen til spelaren og slår på hurtigtastane og panoreringskontrollane.
    Voice-over Translation: Sender video-ID-en, lengda og det valde språket til den uoffisielle Yandex-tenesta for stemmeomsetjing når du ber om ei omsetjing. Av som standard.
    Hold to Double Playback Speed: Hald inne mellomromstasten eller venstre museknapp over spelaren for å doble den gjeldande avspelingsfarten mellombels.
    Ambient Mode: Tonar videofargane inn i området rundt spelaren.
    Default Volume: Er slått av medan Hugs lydstyrke er slått på. Slå av Hugs lydstyrke for å velje ei fast lydstyrke ved starten av kvar video.
    Parallel Segment Loading: |
      Kor mange video- og lydsegment som skal lastast inn samstundes før avspeling.
      Høgare verdiar kan hjelpe på treige eller ustabile samband, men brukar meir bandbreidd og minne.
      Dei kan òg få Automatisk til å undervurdere tilkoplingsfarten og velje lågare kvalitet.
      Straumar som er avgrensa til éin førespurnad om gongen, ser bort frå denne innstillinga.
  External Player Settings:
    Ignore Default Arguments: Ikkje send andre standardargument enn URL-en til videoen til den eksterne spelaren, til dømes avspelingsfart eller URL til spelelista. Eigne argument vert framleis sende vidare.
  Download Settings:
    Download Folder: Videoar vert lagra i denne mappa. La feltet stå tomt for å bruke Nedlastingar-mappa på systemet.
    Global Additional yt-dlp Arguments: Ekstra kommandolinjeargument som vert sende til yt-dlp for kvar nedlasting, til dømes --cookies-from-browser firefox.
    Concurrent Downloads: Det høgaste talet på yt-dlp-jobbar som kan køyre samstundes.
    Bandwidth Limit: Avgrensar den samla overføringsfarten til køen ved å dele grensa mellom jobbar som køyrer samstundes. Skriv inn 0 for inga grense.
  External Software Settings:
    yt-dlp Source: OpenTubeX kan anten bruke yt-dlp som er installert på systemet, eller laste ned og vedlikehalde sin eigen kopi av yt-dlp, som vert lagra i brukardatamappa.
    yt-dlp Channel: Vel kva utgjevingskanal for yt-dlp OpenTubeX skal laste ned og vedlikehalde. Stabil er tilrådd for dei fleste.
    FFmpeg Source: OpenTubeX kan anten bruke FFmpeg og FFprobe som er installerte på systemet, eller laste ned og vedlikehalde sine eigne statiske utgåver, som vert lagra i brukardatamappa.
    Managed Tool Updates: Vel om administrerte verktøy skal oppdaterast automatisk, spørje før oppdatering eller berre oppdaterast med dei manuelle knappane. Manglande verktøy vert framleis lasta ned når dei trengst.
    yt-dlp Executable Path: OpenTubeX går som standard ut frå at yt-dlp kan finnast gjennom miljøvariabelen PATH. Du kan velje ein eigen sti her dersom det trengst.
    Cookie Source: Vel om yt-dlp skal lese ei infokapselfil i Netscape-format eller infokapslar frå ein installert nettlesar ved autentisert avspeling.
    Cookie File: Vel ei infokapselfil i Netscape-format for autentisert avspeling.
    Browser for Cookies: Nettlesarstøtta vert lesen frå den valde yt-dlp-programfila. OpenTubeX ber yt-dlp om å lese frå denne nettlesaren ved autentisert avspeling.
    Browser Profile: Valfritt namn på eller mappe til ein nettlesarprofil. La feltet stå tomt for å bruke profilen som sist vart opna.
    Always Use Cookies: Bruk dei oppsette infokapslane kvar gong yt-dlp hentar ut straumar. Dette byter ikkje metoden for straumuthenting til yt-dlp. Når yt-dlp er valt, kan format som krev konto, verte tilgjengelege. Det omfattar den utvida bithastigheita til YouTube Premium når kontoen har tilgang.
    FFmpeg Executable Path: FFmpeg trengst for å slå saman åtskilde video- og lydstraumar og for lydkonvertering. OpenTubeX går som standard ut frå at FFmpeg kan finnast gjennom miljøvariabelen PATH. Du kan velje ein eigen sti her dersom det trengst.
  Distraction Free Settings:
    Shorten View Counts: Viser visingstal og tal på likarklikk for kommentarar i den avrunda kortforma frå YouTube, til dømes 14K i staden for 14,000. Nøyaktige tal vert alltid viste i full lengd.
    Hide Subscriptions Live: Denne innstillinga vert overstyrt av innstillinga "{appWideSetting}" for heile appen i underdelen "{subsection}" under "{settingsSection}"
    Hide Videos, Playlists and Channels Containing Text: Skriv inn eit ord, ein del av eit ord eller ei setning, utan skilnad på store og små bokstavar, for å gøyme alle videoar, spelelister og kanalar med ein originaltittel som inneheld teksten. Dette gjeld i heile OpenTubeX, bortsett frå Historikk, Dine spelelister og videoar i spelelister.
    Hide Videos on Watch: Gøymer videoar du har sett, frå fanene Videoar, Shorts og Direkte på abonnements- og kanalsidene. Dette påverkar ikkje Heim-fana på kanalsider
  Subscription Settings:
    Fetch Feed on Startup: Når dette er slått på, hentar OpenTubeX automatisk abonnementsstraumen ved oppstart og når eit nytt vindauge vert opna.
    Show New Content Feed: Viser fana Ny med element frå abonnementsstraumen som ikkje fanst ved førre henting.
    Show New Content Indicators: Viser ein liten prikk ved element i abonnementsstraumen som ikkje fanst ved førre henting.
    Show Scheduled Live Streams / Premieres First: Held komande direktesendingar og premierar øvst i abonnementsstraumen. Når dette er slått av, vert dei ståande der dei vart kunngjorde, fram til dei startar. Oppdater abonnementsstraumen éin gong etter at du slår av innstillinga, for å hente kunngjeringsdatoane til eksisterande planlagde element.
    Auto Refresh Interval: Kor ofte OpenTubeX automatisk oppdaterer abonnementsstraumen medan appen er open.
  Theme Settings:
    Show Progress as Notification: Viser eit vedvarande varsel med framdrift i sanntid for bakgrunnsoperasjonar, til dømes oppdatering av abonnementsstraumen og nedlasting av administrerte verktøy, i staden for den globale framdriftslinja.
    Always Show Scrollbars: Held rullefelta synlege heile tida. Når dette er slått av, tonar dei ut kort tid etter at du sluttar å flytte musa, og kjem fram att så snart du flyttar henne.
    Scroll Speed: Endrar kor langt musehjul- og styreflaterørsler rullar.
    Use Fixed Tab Width: Gjev alle fanene i den vassrette fanelinja same breidd i staden for å tilpasse breidda til tittelen.
    Use Grid Player Menu: Ordnar innstillingsmenyen til videospelaren som eit rutenett med felt i staden for ei liste med rader.
  SponsorBlock Settings:
    UseDeArrowTitles: Byt ut videotitlar med titlar som brukarar har sendt inn til DeArrow.
    UseDeArrowThumbnails: Byt ut videominiatyrar med miniatyrar frå DeArrow.
