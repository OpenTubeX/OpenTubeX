    Stored App Data: Dữ liệu ứng dụng đã lưu
    Browser Runtime Data: Dữ liệu thời gian chạy của trình duyệt
    Browser Runtime Data Hint: Bộ nhớ phiên và bộ nhớ cục bộ, cookie, trạng thái riêng tư và mạng cùng tệp sự cố của Chromium.
    Subscription Feed Cache: Bộ nhớ đệm đăng ký và bảng tin
    Subscription Feed Cache Description: Lưu video, video ngắn, luồng trực tiếp và bài đăng đã tải từ kênh đăng ký. OpenTubeX sẽ tạo lại dữ liệu này trong lần làm mới bảng tin tiếp theo.
    Clear Subscription Feed Cache: Xóa bộ nhớ đệm đăng ký và bảng tin
    Clear Subscription Feed Cache Confirmation: Xóa bộ nhớ đệm đăng ký và bảng tin?
    Subscription Feed Cache Effect: Bảng tin đăng ký có thể trống cho đến khi được làm mới. Các kênh đăng ký và hồ sơ sẽ không thay đổi.
    Session Search Cache: Bộ nhớ đệm tìm kiếm của phiên
    In Memory: Trong bộ nhớ
    Session Search Cache Description: '{count} lượt tìm kiếm được lưu trong bộ nhớ để quay lại nhanh hơn. Bộ nhớ đệm này bị xóa khi đóng OpenTubeX.'
    Clear Session Search Cache: Xóa bộ nhớ đệm tìm kiếm của phiên
    Clear Session Search Cache Confirmation: Xóa bộ nhớ đệm tìm kiếm của phiên?
    Session Search Cache Effect: Các trang kết quả trong bộ nhớ đệm sẽ bị xóa. Lịch sử tìm kiếm đã lưu sẽ không thay đổi.
    HTTP Cache: Bộ nhớ đệm HTTP
    HTTP Cache Description: Electron lưu phản hồi mạng trên ổ đĩa để các yêu cầu lặp lại có thể tải mà không phải tải xuống cùng dữ liệu lần nữa. OpenTubeX sẽ tạo lại bộ nhớ đệm này khi cần.
    Managed By Electron: Do Electron quản lý
    Clear HTTP Cache: Xóa bộ nhớ đệm HTTP
    Clear HTTP Cache Confirmation: Xóa bộ nhớ đệm HTTP của Electron?
    HTTP Cache Effect: Ảnh và các tài nguyên mạng khác có thể tải chậm hơn một lần trong khi bộ nhớ đệm được tạo lại.
    Tab Image Cache: Hình thu nhỏ của thẻ và ảnh đại diện kênh
    Tab Image Cache Description: Lưu ảnh xem trước và ảnh đại diện kênh cho các thẻ đang mở và được khôi phục. OpenTubeX sẽ tạo lại chúng khi các thẻ được dùng.
    Clear Tab Image Cache: Xóa bộ nhớ đệm ảnh thẻ
    Clear Tab Image Cache Confirmation: Xóa hình thu nhỏ của thẻ và ảnh đại diện kênh?
    Tab Image Cache Effect: Ảnh thẻ có thể biến mất trong giây lát và sẽ được tạo lại khi dùng thẻ tương ứng.
    Playback Caches: Bộ nhớ đệm phát
    Playback Caches Description: Lưu URL luồng yt-dlp giữa các phiên ứng dụng cùng với tệp trình phát YouTube. Bộ nhớ đệm URL chỉ áp dụng cho luồng lấy bằng yt-dlp.
    Playback URL Cache Entry Size: Giới hạn bộ nhớ đệm URL luồng yt-dlp
    Playback URL Cache Entry Size Tooltip: Đặt kích thước tối đa cho từng mục luồng yt-dlp trong bộ nhớ đệm. Đặt thành 0 MB để tắt lưu bền vững cho luồng yt-dlp.
    Clear Playback Caches: Xóa bộ nhớ đệm phát
    Clear Playback Caches Confirmation: Xóa bộ nhớ đệm yt-dlp và trình phát?
    Playback Caches Effect: Yêu cầu phát cục bộ tiếp theo có thể mất nhiều thời gian hơn vì dữ liệu luồng và trình phát phải được tải lại.
    Clear Cache: Xóa bộ nhớ đệm
    History Data: Lịch sử đã lưu
    Video Metadata Description: Lưu tiêu đề, hình thu nhỏ và mô tả trước đây của các video được hỗ trợ. Không thể tạo lại các bản cũ sau khi xóa.
    Video Metadata Effect: Các bản siêu dữ liệu đã lưu sẽ bị xóa vĩnh viễn. Vẫn có thể tải lại thông tin hiện tại của video.
    Watch History: Lịch sử xem và thống kê
    Watch History Description: Lịch sử xem ghi lại video đã xem và tiến độ. Thống kê xem lưu tổng thời gian xem mỗi ngày. Thời hạn lưu chỉ áp dụng cho lịch sử xem.
    Clear Watch Statistics: Xóa thống kê xem
    Watch History Effect: Bản ghi video đã xem và tiến độ đã lưu sẽ bị xóa. Thống kê xem vẫn được giữ lại.
    Clear Watch Statistics Confirmation: Xóa toàn bộ thống kê xem?
    Watch Statistics Effect: Tổng thời gian xem mỗi ngày sẽ bị xóa. Lịch sử xem vẫn được giữ lại.
    Search History: Lịch sử tìm kiếm
    Search History Description: Lưu các lượt tìm kiếm bạn chọn ghi nhớ.
    Delete Search History: Xóa lịch sử tìm kiếm
    Delete Search History Confirmation: Xóa toàn bộ lịch sử tìm kiếm đã lưu?
    Search History Effect: Gợi ý tìm kiếm đã lưu từ các lượt tìm kiếm trước sẽ biến mất. Bộ nhớ đệm của phiên hiện tại vẫn được giữ lại.
    Other User Data: Dữ liệu người dùng khác
    Other Profile Files: Tệp hồ sơ khác
    Other Profile Files Hint: Bản sao lưu, tệp tạm và mục hồ sơ mà OpenTubeX chưa nhận dạng.
    Subscriptions And Profiles: Kênh đăng ký và hồ sơ
    Subscriptions And Profiles Description: Lưu các kênh đã đăng ký, tên hồ sơ và thành viên trong hồ sơ.
    Subscriptions And Profiles Effect: Tất cả kênh đăng ký và hồ sơ bổ sung sẽ bị xóa vĩnh viễn. Dữ liệu bộ nhớ đệm bảng tin cũng sẽ bị xóa.
    Playlists Description: Lưu tên, mô tả và video trong danh sách phát.
    Playlists Effect: Mọi danh sách phát và danh sách video đã lưu trong đó sẽ bị xóa vĩnh viễn. Các tệp đa phương tiện đã tải vẫn được giữ lại.
    Settings And Sessions: Cài đặt, phiên thẻ và lời nhắc
    Settings And Sessions Description: Lưu tùy chọn ứng dụng, các thẻ có thể khôi phục và lời nhắc luồng trực tiếp. Mở thư mục hồ sơ để kiểm tra hoặc sao lưu các tệp này; trang này không xóa chúng.
    Cleanup Complete: Đã dọn dẹp bộ nhớ
    Cleanup Failed: Không thể dọn dẹp bộ nhớ
