Tooltips:
  General Settings:
    Use AI Translation Completions: Điền phần còn thiếu trong bản dịch của con người bằng văn bản do AI tạo. Bản dịch của con người luôn được ưu tiên.
    Update Relative Timestamps: Cập nhật mốc thời gian tương đối trên toàn ứng dụng khi trang vẫn mở. Khi tắt, mốc thời gian chỉ cập nhật sau khi tải lại hoặc mở lại trang.
    Stream Extraction Method: |
      Chọn cách OpenTubeX lấy luồng video. yt-dlp phải dùng được khi được chọn.
      Video có thể mất nhiều thời gian hơn để bắt đầu khi dùng yt-dlp.
      Phương thức tích hợp không hỗ trợ tua luồng trực tiếp và buổi công chiếu.
    Avoid translation: |
      Tắt tính năng tự động dịch tiêu đề, mô tả và chương video của YouTube.
      Quá nhiều yêu cầu, chẳng hạn lấy tiêu đề video trong nhiều danh sách, có thể tạm thời
      làm giảm độ ổn định của ứng dụng.
    Show Thumbnail Previews: Hiện bản xem trước động khi di chuột lên hình thu nhỏ của video.
    Startup Behavior: |
      Chọn hành động của OpenTubeX khi khởi động.
      Tải tất cả thẻ sẽ khôi phục ngay mọi thẻ đã lưu, nhưng các thẻ nền sẽ không tự động phát video.
      Tải các thẻ đã tải trước đó sẽ tải lại những thẻ đang được tải khi đóng OpenTubeX và giữ các thẻ khác ở trạng thái đã dỡ.
      Tải thẻ hoạt động gần nhất sẽ khôi phục phiên trước với các thẻ khác được mở nhưng chưa tải; chúng sẽ tải khi bạn nhấp vào.
      Bắt đầu với phiên trống sẽ bỏ qua các thẻ đã lưu và mở một cửa sổ mới.
    Remember Tab Navigation History: Lịch sử điều hướng tới và lui của từng thẻ sẽ được lưu và khôi phục khi OpenTubeX khởi động lại.
  Proxy Settings:
    IP Block Recovery Script Path: Đường dẫn tệp tập lệnh sẽ chạy khi phát hiện bị chặn IP. OpenTubeX chờ tập lệnh chạy xong rồi tải lại video. Nếu bật phương án dự phòng, tập lệnh chỉ chạy khi phương án đó cũng thất bại.
  Player Settings:
    Enable Caption Translations: Khi bật, nút phụ đề và phím tắt C sẽ ưu tiên bản phụ đề tự động dịch sang ngôn ngữ phụ đề ưu tiên nếu video không có bản gốc phù hợp.
    Use Quick Playback Speed Bar: Hiện thanh tốc độ phát nhanh trong phần điều khiển bên phải của trình phát. Nếu bật lưu tốc độ phát thủ công theo kênh, thanh này cũng có nút lưu tốc độ cho kênh hiện tại.
    Multiply Seek Interval by Playback Rate: Khi bật, khoảng tua bằng phím mũi tên và J/L được nhân với tốc độ phát hiện tại. Khi tắt, khoảng tua không đổi bất kể tốc độ phát.
    Show Playback Rate Adjusted Timestamp: Khi bật và tốc độ phát khác 1x, trình phát hiện mốc thời gian đã điều chỉnh theo tốc độ phát trong ngoặc đơn sau mốc thời gian thông thường.
    Use YouTube-style Shorts: Hiện video ngắn trong lưới dọc trên trang đăng ký và trang kênh, đồng thời dùng trình phát video ngắn kiểu YouTube.
    Loop Shorts: Khi bật, video ngắn sẽ tự động phát lại. Khi tắt, video ngắn sẽ dừng ở cuối và hiện nút phát lại.
    Show Skip Silence Toggle: Hiện nút bật/tắt bỏ qua đoạn im lặng trong menu cài đặt của trình phát.
    Enable Skip Silence by Default: Bật bỏ qua đoạn im lặng cho thẻ mới. Thay đổi trong một thẻ không ảnh hưởng đến thẻ khác.
    Enable Video Zoom: Hiện điều khiển Thu phóng trong menu cài đặt của trình phát và bật các phím tắt cùng điều khiển di chuyển khung hình.
    Voice-over Translation: Gửi ID video, thời lượng và ngôn ngữ đã chọn đến dịch vụ dịch lồng tiếng Yandex không chính thức khi bạn yêu cầu dịch. Tính năng này mặc định tắt.
    Hold to Double Playback Speed: Giữ phím cách hoặc nút chuột trái trên trình phát để tạm thời tăng gấp đôi tốc độ phát hiện tại.
    Ambient Mode: Hòa màu của video vào khu vực quanh trình phát.
    Default Volume: Không dùng được khi bật Ghi nhớ âm lượng. Tắt Ghi nhớ âm lượng để đặt mức âm lượng khởi đầu cố định cho mỗi video.
    Parallel Segment Loading: |
      Số phân đoạn video và âm thanh tải đồng thời trước vị trí phát.
      Giá trị cao hơn có thể hữu ích với kết nối chậm hoặc không ổn định nhưng dùng nhiều băng thông và bộ nhớ hơn.
      Giá trị cao cũng có thể khiến chế độ Tự động đánh giá thấp tốc độ kết nối và chọn chất lượng thấp hơn.
      Luồng bị giới hạn ở một yêu cầu mỗi lần sẽ bỏ qua cài đặt này.
    Preload Upcoming Videos: "Lấy và lưu đệm URL yt-dlp của các video tiếp theo. Hàng đợi được ưu tiên hơn danh sách phát và đề xuất."
    Upcoming Videos to Preload: "Số video tiếp theo tối đa có URL yt-dlp được lấy trong nền."
  Download Settings:
    Download Folder: Video được lưu vào thư mục này. Để trống để dùng thư mục Tải xuống của hệ thống.
    Global Additional yt-dlp Arguments: Đối số dòng lệnh bổ sung được chuyển cho yt-dlp trong mọi lượt tải, ví dụ --cookies-from-browser firefox.
    Concurrent Downloads: Số tác vụ yt-dlp tối đa có thể chạy cùng lúc.
    Bandwidth Limit: Giới hạn tổng tốc độ truyền của hàng đợi bằng cách chia giới hạn này cho các tác vụ đồng thời. Nhập 0 để không giới hạn.
  External Software Settings:
    yt-dlp Source: OpenTubeX có thể dùng yt-dlp đã cài trên hệ thống hoặc tải và quản lý bản yt-dlp riêng trong thư mục dữ liệu người dùng.
    yt-dlp Channel: Chọn kênh phát hành yt-dlp mà OpenTubeX sẽ tải và quản lý. Kênh ổn định phù hợp với hầu hết người dùng.
    FFmpeg Source: OpenTubeX có thể dùng FFmpeg và FFprobe đã cài trên hệ thống hoặc tải và quản lý các bản dựng tĩnh riêng trong thư mục dữ liệu người dùng.
    Managed Tool Updates: Chọn tự động cập nhật công cụ được quản lý, hỏi trước khi cập nhật hoặc chỉ cập nhật bằng nút thủ công. Công cụ còn thiếu vẫn được tải khi cần.
    yt-dlp Executable Path: Theo mặc định, OpenTubeX giả định có thể tìm thấy yt-dlp qua biến môi trường PATH. Bạn có thể đặt đường dẫn tùy chỉnh tại đây nếu cần.
    Cookie Source: Chọn để yt-dlp đọc tệp cookie Netscape hoặc cookie từ trình duyệt đã cài nhằm phát nội dung cần xác thực.
    Cookie File: Chọn tệp cookie định dạng Netscape để phát nội dung cần xác thực.
    Browser for Cookies: Khả năng hỗ trợ trình duyệt được đọc từ tệp thực thi yt-dlp đã chọn. OpenTubeX yêu cầu yt-dlp đọc trình duyệt này khi cần phát nội dung xác thực.
    Browser Profile: Tên hoặc thư mục hồ sơ trình duyệt không bắt buộc. Để trống để dùng hồ sơ được truy cập gần nhất.
    Always Use Cookies: Dùng cookie đã thiết lập mỗi khi yt-dlp trích xuất luồng. Tùy chọn này không chuyển phương thức trích xuất luồng sang yt-dlp. Khi chọn yt-dlp, các định dạng chỉ dành cho tài khoản có thể xuất hiện, gồm tốc độ bit nâng cao của YouTube Premium nếu tài khoản có quyền truy cập.
    FFmpeg Executable Path: Cần FFmpeg để ghép luồng video và âm thanh riêng biệt cũng như chuyển đổi âm thanh. Theo mặc định, OpenTubeX giả định có thể tìm thấy FFmpeg qua biến môi trường PATH. Bạn có thể đặt đường dẫn tùy chỉnh tại đây nếu cần.
  Distraction Free Settings:
    Shorten View Counts: Hiện số lượt xem và lượt thích bình luận theo dạng rút gọn mà YouTube đã làm tròn, ví dụ 14K thay vì 14.000. Số chính xác luôn được hiện đầy đủ.
  Subscription Settings:
    Fetch Feed on Startup: Khi bật, OpenTubeX sẽ tự động tải bảng tin đăng ký lúc khởi động và khi mở cửa sổ mới.
    Show New Content Feed: Hiện thẻ Mới chứa các mục trong bảng tin đăng ký chưa có ở lần tải trước.
    Show New Content Indicators: Hiện một chấm nhỏ bên cạnh các mục trong bảng tin đăng ký chưa có ở lần tải trước.
    Show Scheduled Live Streams / Premieres First: Giữ luồng trực tiếp và buổi công chiếu sắp tới ở đầu bảng tin đăng ký. Khi tắt, chúng vẫn ở vị trí thông báo cho đến khi bắt đầu. Hãy làm mới bảng tin đăng ký một lần sau khi tắt để lấy ngày thông báo cho các mục đã lên lịch hiện có.
    Auto Refresh Interval: Tần suất OpenTubeX tự động làm mới bảng tin đăng ký khi ứng dụng đang mở.
  Theme Settings:
    Show Progress as Notification: Hiện thông báo cố định với tiến trình trực tiếp cho các thao tác nền, chẳng hạn làm mới đăng ký và tải công cụ được quản lý, thay cho thanh tiến trình chung.
    Always Show Scrollbars: Luôn giữ thanh cuộn hiển thị. Khi tắt, thanh cuộn mờ dần ngay sau khi bạn ngừng di chuyển chuột và xuất hiện lại khi bạn di chuyển chuột.
    Scroll Speed: Thay đổi khoảng cách cuộn của cử chỉ con lăn chuột và con lăn bàn di chuột.
    Use Fixed Tab Width: Đặt cùng chiều rộng cho mọi thẻ trên thanh thẻ ngang thay vì điều chỉnh theo tiêu đề.
    Use Grid Player Menu: Sắp xếp menu cài đặt của trình phát video thành lưới ô thay vì danh sách hàng.
The playlist is at the beginning. Enable loop to continue playing: Danh sách phát đang ở đầu. Hãy bật lặp lại để tiếp tục phát
