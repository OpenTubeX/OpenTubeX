Tooltips:
  General Settings:
    Use AI Translation Completions: İnsan tərcümələrindəki boşluqları süni intellektin yaratdığı mətnlə doldur. İnsan tərcümələrinə həmişə üstünlük verilir.
    Update Relative Timestamps: Səhifə açıq qaldıqda tətbiq boyu nisbi vaxt göstəricilərini yeniləyir. Bağlandıqda onlar yalnız səhifə yenidən yüklənəndə və ya ona yenidən daxil olduqda yenilənir.
    Stream Extraction Method: |
      OpenTubeX-in video axınlarını necə əldə etdiyini seçin. yt-dlp seçildikdə əlçatan olmalıdır.
      yt-dlp istifadə edildikdə videoların başlaması daha uzun çəkə bilər.
      Daxili üsul canlı yayımlarda və premyeralarda vaxt üzrə keçidi dəstəkləmir.
    Avoid translation: |
      YouTube-un videonun başlığını, açıqlamasını və bölümlərini avtomatik tərcümə etməsini bağla.
      Siyahılardakı video başlıqlarının alınması kimi çoxsaylı sorğular tətbiqin
      etibarlılığına müvəqqəti təsir edə bilər.
    Show Thumbnail Previews: Video miniatürlərinin üzərinə gəldikdə hərəkətli önbaxışları göstər.
    Startup Behavior: |
      OpenTubeX başladıqda nə edəcəyini seçin.
      Bütün vərəqləri yüklə seçimi saxlanmış bütün vərəqləri dərhal bərpa edir, lakin arxa plandakı vərəqlərdə videolar avtomatik oynadılmır.
      Əvvəllər yüklənmiş vərəqləri yüklə seçimi OpenTubeX bağlanarkən yüklənmiş vərəqləri yenidən yükləyir və digərlərini yaddaşdan boşaldılmış saxlayır.
      Son aktiv vərəqni yüklə seçimi əvvəlki sessiyanı bərpa edir, digər vərəqlər açıq, lakin yaddaşdan boşaldılmış qalır; onların üzərinə kliklədikdə yüklənirlər.
      Boş sessiya ilə başla seçimi saxlanmış vərəqləri keçərək yeni pəncərə açır.
    Remember Tab Navigation History: Hər vərəqnin geri və irəli keçid tarixçəsi saxlanır və OpenTubeX yenidən başladıqda bərpa olunur.
  Proxy Settings:
    IP Block Recovery Script Path: IP bloklanması aşkarlandıqda icra ediləcək skript faylının yolu. OpenTubeX onun bitməsini gözləyir, sonra videonu yenidən yükləyir. Ehtiyat mənbəyə keçid aktivdirsə, skript yalnız həmin keçid də uğursuz olduqda icra edilir.
  Player Settings:
    Enable Caption Translations: Aktivləşdirildikdə, videoda uyğun orijinal titr treki yoxdursa, titr düyməsi və C qısayolu üstünlük verilən titr dilinə avtomatik tərcümə olunmuş trekə üstünlük verir.
    Use Quick Playback Speed Bar: Oynadıcının sağ tərəfdəki idarəetmə hissəsində sürətli oynatma sürəti panelini göstərir. Kanal üzrə oynatma sürətinin əl ilə saxlanması aktivdirsə, paneldə cari kanalın sürətini saxlamaq üçün düymə də olur.
    Multiply Seek Interval by Playback Rate: Aktivləşdirildikdə, vaxt üzrə keçid aralıqları (ox düymələri və J/L) cari oynatma sürətinə vurulur. Bağlandıqda keçid aralıqları oynatma sürətindən asılı olmayaraq sabit qalır.
    Show Playback Rate Adjusted Timestamp: Aktivləşdirildikdə və oynatma sürəti 1x-dən fərqli olduqda, oynadıcı adi vaxt göstəricisindən sonra mötərizədə oynatma sürətinə uyğunlaşdırılmış vaxt göstəricilərini göstərir.
    Use YouTube-style Shorts: Abunəlik və kanal səhifələrində Shorts videolarını şaquli torda göstərir və YouTube üslublu Shorts oynadıcısından istifadə edir.
    Loop Shorts: Aktivləşdirildikdə, Shorts videoları avtomatik yenidən başlayır. Bağlandıqda, Shorts videoları sonda dayanır və yenidən oynatma düyməsini göstərir.
    Show Skip Silence Toggle: Oynadıcının tənzimləmələr menyusunda səssiz hissələri keçməyi açıb-bağlayan keçid göstərir.
    Enable Skip Silence by Default: Yeni vərəqlərdə səssiz hissələrin keçilməsini aktivləşdirir. Bir vərəqdə dəyişdirilməsi digər vərəqlərə təsir etmir.
    Enable Video Zoom: Oynadıcının tənzimləmələr menyusunda miqyas idarəsini göstərir və onun klaviatura qısayollarını və görüntünü sürüşdürmə idarələrini aktivləşdirir.
    Continue Playback When Screen Is Locked: Səsi arxa planda oynatmağa davam edir və Android media idarələrini təmin edir. Tətbiq artıq görünmədikdə oynatmanı dayandırmaq üçün bunu bağlayın.
    Voice-over Translation: Tərcümə istədiyinizdə videonun ID-sini, müddətini və seçilmiş dili qeyri-rəsmi Yandex səsli tərcümə xidmətinə göndərir. İlkin olaraq bağlıdır.
    Hold to Double Playback Speed: Cari oynatma sürətini müvəqqəti ikiqat artırmaq üçün oynadıcı üzərində Boşluq düyməsini və ya siçanın sol düyməsini basıb saxlayın.
    Ambient Mode: Videonun rənglərini oynadıcının ətrafındakı sahəyə yayır.
    Default Volume: Səsi yadda saxla aktiv olduqda bağlıdır. Hər video üçün sabit başlanğıc səs səviyyəsi təyin etmək üçün Səsi yadda saxla seçimini bağlayın.
    Parallel Segment Loading: |
      Oynatmadan əvvəl eyni anda yüklənəcək video və səs seqmentlərinin sayı.
      Yüksək dəyərlər zəif və ya qeyri-sabit bağlantılarda kömək edə bilər, lakin daha çox trafik və yaddaş istifadə edir.
      Onlar həmçinin Avtomatik rejimin bağlantı sürətini olduğundan aşağı qiymətləndirib daha aşağı keyfiyyət seçməsinə səbəb ola bilər.
      Eyni anda yalnız bir sorğuya icazə verən axınlar bu tənzimləməni nəzərə almır.
    Preload Upcoming Videos: Növbəti oynadıla biləcək videoların yt-dlp axın URL-lərini alır və keşdə saxlayır. Baxış növbəsinə pleylistlər və tövsiyələrdən daha çox üstünlük verilir.
    Upcoming Videos to Preload: yt-dlp axın URL-ləri arxa planda alınan növbəti videoların maksimum sayı.
    Concurrent Preloads: Videoları eyni anda öncədən yükləmək üçün istifadə olunan yt-dlp proseslərinin maksimum sayı. Yüksək dəyərlər daha çox prosessor, yaddaş və şəbəkə resursu istifadə edir.
  Download Settings:
    Download Folder: Videolar bu qovluqda saxlanır. Sistemin Yükləmələr qovluğunu istifadə etmək üçün boş buraxın.
    Global Additional yt-dlp Arguments: Hər endirmədə yt-dlp-yə ötürülən əlavə əmr sətri arqumentləri, məsələn --cookies-from-browser firefox.
    Concurrent Downloads: Eyni anda icra edilə bilən yt-dlp tapşırıqlarının maksimum sayı.
    Bandwidth Limit: Bu həddi eyni vaxtda işləyən tapşırıqlar arasında bölərək növbənin ümumi ötürmə sürətini məhdudlaşdırır. Məhdudiyyət qoymamaq üçün 0 daxil edin.
  External Software Settings:
    yt-dlp Source: OpenTubeX sisteminizdə quraşdırılmış yt-dlp-dən istifadə edə və ya istifadəçi məlumatları qovluğunda saxlanacaq öz yt-dlp nüsxəsini endirib idarə edə bilər.
    yt-dlp Channel: OpenTubeX-in endirib idarə edəcəyi yt-dlp buraxılış kanalını seçin. Əksər istifadəçilərə sabit kanal tövsiyə olunur.
    FFmpeg Source: OpenTubeX sisteminizdə quraşdırılmış FFmpeg və FFprobe-dan istifadə edə və ya istifadəçi məlumatları qovluğunda saxlanacaq öz statik quruluşlarını endirib idarə edə bilər.
    Managed Tool Updates: İdarə olunan vasitələrin avtomatik yenilənəcəyini, yeniləmədən əvvəl soruşulacağını və ya yalnız əl ilə düymələr vasitəsilə yenilənəcəyini seçin. Çatışmayan vasitələr lazım olduqda yenə də endirilir.
    yt-dlp Executable Path: İlkin olaraq OpenTubeX yt-dlp-nin PATH mühit dəyişəni vasitəsilə tapıla biləcəyini qəbul edir. Lazım gələrsə, burada xüsusi yol təyin etmək olar.
    Cookie Source: Hesabla oynatma üçün yt-dlp-nin Netscape kuki faylını, yoxsa quraşdırılmış brauzerdən kukiləri oxuyacağını seçin.
    Cookie File: Hesabla oynatma üçün Netscape formatında kuki faylı seçin.
    Browser for Cookies: Brauzer dəstəyi seçilmiş yt-dlp icra faylından oxunur. Hesabla oynatma tələb olunduqda OpenTubeX yt-dlp-dən bu brauzeri oxumağı istəyir.
    Browser Profile: İstəyə bağlı brauzer profilinin adı və ya qovluğu. Son istifadə olunmuş profili istifadə etmək üçün boş buraxın.
    Always Use Cookies: Təyin edilmiş kukiləri titrlər üçün və yt-dlp axınları əldə edən hər dəfə istifadə et. Bu, axın əldə etmə üsulunu yt-dlp-yə dəyişmir. yt-dlp seçildikdə, hesabın giriş icazəsi varsa YouTube Premium-un artırılmış bitreytli formatı da daxil olmaqla yalnız hesablar üçün formatlar əlçatan ola bilər.
    FFmpeg Executable Path: Ayrı video və səs axınlarını birləşdirmək və səs çevirməsi üçün FFmpeg tələb olunur. İlkin olaraq OpenTubeX FFmpeg-in PATH mühit dəyişəni vasitəsilə tapıla biləcəyini qəbul edir. Lazım gələrsə, burada xüsusi yol təyin etmək olar.
    Use cookies for subtitles: Titr və avtomatik tərcümələr üçün təyin edilmiş kukiləri istifadə et. "Həmişə kukilərdən istifadə et" seçimi də bunu aktivləşdirir.
  Distraction Free Settings:
    Shorten View Counts: YouTube-un artıq yuvarlaqlaşdırdığı baxış, şərh və şərh bəyənmə saylarını qısaldılmış formada, məsələn 14.000 əvəzinə 14K göstərir. Dəqiq saylar həmişə tam göstərilir.
  Subscription Settings:
    Fetch Feed on Startup: Aktivləşdirildikdə OpenTubeX başlanğıcda və yeni pəncərə açıldıqda abunəlik axınınızı avtomatik alır.
    Show New Content Feed: Əvvəlki alınma zamanı olmayan abunəlik axını elementlərini ehtiva edən Yeni səhifəsini göstərir.
    Show New Content Indicators: Əvvəlki alınma zamanı olmayan abunəlik axını elementlərinin yanında kiçik nöqtə göstərir.
    Show Scheduled Live Streams / Premieres First: Gələcək canlı yayımları və premyeraları abunəlik axınının yuxarısında saxlayır. Bağlandıqda, onlar başlayana qədər elan edildikləri mövqedə qalırlar. Mövcud planlaşdırılmış elementlərin elan tarixlərini almaq üçün bağladıqdan sonra abunəlik axınını bir dəfə yeniləyin.
    Auto Refresh Interval: Tətbiq açıq olduqda OpenTubeX-in abunəlik axınınızı hansı tezliklə avtomatik yeniləyəcəyi. Android-də sıfırdan fərqli aralıq tətbiq bağlı olduqda da axını yeniləyir.
    Refresh Subscriptions While App Is Closed: OpenTubeX bağlı olduqda Android-in abunəlik axınlarını seçilmiş aralıqlarla yeniləməsinə icazə verir. Avtomatik yeniləmələri yalnız tətbiq açıq olan vaxtlarla məhdudlaşdırmaq üçün bunu bağlayın.
  Theme Settings:
    Show Progress as Notification: Ümumi gedişat zolağı əvəzinə abunəlik yeniləmələri və idarə olunan vasitələrin endirilməsi kimi arxa plan əməliyyatlarının cari gedişatını daimi bildirişdə göstərir.
    Always Show Scrollbars: Sürüşdürmə zolaqlarını həmişə görünən saxlayır. Bağlandıqda, siçanı hərəkət etdirməyi dayandırdıqdan az sonra solub yox olur və onu yenidən hərəkət etdirən kimi görünürlər.
    Scroll Speed: Siçan çarxı və toxunma paneli jestlərinin səhifəni nə qədər sürüşdürdüyünü dəyişir.
    Use Fixed Tab Width: Üfüqi vərəq zolağında bütün vərəqlərin enini başlıqlarına görə dəyişmək əvəzinə eyni edir.
    Use Grid Player Menu: Video oynadıcısının tənzimləmələr menyusunu sətir siyahısı əvəzinə plitələr toru kimi düzür.
