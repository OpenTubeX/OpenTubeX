Tooltips:
  General Settings:
    Use AI Translation Completions: Fyll ut mangler i menneskelige oversettelser med KI-generert tekst. Menneskelige oversettelser prioriteres alltid.
    Update Relative Timestamps: Oppdaterer relative tidsstempler i hele appen mens en side er åpen. Når dette er slått av, oppdateres de først når siden lastes inn på nytt eller åpnes igjen.
    Stream Extraction Method: |
      Velg hvordan OpenTubeX henter videostrømmer. yt-dlp må være tilgjengelig når det er valgt.
      Det kan ta lengre tid å starte videoer med yt-dlp.
      Innebygd metode støtter ikke spoling i direktesendinger og premierer.
    Avoid translation: |
      Slå av YouTubes automatiske oversettelse av videotittel, beskrivelse og kapitler.
      For mange forespørsler, for eksempel henting av videotitler fra flere lister, kan midlertidig
      påvirke hvor pålitelig appen er.
    Show Thumbnail Previews: Vis animerte forhåndsvisninger når pekeren holdes over videominiatyrer.
    Startup Behavior: |
      Velg hva OpenTubeX skal gjøre ved oppstart.
      Last inn alle faner gjenoppretter alle lagrede faner med én gang, men videoer spilles ikke av automatisk i bakgrunnsfaner.
      Last inn tidligere innlastede faner laster inn fanene som var lastet inn da OpenTubeX ble lukket, og lar de andre være uten å laste dem inn.
      Last inn sist aktive fane gjenoppretter forrige økt med de andre fanene åpne, men ikke innlastet. De lastes inn når du klikker på dem.
      Start med en tom økt hopper over de lagrede fanene og åpner et nytt vindu.
    Remember Tab Navigation History: Navigeringshistorikken fremover og bakover lagres for hver fane og gjenopprettes når OpenTubeX starter på nytt.
  Proxy Settings:
    IP Block Recovery Script Path: Filbane til skriptet som skal kjøres når en IP-blokkering oppdages. OpenTubeX venter til det er ferdig og laster deretter inn videoen på nytt. Hvis reserveløsning er slått på, kjøres skriptet bare når også reserveløsningen mislykkes.
  Player Settings:
    Enable Caption Translations: Når dette er slått på, foretrekker undertekstknappen og hurtigtasten C et automatisk oversatt spor på det foretrukne undertekstspråket hvis videoen ikke har et samsvarende originalspor.
    Use Quick Playback Speed Bar: Viser et hurtigfelt for avspillingshastighet til høyre blant spillerkontrollene. Hvis manuell lagring av avspillingshastighet per kanal er slått på, inneholder feltet også en knapp for å lagre hastigheten for den gjeldende kanalen.
    Multiply Seek Interval by Playback Rate: Når dette er slått på, multipliseres spoleintervallene (piltastene og J/L) med gjeldende avspillingshastighet. Når det er slått av, forblir spoleintervallene konstante uansett avspillingshastighet.
    Show Playback Rate Adjusted Timestamp: Når dette er slått på og avspillingshastigheten avviker fra 1x, viser spilleren hastighetsjusterte tidsstempler i parentes etter den vanlige tidsvisningen.
    Use YouTube-style Shorts: Viser Shorts i et stående rutenett på abonnements- og kanalsider og bruker Shorts-spilleren i YouTube-stil.
    Loop Shorts: Når dette er slått på, starter Shorts automatisk på nytt. Når det er slått av, stopper Shorts på slutten og viser en knapp for å spille av på nytt.
    Show Skip Silence Toggle: Viser en bryter for å hoppe over stillhet i innstillingsmenyen til spilleren.
    Enable Skip Silence by Default: Hopper over stillhet som standard i nye faner. Endring i én fane påvirker ikke andre faner.
    Enable Video Zoom: Viser zoomkontrollen i innstillingsmenyen til spilleren og slår på hurtigtastene og panoreringskontrollene.
    Voice-over Translation: Sender video-ID-en, varigheten og valgt språk til Yandex' uoffisielle tjeneste for taleoversettelse når du ber om en oversettelse. Slått av som standard.
    Hold to Double Playback Speed: Hold inne mellomromstasten eller venstre museknapp over spilleren for å doble avspillingshastigheten midlertidig.
    Ambient Mode: Blander fargene i videoen inn i området rundt spilleren.
    Default Volume: Utilgjengelig mens Husk volum er slått på. Slå av Husk volum for å angi et fast startvolum for hver video.
    Parallel Segment Loading: |
      Antall video- og lydsegmenter som skal lastes inn samtidig før avspilling.
      Høyere verdier kan hjelpe på trege eller ustabile forbindelser, men bruker mer båndbredde og minne.
      De kan også føre til at Automatisk undervurderer tilkoblingshastigheten og velger lavere kvalitet.
      Strømmer som er begrenset til én forespørsel om gangen, ignorerer denne innstillingen.
  Download Settings:
    Download Folder: Videoer lagres i denne mappen. La feltet stå tomt for å bruke systemets nedlastingsmappe.
    Global Additional yt-dlp Arguments: Ekstra kommandolinjeargumenter som sendes til yt-dlp for hver nedlasting, for eksempel --cookies-from-browser firefox.
    Concurrent Downloads: Det høyeste antallet yt-dlp-jobber som kan kjøre samtidig.
    Bandwidth Limit: Begrenser den samlede overføringshastigheten til køen ved å fordele grensen mellom samtidige jobber. Skriv inn 0 for ingen grense.
  External Software Settings:
    yt-dlp Source: OpenTubeX kan enten bruke yt-dlp som er installert på systemet, eller laste ned og administrere sin egen kopi av yt-dlp, som lagres i mappen for brukerdata.
    yt-dlp Channel: Velg hvilken utgivelseskanal for yt-dlp OpenTubeX skal laste ned og administrere. Stabil anbefales for de fleste brukere.
    FFmpeg Source: OpenTubeX kan enten bruke FFmpeg og FFprobe som er installert på systemet, eller laste ned og administrere egne statiske versjoner, som lagres i mappen for brukerdata.
    Managed Tool Updates: Velg om administrerte verktøy skal oppdateres automatisk, spørre før oppdatering eller bare oppdateres med de manuelle knappene. Manglende verktøy lastes fortsatt ned ved behov.
    yt-dlp Executable Path: OpenTubeX antar som standard at yt-dlp finnes via miljøvariabelen PATH. Du kan angi en egendefinert bane her ved behov.
    Cookie Source: Velg om yt-dlp skal lese en Netscape-informasjonskapselfil eller informasjonskapsler fra en installert nettleser for autentisert avspilling.
    Cookie File: Velg en informasjonskapselfil i Netscape-format for autentisert avspilling.
    Browser for Cookies: Nettleserstøtten leses fra den valgte kjørbare yt-dlp-filen. OpenTubeX ber yt-dlp lese informasjonskapsler fra denne nettleseren når autentisert avspilling etterspørres.
    Browser Profile: Valgfritt navn eller mappe for nettleserprofilen. La feltet stå tomt for å bruke profilen som ble åpnet sist.
    Always Use Cookies: Bruk de konfigurerte informasjonskapslene hver gang yt-dlp henter ut strømmer. Dette endrer ikke metoden for strømhenting til yt-dlp. Når yt-dlp er valgt, kan formater som krever konto, bli tilgjengelige, blant annet YouTube Premiums forbedrede bithastighet hvis kontoen har tilgang.
    FFmpeg Executable Path: FFmpeg kreves for å slå sammen separate video- og lydstrømmer og for lydkonvertering. OpenTubeX antar som standard at FFmpeg finnes via miljøvariabelen PATH. Du kan angi en egendefinert bane her ved behov.
  Distraction Free Settings:
    Shorten View Counts: Viser antall visninger og likerklikk på kommentarer i den forkortede formen YouTube allerede har avrundet til, for eksempel 14k i stedet for 14 000. Nøyaktige tall vises alltid i sin helhet.
  Subscription Settings:
    Fetch Feed on Startup: Når dette er slått på, henter OpenTubeX automatisk abonnementsstrømmen ved oppstart og når et nytt vindu åpnes.
    Show New Content Feed: Viser en Ny-fane med elementer i abonnementsstrømmen som ikke var med forrige gang den ble hentet.
    Show New Content Indicators: Viser en liten prikk ved siden av elementer i abonnementsstrømmen som ikke var med forrige gang den ble hentet.
    Show Scheduled Live Streams / Premieres First: Beholder kommende direktesendinger og premierer øverst i abonnementsstrømmen. Når dette er slått av, blir de stående der de ble kunngjort, til de starter. Oppdater abonnementsstrømmen én gang etter at dette er slått av, for å hente kunngjøringsdatoer for eksisterende planlagte elementer.
    Auto Refresh Interval: Hvor ofte OpenTubeX automatisk oppdaterer abonnementsstrømmen mens appen er åpen.
  Theme Settings:
    Show Progress as Notification: Viser et varig varsel med løpende fremdrift for bakgrunnsoperasjoner, for eksempel oppdatering av abonnementer og nedlasting av administrerte verktøy, i stedet for den globale fremdriftslinjen.
    Always Show Scrollbars: Holder rullefeltene synlige hele tiden. Når dette er slått av, tones de ut kort tid etter at du slutter å bevege musen, og vises igjen så snart du beveger den.
    Scroll Speed: Endrer hvor langt musehjul- og styreflatebevegelser ruller.
    Use Fixed Tab Width: Gir alle faner i det vannrette fanefeltet samme bredde i stedet for å tilpasse bredden etter tittelen.
    Use Grid Player Menu: Ordner innstillingsmenyen til videospilleren som et rutenett med fliser i stedet for en liste med rader.
