Tooltips:
  General Settings:
    Use AI Translation Completions: Udfyld huller i menneskelige oversættelser med AI-genereret tekst. Menneskelige oversættelser har altid forrang.
    Update Relative Timestamps: Opdaterer relative tidsangivelser i hele appen, mens en side er åben. Når funktionen er slået fra, opdateres de kun, når siden genindlæses eller besøges igen.
    Stream Extraction Method: |
      Vælg, hvordan OpenTubeX henter videostreams. yt-dlp skal være tilgængeligt, hvis det vælges.
      Det kan tage længere tid at starte videoer med yt-dlp.
      Den indbyggede metode understøtter ikke spoling i livestreams og premierer.
    Avoid translation: |
      Slå YouTubes automatiske oversættelse af videoens titel, beskrivelse og kapitler fra.
      For mange anmodninger, f.eks. hentning af videotitler på tværs af lister, kan midlertidigt
      påvirke appens stabilitet.
    Show Thumbnail Previews: Vis animerede forhåndsvisninger, når markøren holdes over videoers miniaturebilleder.
    Startup Behavior: |
      Vælg, hvad OpenTubeX skal gøre ved opstart.
      Indlæs alle faner gendanner straks alle gemte faner, men faner i baggrunden afspiller ikke videoer automatisk.
      Indlæs tidligere indlæste faner genindlæser de faner, der var indlæst, da OpenTubeX blev lukket, og lader de andre være frigjort.
      Indlæs den senest aktive fane gendanner den forrige session med de andre faner åbne, men frigjorte. De indlæses, når du klikker på dem.
      Start med en tom session springer de gemte faner over og åbner et nyt vindue.
    Remember Tab Navigation History: Hver fanes navigationshistorik frem og tilbage gemmes og gendannes, når OpenTubeX genstartes.
  Proxy Settings:
    IP Block Recovery Script Path: Stien til den scriptfil, der skal køres, når der registreres en IP-blokering. OpenTubeX venter på, at den bliver færdig, og genindlæser derefter videoen. Hvis reservekilden er slået til, køres scriptet kun, når den også mislykkes.
  Player Settings:
    Enable Caption Translations: Når funktionen er slået til, vælger undertekstknappen og genvejen C automatisk et oversat spor på det foretrukne undertekstsprog, hvis videoen ikke har et tilsvarende originalspor.
    Use Quick Playback Speed Bar: Viser en linje til hurtig valg af afspilningshastighed blandt afspillerknapperne til højre. Hvis manuel lagring af afspilningshastighed for hver kanal er slået til, indeholder linjen også en knap til at gemme hastigheden for den aktuelle kanal.
    Multiply Seek Interval by Playback Rate: Når funktionen er slået til, ganges spoleintervallerne for piletasterne og J/L med den aktuelle afspilningshastighed. Når funktionen er slået fra, er intervallerne de samme uanset afspilningshastigheden.
    Show Playback Rate Adjusted Timestamp: Når funktionen er slået til, og afspilningshastigheden ikke er 1×, viser afspilleren tidsangivelser justeret efter hastigheden i parentes efter den normale tidsangivelse.
    Use YouTube-style Shorts: Viser Shorts i et stående gitter på abonnements- og kanalsider og bruger afspilleren til Shorts i YouTube-stil.
    Loop Shorts: Når funktionen er slået til, starter Shorts automatisk forfra. Når den er slået fra, stopper Shorts ved slutningen og viser en knap til genafspilning.
    Show Skip Silence Toggle: Viser en til/fra-knap til at springe stilhed over i afspillerens indstillingsmenu.
    Enable Skip Silence by Default: Slår overspringning af stilhed til for nye faner. En ændring i én fane påvirker ikke andre faner.
    Enable Video Zoom: Viser zoomknappen i afspillerens indstillingsmenu og slår dens tastaturgenveje og panoreringsknapper til.
    Voice-over Translation: Sender videoens id, varighed og valgte sprog til Yandex' uofficielle tjeneste til voiceoveroversættelse, når du anmoder om en oversættelse. Funktionen er som standard slået fra.
    Hold to Double Playback Speed: Hold mellemrumstasten eller venstre museknap nede over afspilleren for midlertidigt at fordoble den aktuelle afspilningshastighed.
    Ambient Mode: Blander videoens farver ind i området omkring afspilleren.
    Default Volume: Deaktiveret, mens Husk lydstyrke er slået til. Slå Husk lydstyrke fra for at angive en fast startlydstyrke for hver video.
    Parallel Segment Loading: |
      Hvor mange video- og lydsegmenter der skal indlæses på én gang før afspilningen.
      Højere værdier kan hjælpe på langsomme eller ustabile forbindelser, men bruger mere båndbredde og hukommelse.
      De kan også få Auto til at undervurdere forbindelseshastigheden og vælge en lavere kvalitet.
      Streams, der er begrænset til én anmodning ad gangen, ignorerer denne indstilling.
  Download Settings:
    Download Folder: Videoer gemmes i denne mappe. Lad feltet stå tomt for at bruge systemets Downloads-mappe.
    Global Additional yt-dlp Arguments: Yderligere kommandolinjeargumenter, der sendes til yt-dlp ved hver download, f.eks. --cookies-from-browser firefox.
    Concurrent Downloads: Det højeste antal yt-dlp-job, der må køre samtidig.
    Bandwidth Limit: Begrænser køens samlede overførselshastighed ved at fordele grænsen mellem samtidige job. Angiv 0 for ingen grænse.
  External Software Settings:
    yt-dlp Source: OpenTubeX kan enten bruge den yt-dlp-version, der er installeret på dit system, eller downloade og administrere sin egen kopi, som gemmes i mappen med brugerdata.
    yt-dlp Channel: Vælg, hvilken udgivelseskanal for yt-dlp OpenTubeX skal downloade og administrere. Stable anbefales til de fleste brugere.
    FFmpeg Source: OpenTubeX kan enten bruge FFmpeg og FFprobe, der er installeret på dit system, eller downloade og administrere sine egne statiske builds, som gemmes i mappen med brugerdata.
    Managed Tool Updates: Vælg, om administrerede værktøjer skal opdateres automatisk, om der skal spørges først, eller om de kun skal opdateres via de manuelle knapper. Manglende værktøjer downloades stadig, når de er nødvendige.
    yt-dlp Executable Path: OpenTubeX antager som standard, at yt-dlp kan findes via miljøvariablen PATH. Du kan om nødvendigt angive en brugerdefineret sti her.
    Cookie Source: Vælg, om yt-dlp skal læse en Netscape-cookiefil eller cookies fra en installeret browser til godkendt afspilning.
    Cookie File: Vælg en cookiefil i Netscape-format til godkendt afspilning.
    Browser for Cookies: Browserunderstøttelse aflæses fra den valgte eksekverbare yt-dlp-fil. OpenTubeX beder yt-dlp om at læse denne browser, når der anmodes om godkendt afspilning.
    Browser Profile: Valgfrit browserprofilnavn eller mappe. Lad feltet stå tomt for at bruge den senest åbnede profil.
    Always Use Cookies: Brug de konfigurerede cookies, hver gang yt-dlp udtrækker streams. Dette ændrer ikke metoden til udtræk af streams til yt-dlp. Når yt-dlp er valgt, kan formater, der kræver en konto, blive tilgængelige, herunder YouTube Premiums forbedrede bithastighed, hvis kontoen har adgang.
    FFmpeg Executable Path: FFmpeg kræves for at flette separate video- og lydstreams og konvertere lyd. OpenTubeX antager som standard, at FFmpeg kan findes via miljøvariablen PATH. Du kan om nødvendigt angive en brugerdefineret sti her.
  Distraction Free Settings:
    Shorten View Counts: Viser antal visninger og likes på kommentarer i den forkortede form, som YouTube allerede har afrundet, f.eks. 14 t. i stedet for 14.000. Nøjagtige tal vises altid fuldt ud.
    Hide Videos on Watch: Skjuler sete videoer fra fanerne Videoer, Shorts og Live på abonnements- og kanalsiderne. Dette påvirker ikke fanen Start på kanalsider
  Subscription Settings:
    Fetch Feed on Startup: Når funktionen er slået til, henter OpenTubeX automatisk dit abonnementsfeed ved opstart, og når et nyt vindue åbnes.
    Show New Content Feed: Viser fanen Ny med elementer fra abonnementsfeedet, som ikke var til stede ved den forrige hentning.
    Show New Content Indicators: Viser en lille prik ud for elementer i abonnementsfeedet, som ikke var til stede ved den forrige hentning.
    Show Scheduled Live Streams / Premieres First: Beholder kommende livestreams og premierer øverst i abonnementsfeedet. Når funktionen er slået fra, bliver de på deres annoncerede placering, indtil de starter. Opdater abonnementsfeedet én gang efter deaktivering for at hente annonceringsdatoer for eksisterende planlagte elementer.
    Auto Refresh Interval: Hvor ofte OpenTubeX automatisk opdaterer dit abonnementsfeed, mens appen er åben.
  Theme Settings:
    Show Progress as Notification: Viser en vedvarende meddelelse med aktuel status for baggrundshandlinger, f.eks. opdatering af abonnementer og download af administrerede værktøjer, i stedet for den globale statuslinje.
    Always Show Scrollbars: Holder rullebjælkerne synlige hele tiden. Når funktionen er slået fra, toner de ud, kort efter at du holder op med at bevæge musen, og vises igen, så snart du bevæger den.
    Use Fixed Tab Width: Giver alle faner i den vandrette fanelinje samme bredde i stedet for at tilpasse dem efter titlen.
    Use Grid Player Menu: Arrangerer videoafspillerens indstillingsmenu som et gitter af felter i stedet for en liste med rækker.
