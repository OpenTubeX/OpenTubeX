Tooltips:
  General Settings:
    Use AI Translation Completions: Заповнює прогалини в перекладах, зроблених людьми, текстом від ШІ. Переклади, зроблені людьми, завжди мають перевагу.
    Update Relative Timestamps: Оновлює відносні часові позначки в усій програмі, доки сторінка відкрита. Якщо вимкнено, вони оновлюються лише після перезавантаження або повторного відкриття сторінки.
    Stream Extraction Method: |
      Виберіть, як OpenTubeX отримуватиме потоки відео. Якщо вибрано yt-dlp, він має бути доступний.
      З yt-dlp запуск відео може тривати довше.
      Вбудований спосіб не підтримує перемотування прямих трансляцій і прем'єр.
    Avoid translation: |
      Вимикає автоматичний переклад назви, опису та розділів відео на YouTube.
      Надмірна кількість запитів, наприклад отримання назв відео зі списків, може тимчасово
      погіршити надійність програми.
    Show Thumbnail Previews: Показує анімований попередній перегляд під час наведення на мініатюри відео.
    Startup Behavior: |
      Виберіть, що робитиме OpenTubeX після запуску.
      «Завантажити всі вкладки» негайно відновлює кожну збережену вкладку, але відео у фонових вкладках не відтворюються автоматично.
      «Завантажити раніше завантажені вкладки» повторно завантажує вкладки, які було завантажено під час закриття OpenTubeX, а решту залишає незавантаженими.
      «Завантажити останню активну вкладку» відновлює попередній сеанс, відкриває решту вкладок, але не завантажує їх; вони завантажаться після натискання.
      «Почати з порожнього сеансу» пропускає збережені вкладки й відкриває нове вікно.
    Remember Tab Navigation History: Історія переходів назад і вперед у кожній вкладці зберігається та відновлюється після перезапуску OpenTubeX.
  Proxy Settings:
    IP Block Recovery Script Path: Шлях до файлу сценарію, який запускається в разі блокування IP-адреси. OpenTubeX очікує на завершення сценарію, а потім перезавантажує відео. Якщо ввімкнено резервний спосіб, сценарій запускається лише тоді, коли цей спосіб також не спрацював.
  Player Settings:
    Continue Playback When Screen Is Locked: 'Продовжує відтворювати звук у фоновому режимі та надає елементи керування медіа Android. Вимкніть, щоб призупиняти відтворення, коли застосунок більше не видимий.'
    Enable Caption Translations: Якщо ввімкнено й відео не має відповідної оригінальної доріжки, кнопка субтитрів і клавіша C надають перевагу автоматично перекладеній доріжці вибраною мовою субтитрів.
    Use Quick Playback Speed Bar: Показує праворуч серед елементів керування програвачем панель швидкої зміни швидкості відтворення. Якщо ввімкнено ручне збереження швидкості відтворення для кожного каналу, на панелі також є кнопка збереження швидкості для поточного каналу.
    Multiply Seek Interval by Playback Rate: Якщо ввімкнено, інтервали перемотування (клавіші зі стрілками та J/L) множаться на поточну швидкість відтворення. Якщо вимкнено, інтервали не залежать від швидкості відтворення.
    Show Playback Rate Adjusted Timestamp: Якщо ввімкнено й швидкість відтворення відрізняється від 1x, програвач показує після звичайної часової позначки в дужках позначку, скориговану відповідно до швидкості.
    Use YouTube-style Shorts: Показує Shorts у вертикальній сітці на сторінках підписок і каналів та використовує програвач Shorts у стилі YouTube.
    Loop Shorts: Якщо ввімкнено, Shorts автоматично запускаються знову. Якщо вимкнено, Shorts зупиняються наприкінці й показують кнопку повторного відтворення.
    Show Skip Silence Toggle: Показує перемикач пропускання тиші в меню налаштувань програвача.
    Enable Skip Silence by Default: Вмикає пропускання тиші для нових вкладок. Зміна в одній вкладці не впливає на інші.
    Enable Video Zoom: Показує елемент керування масштабом у меню налаштувань програвача та вмикає відповідні клавіатурні скорочення й керування панорамуванням.
    Voice-over Translation: Під час запиту на переклад надсилає ідентифікатор і тривалість відео та вибрану мову до неофіційної служби закадрового перекладу Yandex. Типово вимкнено.
    Hold to Double Playback Speed: Утримуйте пробіл або ліву кнопку миші над програвачем, щоб тимчасово подвоїти поточну швидкість відтворення.
    Ambient Mode: Поширює кольори відео на область навколо програвача.
    Default Volume: Недоступно, доки ввімкнено «Запам'ятовувати гучність». Вимкніть «Запам'ятовувати гучність», щоб установити сталу початкову гучність для кожного відео.
    Parallel Segment Loading: |
      Кількість сегментів відео й аудіо, які завантажуються одночасно наперед.
      Вищі значення можуть допомогти за повільного або нестабільного з'єднання, але потребують більшої пропускної здатності та пам'яті.
      Через них режим «Авто» також може недооцінити швидкість з'єднання й вибрати нижчу якість.
      Це налаштування не діє на потоки, обмежені одним одночасним запитом.
    Preload Upcoming Videos: "Отримує та кешує адреси yt-dlp для наступних відео. Черга має пріоритет над списками й рекомендаціями."
    Upcoming Videos to Preload: "Найбільша кількість наступних відео, адреси yt-dlp яких отримуються у тлі."
  Download Settings:
    Download Folder: Відео зберігаються в цій папці. Залиште поле порожнім, щоб використовувати системну папку «Завантаження».
    Global Additional yt-dlp Arguments: Додаткові аргументи командного рядка, що передаються yt-dlp під час кожного завантаження, наприклад --cookies-from-browser firefox.
    Concurrent Downloads: Найбільша кількість завдань yt-dlp, які можуть виконуватися одночасно.
    Bandwidth Limit: Обмежує загальну швидкість передавання даних у черзі, розподіляючи це значення між одночасними завданнями. Введіть 0, щоб не обмежувати швидкість.
  External Software Settings:
    yt-dlp Source: OpenTubeX може використовувати yt-dlp, установлений у системі, або завантажувати й обслуговувати власну копію yt-dlp, що зберігається в каталозі даних користувача.
    yt-dlp Channel: Виберіть канал випусків yt-dlp, який OpenTubeX завантажуватиме й обслуговуватиме. Для більшості користувачів рекомендовано Stable.
    FFmpeg Source: OpenTubeX може використовувати FFmpeg і FFprobe, установлені в системі, або завантажувати й обслуговувати власні статичні збірки, що зберігаються в каталозі даних користувача.
    Managed Tool Updates: Виберіть, чи оновлювати керовані засоби автоматично, запитувати підтвердження перед оновленням або оновлювати їх лише вручну за допомогою кнопок. Відсутні засоби все одно завантажуються за потреби.
    yt-dlp Executable Path: Типово OpenTubeX шукатиме yt-dlp за допомогою змінної середовища PATH. За потреби тут можна вказати власний шлях.
    Cookie Source: Виберіть, чи має yt-dlp читати файл cookie Netscape або файли cookie зі встановленого браузера для автентифікованого відтворення.
    Cookie File: Виберіть файл cookie у форматі Netscape для автентифікованого відтворення.
    Browser for Cookies: Підтримувані браузери визначаються вибраним виконуваним файлом yt-dlp. Під час запиту на автентифіковане відтворення OpenTubeX доручає yt-dlp читати файли cookie із цього браузера.
    Browser Profile: Необов'язкова назва або папка профілю браузера. Залиште поле порожнім, щоб використовувати профіль, до якого востаннє зверталися.
    Always Use Cookies: Використовує налаштовані файли cookie щоразу, коли yt-dlp видобуває потоки. Це не перемикає спосіб видобування потоків на yt-dlp. Якщо вибрано yt-dlp, можуть стати доступними формати лише для облікових записів, зокрема підвищений бітрейт YouTube Premium, якщо обліковий запис має до нього доступ.
    FFmpeg Executable Path: FFmpeg потрібен для об'єднання окремих потоків відео й аудіо та перетворення аудіо. Типово OpenTubeX шукатиме FFmpeg за допомогою змінної середовища PATH. За потреби тут можна вказати власний шлях.
  Distraction Free Settings:
    Shorten View Counts: Показує кількість переглядів і вподобань коментарів у скороченому вигляді, якщо YouTube уже округлив її, наприклад 14 тис. замість 14 000. Точні значення завжди показуються повністю.
  Subscription Settings:
    Fetch Feed on Startup: Якщо ввімкнено, OpenTubeX автоматично отримує стрічку підписок під час запуску та відкриття нового вікна.
    Show New Content Feed: Показує вкладку «Нове» з елементами стрічки підписок, яких не було під час попереднього отримання.
    Show New Content Indicators: Показує маленьку крапку біля елементів стрічки підписок, яких не було під час попереднього отримання.
    Show Scheduled Live Streams / Premieres First: Зберігає заплановані прямі трансляції та прем'єри вгорі стрічки підписок. Якщо вимкнено, до початку вони залишаються на позиції, де їх було оголошено. Після вимкнення один раз оновіть стрічку підписок, щоб отримати дати оголошення для наявних запланованих елементів.
    Auto Refresh Interval: "Як часто OpenTubeX автоматично оновлює стрічку підписок, доки програма відкрита. На Android ненульовий інтервал також оновлює стрічку, коли застосунок закритий."
    Refresh Subscriptions While App Is Closed: "Дозволяє Android оновлювати стрічки підписок із вибраними інтервалами, коли OpenTubeX закрито. Вимкніть цей параметр, щоб автоматичне оновлення виконувалося лише у відкритому застосунку."
  Theme Settings:
    Show Progress as Notification: Замість загальної смуги поступу показує постійне сповіщення про поточний перебіг фонових операцій, як-от оновлення підписок і завантаження керованих засобів.
    Always Show Scrollbars: Завжди показує смуги прокручування. Якщо вимкнено, вони зникають невдовзі після припинення руху миші й знову з'являються, щойно ви її поворухнете.
    Scroll Speed: Змінює відстань прокручування жестами коліщатка миші та сенсорної панелі.
    Use Fixed Tab Width: Установлює однакову ширину всіх вкладок на горизонтальній панелі замість припасування до їхніх назв.
    Use Grid Player Menu: Розміщує меню налаштувань відеопрогравача у вигляді сітки плиток замість списку рядків.
