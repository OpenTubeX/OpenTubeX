Tooltips:
  General Settings:
    Use AI Translation Completions: Fylla í eyður í þýðingum fólks með texta sem gerður er með gervigreind. Þýðingar fólks ganga alltaf fyrir.
    Update Relative Timestamps: Uppfærir afstæð tímamerki í forritinu meðan síða er opin. Ef slökkt er á þessu uppfærast þau aðeins þegar síðan er endurhlaðin eða opnuð aftur.
    Stream Extraction Method: |
      Veldu hvernig OpenTubeX sækir myndbandsstreymi. yt-dlp þarf að vera tiltækt þegar sú aðferð er valin.
      Myndbönd geta verið lengur að hefja spilun þegar yt-dlp er notað.
      Innbyggða aðferðin styður ekki leit í beinum útsendingum og frumsýningum.
    Avoid translation: |
      Slekkur á sjálfvirkri þýðingu YouTube á titli, lýsingu og köflum myndbandsins.
      Of margar beiðnir, til dæmis þegar titlar myndbanda eru sóttir í mörgum listum, geta tímabundið
      dregið úr áreiðanleika forritsins.
    Show Thumbnail Previews: Sýna hreyfimyndaforskoðun þegar bendillinn er yfir smámynd myndbands.
    Startup Behavior: |
      Veldu hvað OpenTubeX gerir við ræsingu.
      Valkosturinn Hlaða inn öllum flipum endurheimtir alla vistaða flipa samstundis en myndbönd spilast ekki sjálfkrafa í bakgrunnsflipum.
      Valkosturinn Hlaða inn áður innhlöðnum flipum hleður aftur inn flipunum sem voru í minni þegar OpenTubeX var lokað en hleður hinum ekki inn.
      Valkosturinn Hlaða inn síðasta virka flipa endurheimtir fyrri setu með hina flipana opna en ekki í minni. Þeir hlaðast inn þegar smellt er á þá.
      Valkosturinn Hefja tóma setu sleppir vistuðum flipum og opnar nýjan glugga.
    Remember Tab Navigation History: Ferill fyrir aftur- og áframflakk hvers flipa er vistaður og endurheimtur þegar OpenTubeX er endurræst.
  Proxy Settings:
    IP Block Recovery Script Path: Slóð að skriftuskrá sem keyra skal þegar vart verður við að IP-tölu hafi verið lokað. OpenTubeX bíður eftir að keyrslu ljúki og endurhleður síðan myndbandinu. Ef varaleið er virk er skriftan aðeins keyrð þegar varaleiðin bregst einnig.
  Player Settings:
    Continue Playback When Screen Is Locked: 'Heldur hljóði í spilun í bakgrunni og birtir miðlunarstýringar Android. Slökktu á þessu til að gera hlé þegar forritið er ekki lengur sýnilegt.'
    Enable Caption Translations: Þegar þetta er virkt velja skjátextahnappurinn og flýtileiðin C sjálfkrafa þýddan texta á völdu tungumáli ef myndbandið býður ekki upp á samsvarandi frumtexta.
    Use Quick Playback Speed Bar: Sýnir stiku til að breyta spilunarhraða hratt hægra megin í stjórntækjum spilarans. Ef kveikt er á handvirkri vistun spilunarhraða fyrir hverja rás birtist þar einnig hnappur til að vista hraðann fyrir núverandi rás.
    Multiply Seek Interval by Playback Rate: Þegar þetta er virkt margfaldast leitarskrefin (örvatakkar og J/L) með núverandi spilunarhraða. Ef slökkt er á þessu haldast leitarskrefin óbreytt óháð spilunarhraða.
    Show Playback Rate Adjusted Timestamp: Þegar þetta er virkt og spilunarhraðinn er ekki 1x sýnir spilarinn tímamerki leiðrétt eftir spilunarhraða í sviga á eftir venjulega tímamerkinu.
    Use YouTube-style Shorts: Sýnir Shorts í reitaneti með lóðréttum smámyndum á áskriftar- og rásarsíðum og notar Shorts-spilara að hætti YouTube.
    Loop Shorts: Þegar þetta er virkt hefjast Shorts sjálfkrafa aftur. Ef slökkt er á þessu stöðvast þau í lokin og hnappur til að spila aftur birtist.
    Show Skip Silence Toggle: Sýnir rofa til að sleppa þögnum í stillingavalmynd spilarans.
    Enable Skip Silence by Default: Sleppir þögnum sjálfgefið í nýjum flipum. Breyting í einum flipa hefur ekki áhrif á aðra flipa.
    Enable Video Zoom: Sýnir aðdráttarstillingu í stillingavalmynd spilarans og virkjar flýtilykla og hliðrunarstjórnun fyrir hana.
    Voice-over Translation: Sendir auðkenni og lengd myndbandsins ásamt völdu tungumáli til óopinberrar talsetningarþjónustu Yandex þegar beðið er um þýðingu. Sjálfgefið er slökkt á þessu.
    Hold to Double Playback Speed: Haltu bilstönginni eða vinstri músarhnappi niðri yfir spilaranum til að tvöfalda núverandi spilunarhraða tímabundið.
    Ambient Mode: Blandar litum myndbandsins inn í svæðið umhverfis spilarann.
    Default Volume: Óvirkt meðan Muna hljóðstyrk er virkt. Slökktu á Muna hljóðstyrk til að velja fastan upphafshljóðstyrk fyrir hvert myndband.
    Parallel Segment Loading: |
      Hversu marga mynd- og hljóðhluta á að hlaða samtímis á undan spilun.
      Hærri gildi geta hjálpað á hægum eða óstöðugum tengingum en nota meiri bandbreidd og minni.
      Þau geta einnig valdið því að Sjálfvirkt vanmeti tengingarhraðann og velji minni gæði.
      Streymi sem er takmarkað við eina beiðni í einu hunsar þessa stillingu.
    Preload Upcoming Videos: "Sækir og vistar yt-dlp-slóðir næstu myndskeiða. Biðröðin hefur forgang fram yfir spilunarlista og tillögur."
    Upcoming Videos to Preload: "Hámarksfjöldi næstu myndskeiða sem yt-dlp-slóðir eru sóttar fyrir í bakgrunni."
  Download Settings:
    Download Folder: Myndbönd vistast í þessa möppu. Skildu reitinn eftir auðan til að nota niðurhalsmöppu kerfisins.
    Global Additional yt-dlp Arguments: Viðbótarviðföng skipanalínu sem eru send til yt-dlp við hvert niðurhal, til dæmis --cookies-from-browser firefox.
    Concurrent Downloads: Hámarksfjöldi yt-dlp-verka sem mega keyra samtímis.
    Bandwidth Limit: Takmarkar samanlagðan flutningshraða biðraðarinnar með því að skipta þessum mörkum milli verka sem keyra samtímis. Sláðu inn 0 fyrir engin mörk.
  External Software Settings:
    yt-dlp Source: OpenTubeX getur annaðhvort notað yt-dlp sem er uppsett á kerfinu eða sótt eigið eintak af yt-dlp, haldið því við og geymt það í notandagagnamöppunni.
    yt-dlp Channel: Veldu hvaða útgáfurás yt-dlp OpenTubeX notar við niðurhal og viðhald. Stöðug útgáfa hentar flestum notendum.
    FFmpeg Source: OpenTubeX getur annaðhvort notað FFmpeg og FFprobe sem eru uppsett á kerfinu eða sótt eigin kyrrstæðar útgáfur, haldið þeim við og geymt þær í notandagagnamöppunni.
    Managed Tool Updates: Veldu hvort tól sem forritið sér um eigi að uppfærast sjálfkrafa, biðja um staðfestingu fyrir uppfærslu eða aðeins uppfærast með handvirku hnöppunum. Tól sem vantar eru samt sótt þegar þeirra er þörf.
    yt-dlp Executable Path: Sjálfgefið gerir OpenTubeX ráð fyrir að yt-dlp finnist með PATH-umhverfisbreytunni. Hér má velja sérsniðna slóð ef þess þarf.
    Cookie Source: Veldu hvort yt-dlp eigi að lesa Netscape-vefkökur úr skrá eða vefkökur úr uppsettum vafra til auðkenndrar spilunar.
    Cookie File: Veldu vefkökuskrá á Netscape-sniði fyrir auðkennda spilun.
    Browser for Cookies: Valda yt-dlp-keyrsluskráin ræður hvaða vafrar eru studdir. OpenTubeX biður yt-dlp um að lesa vefkökur úr þessum vafra þegar beðið er um auðkennda spilun.
    Browser Profile: Valfrjálst heiti eða mappa vafrasniðs. Skildu reitinn eftir auðan til að nota síðast opnaða sniðið.
    Always Use Cookies: Notar stilltar vefkökur í hvert sinn sem yt-dlp dregur út streymi. Þetta breytir ekki aðferðinni við að draga út streymi í yt-dlp. Þegar yt-dlp er valið kunna snið sem krefjast reiknings að verða tiltæk, þar á meðal aukinn bitahraði YouTube Premium ef reikningurinn hefur aðgang að honum.
    FFmpeg Executable Path: FFmpeg er nauðsynlegt til að sameina aðskilið mynd- og hljóðstreymi og til að umbreyta hljóði. Sjálfgefið gerir OpenTubeX ráð fyrir að FFmpeg finnist með PATH-umhverfisbreytunni. Hér má velja sérsniðna slóð ef þess þarf.
  Distraction Free Settings:
    Shorten View Counts: Sýnir fjölda áhorfa og fjölda þeirra sem líka við athugasemdir á styttu formi ef YouTube hefur þegar námundað tölurnar, t.d. 14 þ. í stað 14.000. Nákvæmur fjöldi er alltaf sýndur fullskrifaður.
  Subscription Settings:
    Fetch Feed on Startup: Þegar þetta er virkt sækir OpenTubeX áskriftarstreymið sjálfkrafa við ræsingu og þegar nýr gluggi er opnaður.
    Show New Content Feed: Sýnir flipann Nýtt með færslum í áskriftarstreymi sem voru ekki til staðar þegar það var síðast sótt.
    Show New Content Indicators: Sýnir lítinn punkt við færslur í áskriftarstreymi sem voru ekki til staðar þegar það var síðast sótt.
    Show Scheduled Live Streams / Premieres First: Heldur væntanlegum beinum útsendingum og frumsýningum efst í áskriftarstreymi. Ef slökkt er á þessu haldast þær á upprunalegum stað í röðinni þar til þær hefjast. Endurnýjaðu áskriftarstreymið einu sinni eftir að slökkt er á þessu til að sækja tilkynningardagsetningar fyrir fyrirliggjandi tímasettar færslur.
    Auto Refresh Interval: "Hversu oft OpenTubeX endurnýjar áskriftarstreymið sjálfkrafa meðan forritið er opið. Í Android endurnýjar bil sem er ekki núll einnig veituna þegar appið er lokað."
    Refresh Subscriptions While App Is Closed: "Leyfir Android að uppfæra áskriftarstreymi með völdu millibili þegar OpenTubeX er lokað. Slökktu á þessu til að sjálfvirkar uppfærslur fari aðeins fram þegar forritið er opið."
  Theme Settings:
    Show Progress as Notification: Sýnir tilkynningu með framvindu bakgrunnsaðgerða í rauntíma sem hverfur ekki, svo sem við endurnýjun áskriftarstreymis og niðurhal tóla sem forritið sér um, í stað almennu framvindustikunnar.
    Always Show Scrollbars: Heldur skrunstikum alltaf sýnilegum. Ef slökkt er á þessu dofna þær stuttu eftir að músin hættir að hreyfast og birtast aftur um leið og hún er hreyfð.
    Scroll Speed: Breytir hversu langt er skrunað með músarhjóli og snertifleti.
    Use Fixed Tab Width: Gefur öllum flipum á láréttu flipastikunni sömu breidd í stað þess að laga breidd þeirra að titlinum.
    Use Grid Player Menu: Raðar stillingavalmynd myndbandsspilarans í reitanet í stað raðalista.
