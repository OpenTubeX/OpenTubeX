Tooltips:
  General Settings:
    Use AI Translation Completions: 人手による翻訳の不足部分をAI生成テキストで補います。人手による翻訳が常に優先されます。
    Update Relative Timestamps: ページを開いている間、アプリ内の相対日時を更新します。無効にすると、ページを再読み込みするか開き直したときにのみ更新されます。
    Stream Extraction Method: |
      OpenTubeXが動画ストリームを取得する方法を選択します。yt-dlpを選択するには、yt-dlpが利用可能である必要があります。
      yt-dlpを使用すると、動画の再生開始に時間がかかる場合があります。
      内蔵方式では、ライブ配信とプレミア公開のシークに対応していません。
    Avoid translation: |
      YouTubeによる動画のタイトル、説明、チャプターの自動翻訳を無効にします。
      一覧にある動画のタイトルをまとめて取得するなど、要求が多すぎると、
      アプリが一時的に不安定になる場合があります。
    Show Thumbnail Previews: 動画のサムネイルにポインターを合わせたときにアニメーションプレビューを表示します。
    Startup Behavior: |
      OpenTubeXの起動時の動作を選択します。
      「すべてのタブを読み込む」は保存済みのタブをすぐにすべて復元しますが、バックグラウンドのタブでは動画を自動再生しません。
      「前回読み込まれていたタブを読み込む」は、OpenTubeXの終了時に読み込まれていたタブを再読み込みし、それ以外は解放したままにします。
      「最後に使用したタブを読み込む」は、ほかのタブを開いた状態でメモリから解放して前回のセッションを復元します。クリックすると読み込まれます。
      「空のセッションで開始」は保存済みのタブを復元せず、新しいウィンドウを開きます。
    Remember Tab Navigation History: 各タブの「戻る」と「進む」の履歴を保存し、OpenTubeXの再起動時に復元します。
  Proxy Settings:
    IP Block Recovery Script Path: IPブロックを検出したときに実行するスクリプトファイルのパスです。OpenTubeXは処理の完了を待ってから動画を再読み込みします。フォールバックが有効な場合は、フォールバックにも失敗したときだけ実行します。
  Player Settings:
    Continue Playback When Screen Is Locked: 'バックグラウンドで音声の再生を続け、Android のメディアコントロールを提供します。アプリが表示されなくなったときに一時停止するには無効にしてください。'
    Enable Caption Translations: 有効にすると、指定した字幕言語の原文トラックが動画にない場合、字幕ボタンとCキーのショートカットで自動翻訳トラックを優先します。
    Use Quick Playback Speed Bar: プレーヤー右側の操作欄にクイック再生速度バーを表示します。チャンネルごとの再生速度を手動保存する設定が有効な場合は、現在のチャンネルに速度を保存するボタンも表示されます。
    Multiply Seek Interval by Playback Rate: 有効にすると、シーク間隔（矢印キーとJ/Lキー）に現在の再生速度を掛けます。無効にすると、再生速度に関係なくシーク間隔は一定です。
    Show Playback Rate Adjusted Timestamp: 有効で再生速度が1倍以外の場合、通常の時刻表示の後に、再生速度を反映した時刻を括弧内に表示します。
    Use YouTube-style Shorts: 登録チャンネルとチャンネルのページでショート動画を縦長のグリッドに表示し、YouTube形式のショート動画プレーヤーを使用します。
    Loop Shorts: 有効にするとショート動画を自動的に最初から再生します。無効にすると最後で停止し、再生ボタンを表示します。
    Show Skip Silence Toggle: プレーヤーの設定メニューに、無音スキップのオンとオフを切り替える項目を表示します。
    Enable Skip Silence by Default: 新しいタブで無音スキップを有効にします。あるタブで変更しても、ほかのタブには影響しません。
    Enable Video Zoom: プレーヤーの設定メニューにズーム操作を表示し、キーボードショートカットとパン操作を有効にします。
    Voice-over Translation: 翻訳を要求すると、動画ID、長さ、選択した言語を非公式のYandex吹き替え翻訳サービスへ送信します。既定では無効です。
    Hold to Double Playback Speed: プレーヤー上でスペースキーまたはマウスの左ボタンを長押しすると、一時的に現在の2倍の速度で再生します。
    Ambient Mode: 動画の色をプレーヤー周辺の領域になじませます。
    Default Volume: 「音量を記憶」が有効な間は使用できません。動画ごとに起動時の音量を固定するには、「音量を記憶」をオフにしてください。
    Parallel Segment Loading: |
      再生に先立って同時に読み込む動画と音声のセグメント数です。
      値を大きくすると、低速または不安定な接続では改善する場合がありますが、帯域幅とメモリの使用量が増えます。
      また、「自動」が接続速度を実際より低く見積もり、低い品質を選ぶ場合があります。
      一度に1件の要求しか行えないストリームでは、この設定は無視されます。
    Preload Upcoming Videos: "次に再生可能な動画の yt-dlp URL を取得してキャッシュします。キューは再生リストやおすすめより優先されます。"
    Upcoming Videos to Preload: "バックグラウンドで yt-dlp URL を取得する次の動画の最大数です。"
    Concurrent Preloads: "動画の先読みに同時使用する yt-dlp プロセスの最大数です。値を大きくすると、CPU、メモリ、ネットワーク帯域をより多く使用します。"
  Download Settings:
    Download Folder: 動画をこのフォルダーに保存します。空欄にすると、システムのダウンロードフォルダーを使用します。
    Global Additional yt-dlp Arguments: 'すべてのダウンロードでyt-dlpに渡す追加のコマンドライン引数です。例: --cookies-from-browser firefox'
    Concurrent Downloads: 同時に実行できるyt-dlpジョブの最大数です。
    Bandwidth Limit: この上限を同時実行中のジョブで分け、キュー全体の転送速度を制限します。無制限にするには0を入力してください。
  External Software Settings:
    yt-dlp Source: システムにインストールされているyt-dlpを使用するか、OpenTubeXが独自にダウンロードして管理するyt-dlpを使用します。管理対象のコピーはユーザーデータディレクトリに保存されます。
    yt-dlp Channel: OpenTubeXがダウンロードして管理するyt-dlpのリリースチャンネルを選択します。ほとんどの場合はStableを推奨します。
    FFmpeg Source: システムにインストールされているFFmpegとFFprobeを使用するか、OpenTubeXが静的ビルドをダウンロードして管理します。管理対象のビルドはユーザーデータディレクトリに保存されます。
    Managed Tool Updates: 管理対象ツールを自動更新するか、更新前に確認するか、手動ボタンからのみ更新するかを選択します。不足しているツールは必要になったときにダウンロードされます。
    yt-dlp Executable Path: 既定では、PATH環境変数からyt-dlpが見つかるものとみなします。必要に応じて、ここでカスタムパスを指定できます。
    Cookie Source: 認証が必要な再生で、yt-dlpがNetscape形式のCookieファイルとインストール済みブラウザーのCookieのどちらを読み取るか選択します。
    Cookie File: 認証が必要な再生に使用するNetscape形式のCookieファイルを選択します。
    Browser for Cookies: 選択したyt-dlp実行ファイルからブラウザーの対応状況を取得します。認証が必要な再生を要求すると、OpenTubeXはyt-dlpにこのブラウザーのCookieを読み取るよう指示します。
    Browser Profile: ブラウザーのプロフィール名またはフォルダーを必要に応じて指定します。空欄にすると、最近使用したプロフィールを使います。
    Always Use Cookies: yt-dlpがストリームを抽出するたびに、設定したCookieを使用します。ストリーム抽出方式がyt-dlpに切り替わるわけではありません。yt-dlpを選択している場合は、アカウントに権限があればYouTube Premiumの高ビットレートなど、アカウント限定の形式を利用できる場合があります。
    FFmpeg Executable Path: FFmpegは、分離された動画と音声ストリームの結合や音声変換に必要です。既定では、PATH環境変数からFFmpegが見つかるものとみなします。必要に応じて、ここでカスタムパスを指定できます。
  Distraction Free Settings:
    Shorten View Counts: YouTubeですでに丸められた視聴回数とコメントの高評価数を、14,000ではなく14Kのように省略表示します。正確な数値は常に省略せず表示します。
  Subscription Settings:
    Fetch Feed on Startup: 有効にすると、OpenTubeXの起動時と新しいウィンドウを開いたときに登録チャンネルのフィードを自動取得します。
    Show New Content Feed: 前回の取得時にはなかった登録チャンネルのフィード項目を「新着」タブに表示します。
    Show New Content Indicators: 前回の取得時にはなかった登録チャンネルのフィード項目の横に小さな点を表示します。
    Show Scheduled Live Streams / Premieres First: 予定されているライブ配信とプレミア公開を登録チャンネルのフィード上部に表示します。無効にすると、開始するまで告知時の位置に表示されます。無効にした後、一度フィードを更新すると、既存の予定項目の告知日を取得できます。
    Auto Refresh Interval: "アプリの起動中にOpenTubeXが登録チャンネルのフィードを自動更新する間隔です。 Android では、0 以外の間隔を選ぶと、アプリを閉じている間もフィードが更新されます。"
    Refresh Subscriptions While App Is Closed: "OpenTubeX を閉じている間も、Android が選択した間隔で登録チャンネルのフィードを更新できるようにします。アプリを開いている間だけ自動更新する場合は、この設定をオフにしてください。"
  Theme Settings:
    Show Progress as Notification: 登録チャンネルの更新や管理対象ツールのダウンロードなど、バックグラウンド処理の進行状況を共通の進行状況バーではなく、常に表示される通知で示します。
    Always Show Scrollbars: スクロールバーを常に表示します。無効にすると、マウスを止めてから少し後に消え、再び動かすとすぐに表示されます。
    Scroll Speed: マウスホイールとタッチパッドのホイール操作によるスクロール距離を変更します。
    Use Fixed Tab Width: 横型タブバーの各タブを、タイトルに合わせた幅ではなく同じ幅にします。
    Use Grid Player Menu: 動画プレーヤーの設定メニューを行の一覧ではなく、タイル状のグリッドに配置します。
