Tooltips:
  General Settings:
    Use AI Translation Completions: İnsan çevirilerindeki eksikleri yapay zekâ tarafından oluşturulan metinlerle tamamlar. İnsan çevirileri her zaman önceliklidir.
    Update Relative Timestamps: Sayfa açık kaldığı sürece uygulamadaki göreli zaman damgalarını günceller. Devre dışı bırakıldığında yalnızca sayfa yeniden yüklendiğinde veya ziyaret edildiğinde güncellenir.
    Stream Extraction Method: |
      OpenTubeX'in video akışlarını nasıl alacağını seçin. yt-dlp seçildiğinde kullanılabilir olmalıdır.
      yt-dlp kullanıldığında videoların başlaması daha uzun sürebilir.
      Yerleşik yöntem, canlı yayınlarda ve ilk gösterimlerde sarmayı desteklemez.
    Avoid translation: |
      YouTube'un video başlığı, açıklaması ve bölümleri için otomatik çevirisini devre dışı bırakır.
      Listelerdeki video başlıklarını getirmek gibi çok fazla istek, uygulamanın
      güvenilirliğini geçici olarak etkileyebilir.
    Show Thumbnail Previews: Video küçük resimlerinin üzerine gelindiğinde hareketli önizlemeler gösterir.
    Startup Behavior: |
      OpenTubeX'in başlatıldığında ne yapacağını seçin.
      Tüm sekmeleri yükle, kayıtlı tüm sekmeleri hemen geri yükler ancak arka plan sekmeleri videoları otomatik oynatmaz.
      Daha önce yüklenen sekmeleri yükle, OpenTubeX kapatıldığında yüklü olan sekmeleri yeniden yükler ve diğerlerini bellekten kaldırılmış durumda tutar.
      Son etkin sekmeyi yükle, önceki oturumu diğer sekmeler açık ama bellekten kaldırılmış hâlde geri yükler. Tıkladığınızda yüklenirler.
      Boş bir oturumla başla, kayıtlı sekmeleri atlayıp yeni bir pencere açar.
    Remember Tab Navigation History: Her sekmenin geri ve ileri gezinme geçmişi kaydedilir ve OpenTubeX yeniden başlatıldığında geri yüklenir.
  Proxy Settings:
    IP Block Recovery Script Path: IP engeli algılandığında çalıştırılacak betik dosyasının yolu. OpenTubeX betiğin tamamlanmasını bekler ve videoyu yeniden yükler. Yedek arka uç etkinse yalnızca yedek arka uç da başarısız olduğunda çalışır.
  Player Settings:
    Continue Playback When Screen Is Locked: 'Sesi arka planda çalmaya devam eder ve Android medya kontrolleri sağlar. Uygulama artık görünür olmadığında duraklatmak için bunu kapatın.'
    Enable Caption Translations: Etkinleştirildiğinde ve videoda eşleşen özgün bir parça olmadığında alt yazı düğmesi ile C kısayolu, tercih edilen alt yazı diline otomatik çevrilmiş parçayı seçer.
    Use Quick Playback Speed Bar: Sağdaki oynatıcı denetimlerinde hızlı oynatma hızı çubuğunu gösterir. Kanal başına oynatma hızını elle kaydetme etkinse çubukta geçerli kanalın hızını kaydetme düğmesi de bulunur.
    Multiply Seek Interval by Playback Rate: Etkinleştirildiğinde sarma aralıkları (ok tuşları ve J/L) geçerli oynatma hızıyla çarpılır. Devre dışı bırakıldığında sarma aralıkları oynatma hızından bağımsız olarak sabit kalır.
    Show Playback Rate Adjusted Timestamp: Etkinleştirildiğinde ve oynatma hızı 1x'ten farklı olduğunda oynatıcı, normal zaman damgasından sonra parantez içinde oynatma hızına göre ayarlanmış zaman damgalarını gösterir.
    Use YouTube-style Shorts: Kısa Videoları abonelik ve kanal sayfalarında dikey bir ızgarada gösterir ve YouTube tarzı Kısa Video oynatıcısını kullanır.
    Loop Shorts: Etkinleştirildiğinde Kısa Videolar otomatik olarak yeniden başlar. Devre dışı bırakıldığında sonunda durur ve yeniden oynatma düğmesi gösterir.
    Show Skip Silence Toggle: Oynatıcının ayarlar menüsünde sessizliği atmak için açma ve kapatma düğmesi gösterir.
    Enable Skip Silence by Default: Yeni sekmelerde sessizliği atlamayı etkinleştirir. Bir sekmede değiştirilmesi diğer sekmeleri etkilemez.
    Enable Video Zoom: Oynatıcının ayarlar menüsünde Yakınlaştırma denetimini gösterir; klavye kısayollarını ve kaydırma denetimlerini etkinleştirir.
    Voice-over Translation: Çeviri istediğinizde video kimliğini, süresini ve seçili dili resmî olmayan Yandex seslendirme çevirisi hizmetine gönderir. Varsayılan olarak devre dışıdır.
    Hold to Double Playback Speed: Geçerli oynatma hızını geçici olarak ikiye katlamak için oynatıcının üzerindeyken Boşluk tuşunu veya sol fare düğmesini basılı tutun.
    Ambient Mode: Videonun renklerini oynatıcının çevresindeki alana yayar.
    Default Volume: Ses Düzeyini Hatırla etkinken devre dışıdır. Her video için sabit bir başlangıç ses düzeyi ayarlamak üzere Ses Düzeyini Hatırla'yı kapatın.
    Parallel Segment Loading: |
      Oynatmadan önce aynı anda kaç video ve ses bölümünün yükleneceğini belirler.
      Yüksek değerler yavaş veya kararsız bağlantılarda yardımcı olabilir ancak daha fazla bant genişliği ve bellek kullanır.
      Otomatik seçeneğinin bağlantı hızını düşük hesaplayıp daha düşük kalite seçmesine de neden olabilir.
      Aynı anda tek istekle sınırlı akışlar bu ayarı yok sayar.
    Preload Upcoming Videos: "Sonraki videoların yt-dlp adreslerini alıp önbelleğe kaydeder. Kuyruk, oynatma listeleri ve önerilerden önce gelir."
    Upcoming Videos to Preload: "yt-dlp adresleri arka planda alınacak sonraki videoların azami sayısı."
    Concurrent Preloads: "Videoları aynı anda önceden yüklemek için kullanılan en fazla yt-dlp işlemi sayısı. Daha yüksek değerler daha fazla CPU, bellek ve ağ bant genişliği kullanır."
  Download Settings:
    Download Folder: Videolar bu klasöre kaydedilir. Sisteminizin İndirilenler klasörünü kullanmak için boş bırakın.
    Global Additional yt-dlp Arguments: Her indirmede yt-dlp'ye iletilen ek komut satırı argümanları, örneğin --cookies-from-browser firefox.
    Concurrent Downloads: Aynı anda çalışabilecek en fazla yt-dlp işi sayısı.
    Bandwidth Limit: Bu sınırı eş zamanlı işler arasında bölerek kuyruğun toplam aktarım hızını sınırlar. Sınır koymamak için 0 girin.
  External Software Settings:
    yt-dlp Source: OpenTubeX sisteminizde yüklü yt-dlp'yi kullanabilir veya kullanıcı verileri dizininde saklanan kendi yt-dlp kopyasını indirip yönetebilir.
    yt-dlp Channel: OpenTubeX'in indirip yöneteceği yt-dlp yayın kanalını seçin. Çoğu kullanıcı için Kararlı önerilir.
    FFmpeg Source: OpenTubeX sisteminizde yüklü FFmpeg ve FFprobe'u kullanabilir veya kullanıcı verileri dizininde saklanan kendi statik derlemelerini indirip yönetebilir.
    Managed Tool Updates: Yönetilen araçların otomatik güncellenmesini, güncellemeden önce sormasını veya yalnızca elle kullanılan düğmelerle güncellenmesini seçin. Eksik araçlar gerektiğinde yine indirilir.
    yt-dlp Executable Path: OpenTubeX varsayılan olarak yt-dlp'nin PATH ortam değişkeni üzerinden bulunabildiğini varsayar. Gerekirse buradan özel bir yol ayarlayabilirsiniz.
    Cookie Source: Kimlik doğrulamalı oynatma için yt-dlp'nin Netscape çerez dosyasını mı yoksa yüklü bir tarayıcının çerezlerini mi okuyacağını seçin.
    Cookie File: Kimlik doğrulamalı oynatma için Netscape biçiminde bir çerez dosyası seçin.
    Browser for Cookies: Tarayıcı desteği seçili yt-dlp yürütülebilir dosyasından okunur. Kimlik doğrulamalı oynatma istendiğinde OpenTubeX, yt-dlp'den bu tarayıcıyı okumasını ister.
    Browser Profile: İsteğe bağlı tarayıcı profili adı veya klasörü. Son erişilen profili kullanmak için boş bırakın.
    Always Use Cookies: yt-dlp akışları her çıkardığında yapılandırılmış çerezleri kullanır. Bu, akış çıkarma yöntemini yt-dlp olarak değiştirmez. yt-dlp seçiliyken ve hesabın erişimi varsa YouTube Premium'un gelişmiş bit hızı dâhil yalnızca hesaba özel biçimler kullanılabilir hâle gelebilir.
    FFmpeg Executable Path: Ayrı video ve ses akışlarını birleştirmek ve ses dönüştürmek için FFmpeg gereklidir. OpenTubeX varsayılan olarak FFmpeg'in PATH ortam değişkeni üzerinden bulunabildiğini varsayar. Gerekirse buradan özel bir yol ayarlayabilirsiniz.
  Distraction Free Settings:
    Shorten View Counts: YouTube'un zaten yuvarlayarak kısalttığı izlenme ve yorum beğeni sayılarını gösterir, örneğin 14.000 yerine 14 B. Kesin sayılar her zaman tam gösterilir.
  Subscription Settings:
    Fetch Feed on Startup: Etkinleştirildiğinde OpenTubeX, başlangıçta ve yeni pencere açıldığında abonelik akışınızı otomatik olarak getirir.
    Show New Content Feed: Önceki getirme sırasında bulunmayan abonelik akışı öğelerini içeren Yeni sekmesini gösterir.
    Show New Content Indicators: Önceki getirme sırasında bulunmayan abonelik akışı öğelerinin yanında küçük bir nokta gösterir.
    Show Scheduled Live Streams / Premieres First: Yaklaşan canlı yayınları ve ilk gösterimleri abonelik akışının en üstünde tutar. Devre dışı bırakıldığında başlayana kadar duyuruldukları konumda kalırlar. Mevcut planlanmış kayıtların duyuru tarihlerini almak için devre dışı bıraktıktan sonra abonelik akışını bir kez yenileyin.
    Auto Refresh Interval: "Uygulama açıkken OpenTubeX'in abonelik akışınızı ne sıklıkla otomatik yenileyeceğini belirler. Android’de sıfırdan farklı bir aralık, uygulama kapalıyken de akışı yeniler."
    Refresh Subscriptions While App Is Closed: "OpenTubeX kapalıyken Android'in abonelik akışlarını seçilen aralıklarda yenilemesine izin verir. Otomatik yenilemeyi yalnızca uygulama açıkken çalışacak şekilde sınırlamak için bu seçeneği kapatın."
  Theme Settings:
    Show Progress as Notification: Abonelik yenilemeleri ve yönetilen araç indirmeleri gibi arka plan işlemlerinin anlık ilerlemesini genel ilerleme çubuğu yerine kalıcı bir bildirimde gösterir.
    Always Show Scrollbars: Kaydırma çubuklarını her zaman görünür tutar. Devre dışı bırakıldığında fareyi hareket ettirmeyi bıraktıktan kısa süre sonra kaybolur ve yeniden hareket ettirdiğinizde görünür.
    Scroll Speed: Fare tekerleği ve dokunmatik yüzey kaydırma hareketlerinin ne kadar uzağa kaydıracağını değiştirir.
    Use Fixed Tab Width: Yatay sekme çubuğundaki her sekmeye başlığına göre boyut vermek yerine aynı genişliği verir.
    Use Grid Player Menu: Video oynatıcısının ayarlar menüsünü satır listesi yerine döşeme ızgarası olarak düzenler.
