      Otomatik, çoğu videoyu YouTube'un visionOS istemcisiyle oynatır; bu istemci daha hızlı başlar ve otomatik kaliteyi destekler. Canlı yayınlar ve oynatamadığı videolar SABR kullanır.
      Yalnızca SABR her zaman YouTube'un web istemcisini kullanır; bu istemci daha yavaş başlar ve otomatik kalite sunmaz.
    Title Lines: "Listelerde ve ızgaralarda video ve oynatma listesi başlıklarını üç nokta ile seçilen satır sayısına kısaltır, böylece kartlar daha düzenli görünür. Başlığın tamamını görmek için imleci üzerine getirin."
    Close Window With Last Tab: 'Kapalıyken son sekmeyi kapatmak bunun yerine yeni bir sekme açar; böylece pencere siz kapatana kadar açık kalır.'
    Preferred Video Codec: |
      Otomatik mod, cihazınızın donanımla çözebildiği kodekleri tercih eder.
      AV1: en az veriyle en iyi kalite, ancak her videoda bulunmaz. Donanım çözme olmadan pili tüketebilir veya kare atlayabilir.
      VP9: verimlilik ile uyumluluk arasında bir denge, genellikle en yüksek çözünürlüğe kadar kullanılabilir.
      H.264: neredeyse her cihazda çözmesi en kolay olan, ancak daha fazla veri kullanır ve genellikle 1080p ile sınırlıdır.
      Değişiklikler sonraki videodan itibaren geçerli olur. Tercih edilen kodek kullanılamıyorsa başka biri kullanılır.
    Always Use Backup Media Server: "Videoları atanan sunucu yerine YouTube'un belirttiği yedek sunucudan oynatır; örneğin internet sağlayıcınızın önbelleği sık sık yavaş olduğunda. Aksi halde OpenTubeX yalnızca atanan sunucu yanıt vermediğinde geçiş yapar."
    Automatically switch stream extraction methods: "Yerleşik oynatma başarısız olursa yt-dlp’yi, yt-dlp başarısız olursa yerleşik oynatmayı dene."
    Enable Tabs: "Geçerli sayfa açık kalır. Diğer sekmeler uygulama yeniden başlatılana kadar saklanır; onları geri yüklemek için sekmeleri yeniden etkinleştirin."
    Data Saver Thumbnails: "Veri kullanımını azaltmak için daha düşük çözünürlüklü küçük resimler kullanın."
    Use AI Translation Completions: İnsan çevirilerindeki eksikleri yapay zekâ tarafından oluşturulan metinlerle tamamlar. İnsan çevirileri her zaman önceliklidir.
    Update Relative Timestamps: Sayfa açık kaldığı sürece uygulamadaki göreli zaman damgalarını günceller. Devre dışı bırakıldığında yalnızca sayfa yeniden yüklendiğinde veya ziyaret edildiğinde güncellenir.
    Stream Extraction Method: |
      OpenTubeX'in video akışlarını nasıl alacağını seçin. yt-dlp seçildiğinde kullanılabilir olmalıdır.
      yt-dlp kullanıldığında videoların başlaması daha uzun sürebilir.
    Avoid translation: |
      YouTube'un video başlığı, açıklaması ve bölümleri için otomatik çevirisini devre dışı bırakır.
      "Tüm Uygulama", kanal adlarını ve açıklamalarını da orijinal dillerinde gösterir.
      Listelerdeki video başlıklarını getirmek gibi çok fazla istek, uygulamanın
      güvenilirliğini geçici olarak etkileyebilir.
    Show Thumbnail Previews: Video küçük resimlerinin üzerine gelindiğinde hareketli önizlemeler gösterir.
    Startup Behavior: |
      OpenTubeX'in başlatıldığında ne yapacağını seçin.
      Tüm sekmeleri yükle, kayıtlı tüm sekmeleri hemen geri yükler ancak arka plan sekmeleri videoları otomatik oynatmaz.
      Daha önce yüklenen sekmeleri yükle, OpenTubeX kapatıldığında yüklü olan sekmeleri yeniden yükler ve diğerlerini bellekten kaldırılmış durumda tutar.
      Son etkin sekmeyi yükle, önceki oturumu diğer sekmeler açık ama bellekten kaldırılmış hâlde geri yükler. Tıkladığınızda yüklenirler.
      Boş bir oturumla başla, kayıtlı sekmeleri atlayıp yeni bir pencere açar.
    Remember Tab Navigation History: Her sekmenin geri ve ileri gezinme geçmişi kaydedilir ve OpenTubeX yeniden başlatıldığında geri yüklenir.
    Yattee Server: OpenTubeX'un videoları, kanalları, oynatma listelerini ve arama sonuçlarını yüklediği yattee-server örneği. Kullanıcı adı ve parola yalnızca bu cihazda saklanır.
    Proxy Videos Through Yattee Server: Video ve ses akışlarını sunucu üzerinden aktarır. Sunucu sizinle aynı internet bağlantısını kullanmıyorsa bunu açık bırakın, çünkü YouTube akışları yalnızca onları isteyen adrese sunar. Önizleme görselleri her zaman doğrudan YouTube'dan yüklenir.
    Notifications: OpenTubeX’in sizi canlı yayınlar, yeni yüklemeler ve otomatik indirmeler hakkında nasıl bilgilendireceğini seçin. Sistem ve uygulama içi seçeneğinde bildirimler OpenTubeX’i kullanırken uygulamanın içinde, aksi hâlde sistem bildirimi olarak görünür ve zil onları saklar. Kapalı, bildirim seçeneklerini de gizler.
    Ignore System Haptics Setting: Android ayarlarında dokunma geri bildirimi kapalı olsa bile uzun basmalarda ve hareketlerde titreşim ver.
  Proxy Settings:
    IP Block Recovery Script Path: IP engeli algılandığında çalıştırılacak betik dosyasının yolu. OpenTubeX betiğin tamamlanmasını bekler ve videoyu yeniden yükler. Yedek arka uç etkinse yalnızca yedek arka uç da başarısız olduğunda çalışır.
  Player Settings:
    Rewind on Resume: "Duraklatılmış bir videoya devam ettiğinizde son anları tekrar görebilmeniz için bu kadar saniye geri gider. Kapatmak için 0 olarak ayarlayın."
    Minimum Pause Before Rewinding: "Yalnızca video en az bu kadar süre duraklatıldıysa geri sarar. Her duraklatmadan sonra geri sarmak için 0 olarak ayarlayın."
    Mono Audio: 'Sol ve sağ ses kanallarını her iki kulakta da çalar. Bir videonun sesi kulaklığınızın yalnızca bir tarafından geliyorsa kullanın.'
    Normalize Loudness: 'Çoğundan daha yüksek sesli videoların sesini kısar, böylece ses düzeyi videolar arasında sıçramaz. Sessiz videolar ses düzeylerini korur. Yalnızca Yerel API ile yüklenen videolarda çalışır.'
    Pause on Stream Recovery: "Video akışı başarısız olduğunda ve oynatıcı onu yeniden yüklediğinde ya da başka bir biçime veya motora geçtiğinde oynatma duraklatılır ve hata siz kapatana kadar oynatıcının üstünde kalır. Devre dışı bırakıldığında oynatma devam eder ve hata kısa süreliğine bildirim olarak görünür."
    Continue Playback When Screen Is Locked: 'Sesi arka planda çalmaya devam eder ve Android medya kontrolleri sağlar. Uygulama artık görünür olmadığında duraklatmak için bunu kapatın.'
    Enable Caption Translations: Etkinleştirildiğinde ve videoda eşleşen özgün bir parça olmadığında alt yazı düğmesi ile C kısayolu, tercih edilen alt yazı diline otomatik çevrilmiş parçayı seçer.
    Use Quick Playback Speed Bar: Sağdaki oynatıcı denetimlerinde hızlı oynatma hızı çubuğunu gösterir. Kanal başına oynatma hızını elle kaydetme etkinse çubukta geçerli kanalın hızını kaydetme düğmesi de bulunur.
    Multiply Seek Interval by Playback Rate: Etkinleştirildiğinde sarma aralıkları (ok tuşları ve J/L) geçerli oynatma hızıyla çarpılır. Devre dışı bırakıldığında sarma aralıkları oynatma hızından bağımsız olarak sabit kalır.
    Show Playback Rate Adjusted Timestamp: Etkinleştirildiğinde ve oynatma hızı 1x'ten farklı olduğunda oynatıcı, normal zaman damgasından sonra parantez içinde oynatma hızına göre ayarlanmış zaman damgalarını gösterir.
    Use YouTube-style Shorts: Kısa Videoları abonelik ve kanal sayfalarında dikey bir ızgarada gösterir ve YouTube tarzı Kısa Video oynatıcısını kullanır.
    Loop Shorts: Etkinleştirildiğinde Kısa Videolar otomatik olarak yeniden başlar. Devre dışı bırakıldığında sonunda durur ve yeniden oynatma düğmesi gösterir.
    Show Skip Silence Toggle: Oynatıcının ayarlar menüsünde sessizliği atmak için açma ve kapatma düğmesi gösterir.
    Enable Skip Silence by Default: Yeni sekmelerde sessizliği atlamayı etkinleştirir. Bir sekmede değiştirilmesi diğer sekmeleri etkilemez.
    Enable Video Zoom: Oynatıcının ayarlar menüsünde Yakınlaştırma denetimini gösterir; klavye kısayollarını ve kaydırma denetimlerini etkinleştirir.
    Enable Seek History: Uygulama kapanana kadar her videoda nereden atladığınızı hatırlar. Oynatıcının ayarlar menüsünde atlama geçmişi listesini gösterir ve klavye kısayollarını etkinleştirir.
    Show Seek Bar Filmstrip: "Sarma çubuğunun düğmesini sürüklemek, varacağınız yerin çevresindeki karelerden oluşan bir şerit gösterir; şeridin üzerine yukarı çekmek hassas sarma sağlar. Devre dışı bırakıldığında sürükleme, üzerine gelindiğinde olduğu gibi tek bir küçük resim gösterir."
    Voice-over Translation: Çeviri istediğinizde video kimliğini, süresini ve seçili dili resmî olmayan Yandex seslendirme çevirisi hizmetine gönderir. Varsayılan olarak devre dışıdır.
    Hold to Speed Up: Geçerli oynatma hızını geçici olarak seçilen değerle çarpmak için oynatıcının üzerindeyken Boşluk tuşunu veya sol fare düğmesini basılı tutun.
    Ambient Mode: Videonun renklerini oynatıcının çevresindeki alana yayar.
    Default Volume: Ses Düzeyini Hatırla etkinken devre dışıdır. Her video için sabit bir başlangıç ses düzeyi ayarlamak üzere Ses Düzeyini Hatırla'yı kapatın.
    Parallel Segment Loading: |
      Oynatmadan önce aynı anda kaç video ve ses bölümünün yükleneceğini belirler.
      Yüksek değerler yavaş veya kararsız bağlantılarda yardımcı olabilir ancak daha fazla bant genişliği ve bellek kullanır.
      Otomatik seçeneğinin bağlantı hızını düşük hesaplayıp daha düşük kalite seçmesine de neden olabilir.
      Aynı anda tek istekle sınırlı akışlar bu ayarı yok sayar.
    Preload Upcoming Videos: "Sonraki videoların yt-dlp adreslerini alıp önbelleğe kaydeder. Kuyruk, oynatma listeleri ve önerilerden önce gelir."
    Upcoming Videos to Preload: "yt-dlp adresleri arka planda alınacak sonraki videoların azami sayısı."
    Concurrent Preloads: "Videoları aynı anda önceden yüklemek için kullanılan en fazla yt-dlp işlemi sayısı. Daha yüksek değerler daha fazla CPU, bellek ve ağ bant genişliği kullanır."
    Ignore System Rotation Lock for Fullscreen: Android otomatik döndürmesi kapalı olsa bile tam ekrana girmek ve çıkmak için cihazı fiziksel olarak döndürün.
    Ask Before Preloading Large Playlists: "{count} videodan fazla içeren bir oynatma listesinin tüm videolarını önceden yüklemeden önce onay ister."
  Download Settings:
    Download Folder: Videolar bu klasöre kaydedilir. Sisteminizin İndirilenler klasörünü kullanmak için boş bırakın.
    Global Additional yt-dlp Arguments: Her indirmede yt-dlp'ye iletilen ek komut satırı argümanları, örneğin --cookies-from-browser firefox.
    Concurrent Downloads: Aynı anda çalışabilecek en fazla yt-dlp işi sayısı.
    Bandwidth Limit: Bu sınırı eş zamanlı işler arasında bölerek kuyruğun toplam aktarım hızını sınırlar. Sınır koymamak için 0 girin.
  External Software Settings:
    yt-dlp Source: OpenTubeX sisteminizde yüklü yt-dlp'yi kullanabilir veya kullanıcı verileri dizininde saklanan kendi yt-dlp kopyasını indirip yönetebilir.
    yt-dlp Channel: OpenTubeX'in indirip yöneteceği yt-dlp yayın kanalını seçin. Çoğu kullanıcı için Kararlı önerilir.
    FFmpeg Source: OpenTubeX sisteminizde yüklü FFmpeg ve FFprobe'u kullanabilir veya kullanıcı verileri dizininde saklanan kendi statik derlemelerini indirip yönetebilir.
    Managed Tool Updates: Yönetilen araçların otomatik güncellenmesini, güncellemeden önce sormasını veya yalnızca elle kullanılan düğmelerle güncellenmesini seçin. Eksik araçlar gerektiğinde yine indirilir.
    yt-dlp Executable Path: OpenTubeX varsayılan olarak yt-dlp'nin PATH ortam değişkeni üzerinden bulunabildiğini varsayar. Gerekirse buradan özel bir yol ayarlayabilirsiniz.
    Cookie Source: Kimlik doğrulamalı oynatma için yt-dlp'nin Netscape çerez dosyasını mı yoksa yüklü bir tarayıcının çerezlerini mi okuyacağını seçin.
    Cookie File: Kimlik doğrulamalı oynatma için Netscape biçiminde bir çerez dosyası seçin.
    Browser for Cookies: Tarayıcı desteği seçili yt-dlp yürütülebilir dosyasından okunur. Kimlik doğrulamalı oynatma istendiğinde OpenTubeX, yt-dlp'den bu tarayıcıyı okumasını ister.
    Browser Profile: İsteğe bağlı tarayıcı profili adı veya klasörü. Son erişilen profili kullanmak için boş bırakın.
    Always Use Cookies: "İndirmeler, altyazılar ve yt-dlp akışları çıkardığında yapılandırılmış çerezleri kullanın. Bu, akış çıkarma yöntemini yt-dlp olarak değiştirmez. yt-dlp seçiliyken ve hesabın erişimi varsa YouTube Premium'un gelişmiş bit hızı dâhil yalnızca hesaba özel biçimler kullanılabilir hâle gelebilir."
    FFmpeg Executable Path: Ayrı video ve ses akışlarını birleştirmek ve ses dönüştürmek için FFmpeg gereklidir. OpenTubeX varsayılan olarak FFmpeg'in PATH ortam değişkeni üzerinden bulunabildiğini varsayar. Gerekirse buradan özel bir yol ayarlayabilirsiniz.
    Use cookies for subtitles: "Altyazılar ve otomatik çeviriler için yapılandırılmış çerezleri kullan. \"Her zaman çerezleri kullan\" seçeneği de bunu etkinleştirir."
  Distraction Free Settings:
    Hide Playlist Stats: Oynatma listesi sayfalarında video sayısını, görüntülenme sayısını, son güncelleme tarihini ve toplam süreyi gizler.
    Count Watch Time From: "\"Tüm cihazlar\" seçeneği, izleme istatistiklerini eşitleyen her cihazı sayar. \"Bu cihaz\" yalnızca burada izlediklerinizi sayar."
    When a Limit Is Reached: "\"Oynatmayı Duraklat\" seçeneği, 15 dakika eklemenize veya sınırı bugünlük yok saymanıza olanak tanır. Ayarlar parolası varsa bir sınırı yalnızca Ayarlar'dan artırabilirsiniz."
    Grayscale: "Uygulamayı gri tonlarında göstererek daha az dikkat çekmesini sağlar. \"Uyku Vaktinde\" seçeneği, uyku vakti hatırlatıcısının programını izler."
    Apply Grayscale To: "\"Videolar ve Görseller\" arayüzü renkli bırakır ve videolar, küçük resimler ve avatarlar gibi içerikleri gri yapar."
    Daily Watch Time Limit: "İzleme istatistiklerini eşitleyen tüm cihazlarda bugün izlediklerinizi, kısa videolar dahil, sayar."
    Daily Shorts Limit: "Bu cihazda bugün izlediğiniz kısa videoları sayar."
    Take a Break Reminder: "Bu kadar izledikten sonra videoyu duraklatır. 10 dakika veya daha uzun bir ara, sayımı yeniden başlatır."
    Bedtime Reminder: "Başlangıç ve bitiş saatleri arasında videoyu duraklatır ve izlemeyi bırakmanızı hatırlatır."
    Shorten View Counts: YouTube'un zaten yuvarlayarak kısalttığı izlenme, yorum ve yorum beğeni sayılarını gösterir, örneğin 14.000 yerine 14 B. Kesin sayılar her zaman tam gösterilir.
  Subscription Settings:
    Fetch Feed on Startup: Etkinleştirildiğinde OpenTubeX, başlangıçta ve yeni pencere açıldığında abonelik akışınızı otomatik olarak getirir.
    Show New Content Feed: Önceki getirme sırasında bulunmayan abonelik akışı öğelerini içeren Yeni sekmesini gösterir.
    Enable RSS Feeds: Abonelikler sayfasında RSS veya Atom akışlarının öğelerini içeren bir RSS sekmesi gösterir, böylece diğer platformlardaki içerik üreticilerini takip edebilirsiniz. Öğeleri yt-dlp ile açılır.
    Show New Content Indicators: Önceki getirme sırasında bulunmayan abonelik akışı öğelerinin yanında küçük bir nokta gösterir.
    Show Scheduled Live Streams / Premieres First: Yaklaşan canlı yayınları ve ilk gösterimleri abonelik akışının en üstünde tutar. Devre dışı bırakıldığında başlayana kadar duyuruldukları konumda kalırlar. Mevcut planlanmış kayıtların duyuru tarihlerini almak için devre dışı bıraktıktan sonra abonelik akışını bir kez yenileyin.
    Auto Refresh Interval: "Uygulama açıkken OpenTubeX'in abonelik akışınızı ne sıklıkla otomatik yenileyeceğini belirler. Android’de sıfırdan farklı bir aralık, uygulama kapalıyken de akışı yeniler."
    Refresh Subscriptions While App Is Closed: "Akışları seçtiğiniz ayarlarla yeniler. Masaüstünde OpenTubeX, çıkış yapana kadar sistem tepsisinde kalır. Android, arka plan yenilemelerinin zamanını belirler."
    Notify About New Uploads: Abonelik ayarlarında bildirimlerini açtığınız kanallar için bu cihazda sistem bildirimleri gösterir. OpenTubeX yeni içeriği abonelikler yenilendiğinde denetler, bu nedenle bir otomatik yenileme aralığı seçin. Uygulama kapalıyken de bildirim almak için uygulama kapalıyken yenilemeyi de etkinleştirin.
    RSS Feeds Auto Refresh Interval: Uygulama açıkken OpenTubeX'in RSS akışlarınızı ne sıklıkla otomatik olarak yenilediği.
    Faster Subscription Refresh: "Önce her kanalın RSS akışını denetler ve yalnızca yeni yüklemesi olan kanalların videolarını, Shorts'larını ve canlı yayınlarını yükler. Otomatik yenilemeler son 10 dakikada yüklenen kanalları da atlar. Yeni yüklemesi olmayan kanallarda görüntüleme sayıları, kaldırılan videolar ve değişen başlıklar yalnızca birkaç saatte bir güncellenir ve RSS akışı geride kaldığında yeni yüklemeler daha geç görünebilir. Invidious API ile kullanılamaz."
    Platforms Auto Refresh Interval: Uygulama açıkken OpenTubeX'in diğer platformlarda takip ettiğiniz kanalları ne sıklıkla otomatik olarak yenilediği.
    Twitch Notify When Live: Takip ettiğiniz Twitch kanallarından biri yayına başladığında size bildirir. OpenTubeX açıkken birkaç dakikada bir kontrol eder; kapalıyken de o sırada abonelikleri yeniliyorsa kontrol eder.
  Theme Settings:
    Only Show Important Notifications: Yalnızca bir işlemi onaylayan veya bir durumu bildiren uygulama içi bildirimleri, Geri al sunanlar dahil, gizler. Hatalar, uyarılar, ayarladığınız hatırlatıcılar ve güncelleme istemleri gibi karar gerektiren bildirimler görünmeye devam eder. Abonelikleri yenileme gibi arka plan işlemlerinin ilerlemesi bildirim yerine genel ilerleme çubuğunda gösterilir. Sistem bildirimleri etkilenmez.
    Visible Search Suggestions: "Arama çubuğunun listesi kaydırılmadan önce kaç arama geçmişi girdisi ve öneri göstereceğini belirler. Liste hiçbir zaman pencerenin alt kenarını aşmaz."
    Thumbnail Size: "Izgaralarda ve listelerde video küçük resimlerini ölçeklendirir. Sabit sütun sayısına sahip ızgaralar veya Tam Genişlik görünüm türü bunun yerine her satırı doldurur, bu yüzden orada yalnızca liste küçük resimlerini ve Shorts'u değiştirir. Telefon boyutundaki pencerelerde ızgara küçük resimleri %100 ile sınırlıdır."
    Playlist Thumbnail Size: "Oynatma listesi sayfalarında video küçük resimlerini ölçeklendirir. Sabit sütun sayısına sahip ızgaralar veya Tam Genişlik görünüm türü bunun yerine her satırı doldurur, bu yüzden orada yalnızca liste küçük resimlerini ve Shorts'u değiştirir. Telefon boyutundaki pencerelerde ızgara küçük resimleri %100 ile sınırlıdır."
    Compact Settings Categories: "Açıklamaları gizler ve ayar kategorilerinin yüksekliğini azaltır."
    Show Progress as Notification: Abonelik yenilemeleri ve yönetilen araç indirmeleri gibi arka plan işlemlerinin anlık ilerlemesini genel ilerleme çubuğu yerine kalıcı bir bildirimde gösterir.
    Always Show Scrollbars: Kaydırma çubuklarını her zaman görünür tutar. Devre dışı bırakıldığında fareyi hareket ettirmeyi bıraktıktan kısa süre sonra kaybolur ve yeniden hareket ettirdiğinizde görünür.
    Scroll Speed: Fare tekerleği ve dokunmatik yüzey kaydırma hareketlerinin ne kadar uzağa kaydıracağını değiştirir.
    Use Fixed Tab Width: Yatay sekme çubuğundaki her sekmeye başlığına göre boyut vermek yerine aynı genişliği verir.
    Use Custom Title Bar: Dikey alandan tasarruf etmek için sistem başlık çubuğunu sekme çubuğuyla, sekmeler üstte değilse üst gezinme çubuğuyla değiştirir. Pencere denetimleri bu çubuğun köşesinde görünür.
    Use Grid Player Menu: Video oynatıcısının ayarlar menüsünü satır listesi yerine döşeme ızgarası olarak düzenler.
    Modal Backdrop: "İletişim kutularının ve menülerin arkasında uygulamanın nasıl görüneceğini belirler. Bulanıklaştırma daha az güçlü cihazlarda yavaş olabilir."
