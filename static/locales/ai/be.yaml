Tooltips:
  General Settings:
    Use AI Translation Completions: Запаўняе прагалы ў перакладах, зробленых людзьмі, тэкстам, створаным ШІ. Пераклады людзей заўсёды маюць перавагу.
    Update Relative Timestamps: Абнаўляе адносныя пазнакі часу ва ўсёй праграме, пакуль старонка адкрытая. Калі адключана, яны абнаўляюцца толькі пасля перазагрузкі або паўторнага адкрыцця старонкі.
    Stream Extraction Method: |
      Выберыце, як OpenTubeX атрымлівае плыні відэа. Каб выбраць yt-dlp, ён мусіць быць даступны.
      Пры выкарыстанні yt-dlp відэа можа запускацца даўжэй.
      Убудаваны метад не падтрымлівае перамотванне жывых трансляцый і прэм'ер.
    Avoid translation: |
      Адключае аўтаматычны пераклад назвы, апісання і раздзелаў відэа з боку YouTube.
      Занадта шмат запытаў, напрыклад атрыманне назваў відэа ва ўсіх спісах, можа часова
      пагоршыць надзейнасць праграмы.
    Show Thumbnail Previews: Паказвае анімаваны перадпрагляд пры навядзенні на мініяцюры відэа.
    Startup Behavior: |
      Выберыце, што робіць OpenTubeX пры запуску.
      «Загрузіць усе ўкладкі» адразу аднаўляе ўсе захаваныя ўкладкі, але відэа ў фонавых укладках не запускаецца аўтаматычна.
      «Загрузіць раней загружаныя ўкладкі» паўторна загружае ўкладкі, якія былі загружаныя пры закрыцці OpenTubeX, а астатнія пакідае выгружанымі.
      «Загрузіць апошнюю актыўную ўкладку» аднаўляе папярэдні сеанс, адкрываючы астатнія ўкладкі выгружанымі; яны загрузяцца, калі вы на іх націснеце.
      «Пачаць з пустога сеанса» прапускае захаваныя ўкладкі і адкрывае новае акно.
    Remember Tab Navigation History: Гісторыя пераходаў назад і наперад у кожнай укладцы захоўваецца і аднаўляецца пасля перазапуску OpenTubeX.
  Proxy Settings:
    IP Block Recovery Script Path: Шлях да файла сцэнарыя, які запускаецца пры выяўленні блакавання IP. OpenTubeX чакае яго завяршэння, а потым перазагружае відэа. Калі ўключаны рэзервовы метад, сцэнарый запускаецца толькі тады, калі гэты метад таксама не спрацаваў.
  Player Settings:
    Enable Caption Translations: Калі ўключана і відэа не мае адпаведнай арыгінальнай дарожкі, кнопка субцітраў і спалучэнне C аддаюць перавагу аўтаматычна перакладзенай дарожцы на пажаданай мове субцітраў.
    Use Quick Playback Speed Bar: Паказвае справа сярод элементаў кіравання прайгравальнікам панэль хуткай змены хуткасці прайгравання. Калі ўключана ручное захаванне хуткасці прайгравання для асобных каналаў, на панэлі таксама ёсць кнопка захавання хуткасці для бягучага канала.
    Multiply Seek Interval by Playback Rate: Калі ўключана, інтэрвалы перамотвання (клавішы са стрэлкамі і J/L) памнажаюцца на бягучую хуткасць прайгравання. Калі адключана, інтэрвалы застаюцца нязменнымі незалежна ад хуткасці прайгравання.
    Show Playback Rate Adjusted Timestamp: Калі ўключана і хуткасць прайгравання адрозніваецца ад 1x, прайгравальнік паказвае пасля звычайнай пазнакі часу ў дужках пазнаку з улікам хуткасці.
    Use YouTube-style Shorts: Паказвае Shorts у вертыкальнай сетцы на старонках падпісак і каналаў ды выкарыстоўвае прайгравальнік Shorts у стылі YouTube.
    Loop Shorts: Калі ўключана, Shorts аўтаматычна запускаюцца спачатку. Калі адключана, Shorts спыняюцца ў канцы і паказваюць кнопку паўторнага прайгравання.
    Show Skip Silence Toggle: Паказвае пераключальнік пропуску цішыні ў меню налад прайгравальніка.
    Enable Skip Silence by Default: Уключае пропуск цішыні для новых укладак. Змена ў адной укладцы не ўплывае на іншыя.
    Enable Video Zoom: Паказвае элемент кіравання маштабам у меню налад прайгравальніка і ўключае адпаведныя спалучэнні клавіш і элементы панарамавання.
    Voice-over Translation: Пасля запыту перакладу адпраўляе ідэнтыфікатар відэа, працягласць і выбраную мову неафіцыйнаму сэрвісу закадравага перакладу Yandex. Прадвызначана адключана.
    Hold to Double Playback Speed: Утрымлівайце прабел або левую кнопку мышы над прайгравальнікам, каб часова падвоіць бягучую хуткасць прайгравання.
    Ambient Mode: Пашырае колеры відэа на прастору вакол прайгравальніка.
    Default Volume: Недаступна, пакуль уключана «Запамінаць гучнасць». Адключыце «Запамінаць гучнасць», каб задаць фіксаваную пачатковую гучнасць для кожнага відэа.
    Parallel Segment Loading: |
      Колькі сегментаў відэа і аўдыя загадзя загружаць адначасова.
      Большыя значэнні могуць дапамагчы пры павольным або нестабільным злучэнні, але патрабуюць больш прапускной здольнасці і памяці.
      Таксама праз іх аўтаматычная ацэнка можа занізіць хуткасць злучэння і выбраць ніжэйшую якасць.
      Плыні з абмежаваннем у адзін адначасовы запыт не ўлічваюць гэтую наладу.
  Download Settings:
    Download Folder: Відэа захоўваюцца ў гэтай папцы. Пакіньце поле пустым, каб выкарыстоўваць сістэмную папку «Спампоўванні».
    Global Additional yt-dlp Arguments: Дадатковыя аргументы каманднага радка, якія перадаюцца yt-dlp пры кожным спампоўванні, напрыклад --cookies-from-browser firefox.
    Concurrent Downloads: Найбольшая колькасць заданняў yt-dlp, якія могуць выконвацца адначасова.
    Bandwidth Limit: Абмяжоўвае агульную хуткасць перадачы чаргі, размяркоўваючы гэтае значэнне паміж адначасовымі заданнямі. Увядзіце 0, каб зняць абмежаванне.
  External Software Settings:
    yt-dlp Source: OpenTubeX можа выкарыстоўваць усталяваны ў сістэме yt-dlp або спампаваць уласную копію yt-dlp, захоўваць яе ў папцы даных карыстальніка і кіраваць ёю.
    yt-dlp Channel: Выберыце канал выпускаў yt-dlp, які OpenTubeX будзе спампоўваць і якім будзе кіраваць. Для большасці карыстальнікаў рэкамендуецца Stable.
    FFmpeg Source: OpenTubeX можа выкарыстоўваць усталяваныя ў сістэме FFmpeg і FFprobe або спампоўваць уласныя статычныя зборкі, захоўваць іх у папцы даных карыстальніка і кіраваць імі.
    Managed Tool Updates: Выберыце, ці абнаўляць кіраваныя інструменты аўтаматычна, запытваць дазвол перад абнаўленнем або абнаўляць іх толькі ўручную адпаведнымі кнопкамі. Адсутныя інструменты ўсё роўна спампоўваюцца пры неабходнасці.
    yt-dlp Executable Path: Прадвызначана OpenTubeX мяркуе, што yt-dlp можна знайсці праз зменную асяроддзя PATH. Пры неабходнасці тут можна задаць іншы шлях.
    Cookie Source: Выберыце, ці мусіць yt-dlp для аўтэнтыфікаванага прайгравання чытаць файл cookie Netscape або файлы cookie з усталяванага браўзера.
    Cookie File: Выберыце файл cookie ў фармаце Netscape для аўтэнтыфікаванага прайгравання.
    Browser for Cookies: Падтрымка браўзераў вызначаецца з выбранага выканальнага файла yt-dlp. Пры запыце аўтэнтыфікаванага прайгравання OpenTubeX загадвае yt-dlp прачытаць файлы cookie з гэтага браўзера.
    Browser Profile: Неабавязковая назва або папка профілю браўзера. Пакіньце поле пустым, каб выкарыстоўваць апошні адкрыты профіль.
    Always Use Cookies: Выкарыстоўвае наладжаныя файлы cookie кожны раз, калі yt-dlp здабывае плыні. Гэта не пераключае метад здабывання плыняў на yt-dlp. Калі выбраны yt-dlp, могуць стаць даступнымі фарматы толькі для ўліковага запісу, у тым ліку палепшаны бітрэйт YouTube Premium, калі ўліковы запіс мае да яго доступ.
    FFmpeg Executable Path: FFmpeg патрэбны для аб'яднання асобных плыняў відэа і аўдыя ды пераўтварэння аўдыя. Прадвызначана OpenTubeX мяркуе, што FFmpeg можна знайсці праз зменную асяроддзя PATH. Пры неабходнасці тут можна задаць іншы шлях.
  Distraction Free Settings:
    Shorten View Counts: Паказвае колькасць праглядаў і ўпадабанняў каментароў у скарочаным выглядзе, ужо акругленым YouTube, напрыклад 14 тыс. замест 14 000. Дакладная колькасць заўсёды паказваецца цалкам.
    Hide Videos on Watch: Хавае прагледжаныя відэа ва ўкладках «Відэа», Shorts і «Ужывую» на старонках падпісак і каналаў. Гэта не ўплывае на ўкладку «Галоўная» на старонках каналаў
  Subscription Settings:
    Fetch Feed on Startup: Калі ўключана, OpenTubeX аўтаматычна атрымлівае стужку падпісак пры запуску і адкрыцці новага акна.
    Show New Content Feed: Паказвае ўкладку «Новае» з элементамі стужкі падпісак, якіх не было падчас папярэдняга атрымання.
    Show New Content Indicators: Паказвае маленькую кропку побач з элементамі стужкі падпісак, якіх не было падчас папярэдняга атрымання.
    Show Scheduled Live Streams / Premieres First: Трымае запланаваныя жывыя трансляцыі і прэм'еры ўверсе стужкі падпісак. Калі адключана, яны застаюцца на месцы абвяшчэння да пачатку. Пасля адключэння адзін раз абнавіце стужку падпісак, каб атрымаць даты абвяшчэння для наяўных запланаваных элементаў.
    Auto Refresh Interval: Як часта OpenTubeX аўтаматычна абнаўляе стужку падпісак, пакуль праграма адкрытая.
  Theme Settings:
    Show Progress as Notification: Замест агульнай панэлі ходу паказвае пастаяннае апавяшчэнне з бягучым ходам фонавых аперацый, напрыклад абнаўлення стужкі падпісак і спампоўвання кіраваных інструментаў.
    Always Show Scrollbars: Заўсёды пакідае палосы пракруткі бачнымі. Калі адключана, яны знікаюць неўзабаве пасля спынення руху мышы і зноў з'яўляюцца, як толькі вы яе паварушыце.
    Scroll Speed: Змяняе адлегласць пракруткі колам мышы і жэстамі кола сэнсарнай панэлі.
    Use Fixed Tab Width: Задае ўсім укладкам на гарызантальнай панэлі аднолькавую шырыню замест падбору шырыні паводле назвы.
    Use Grid Player Menu: Размяшчае меню налад відэапрайгравальніка ў выглядзе сеткі плітак замест спіса радкоў.
