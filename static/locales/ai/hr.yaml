Tooltips:
  General Settings:
    Use AI Translation Completions: Popunjava praznine u ljudskim prijevodima tekstom koji generira umjetna inteligencija. Ljudski prijevodi uvijek imaju prednost.
    Update Relative Timestamps: Ažurira relativne vremenske oznake u cijeloj aplikaciji dok je stranica otvorena. Kada je isključeno, ažuriraju se tek nakon ponovnog učitavanja ili ponovnog posjeta stranici.
    Stream Extraction Method: |
      Odaberite kako OpenTubeX dohvaća tokove videozapisa. yt-dlp mora biti dostupan kada je odabran.
      Pri upotrebi alata yt-dlp pokretanje videozapisa može trajati dulje.
      Ugrađena metoda ne podržava premotavanje prijenosa uživo i premijera.
    Avoid translation: |
      Onemogućuje YouTubeov automatski prijevod naslova, opisa i poglavlja videozapisa.
      Previše zahtjeva, primjerice pri dohvaćanju naslova videozapisa na popisima, može privremeno
      utjecati na pouzdanost aplikacije.
    Show Thumbnail Previews: Prikazuje animirane pretpreglede pri prelasku pokazivačem preko minijatura videozapisa.
    Startup Behavior: |
      Odaberite što OpenTubeX čini pri pokretanju.
      Mogućnost "Učitaj sve kartice" odmah vraća svaku spremljenu karticu, ali videozapisi se neće automatski reproducirati na karticama u pozadini.
      Mogućnost "Učitaj prethodno učitane kartice" ponovno učitava kartice koje su bile učitane pri zatvaranju aplikacije OpenTubeX, a ostale ostavlja neučitanima.
      Mogućnost "Učitaj posljednju aktivnu karticu" vraća prethodnu sesiju s ostalim otvorenim, ali neučitanim karticama; učitat će se kada ih kliknete.
      Mogućnost "Pokreni s praznom sesijom" preskače spremljene kartice i otvara novi prozor.
    Remember Tab Navigation History: Povijest kretanja unatrag i naprijed sprema se za svaku karticu i vraća pri ponovnom pokretanju aplikacije OpenTubeX.
  Proxy Settings:
    IP Block Recovery Script Path: Putanja datoteke skripte koja se pokreće kada se otkrije blokada IP adrese. OpenTubeX čeka da završi, a zatim ponovno učitava videozapis. Ako je pričuvna metoda omogućena, skripta se pokreće samo ako ni pričuvna metoda ne uspije.
  Player Settings:
    Use Document Picture-in-Picture: "Prikazuje kontrole reproduktora i titlove aplikacije u načinu slike u slici. Isključite za korištenje sistemskog prozora slike u slici za video."
    Continue Playback When Screen Is Locked: 'Nastavlja reprodukciju zvuka u pozadini i pruža Android kontrole medija. Isključite ovo za pauziranje kada aplikacija više nije vidljiva.'
    Enable Caption Translations: Kada je omogućeno, gumb za titlove i prečac C daju prednost automatski prevedenom zapisu na željenom jeziku titlova ako videozapis nema odgovarajući izvorni zapis.
    Use Quick Playback Speed Bar: Prikazuje traku za brzu promjenu brzine reprodukcije među kontrolama reproduktora s desne strane. Ako je omogućeno ručno spremanje brzine reprodukcije po kanalu, traka sadrži i gumb za spremanje brzine za trenutačni kanal.
    Multiply Seek Interval by Playback Rate: Kada je omogućeno, razmaci premotavanja (tipke sa strelicama i J/L) množe se trenutačnom brzinom reprodukcije. Kada je isključeno, ostaju jednaki bez obzira na brzinu reprodukcije.
    Show Playback Rate Adjusted Timestamp: Kada je omogućeno i brzina reprodukcije nije 1x, reproduktor iza uobičajenog prikaza vremena u zagradama prikazuje vremenske oznake prilagođene brzini reprodukcije.
    Use YouTube-style Shorts: Prikazuje Shorts videozapise u okomitoj mreži na stranicama pretplata i kanala te upotrebljava reproduktor za Shorts videozapise u stilu YouTubea.
    Loop Shorts: Kada je omogućeno, Shorts videozapisi automatski se ponovno pokreću. Kada je isključeno, zaustavljaju se na kraju i prikazuju gumb za ponovnu reprodukciju.
    Show Skip Silence Toggle: Prikazuje prekidač za preskakanje tišine u izborniku postavki reproduktora.
    Enable Skip Silence by Default: Omogućuje preskakanje tišine za nove kartice. Promjena na jednoj kartici ne utječe na ostale.
    Enable Video Zoom: Prikazuje kontrolu Zumiranje u izborniku postavki reproduktora te omogućuje njezine tipkovne prečace i kontrole pomicanja.
    Voice-over Translation: Pri zahtjevu za prijevod šalje ID videozapisa, trajanje i odabrani jezik neslužbenoj Yandexovoj usluzi glasovnog prijevoda. Prema zadanim je postavkama isključena.
    Hold to Double Playback Speed: Držite razmaknicu ili lijevu tipku miša iznad reproduktora kako biste privremeno udvostručili trenutačnu brzinu reprodukcije.
    Ambient Mode: Stapa boje videozapisa s područjem oko reproduktora.
    Default Volume: Onemogućeno dok je uključena postavka Zapamti glasnoću. Isključite je kako biste postavili stalnu početnu glasnoću za svaki videozapis.
    Parallel Segment Loading: |
      Broj segmenata videozapisa i zvuka koji se istodobno unaprijed učitavaju.
      Veće vrijednosti mogu pomoći na sporim ili nestabilnim vezama, ali troše više propusnosti i memorije.
      Zbog njih Automatski odabir također može podcijeniti brzinu veze i odabrati nižu kvalitetu.
      Tokovi ograničeni na jedan zahtjev istodobno zanemaruju ovu postavku.
    Preload Upcoming Videos: "Dohvaća i sprema yt-dlp adrese za sljedeće videozapise. Red čekanja ima prednost pred popisima i preporukama."
    Upcoming Videos to Preload: "Najveći broj sljedećih videozapisa čije se yt-dlp adrese dohvaćaju u pozadini."
    Concurrent Preloads: "Najveći broj yt-dlp procesa koji se koriste za istodobno predučitavanje videozapisa. Veće vrijednosti koriste više procesora, memorije i mrežne propusnosti."
  Download Settings:
    Download Folder: Videozapisi se spremaju u ovu mapu. Ostavite prazno za upotrebu sustavske mape Preuzimanja.
    Global Additional yt-dlp Arguments: Dodatni argumenti naredbenog retka koji se prosljeđuju alatu yt-dlp pri svakom preuzimanju, primjerice --cookies-from-browser firefox.
    Concurrent Downloads: Najveći broj yt-dlp zadataka koji se mogu istodobno izvoditi.
    Bandwidth Limit: Ograničava ukupnu brzinu prijenosa reda čekanja dijeljenjem ovog ograničenja među istodobnim zadacima. Unesite 0 za neograničenu brzinu.
  External Software Settings:
    yt-dlp Source: OpenTubeX može upotrebljavati yt-dlp instaliran na sustavu ili preuzeti vlastitu kopiju alata yt-dlp, upravljati njome i pohraniti je u mapu korisničkih podataka.
    yt-dlp Channel: Odaberite kanal izdanja alata yt-dlp koji OpenTubeX preuzima i kojim upravlja. Stabilni kanal preporučuje se većini korisnika.
    FFmpeg Source: OpenTubeX može upotrebljavati FFmpeg i FFprobe instalirane na sustavu ili preuzeti vlastita statička izdanja, upravljati njima i pohraniti ih u mapu korisničkih podataka.
    Managed Tool Updates: Odaberite hoće li se alati kojima se upravlja ažurirati automatski, zatražiti potvrdu prije ažuriranja ili ažurirati samo ručnim gumbima. Alati koji nedostaju i dalje se preuzimaju kada su potrebni.
    yt-dlp Executable Path: OpenTubeX prema zadanim postavkama pretpostavlja da se yt-dlp može pronaći putem varijable okruženja PATH. Ovdje po potrebi možete postaviti prilagođenu putanju.
    Cookie Source: Odaberite treba li yt-dlp za reprodukciju uz prijavu čitati Netscape datoteku kolačića ili kolačiće iz instaliranog preglednika.
    Cookie File: Odaberite datoteku kolačića u formatu Netscape za reprodukciju uz prijavu.
    Browser for Cookies: Podrška za preglednike očitava se iz odabrane izvršne datoteke alata yt-dlp. Pri zahtjevu za reprodukciju uz prijavu OpenTubeX traži od alata yt-dlp da čita podatke iz ovog preglednika.
    Browser Profile: Neobavezan naziv ili mapa profila preglednika. Ostavite prazno za upotrebu posljednjeg korištenog profila.
    Always Use Cookies: Upotrijebi konfigurirane kolačiće kad god yt-dlp izdvaja tokove. Time se način izdvajanja tokova ne prebacuje na yt-dlp. Kada je yt-dlp odabran, mogu postati dostupni formati samo za prijavljene račune, uključujući poboljšanu brzinu prijenosa usluge YouTube Premium ako račun ima pristup toj usluzi.
    FFmpeg Executable Path: FFmpeg je potreban za spajanje odvojenih tokova videozapisa i zvuka te za pretvorbu zvuka. OpenTubeX prema zadanim postavkama pretpostavlja da se FFmpeg može pronaći putem varijable okruženja PATH. Ovdje po potrebi možete postaviti prilagođenu putanju.
  Distraction Free Settings:
    Shorten View Counts: Prikazuje skraćene brojeve pregleda i oznaka sviđanja komentara koje je YouTube već zaokružio, primjerice 14 tis. umjesto 14.000. Točni brojevi uvijek se prikazuju u cijelosti.
  Subscription Settings:
    Fetch Feed on Startup: Kada je omogućeno, OpenTubeX automatski dohvaća sažetak pretplata pri pokretanju i otvaranju novog prozora.
    Show New Content Feed: Prikazuje karticu Novo sa stavkama sažetka pretplata kojih nije bilo pri prethodnom dohvaćanju.
    Show New Content Indicators: Prikazuje malu točku uz stavke sažetka pretplata kojih nije bilo pri prethodnom dohvaćanju.
    Show Scheduled Live Streams / Premieres First: Zadržava predstojeće prijenose uživo i premijere na vrhu sažetka pretplata. Kada je isključeno, ostaju na mjestu svoje najave sve do početka. Nakon isključivanja jednom osvježite sažetak pretplata kako biste dohvatili datume najave za postojeće zakazane stavke.
    Auto Refresh Interval: "Učestalost kojom OpenTubeX automatski osvježava sažetak pretplata dok je aplikacija otvorena. Na Androidu interval koji nije nula osvježava sažetak i dok je aplikacija zatvorena."
    Refresh Subscriptions While App Is Closed: "Omogućuje Androidu osvježavanje sažetaka pretplata u odabranim razmacima dok je OpenTubeX zatvoren. Isključite ovu opciju kako bi se automatsko osvježavanje odvijalo samo dok je aplikacija otvorena."
  Theme Settings:
    Show Progress as Notification: Umjesto opće trake napretka prikazuje trajnu obavijest s trenutačnim napretkom pozadinskih postupaka, poput osvježavanja pretplata i preuzimanja alata kojima se upravlja.
    Always Show Scrollbars: Drži klizne trake uvijek vidljivima. Kada je isključeno, nestaju ubrzo nakon što prestanete pomicati miš i ponovno se pojavljuju čim ga pomaknete.
    Scroll Speed: Mijenja udaljenost pomicanja gestama kotačića miša i dodirne pločice.
    Use Fixed Tab Width: Daje svim karticama na vodoravnoj traci kartica jednaku širinu umjesto da se širina prilagođava njihovim naslovima.
    Use Grid Player Menu: Raspoređuje izbornik postavki reproduktora videozapisa kao mrežu pločica umjesto popisa redaka.
