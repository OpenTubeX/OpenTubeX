Tooltips:
  General Settings:
    Use AI Translation Completions: Completa as lagoas das traducións humanas con texto xerado por IA. As traducións humanas sempre teñen prioridade.
    Update Relative Timestamps: Actualiza as marcas de tempo relativas en toda a aplicación mentres a páxina permaneza aberta. Se se desactiva, só se actualizan ao recargar ou volver visitar a páxina.
    Stream Extraction Method: |
      Escolle como obtén OpenTubeX as emisións de vídeo. Se seleccionas yt-dlp, debe estar dispoñible.
      Con yt-dlp, os vídeos poden tardar máis en comezar.
      O método integrado non permite saltar dentro das emisións en directo nin das estreas.
    Avoid translation: |
      Desactiva a tradución automática de YouTube do título, a descrición e os capítulos dun vídeo.
      Demasiadas solicitudes, como obter os títulos dos vídeos das listas, poden afectar temporalmente
      á fiabilidade da aplicación.
    Show Thumbnail Previews: Amosa previsualizacións animadas ao pasar por riba das miniaturas dos vídeos.
    Startup Behavior: |
      Escolle o que fai OpenTubeX ao iniciarse.
      «Cargar todas as lapelas» restaura inmediatamente todas as lapelas gardadas, pero as que están en segundo plano non reproducen vídeos automaticamente.
      «Cargar as lapelas que xa estaban cargadas» recarga as que estaban cargadas cando se pechou OpenTubeX e mantén descargadas as demais.
      «Cargar a última lapela activa» restaura a sesión anterior coas demais lapelas abertas pero descargadas; cargaranse ao premer nelas.
      «Comezar cunha sesión baleira» omite as lapelas gardadas e abre unha xanela nova.
    Remember Tab Navigation History: O historial de navegación cara atrás e cara adiante de cada lapela gárdase e restáurase ao reiniciar OpenTubeX.
  Proxy Settings:
    IP Block Recovery Script Path: Ruta do ficheiro de script que se executará ao detectar un bloqueo de IP. OpenTubeX agarda a que remate e despois recarga o vídeo. Se o servizo alternativo está activado, só se executa cando este tamén falla.
  Player Settings:
    Continue Playback When Screen Is Locked: 'Mantén o audio reproducíndose en segundo plano e fornece controis multimedia de Android. Desactívao para pausar cando a aplicación deixe de estar visible.'
    Enable Caption Translations: Cando está activado e o vídeo non ofrece unha pista orixinal no idioma preferido dos subtítulos, o botón de subtítulos e o atallo C dan prioridade a unha pista traducida automaticamente a ese idioma.
    Use Quick Playback Speed Bar: Amosa unha barra rápida de velocidade de reprodución nos controis da dereita do reprodutor. Se está activado o gardado manual da velocidade por canle, a barra tamén inclúe o botón para gardar a velocidade da canle actual.
    Multiply Seek Interval by Playback Rate: Cando está activado, os intervalos de salto (teclas de frecha e J/L) multiplícanse pola velocidade de reprodución actual. Se se desactiva, os intervalos permanecen constantes con independencia da velocidade.
    Show Playback Rate Adjusted Timestamp: Cando está activado e a velocidade de reprodución non é 1x, o reprodutor amosa entre parénteses as marcas de tempo axustadas á velocidade despois das normais.
    Use YouTube-style Shorts: Amosa os vídeos curtos nunha grade vertical nas páxinas das subscricións e das canles e usa o reprodutor de vídeos curtos ao estilo de YouTube.
    Loop Shorts: Cando está activado, os vídeos curtos reinícianse automaticamente. Se se desactiva, detéñense ao final e amosan un botón para repetilos.
    Show Skip Silence Toggle: Amosa un interruptor para saltar os silencios no menú de configuración do reprodutor.
    Enable Skip Silence by Default: Activa o salto de silencios nas lapelas novas. Cambialo nunha lapela non afecta ás demais.
    Enable Video Zoom: Amosa o control de ampliación no menú de configuración do reprodutor e activa os seus atallos de teclado e controis de desprazamento.
    Voice-over Translation: Ao solicitar unha tradución, envía o ID, a duración e o idioma seleccionado do vídeo ao servizo non oficial de tradución de voz de Yandex. Está desactivado de maneira predeterminada.
    Hold to Double Playback Speed: Mantén premida a barra espazadora ou o botón esquerdo do rato sobre o reprodutor para duplicar temporalmente a velocidade de reprodución actual.
    Ambient Mode: Mestura as cores do vídeo coa zona que rodea o reprodutor.
    Default Volume: Non está dispoñible mentres «Lembrar o volume» estea activado. Desactiva esta opción para establecer un volume inicial fixo para cada vídeo.
    Parallel Segment Loading: |
      Número de segmentos de vídeo e son que se cargan á vez por adiantado.
      Os valores máis altos poden axudar con conexións lentas ou inestables, pero usan máis largura de banda e memoria.
      Tamén poden facer que o modo automático calcule á baixa a velocidade da conexión e escolla unha calidade inferior.
      As emisións limitadas a unha solicitude á vez ignoran este axuste.
    Preload Upcoming Videos: "Obtén e garda na caché os URL de yt-dlp dos seguintes vídeos. A cola ten prioridade sobre as listas e as recomendacións."
    Upcoming Videos to Preload: "Número máximo de vídeos seguintes cuxos URL de yt-dlp se obteñen en segundo plano."
    Concurrent Preloads: "Número máximo de procesos de yt-dlp utilizados para precargar vídeos ao mesmo tempo. Os valores máis altos usan máis CPU, memoria e largura de banda da rede."
  Download Settings:
    Download Folder: Os vídeos gárdanse neste cartafol. Déixao en branco para usar o cartafol Descargas do sistema.
    Global Additional yt-dlp Arguments: Argumentos adicionais da liña de ordes que se pasan a yt-dlp en todas as descargas, por exemplo --cookies-from-browser firefox.
    Concurrent Downloads: Número máximo de tarefas de yt-dlp que se poden executar á vez.
    Bandwidth Limit: Limita a velocidade de transferencia combinada da cola repartindo o límite entre as tarefas simultáneas. Introduce 0 para non establecer ningún límite.
  External Software Settings:
    yt-dlp Source: OpenTubeX pode usar a instalación de yt-dlp do sistema ou descargar e xestionar unha copia propia, que se garda no cartafol de datos do usuario.
    yt-dlp Channel: Escolle a canle de publicación de yt-dlp que descargará e xestionará OpenTubeX. Recoméndase a estable para a maioría das persoas.
    FFmpeg Source: OpenTubeX pode usar FFmpeg e FFprobe instalados no sistema ou descargar e xestionar compilacións estáticas propias, que se gardan no cartafol de datos do usuario.
    Managed Tool Updates: Escolle se as ferramentas xestionadas se actualizan automaticamente, se preguntan antes de actualizarse ou se só se actualizan cos botóns manuais. As ferramentas que falten descargaranse cando sexan necesarias.
    yt-dlp Executable Path: De maneira predeterminada, OpenTubeX supón que pode atopar yt-dlp mediante a variable de contorno PATH. Se fai falta, podes indicar aquí unha ruta personalizada.
    Cookie Source: Escolle se yt-dlp debe ler un ficheiro de cookies de Netscape ou as cookies dun navegador instalado para a reprodución autenticada.
    Cookie File: Escolle un ficheiro de cookies con formato Netscape para a reprodución autenticada.
    Browser for Cookies: A compatibilidade cos navegadores obtense do executable de yt-dlp seleccionado. OpenTubeX pídelle a yt-dlp que lea este navegador cando se solicita reprodución autenticada.
    Browser Profile: Nome ou cartafol opcional do perfil do navegador. Déixao en branco para usar o perfil ao que se accedeu máis recentemente.
    Always Use Cookies: Usa as cookies configuradas sempre que yt-dlp extraia emisións. Isto non cambia a yt-dlp o método de extracción das emisións. Se se escolle yt-dlp, poden quedar dispoñibles formatos exclusivos da conta, incluída a taxa de bits mellorada de YouTube Premium cando a conta teña acceso.
    FFmpeg Executable Path: FFmpeg é necesario para combinar emisións de vídeo e son separadas e para converter son. De maneira predeterminada, OpenTubeX supón que pode atopar FFmpeg mediante a variable de contorno PATH. Se fai falta, podes indicar aquí unha ruta personalizada.
  Distraction Free Settings:
    Shorten View Counts: Amosa de forma abreviada as cifras de visualizacións e de valoracións positivas dos comentarios que YouTube xa redondeou, por exemplo 14 mil en lugar de 14 000. As cifras exactas sempre se amosan completas.
  Subscription Settings:
    Fetch Feed on Startup: Cando está activado, OpenTubeX obtén automaticamente a fonte das subscricións ao iniciarse e ao abrir unha xanela nova.
    Show New Content Feed: Amosa unha lapela «Novo» cos elementos da fonte das subscricións que non estaban presentes na obtención anterior.
    Show New Content Indicators: Amosa un punto pequeno xunto aos elementos da fonte das subscricións que non estaban presentes na obtención anterior.
    Show Scheduled Live Streams / Premieres First: Mantén as próximas emisións en directo e estreas na parte superior da fonte das subscricións. Se se desactiva, permanecen na posición do anuncio ata que comezan. Actualiza a fonte unha vez despois de desactivar esta opción para obter as datas de anuncio das entradas programadas existentes.
    Auto Refresh Interval: "Frecuencia coa que OpenTubeX actualiza automaticamente a fonte das subscricións mentres a aplicación está aberta. En Android, un intervalo distinto de cero tamén actualiza a fonte mentres a aplicación está pechada."
    Refresh Subscriptions While App Is Closed: "Permite que Android actualice as fontes de subscricións nos intervalos seleccionados mentres OpenTubeX está pechado. Desactiva esta opción para limitar as actualizacións automáticas aos momentos nos que a aplicación está aberta."
  Theme Settings:
    Show Progress as Notification: Amosa unha notificación persistente co progreso en directo das operacións en segundo plano, como as actualizacións das subscricións e as descargas de ferramentas xestionadas, en lugar da barra de progreso global.
    Always Show Scrollbars: Mantén as barras de desprazamento visibles en todo momento. Se se desactiva, esvaecen pouco despois de deixar de mover o rato e reaparecen en canto volves movelo.
    Scroll Speed: Cambia a distancia de desprazamento dos xestos da roda do rato e do panel táctil.
    Use Fixed Tab Width: Dálles a todas as lapelas da barra horizontal a mesma largura en lugar de adaptar o tamaño ao título.
    Use Grid Player Menu: Organiza o menú de configuración do reprodutor de vídeo como unha grade de bloques en lugar dunha lista de filas.
