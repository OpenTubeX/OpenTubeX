Tooltips:
  General Settings:
    Use AI Translation Completions: 使用 AI 產生的文字補齊人工翻譯的缺漏。人工翻譯一律優先採用。
    Update Relative Timestamps: 頁面開啟期間持續更新應用程式中的相對時間戳記。停用後，只有重新載入或再次開啟頁面時才會更新。
    Stream Extraction Method: |
      選擇 OpenTubeX 取得影片串流的方式。選擇 yt-dlp 時，系統必須能使用 yt-dlp。
      使用 yt-dlp 時，影片可能需要更久才會開始播放。
      內建方式不支援在直播和首播中跳轉播放位置。
    Avoid translation: |
      停用 YouTube 自動翻譯影片標題、說明與章節的功能。
      提出過多請求（例如擷取多份清單中的影片標題）可能會暫時
      影響應用程式的穩定性。
    Show Thumbnail Previews: 將滑鼠游標停在影片縮圖上時顯示動畫預覽。
    Startup Behavior: |
      選擇 OpenTubeX 啟動時要執行的動作。
      載入所有分頁會立即還原每個已儲存的分頁，但背景分頁不會自動播放影片。
      載入先前載入的分頁會重新載入 OpenTubeX 關閉時已載入的分頁，其他分頁則維持未載入狀態。
      載入上次使用的分頁會還原前一個工作階段，其他分頁會保持開啟但尚未載入，點選時才會載入。
      以空白工作階段啟動會略過已儲存的分頁並開啟全新視窗。
    Remember Tab Navigation History: 儲存每個分頁的上一頁與下一頁瀏覽記錄，並在 OpenTubeX 重新啟動時還原。
  Proxy Settings:
    IP Block Recovery Script Path: 偵測到 IP 封鎖時要執行的指令碼檔案路徑。OpenTubeX 會等候指令碼執行完畢，再重新載入影片。若已啟用備援功能，則僅在備援也失敗時執行。
  Player Settings:
    Enable Caption Translations: 啟用後，若影片未提供符合偏好字幕語言的原始字幕軌，字幕按鈕與 C 快捷鍵會優先選用自動翻譯的字幕軌。
    Use Quick Playback Speed Bar: 在播放器右側的控制項中顯示快速播放速度列。若已啟用手動儲存各頻道播放速度，速度列也會顯示用來儲存目前頻道播放速度的按鈕。
    Multiply Seek Interval by Playback Rate: 啟用後，快轉與倒轉間隔（方向鍵及 J/L）會乘以目前的播放速率。停用後，無論播放速率為何，間隔都保持不變。
    Show Playback Rate Adjusted Timestamp: 啟用後，若播放速度不是 1x，播放器會在一般時間戳記後以括號顯示依播放速率調整的時間戳記。
    Use YouTube-style Shorts: 在訂閱與頻道頁面上以直向格狀排列顯示 Shorts，並使用 YouTube 風格的 Shorts 播放器。
    Loop Shorts: 啟用後，Shorts 會自動重新播放。停用後，Shorts 會在結束時停止並顯示重播按鈕。
    Show Skip Silence Toggle: 在播放器的設定選單中顯示略過靜音的開關。
    Enable Skip Silence by Default: 新分頁預設啟用略過靜音。在一個分頁中變更此設定不會影響其他分頁。
    Enable Video Zoom: 在播放器的設定選單中顯示縮放控制項，並啟用其鍵盤快捷鍵與平移控制項。
    Voice-over Translation: 當您要求翻譯時，將影片 ID、長度與所選語言傳送至非官方 Yandex 語音翻譯服務。預設為停用。
    Hold to Double Playback Speed: 在播放器上按住空白鍵或滑鼠左鍵，即可暫時將目前的播放速度加倍。
    Ambient Mode: 將影片色彩融合至播放器周圍區域。
    Default Volume: 啟用「記住音量」時無法使用。關閉「記住音量」，即可為每部影片設定固定的起始音量。
    Parallel Segment Loading: |
      播放前要同時預先載入的影片與音訊片段數量。
      較高的值可能有助於改善緩慢或不穩定的連線，但會使用更多頻寬與記憶體。
      也可能使「自動」低估連線速度並選擇較低的畫質。
      限制為一次只能提出一項請求的串流會忽略此設定。
  Download Settings:
    Download Folder: 影片會儲存至此資料夾。留白可使用系統的「下載」資料夾。
    Global Additional yt-dlp Arguments: 每次下載時傳遞給 yt-dlp 的額外命令列引數，例如 --cookies-from-browser firefox。
    Concurrent Downloads: 可同時執行的 yt-dlp 工作數量上限。
    Bandwidth Limit: 將此上限分配給同時執行的工作，以限制佇列的總傳輸速率。輸入 0 表示不設限。
  External Software Settings:
    yt-dlp Source: OpenTubeX 可使用系統中安裝的 yt-dlp，也可下載並管理自己的 yt-dlp 副本。該副本會儲存在使用者資料目錄中。
    yt-dlp Channel: 選擇 OpenTubeX 要下載及管理的 yt-dlp 發行頻道。建議大多數使用者選用 Stable。
    FFmpeg Source: OpenTubeX 可使用系統中安裝的 FFmpeg 與 FFprobe，也可下載並管理自己的靜態組建。這些組建會儲存在使用者資料目錄中。
    Managed Tool Updates: 選擇受管理工具要自動更新、更新前詢問，或只透過手動按鈕更新。需要缺少的工具時仍會下載。
    yt-dlp Executable Path: OpenTubeX 預設會假設可透過 PATH 環境變數找到 yt-dlp。如有需要，可在此設定自訂路徑。
    Cookie Source: 選擇 yt-dlp 要讀取 Netscape Cookie 檔案，還是已安裝瀏覽器中的 Cookie，以進行驗證後播放。
    Cookie File: 選擇 Netscape 格式的 Cookie 檔案，以進行驗證後播放。
    Browser for Cookies: 瀏覽器支援資訊是從所選的 yt-dlp 執行檔讀取。要求驗證後播放時，OpenTubeX 會要求 yt-dlp 讀取此瀏覽器。
    Browser Profile: 選填的瀏覽器設定檔名稱或資料夾。留白可使用最近存取的設定檔。
    Always Use Cookies: 每當 yt-dlp 擷取串流時，都使用已設定的 Cookie。這不會將串流擷取方式切換為 yt-dlp。選用 yt-dlp 後，可能會提供僅限帳戶使用的格式，包括帳戶有權使用時的 YouTube Premium 增強型位元率。
    FFmpeg Executable Path: 合併分開的影片與音訊串流及轉換音訊時需要 FFmpeg。OpenTubeX 預設會假設可透過 PATH 環境變數找到 FFmpeg。如有需要，可在此設定自訂路徑。
  Distraction Free Settings:
    Shorten View Counts: 將 YouTube 已四捨五入的觀看次數與留言按讚數以縮寫顯示，例如以 14K 取代 14,000。精確數字一律完整顯示。
  Subscription Settings:
    Fetch Feed on Startup: 啟用後，OpenTubeX 會在啟動及開啟新視窗時自動擷取您的訂閱動態消息。
    Show New Content Feed: 顯示「新增」分頁，其中包含上次擷取時尚未出現的訂閱動態消息項目。
    Show New Content Indicators: 在上次擷取時尚未出現的訂閱動態消息項目旁顯示小圓點。
    Show Scheduled Live Streams / Premieres First: 將即將開始的直播與首播保留在訂閱動態消息頂端。停用後，這些項目會留在公告時的位置，直到開始為止。停用後請重新整理一次訂閱動態消息，以取得現有排程項目的公告日期。
    Auto Refresh Interval: 應用程式開啟時，OpenTubeX 自動重新整理訂閱動態消息的頻率。
  Theme Settings:
    Show Progress as Notification: 以持續顯示的通知呈現背景作業的即時進度（例如重新整理訂閱與下載受管理工具），而不使用全域進度列。
    Always Show Scrollbars: 讓捲動軸隨時保持顯示。停用後，停止移動滑鼠不久便會淡出，再次移動滑鼠時則會立即顯示。
    Scroll Speed: 變更滑鼠滾輪和觸控板滾輪手勢的捲動距離。
    Use Fixed Tab Width: 水平分頁列中的每個分頁使用相同寬度，而不依標題調整寬度。
    Use Grid Player Menu: 將影片播放器的設定選單排列成格狀方塊，而非逐列清單。
