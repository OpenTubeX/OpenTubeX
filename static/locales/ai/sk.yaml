Tooltips:
  General Settings:
    Use AI Translation Completions: Doplní medzery v ľudských prekladoch textom vytvoreným umelou inteligenciou. Ľudské preklady majú vždy prednosť.
    Update Relative Timestamps: Aktualizuje relatívne časové údaje v celej aplikácii, kým je stránka otvorená. Ak je táto možnosť vypnutá, aktualizujú sa až po opätovnom načítaní alebo otvorení stránky.
    Stream Extraction Method: |
      Vyberte spôsob, akým OpenTubeX získava streamy videí. Ak vyberiete yt-dlp, musí byť dostupný.
      Pri použití yt-dlp môže spustenie videa trvať dlhšie.
      Vstavaný spôsob nepodporuje posúvanie v živých prenosoch a premiérach.
    Avoid translation: |
      Vypne automatický preklad názvu, opisu a kapitol videa službou YouTube.
      Príliš veľa požiadaviek, napríklad načítavanie názvov videí v zoznamoch, môže dočasne
      ovplyvniť spoľahlivosť aplikácie.
    Show Thumbnail Previews: Pri ukázaní na miniatúru videa zobrazí animovaný náhľad.
    Startup Behavior: |
      Vyberte, čo OpenTubeX urobí pri spustení.
      Možnosť Načítať všetky karty okamžite obnoví každú uloženú kartu, ale videá na kartách na pozadí sa automaticky neprehrajú.
      Možnosť Načítať predtým načítané karty znova načíta karty, ktoré boli načítané pri ukončení OpenTubeX, a ostatné ponechá uvoľnené.
      Možnosť Načítať naposledy aktívnu kartu obnoví predchádzajúcu reláciu. Ostatné karty otvorí, ale ponechá ich uvoľnené, kým na ne nekliknete.
      Možnosť Začať s prázdnou reláciou preskočí uložené karty a otvorí nové prázdne okno.
    Remember Tab Navigation History: História prechádzania späť a dopredu sa pre každú kartu uloží a obnoví po opätovnom spustení OpenTubeX.
  Proxy Settings:
    IP Block Recovery Script Path: Cesta k súboru skriptu, ktorý sa spustí po zistení zablokovania IP adresy. OpenTubeX počká na jeho dokončenie a potom znova načíta video. Ak je zapnutý záložný backend, skript sa spustí až po jeho zlyhaní.
  Player Settings:
    Enable Caption Translations: Ak video neposkytuje pôvodnú stopu v uprednostnenom jazyku titulkov, tlačidlo titulkov a klávesová skratka C po zapnutí uprednostnia automaticky preloženú stopu v tomto jazyku.
    Use Quick Playback Speed Bar: V pravej časti ovládacích prvkov prehrávača zobrazí panel rýchlej zmeny rýchlosti prehrávania. Ak je zapnuté ručné ukladanie rýchlosti prehrávania pre jednotlivé kanály, panel obsahuje aj tlačidlo na uloženie rýchlosti aktuálneho kanála.
    Multiply Seek Interval by Playback Rate: Po zapnutí sa intervaly posunu pomocou klávesov so šípkami a J/L násobia aktuálnou rýchlosťou prehrávania. Po vypnutí zostávajú rovnaké bez ohľadu na rýchlosť prehrávania.
    Show Playback Rate Adjusted Timestamp: Ak je táto možnosť zapnutá a rýchlosť prehrávania sa líši od 1×, prehrávač za bežným časovým údajom zobrazí v zátvorkách čas upravený podľa rýchlosti prehrávania.
    Use YouTube-style Shorts: Na stránkach odberov a kanálov zobrazí krátke videá v mriežke na výšku a použije prehrávač v štýle YouTube Shorts.
    Loop Shorts: Po zapnutí sa krátke videá automaticky spustia odznova. Po vypnutí sa na konci zastavia a zobrazia tlačidlo opätovného prehrania.
    Show Skip Silence Toggle: V ponuke nastavení prehrávača zobrazí prepínač preskakovania ticha.
    Enable Skip Silence by Default: Zapne preskakovanie ticha na nových kartách. Zmena na jednej karte neovplyvní ostatné karty.
    Enable Video Zoom: V ponuke nastavení prehrávača zobrazí ovládací prvok Priblíženie a zapne jeho klávesové skratky a ovládanie posúvania obrazu.
    Voice-over Translation: Po vyžiadaní prekladu odošle ID videa, jeho trvanie a vybraný jazyk neoficiálnej službe Yandex na preklad hlasového komentára. Predvolene je táto možnosť vypnutá.
    Hold to Double Playback Speed: Podržaním medzerníka alebo ľavého tlačidla myši nad prehrávačom dočasne zdvojnásobíte aktuálnu rýchlosť prehrávania.
    Ambient Mode: Rozšíri farby videa do oblasti okolo prehrávača.
    Default Volume: Táto možnosť je vypnutá, kým je zapnuté zapamätanie hlasitosti. Ak chcete nastaviť pevnú počiatočnú hlasitosť každého videa, vypnite zapamätanie hlasitosti.
    Parallel Segment Loading: |
      Počet obrazových a zvukových segmentov, ktoré sa majú naraz načítať vopred.
      Vyššie hodnoty môžu pomôcť pri pomalom alebo nestabilnom pripojení, ale využívajú väčšiu šírku pásma a viac pamäte.
      Môžu tiež spôsobiť, že automatický režim podhodnotí rýchlosť pripojenia a vyberie nižšiu kvalitu.
      Streamy obmedzené na jednu požiadavku naraz toto nastavenie ignorujú.
  Download Settings:
    Download Folder: Videá sa ukladajú do tohto priečinka. Ak chcete použiť systémový priečinok Stiahnuté súbory, ponechajte pole prázdne.
    Global Additional yt-dlp Arguments: Dodatočné argumenty príkazového riadka odovzdané nástroju yt-dlp pri každom sťahovaní, napríklad --cookies-from-browser firefox.
    Concurrent Downloads: Maximálny počet úloh yt-dlp, ktoré môžu bežať naraz.
    Bandwidth Limit: Obmedzí spoločnú prenosovú rýchlosť poradia rozdelením limitu medzi súbežné úlohy. Hodnota 0 znamená bez obmedzenia.
  External Software Settings:
    yt-dlp Source: OpenTubeX môže použiť yt-dlp nainštalovaný v systéme alebo stiahnuť a spravovať vlastnú kópiu uloženú v priečinku používateľských údajov.
    yt-dlp Channel: Vyberte kanál vydaní yt-dlp, ktorý bude OpenTubeX sťahovať a spravovať. Pre väčšinu používateľov sa odporúča kanál Stable.
    FFmpeg Source: OpenTubeX môže použiť FFmpeg a FFprobe nainštalované v systéme alebo stiahnuť a spravovať ich vlastné statické zostavy uložené v priečinku používateľských údajov.
    Managed Tool Updates: Vyberte, či sa majú spravované nástroje aktualizovať automaticky, či sa má aplikácia pred aktualizáciou opýtať alebo či sa majú aktualizovať len ručnými tlačidlami. Chýbajúce nástroje sa v prípade potreby aj tak stiahnu.
    yt-dlp Executable Path: OpenTubeX predvolene predpokladá, že yt-dlp možno nájsť cez premennú prostredia PATH. V prípade potreby tu môžete nastaviť vlastnú cestu.
    Cookie Source: Vyberte, či má yt-dlp pri overenom prehrávaní čítať súbor cookie vo formáte Netscape alebo súbory cookie z nainštalovaného prehliadača.
    Cookie File: Vyberte súbor cookie vo formáte Netscape na overené prehrávanie.
    Browser for Cookies: Podpora prehliadačov sa načíta z vybraného spustiteľného súboru yt-dlp. Pri požiadavke na overené prehrávanie OpenTubeX požiada yt-dlp, aby načítal údaje z tohto prehliadača.
    Browser Profile: Voliteľný názov alebo priečinok profilu prehliadača. Ak chcete použiť naposledy otvorený profil, ponechajte pole prázdne.
    Always Use Cookies: Nastavené súbory cookie sa použijú pri každom získavaní streamov cez yt-dlp. Spôsob získavania streamov sa tým nezmení na yt-dlp. Ak je vybraný yt-dlp, môžu byť dostupné formáty len pre účet vrátane vyššieho dátového toku YouTube Premium, ak k nemu má účet prístup.
    FFmpeg Executable Path: FFmpeg je potrebný na spájanie samostatných obrazových a zvukových streamov a na prevod zvuku. OpenTubeX predvolene predpokladá, že FFmpeg možno nájsť cez premennú prostredia PATH. V prípade potreby tu môžete nastaviť vlastnú cestu.
  Distraction Free Settings:
    Shorten View Counts: Počty pozretí a označení Páči sa mi to pri komentároch zobrazí v skrátenej podobe, ktorú už zaokrúhlila služba YouTube, napríklad 14 tis. namiesto 14 000. Presné počty sa vždy zobrazia celé.
  Subscription Settings:
    Fetch Feed on Startup: Po zapnutí OpenTubeX automaticky načíta kanál odberov pri spustení a otvorení nového okna.
    Show New Content Feed: Zobrazí kartu Nové s položkami kanála odberov, ktoré pri predchádzajúcom načítaní neboli prítomné.
    Show New Content Indicators: Vedľa položiek kanála odberov, ktoré pri predchádzajúcom načítaní neboli prítomné, zobrazí malú bodku.
    Show Scheduled Live Streams / Premieres First: Ponechá nadchádzajúce živé prenosy a premiéry v hornej časti kanála odberov. Po vypnutí zostanú až do začiatku na pozícii podľa oznámenia. Po vypnutí raz obnovte kanál odberov, aby sa načítali dátumy oznámenia existujúcich naplánovaných položiek.
    Auto Refresh Interval: Určuje, ako často OpenTubeX automaticky obnoví kanál odberov, kým je aplikácia otvorená.
  Theme Settings:
    Show Progress as Notification: Namiesto globálneho ukazovateľa priebehu zobrazí trvalé oznámenie s aktuálnym priebehom operácií na pozadí, napríklad obnovovania odberov a sťahovania spravovaných nástrojov.
    Always Show Scrollbars: Posúvače zostanú stále viditeľné. Po vypnutí krátko po zastavení pohybu myši zmiznú a pri ďalšom pohybe sa znova zobrazia.
    Scroll Speed: Mení vzdialenosť posúvania gestami kolieska myši a touchpadu.
    Use Fixed Tab Width: Všetkým kartám na vodorovnom paneli priradí rovnakú šírku namiesto prispôsobenia podľa ich názvu.
    Use Grid Player Menu: Usporiada ponuku nastavení prehrávača videa do mriežky dlaždíc namiesto zoznamu riadkov.
