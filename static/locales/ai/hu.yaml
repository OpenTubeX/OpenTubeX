Tooltips:
  General Settings:
    Use AI Translation Completions: Az emberi fordítások hiányzó részeinek kitöltése mesterséges intelligenciával létrehozott szöveggel. Az emberi fordítások mindig elsőbbséget élveznek.
    Update Relative Timestamps: A relatív időbélyegek frissítése az egész alkalmazásban, amíg nyitva van egy oldal. Kikapcsolva csak az oldal újratöltésekor vagy újbóli megnyitásakor frissülnek.
    Stream Extraction Method: |
      Válassza ki, hogyan szerezze be az OpenTubeX a videó-adatfolyamokat. A yt-dlp használatához annak elérhetőnek kell lennie.
      A videók indítása tovább tarthat a yt-dlp használatakor.
      A beépített módszer élő közvetítéseknél és premiereknél nem támogatja a tekerést.
    Avoid translation: |
      A videócímek, -leírások és -fejezetek YouTube általi automatikus fordításának kikapcsolása.
      A túl sok kérés, például a videócímek lekérése több listán keresztül, átmenetileg
      ronthatja az alkalmazás megbízhatóságát.
    Show Thumbnail Previews: Animált előnézet megjelenítése, amikor az egér a videó bélyegképe fölött van.
    Startup Behavior: |
      Válassza ki, mit tegyen az OpenTubeX indításkor.
      Az összes lap betöltése azonnal visszaállít minden mentett lapot, de a háttérben lévő lapokon nem indulnak el automatikusan a videók.
      A korábban betöltött lapok betöltése újratölti az OpenTubeX bezárásakor betöltött lapokat, a többit pedig betöltetlenül hagyja.
      A legutóbb aktív lap betöltése visszaállítja az előző munkamenetet, a többi lapot pedig nyitva, de betöltetlenül hagyja; azok kattintáskor töltődnek be.
      Az üres munkamenet indítása kihagyja a mentett lapokat, és új ablakot nyit.
    Remember Tab Navigation History: Az egyes lapok vissza- és előrelépési előzményeinek mentése, majd visszaállítása az OpenTubeX újraindításakor.
  Proxy Settings:
    IP Block Recovery Script Path: Az IP-cím letiltásának észlelésekor futtatandó parancsfájl elérési útja. Az OpenTubeX megvárja a befejezését, majd újratölti a videót. Ha a tartalék módszer engedélyezett, csak akkor fut le, ha az is sikertelen.
  Player Settings:
    Enable Caption Translations: Bekapcsolva a feliratok gomb és a C billentyűparancs az előnyben részesített feliratnyelvre automatikusan lefordított sávot választja, ha a videóhoz nincs ezen a nyelven eredeti sáv.
    Use Quick Playback Speed Bar: Gyors lejátszásisebesség-sáv megjelenítése a lejátszó jobb oldali vezérlői között. Ha engedélyezett a lejátszási sebesség csatornánkénti kézi mentése, a sávon az aktuális csatorna sebességének mentésére szolgáló gomb is megjelenik.
    Multiply Seek Interval by Playback Rate: Bekapcsolva a tekerési időközök (nyílbillentyűk és J/L) az aktuális lejátszási sebességgel szorzódnak. Kikapcsolva az időközök a lejátszási sebességtől függetlenül változatlanok maradnak.
    Show Playback Rate Adjusted Timestamp: Bekapcsolva, ha a lejátszási sebesség eltér az 1x értéktől, a lejátszó a szokásos időbélyeg után zárójelben megjeleníti a lejátszási sebességhez igazított időbélyeget.
    Use YouTube-style Shorts: A Shorts-videók álló tájolású rácsban jelennek meg a feliratkozások és a csatornák oldalain, és a YouTube-stílusú Shorts-lejátszót használják.
    Loop Shorts: Bekapcsolva a Shorts-videók automatikusan újraindulnak. Kikapcsolva a végükön megállnak, és megjelenik az újrajátszás gomb.
    Show Skip Silence Toggle: A csend átugrására szolgáló kapcsoló megjelenítése a lejátszó beállítási menüjében.
    Enable Skip Silence by Default: A csend átugrásának engedélyezése az új lapokon. Az egyik lapon végzett módosítás nincs hatással a többi lapra.
    Enable Video Zoom: A nagyítási vezérlő megjelenítése a lejátszó beállítási menüjében, valamint a hozzá tartozó billentyűparancsok és pásztázási vezérlők engedélyezése.
    Voice-over Translation: Fordítás kérésekor elküldi a videó azonosítóját, hosszát és a kiválasztott nyelvet a Yandex nem hivatalos szinkronfordítási szolgáltatásának. Alapértelmezés szerint ki van kapcsolva.
    Hold to Double Playback Speed: Tartsa lenyomva a szóközbillentyűt vagy a bal egérgombot a lejátszó fölött az aktuális lejátszási sebesség ideiglenes megduplázásához.
    Ambient Mode: A videó színeinek kiterjesztése a lejátszó körüli területre.
    Default Volume: Nem érhető el, amíg a hangerő megjegyzése engedélyezett. Kapcsolja ki a hangerő megjegyzését, hogy minden videóhoz rögzített kezdő hangerőt állíthasson be.
    Parallel Segment Loading: |
      A lejátszás előtt egyszerre betöltendő videó- és hangszegmensek száma.
      A nagyobb érték lassú vagy instabil kapcsolatnál segíthet, de több sávszélességet és memóriát használ.
      Emiatt az Auto alábecsülheti a kapcsolat sebességét, és gyengébb minőséget választhat.
      Az egyszerre egy kérésre korlátozott adatfolyamok figyelmen kívül hagyják ezt a beállítást.
  Download Settings:
    Download Folder: A videók ebbe a mappába kerülnek. Hagyja üresen a rendszer Letöltések mappájának használatához.
    Global Additional yt-dlp Arguments: Minden letöltésnél a yt-dlp számára átadott további parancssori argumentumok, például --cookies-from-browser firefox.
    Concurrent Downloads: Az egyszerre futtatható yt-dlp-feladatok legnagyobb száma.
    Bandwidth Limit: A várólista összesített átviteli sebességének korlátozása az érték egyidejű feladatok közötti elosztásával. A 0 korlátlan sebességet jelent.
  External Software Settings:
    yt-dlp Source: Az OpenTubeX használhatja a rendszerre telepített yt-dlp-t, vagy letöltheti és kezelheti a saját, a felhasználói adatok mappájában tárolt példányát.
    yt-dlp Channel: Válassza ki, melyik yt-dlp kiadási csatornát töltse le és kezelje az OpenTubeX. A legtöbb felhasználónak a Stable ajánlott.
    FFmpeg Source: Az OpenTubeX használhatja a rendszerre telepített FFmpeg és FFprobe programot, vagy letöltheti és kezelheti a saját, a felhasználói adatok mappájában tárolt statikus összeállításait.
    Managed Tool Updates: Válassza ki, hogy a kezelt eszközök automatikusan frissüljenek, frissítés előtt kérdezzenek rá, vagy csak a kézi gombokkal frissüljenek. A hiányzó eszközök szükség esetén továbbra is letöltődnek.
    yt-dlp Executable Path: Az OpenTubeX alapértelmezés szerint azt feltételezi, hogy a yt-dlp megtalálható a PATH környezeti változó alapján. Szükség esetén itt egyéni elérési út adható meg.
    Cookie Source: Válassza ki, hogy a yt-dlp egy Netscape cookie-fájlból vagy egy telepített böngészőből olvassa-e be a cookie-kat a hitelesített lejátszáshoz.
    Cookie File: Válasszon Netscape-formátumú cookie-fájlt a hitelesített lejátszáshoz.
    Browser for Cookies: A böngészőtámogatás adatait a kiválasztott yt-dlp végrehajtható fájlból olvassa be az alkalmazás. Hitelesített lejátszás kérésekor az OpenTubeX arra utasítja a yt-dlp-t, hogy ebből a böngészőből olvassa be a cookie-kat.
    Browser Profile: Nem kötelező böngészőprofilnév vagy -mappa. Hagyja üresen a legutóbb használt profil kiválasztásához.
    Always Use Cookies: A beállított cookie-k használata minden alkalommal, amikor a yt-dlp adatfolyamokat nyer ki. Ez nem állítja át az adatfolyam-kinyerési módszert yt-dlp-re. A yt-dlp kiválasztásával csak fiókkal elérhető formátumok is megjelenhetnek, köztük a YouTube Premium nagyobb bitrátája, ha a fiók hozzáfér.
    FFmpeg Executable Path: Az FFmpeg szükséges a különálló videó- és hangadatfolyamok egyesítéséhez, valamint a hangkonvertáláshoz. Az OpenTubeX alapértelmezés szerint azt feltételezi, hogy az FFmpeg megtalálható a PATH környezeti változó alapján. Szükség esetén itt egyéni elérési út adható meg.
  Distraction Free Settings:
    Shorten View Counts: A YouTube által már kerekített megtekintés- és hozzászóláskedvelési számok rövidített megjelenítése, például 14 E a 14 000 helyett. A pontos számok mindig teljesen jelennek meg.
  Subscription Settings:
    Fetch Feed on Startup: Bekapcsolva az OpenTubeX automatikusan lekéri a feliratkozási hírfolyamot indításkor és új ablak megnyitásakor.
    Show New Content Feed: Egy Új lap megjelenítése azokkal a feliratkozási hírfolyamelemekkel, amelyek az előző lekéréskor még nem szerepeltek.
    Show New Content Indicators: Egy kis pont megjelenítése azok mellett a feliratkozási hírfolyamelemek mellett, amelyek az előző lekéréskor még nem szerepeltek.
    Show Scheduled Live Streams / Premieres First: A közelgő élő közvetítések és premierek a feliratkozási hírfolyam tetején maradnak. Kikapcsolva a kezdésükig a bejelentésük helyén maradnak. Kikapcsolás után frissítse egyszer a feliratkozási hírfolyamot a meglévő ütemezett bejegyzések bejelentési dátumának lekéréséhez.
    Auto Refresh Interval: Milyen gyakran frissítse automatikusan az OpenTubeX a feliratkozási hírfolyamot, amíg az alkalmazás nyitva van.
  Theme Settings:
    Show Progress as Notification: Állandó értesítés megjelenítése a háttérműveletek, például a feliratkozások frissítése és a kezelt eszközök letöltése valós idejű állapotával a globális folyamatjelző helyett.
    Always Show Scrollbars: A görgetősávok állandó megjelenítése. Kikapcsolva röviddel az egér mozgatásának befejezése után elhalványulnak, és az egér újbóli megmozdításakor ismét megjelennek.
    Scroll Speed: Megváltoztatja, hogy az egérgörgő és az érintőpad kézmozdulatai milyen messzire görgessenek.
    Use Fixed Tab Width: Minden lap azonos szélességű lesz a vízszintes lapsávon, a címükhöz igazodó méretezés helyett.
    Use Grid Player Menu: A videólejátszó beállítási menüjének elrendezése csempékből álló rácsként, sorok listája helyett.
The playlist is at the beginning. Enable loop to continue playing: A lejátszási lista elején jár. Kapcsolja be az ismétlést a lejátszás folytatásához
