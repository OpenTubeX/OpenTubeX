    Session Search Cache: Pamięć podręczna wyszukiwania w sesji
    In Memory: W pamięci operacyjnej
    Session Search Cache Description: '{count} wyszukiwanie zapisano w pamięci, aby przyspieszyć powrót do poprzedniej strony. Pamięć zostanie wyczyszczona po zamknięciu OpenTubeX. | {count} wyszukiwania zapisano w pamięci, aby przyspieszyć powrót do poprzedniej strony. Pamięć zostanie wyczyszczona po zamknięciu OpenTubeX. | {count} wyszukiwań zapisano w pamięci, aby przyspieszyć powrót do poprzedniej strony. Pamięć zostanie wyczyszczona po zamknięciu OpenTubeX.'
    Clear Session Search Cache: Wyczyść pamięć podręczną wyszukiwania w sesji
    Clear Session Search Cache Confirmation: Wyczyścić pamięć podręczną wyszukiwania w sesji?
    Session Search Cache Effect: Zapisane strony wyników zostaną usunięte. Historia wyszukiwania nie zostanie zmieniona.
    HTTP Cache: Pamięć podręczna HTTP
    HTTP Cache Description: Electron zapisuje odpowiedzi sieciowe na dysku, aby kolejne żądania nie wymagały ponownego pobierania tych samych danych. OpenTubeX odtworzy tę pamięć w razie potrzeby.
    Managed By Electron: Zarządzane przez Electron
    Clear HTTP Cache: Wyczyść pamięć podręczną HTTP
    Clear HTTP Cache Confirmation: Wyczyścić pamięć podręczną HTTP programu Electron?
    HTTP Cache Effect: Podczas jej odtwarzania obrazy i inne zasoby sieciowe mogą raz wczytać się wolniej.
    Tab Image Cache: Miniatury kart i awatary kanałów
    Tab Image Cache Description: Przechowuje obrazy podglądu i awatary kanałów dla otwartych i przywróconych kart. OpenTubeX odtworzy je podczas korzystania z kart.
    Clear Tab Image Cache: Wyczyść pamięć podręczną obrazów kart
    Clear Tab Image Cache Confirmation: Wyczyścić miniatury kart i awatary kanałów?
    Tab Image Cache Effect: Obrazy kart mogą na chwilę zniknąć. Zostaną odtworzone podczas korzystania z kart.
    Playback Caches: Pamięci podręczne odtwarzania
    Playback Caches Description: Przechowuje między sesjami adresy URL strumieni z yt-dlp oraz pliki odtwarzacza YouTube. Pamięć adresów URL dotyczy tylko strumieni pobieranych za pomocą yt-dlp.
    Playback URL Cache Entry Size: Limit pamięci adresów URL strumieni z yt-dlp
    Playback URL Cache Entry Size Tooltip: Określa maksymalny rozmiar każdego zapisanego wpisu strumienia z yt-dlp. Ustaw 0 MB, aby wyłączyć zapisywanie strumieni z yt-dlp między sesjami.
    Clear Playback Caches: Wyczyść pamięci podręczne odtwarzania
    Clear Playback Caches Confirmation: Wyczyścić pamięci podręczne yt-dlp i odtwarzacza?
    Playback Caches Effect: Następne lokalne odtwarzanie może potrwać dłużej, ponieważ dane strumienia i odtwarzacza trzeba będzie pobrać ponownie.
    Clear Cache: Wyczyść pamięć podręczną
    History Data: Zapisane historie
    Video Metadata Description: Przechowuje poprzednie tytuły, miniatury i opisy obsługiwanych filmów. Po usunięciu nie będzie można odtworzyć starszych wersji.
    Video Metadata Effect: Zapisane wersje metadanych zostaną trwale usunięte. Bieżące informacje o filmie nadal będzie można pobrać ponownie.
    Watch History: Historia i statystyki oglądania
    Watch History Description: Historia oglądania zapisuje obejrzane filmy i postęp. Statystyki zawierają dzienny czas oglądania. Okres przechowywania dotyczy tylko historii oglądania.
    Clear Watch Statistics: Wyczyść statystyki oglądania
    Watch History Effect: Wpisy obejrzanych filmów i zapisany postęp zostaną usunięte. Statystyki oglądania pozostaną bez zmian.
    Clear Watch Statistics Confirmation: Usunąć wszystkie statystyki oglądania?
    Watch Statistics Effect: Dzienny czas oglądania zostanie usunięty. Historia oglądania pozostanie bez zmian.
    Search History: Historia wyszukiwania
    Search History Description: Przechowuje wyszukiwania wybrane do zapamiętania.
    Delete Search History: Usuń historię wyszukiwania
    Delete Search History Confirmation: Usunąć całą zapisaną historię wyszukiwania?
    Search History Effect: Znikną zapisane podpowiedzi z poprzednich wyszukiwań. Pamięć podręczna bieżącej sesji pozostanie bez zmian.
    Other User Data: Pozostałe dane użytkownika
    Other Profile Files: Pozostałe pliki profilu
    Other Profile Files Hint: Kopie zapasowe, pliki tymczasowe i wpisy profilu, których OpenTubeX jeszcze nie rozpoznaje.
    Subscriptions And Profiles: Subskrypcje i profile
    Subscriptions And Profiles Description: Przechowuje subskrybowane kanały, nazwy profili i ich zawartość.
    Subscriptions And Profiles Effect: Wszystkie subskrypcje i dodatkowe profile zostaną trwale usunięte. Pamięć podręczna kanału również zostanie wyczyszczona.
    Playlists Description: Przechowuje nazwy i opisy playlist oraz zapisane filmy.
    Playlists Effect: Każda playlista wraz z listą zapisanych filmów zostanie trwale usunięta. Pobrane pliki multimedialne pozostaną na dysku.
    Settings And Sessions: Ustawienia, sesje kart i przypomnienia
    Settings And Sessions Description: Przechowuje ustawienia aplikacji, karty możliwe do przywrócenia i przypomnienia o transmisjach na żywo. Otwórz katalog profilu, aby przejrzeć te pliki lub utworzyć ich kopię zapasową. Ta strona ich nie usuwa.
