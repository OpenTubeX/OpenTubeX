Tooltips:
  General Settings:
    Use AI Translation Completions: Uzupełnia luki w tłumaczeniach tekstem wygenerowanym przez AI. Tłumaczenia wykonane przez ludzi zawsze mają pierwszeństwo.
    Update Relative Timestamps: Aktualizuje względne znaczniki czasu w całej aplikacji, dopóki strona pozostaje otwarta. Po wyłączeniu są aktualizowane dopiero po ponownym wczytaniu lub otwarciu strony.
    Stream Extraction Method: |
      Wybierz sposób pobierania strumieni filmów przez OpenTubeX. Po wybraniu yt-dlp musi być dostępny.
      Uruchamianie filmów za pomocą yt-dlp może trwać dłużej.
      Wbudowany mechanizm nie obsługuje przewijania transmisji na żywo ani premier.
    Show Thumbnail Previews: Pokazuje animowany podgląd po najechaniu na miniaturę filmu.
  Player Settings:
    Continue Playback When Screen Is Locked: 'Utrzymuje odtwarzanie dźwięku w tle i udostępnia elementy sterowania multimediami Androida. Wyłącz, aby wstrzymywać odtwarzanie, gdy aplikacja nie jest już widoczna.'
    Use YouTube-style Shorts: Wyświetla Shorts w pionowej siatce na stronach subskrypcji i kanałów oraz używa odtwarzacza Shorts w stylu YouTube.
    Loop Shorts: Po włączeniu Shorts są automatycznie odtwarzane od początku. Po wyłączeniu zatrzymują się na końcu i wyświetlają przycisk ponownego odtwarzania.
    Enable Skip Silence by Default: Włącza pomijanie ciszy na nowych kartach. Zmiana na jednej karcie nie wpływa na pozostałe.
    Enable Video Zoom: Wyświetla opcję powiększenia w menu ustawień odtwarzacza oraz włącza jej skróty klawiszowe i sterowanie przesuwaniem obrazu.
    Voice-over Translation: Po wybraniu tłumaczenia wysyła identyfikator i czas trwania filmu oraz wybrany język do nieoficjalnej usługi tłumaczenia lektorskiego Yandex. Funkcja jest domyślnie wyłączona.
    Parallel Segment Loading: |
      Liczba segmentów obrazu i dźwięku wczytywanych jednocześnie przed odtwarzaniem.
      Wyższe wartości mogą pomóc przy wolnym lub niestabilnym połączeniu, ale zwiększają użycie transferu i pamięci.
      Mogą też sprawić, że tryb Auto zaniży prędkość połączenia i wybierze niższą jakość.
      To ustawienie nie wpływa na strumienie ograniczone do jednego żądania naraz.
    Preload Upcoming Videos: "Pobiera i zapisuje w pamięci podręcznej adresy yt-dlp następnych filmów. Kolejka ma pierwszeństwo przed playlistami i rekomendacjami."
    Upcoming Videos to Preload: "Maksymalna liczba następnych filmów, których adresy yt-dlp są pobierane w tle."
    Concurrent Preloads: "Maksymalna liczba procesów yt-dlp używanych do jednoczesnego wstępnego ładowania filmów. Wyższe wartości zużywają więcej procesora, pamięci i przepustowości sieci."
  Download Settings:
    Global Additional yt-dlp Arguments: Dodatkowe argumenty wiersza poleceń przekazywane do yt-dlp przy każdym pobieraniu, na przykład --cookies-from-browser firefox.
    Concurrent Downloads: Maksymalna liczba zadań yt-dlp wykonywanych jednocześnie.
    Bandwidth Limit: Ogranicza łączną szybkość transferu kolejki, dzieląc limit między równoczesne zadania. Wpisz 0, aby wyłączyć limit.
  External Software Settings:
    Managed Tool Updates: Wybierz, czy zarządzane narzędzia mają aktualizować się automatycznie, pytać przed aktualizacją czy korzystać tylko z przycisków aktualizacji ręcznej. Brakujące narzędzia nadal będą pobierane, gdy okażą się potrzebne.
    Cookie Source: Wybierz, czy yt-dlp ma odczytywać plik ciasteczek w formacie Netscape, czy ciasteczka z zainstalowanej przeglądarki na potrzeby uwierzytelnionego odtwarzania.
    Cookie File: Wybierz plik ciasteczek w formacie Netscape na potrzeby uwierzytelnionego odtwarzania.
    Browser for Cookies: Obsługiwane przeglądarki są odczytywane z wybranego pliku wykonywalnego yt-dlp. Gdy potrzebne jest uwierzytelnione odtwarzanie, OpenTubeX zleca yt-dlp odczytanie ciasteczek z tej przeglądarki.
    Browser Profile: Opcjonalna nazwa lub folder profilu przeglądarki. Pozostaw puste pole, aby użyć ostatnio otwieranego profilu.
    Always Use Cookies: Używa skonfigurowanych ciasteczek przy każdym pobieraniu strumieni przez yt-dlp. Nie zmienia to metody pobierania strumienia na yt-dlp. Po wybraniu yt-dlp mogą być dostępne formaty przeznaczone tylko dla kont, w tym wyższa szybkość transmisji bitów YouTube Premium, jeśli konto ma do niej dostęp.
  Distraction Free Settings:
    Shorten View Counts: Pokazuje liczbę wyświetleń i polubień komentarzy w skróconej postaci zaokrąglonej przez YouTube, na przykład 14 tys. zamiast 14 000. Dokładne wartości są zawsze wyświetlane w całości.
  Subscription Settings:
    Show Scheduled Live Streams / Premieres First: Umieszcza nadchodzące transmisje na żywo i premiery na górze kanału subskrypcji. Po wyłączeniu pozostają na pozycji zgodnej z datą ogłoszenia aż do rozpoczęcia. Po wyłączeniu odśwież kanał subskrypcji, aby pobrać daty ogłoszenia istniejących zaplanowanych pozycji.
    Refresh Subscriptions While App Is Closed: "Pozwala systemowi Android odświeżać kanały subskrypcji w wybranych odstępach czasu, gdy OpenTubeX jest zamknięty. Wyłącz tę opcję, aby automatyczne odświeżanie działało tylko przy otwartej aplikacji."
  Theme Settings:
    Show Progress as Notification: Zamiast ogólnego paska postępu wyświetla stałe powiadomienie z bieżącym postępem operacji w tle, takich jak odświeżanie subskrypcji i pobieranie zarządzanych narzędzi.
    Scroll Speed: Zmienia odległość przewijania gestami kółka myszy i panelu dotykowego.
    Use Fixed Tab Width: Nadaje wszystkim kartom na poziomym pasku jednakową szerokość zamiast dopasowywać ją do tytułu.
    Use Grid Player Menu: Układa menu ustawień odtwarzacza filmu w siatkę kafelków zamiast listy wierszy.
