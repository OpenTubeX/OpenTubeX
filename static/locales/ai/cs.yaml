Tooltips:
  General Settings:
    Use AI Translation Completions: Doplňuje mezery v lidských překladech textem vytvořeným umělou inteligencí. Lidské překlady mají vždy přednost.
    Update Relative Timestamps: Aktualizuje relativní časové údaje v celé aplikaci, dokud stránka zůstává otevřená. Pokud je funkce vypnutá, údaje se aktualizují až po opětovném načtení nebo návratu na stránku.
    Stream Extraction Method: |
      Zvolte, jak má OpenTubeX získávat streamy videí. Pokud vyberete yt-dlp, musí být tento nástroj dostupný.
      Při použití yt-dlp může spuštění videa trvat déle.
      Vestavěný způsob nepodporuje posun v živých přenosech a premiérách.
    Avoid translation: |
      Vypne automatický překlad názvu, popisu a kapitol videa na YouTube.
      Příliš mnoho požadavků, například načítání názvů videí v seznamech, může dočasně
      snížit spolehlivost aplikace.
    Show Thumbnail Previews: Při najetí ukazatelem na miniaturu videa zobrazí animovaný náhled.
    Startup Behavior: |
      Zvolte, co má OpenTubeX udělat při spuštění.
      Načíst všechny karty okamžitě obnoví všechny uložené karty, ale videa na kartách na pozadí se automaticky nespustí.
      Načíst dříve načtené karty znovu načte karty, které byly načtené při ukončení aplikace OpenTubeX, a ostatní ponechá uvolněné.
      Načíst naposledy aktivní kartu obnoví předchozí relaci. Ostatní karty otevře, ale ponechá je uvolněné. Načtou se po kliknutí.
      Začít s prázdnou relací přeskočí uložené karty a otevře nové okno.
    Remember Tab Navigation History: Historie procházení zpět a vpřed se pro každou kartu uloží a obnoví při příštím spuštění aplikace OpenTubeX.
  Proxy Settings:
    IP Block Recovery Script Path: Cesta k souboru skriptu, který se spustí při zjištění blokování IP adresy. OpenTubeX počká na jeho dokončení a poté znovu načte video. Pokud je povolen záložní poskytovatel, skript se spustí až po jeho selhání.
  Player Settings:
    Continue Playback When Screen Is Locked: 'Ponechá zvuk přehrávaný na pozadí a zpřístupní ovládání médií systému Android. Vypnutím se přehrávání pozastaví, jakmile aplikace přestane být viditelná.'
    Enable Caption Translations: Pokud video neposkytuje odpovídající původní stopu, tlačítko titulků a klávesová zkratka C při zapnutí upřednostní automaticky přeloženou stopu v preferovaném jazyce titulků.
    Use Quick Playback Speed Bar: Zobrazí na pravé straně ovládacích prvků přehrávače panel rychlé volby rychlosti. Pokud je zapnuté ruční ukládání rychlosti přehrávání pro jednotlivé kanály, panel obsahuje také tlačítko pro uložení rychlosti aktuálního kanálu.
    Multiply Seek Interval by Playback Rate: Pokud je funkce zapnutá, intervaly posunu pomocí kláves se šipkami a J/L se násobí aktuální rychlostí přehrávání. Pokud je vypnutá, intervaly zůstávají stejné bez ohledu na rychlost přehrávání.
    Show Playback Rate Adjusted Timestamp: Pokud je funkce zapnutá a rychlost přehrávání se liší od 1×, přehrávač za běžným časovým údajem zobrazí v závorkách čas upravený podle rychlosti přehrávání.
    Use YouTube-style Shorts: Zobrazí krátká videa v mřížce na výšku na stránkách odběrů a kanálů a použije pro ně přehrávač ve stylu YouTube.
    Loop Shorts: Pokud je funkce zapnutá, krátká videa se automaticky spustí znovu. Pokud je vypnutá, na konci se zastaví a zobrazí tlačítko pro opakované přehrání.
    Show Skip Silence Toggle: Zobrazí v nabídce nastavení přehrávače přepínač přeskakování ticha.
    Enable Skip Silence by Default: Zapne přeskakování ticha pro nové karty. Změna na jedné kartě neovlivní ostatní karty.
    Enable Video Zoom: Zobrazí v nabídce nastavení přehrávače ovládání přiblížení a zapne jeho klávesové zkratky a posouvání obrazu.
    Voice-over Translation: Při požadavku na překlad odešle ID videa, délku a vybraný jazyk neoficiální službě Yandex pro překlad dabingu. Ve výchozím nastavení je vypnuto.
    Hold to Double Playback Speed: Podržením mezerníku nebo levého tlačítka myši nad přehrávačem dočasně zdvojnásobíte aktuální rychlost přehrávání.
    Ambient Mode: Rozšíří barvy videa do prostoru kolem přehrávače.
    Default Volume: Není dostupné, když je zapnutá možnost Pamatovat si hlasitost. Chcete-li nastavit pevnou počáteční hlasitost každého videa, tuto možnost vypněte.
    Parallel Segment Loading: |
      Počet úseků obrazu a zvuku, které se mají načíst současně před přehráváním.
      Vyšší hodnoty mohou pomoci při pomalém nebo nestabilním připojení, ale spotřebují více přenosové rychlosti a paměti.
      Mohou také způsobit, že automatický režim podhodnotí rychlost připojení a zvolí nižší kvalitu.
      Streamy omezené na jeden požadavek současně toto nastavení ignorují.
    Preload Upcoming Videos: "Načte a uloží do mezipaměti adresy yt-dlp pro následující videa. Fronta má přednost před playlisty a doporučeními."
    Upcoming Videos to Preload: "Nejvyšší počet následujících videí, jejichž adresy yt-dlp se načtou na pozadí."
  Download Settings:
    Download Folder: Videa se ukládají do této složky. Chcete-li použít systémovou složku Stažené, ponechte pole prázdné.
    Global Additional yt-dlp Arguments: Další argumenty příkazového řádku předávané nástroji yt-dlp při každém stahování, například --cookies-from-browser firefox.
    Concurrent Downloads: Maximální počet úloh yt-dlp, které mohou běžet současně.
    Bandwidth Limit: Omezí celkovou přenosovou rychlost fronty rozdělením limitu mezi souběžné úlohy. Hodnota 0 znamená bez omezení.
  External Software Settings:
    yt-dlp Source: OpenTubeX může použít nástroj yt-dlp nainstalovaný v systému nebo stáhnout a spravovat vlastní kopii uloženou ve složce uživatelských dat.
    yt-dlp Channel: Vyberte kanál vydání yt-dlp, který má OpenTubeX stahovat a spravovat. Pro většinu uživatelů se doporučuje stabilní kanál.
    FFmpeg Source: OpenTubeX může použít nástroje FFmpeg a FFprobe nainstalované v systému nebo stáhnout a spravovat vlastní statická sestavení uložená ve složce uživatelských dat.
    Managed Tool Updates: Zvolte, zda se mají spravované nástroje aktualizovat automaticky, zda se má aplikace před aktualizací zeptat nebo zda se mají aktualizovat pouze ručními tlačítky. Chybějící nástroje se v případě potřeby stáhnou vždy.
    yt-dlp Executable Path: OpenTubeX ve výchozím nastavení předpokládá, že nástroj yt-dlp lze najít pomocí proměnné prostředí PATH. V případě potřeby zde můžete nastavit vlastní cestu.
    Cookie Source: Zvolte, zda má yt-dlp pro ověřené přehrávání číst soubor cookies ve formátu Netscape, nebo cookies z nainstalovaného prohlížeče.
    Cookie File: Vyberte soubor cookies ve formátu Netscape pro ověřené přehrávání.
    Browser for Cookies: Podpora prohlížečů se načítá z vybraného spustitelného souboru yt-dlp. Při požadavku na ověřené přehrávání OpenTubeX požádá yt-dlp o načtení tohoto prohlížeče.
    Browser Profile: Volitelný název nebo složka profilu prohlížeče. Chcete-li použít naposledy otevřený profil, ponechte pole prázdné.
    Always Use Cookies: Nastavené cookies použije při každém získávání streamů pomocí yt-dlp. Způsob získávání streamu se tím nepřepne na yt-dlp. Pokud je vybrán yt-dlp, mohou být dostupné formáty pouze pro účty, včetně vyšší přenosové rychlosti YouTube Premium, pokud k ní má účet přístup.
    FFmpeg Executable Path: FFmpeg je nutný ke slučování samostatných streamů obrazu a zvuku a k převodu zvuku. OpenTubeX ve výchozím nastavení předpokládá, že nástroj FFmpeg lze najít pomocí proměnné prostředí PATH. V případě potřeby zde můžete nastavit vlastní cestu.
  Distraction Free Settings:
    Shorten View Counts: Zobrazí počty zhlédnutí a hodnocení komentářů, které YouTube již zaokrouhlil do zkrácené podoby, například 14K místo 14,000. Přesné počty se vždy zobrazují celé.
  Subscription Settings:
    Fetch Feed on Startup: Pokud je funkce zapnutá, OpenTubeX automaticky načte kanál odběrů při spuštění a při otevření nového okna.
    Show New Content Feed: Zobrazí kartu Nové s položkami kanálu odběrů, které při předchozím načtení nebyly dostupné.
    Show New Content Indicators: Vedle položek kanálu odběrů, které při předchozím načtení nebyly dostupné, zobrazí malou tečku.
    Show Scheduled Live Streams / Premieres First: Ponechá nadcházející živé přenosy a premiéry v horní části kanálu odběrů. Pokud je funkce vypnutá, zůstanou až do zahájení na pozici podle data oznámení. Po vypnutí jednou obnovte kanál odběrů, aby se načetla data oznámení stávajících naplánovaných položek.
    Auto Refresh Interval: "Určuje, jak často OpenTubeX automaticky obnovuje kanál odběrů, když je aplikace otevřená. V Androidu nenulový interval obnovuje kanál také tehdy, když je aplikace zavřená."
    Refresh Subscriptions While App Is Closed: "Umožní Androidu obnovovat kanály odběrů ve vybraných intervalech, když je OpenTubeX zavřený. Vypnutím této možnosti omezíte automatické obnovování na dobu, kdy je aplikace otevřená."
  Theme Settings:
    Show Progress as Notification: Místo celkového ukazatele průběhu zobrazí trvalé oznámení s aktuálním průběhem operací na pozadí, například obnovování odběrů a stahování spravovaných nástrojů.
    Always Show Scrollbars: Ponechá posuvníky stále viditelné. Pokud je funkce vypnutá, krátce po zastavení pohybu myši zmizí a při dalším pohybu se znovu zobrazí.
    Scroll Speed: Mění vzdálenost posunu kolečkem myši a gesty kolečka touchpadu.
    Use Fixed Tab Width: Nastaví všem kartám na vodorovném panelu stejnou šířku místo šířky podle názvu.
    Use Grid Player Menu: Uspořádá nabídku nastavení přehrávače videa do mřížky dlaždic místo seznamu řádků.
