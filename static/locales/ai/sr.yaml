Tooltips:
  General Settings:
    Use AI Translation Completions: Попуни празнине у људским преводима текстом који је генерисала вештачка интелигенција. Људски преводи увек имају предност.
    Update Relative Timestamps: Ажурира релативне временске ознаке у целој апликацији док је страница отворена. Када је искључено, ажурирају се тек након поновног учитавања или повратка на страницу.
    Stream Extraction Method: |
      Изаберите како OpenTubeX прибавља токове видео-снимака. yt-dlp мора бити доступан ако га изаберете.
      Покретање видео-снимака може трајати дуже када се користи yt-dlp.
      Уграђени начин не подржава премотавање преноса уживо и премијера.
    Avoid translation: |
      Искључите YouTube аутоматски превод наслова, описа и поглавља видео-снимка.
      Превише захтева, попут преузимања наслова видео-снимака са листа, може привремено
      утицати на поузданост апликације.
    Show Thumbnail Previews: Прикажи анимиране прегледе при преласку показивачем преко сличица видео-снимака.
    Startup Behavior: |
      Изаберите шта OpenTubeX ради при покретању.
      „Учитај све картице“ одмах враћа све сачуване картице, али картице у позадини неће аутоматски репродуковати видео-снимке.
      „Учитај претходно учитане картице“ поново учитава картице које су биле учитане када је OpenTubeX затворен, а остале оставља неучитане.
      „Учитај последњу активну картицу“ враћа претходну сесију са осталим отвореним, али неучитаним картицама; учитавају се када кликнете на њих.
      „Почни са празном сесијом“ прескаче сачуване картице и отвара нов прозор.
    Remember Tab Navigation History: Историја кретања уназад и унапред за сваку картицу се чува и враћа када се OpenTubeX поново покрене.
  Proxy Settings:
    IP Block Recovery Script Path: Путања до датотеке скрипте која се покреће када се открије блокада IP адресе. OpenTubeX чека да се скрипта заврши, па поново учитава видео-снимак. Ако је резервни начин укључен, скрипта се покреће само ако и он не успе.
  Player Settings:
    Enable Caption Translations: Када је укључено, дугме за титлове и пречица C дају предност аутоматски преведеном запису на жељеном језику титлова ако видео-снимак нема одговарајући изворни запис.
    Use Quick Playback Speed Bar: Приказује траку за брзу промену брзине репродукције међу контролама плејера са десне стране. Ако је укључено ручно чување брзине репродукције за сваки канал, трака садржи и дугме за чување брзине за тренутни канал.
    Multiply Seek Interval by Playback Rate: Када је укључено, интервали премотавања (тастери са стрелицама и J/L) множе се тренутном брзином репродукције. Када је искључено, интервали остају исти без обзира на брзину репродукције.
    Show Playback Rate Adjusted Timestamp: Када је укључено и брзина репродукције није 1x, плејер приказује временске ознаке прилагођене брзини репродукције у заградама после уобичајених временских ознака.
    Use YouTube-style Shorts: Приказује Shorts у усправној мрежи на страницама претплата и канала и користи плејер у стилу YouTube Shorts.
    Loop Shorts: Када је укључено, Shorts се аутоматски покрећу испочетка. Када је искључено, Shorts се заустављају на крају и приказују дугме за поновну репродукцију.
    Show Skip Silence Toggle: Приказује прекидач за прескакање тишине у менију подешавања плејера.
    Enable Skip Silence by Default: Укључује прескакање тишине за нове картице. Промена у једној картици не утиче на остале.
    Enable Video Zoom: Приказује контролу за зумирање у менију подешавања плејера и укључује њене пречице на тастатури и контроле померања.
    Voice-over Translation: Када затражите превод, шаље ID видео-снимка, трајање и изабрани језик незваничној услузи Yandex за гласовни превод. Подразумевано је искључено.
    Hold to Double Playback Speed: Држите размакницу или леви тастер миша изнад плејера да бисте привремено удвостручили тренутну брзину репродукције.
    Ambient Mode: Прелива боје видео-снимка у простор око плејера.
    Default Volume: Није доступно док је укључено памћење јачине звука. Искључите памћење јачине звука да бисте подесили сталну почетну јачину за сваки видео-снимак.
    Parallel Segment Loading: |
      Колико сегмената видео и звучног записа треба истовремено учитати унапред.
      Веће вредности могу помоћи на спорим или нестабилним везама, али користе више пропусног опсега и меморије.
      Због њих аутоматски избор може потценити брзину везе и изабрати нижи квалитет.
      Токови ограничени на један захтев истовремено занемарују ово подешавање.
  Download Settings:
    Download Folder: Видео-снимци се чувају у овој фасцикли. Оставите празно да бисте користили системску фасциклу за преузимања.
    Global Additional yt-dlp Arguments: Додатни аргументи командне линије који се прослеђују програму yt-dlp при сваком преузимању, на пример --cookies-from-browser firefox.
    Concurrent Downloads: Највећи број yt-dlp задатака који могу истовремено да се извршавају.
    Bandwidth Limit: Ограничава укупну брзину преноса реда тако што ово ограничење дели међу истовременим задацима. Унесите 0 да не буде ограничења.
  External Software Settings:
    yt-dlp Source: OpenTubeX може да користи yt-dlp инсталиран на систему или да преузме сопствену копију програма yt-dlp, управља њом и чува је у фасцикли корисничких података.
    yt-dlp Channel: Изаберите канал издања програма yt-dlp који OpenTubeX преузима и којим управља. Стабилни канал се препоручује већини корисника.
    FFmpeg Source: OpenTubeX може да користи FFmpeg и FFprobe инсталиране на систему или да преузме сопствене статичке верзије, управља њима и чува их у фасцикли корисничких података.
    Managed Tool Updates: Изаберите да ли се алатке којима апликација управља ажурирају аутоматски, траже потврду пре ажурирања или се ажурирају само помоћу ручних дугмади. Алатке које недостају и даље се преузимају када су потребне.
    yt-dlp Executable Path: OpenTubeX подразумевано претпоставља да се yt-dlp може пронаћи преко променљиве окружења PATH. Овде по потреби можете да подесите другу путању.
    Cookie Source: Изаберите да ли yt-dlp треба да чита Netscape датотеку колачића или колачиће из инсталираног прегледача ради репродукције уз пријаву.
    Cookie File: Изаберите датотеку колачића у формату Netscape за репродукцију уз пријаву.
    Browser for Cookies: Подршка за прегледаче се чита из изабране извршне датотеке програма yt-dlp. Када се затражи репродукција уз пријаву, OpenTubeX тражи од програма yt-dlp да прочита колачиће из овог прегледача.
    Browser Profile: Необавезни назив или фасцикла профила прегледача. Оставите празно да бисте користили последњи отварани профил.
    Always Use Cookies: Користи подешене колачиће кад год yt-dlp издваја токове. Ово не мења начин издвајања токова у yt-dlp. Када је изабран yt-dlp, могу постати доступни формати само за налоге, укључујући побољшану брзину протока услуге YouTube Premium ако налог има приступ.
    FFmpeg Executable Path: FFmpeg је неопходан за спајање засебних токова видео и звучног записа и за претварање звука. OpenTubeX подразумевано претпоставља да се FFmpeg може пронаћи преко променљиве окружења PATH. Овде по потреби можете да подесите другу путању.
  Distraction Free Settings:
    Shorten View Counts: Приказује број прегледа и свиђања коментара које је YouTube већ заокружио у скраћеном облику, нпр. 14 хиљ. уместо 14.000. Тачни бројеви се увек приказују у целости.
  Subscription Settings:
    Fetch Feed on Startup: Када је укључено, OpenTubeX аутоматски преузима садржај претплата при покретању и отварању новог прозора.
    Show New Content Feed: Приказује картицу „Ново“ са ставкама из претплата које нису постојале током претходног преузимања.
    Show New Content Indicators: Приказује малу тачку поред ставки из претплата које нису постојале током претходног преузимања.
    Show Scheduled Live Streams / Premieres First: Задржава предстојеће преносе уживо и премијере на врху садржаја претплата. Када је искључено, остају на месту своје најаве док не почну. Након искључивања једном освежите садржај претплата да бисте преузели датуме најаве постојећих заказаних ставки.
    Auto Refresh Interval: Колико често OpenTubeX аутоматски освежава садржај претплата док је апликација отворена.
  Theme Settings:
    Show Progress as Notification: Приказује трајно обавештење са тренутним напретком позадинских радњи, као што су освежавање претплата и преузимање алатки којима апликација управља, уместо опште траке напретка.
    Always Show Scrollbars: Траке за померање су увек видљиве. Када је искључено, нестају убрзо пошто престанете да померате миш и поново се појављују чим га померите.
    Scroll Speed: Мења растојање померања покретима точкића миша и додирне табле.
    Use Fixed Tab Width: Даје свакој картици на водоравној траци картица исту ширину уместо да је прилагођава наслову.
    Use Grid Player Menu: Распоређује мени подешавања плејера као мрежу плочица уместо као листу редова.
