      An doare enframmat ne skor ket ar mont en-dro er skignadoù war-eeun hag er c'hentañ skignadennoù.
    Avoid translation: |
      Diweredekaat troidigezh emgefreek YouTube evit titl, deskrivadur ha chabistroù ur video.
      Re a azgoulennoù, evel adtapout titloù videoioù e meur a roll, a c'hall lakaat
      an arload da vezañ digredus evit ur pennad.
    Show Thumbnail Previews: "Diskouez rakwelioù fiñv pa vez al logodenn war skeudennigoù ar videoioù."
    Startup Behavior: |
      Dibabit pezh a ra OpenTubeX pa loc'h.
      Kargañ an holl ivinelloù a assav diouzhtu pep ivinell enrollet, met ar videoioù ne vezont ket lennet ent emgefreek en ivinelloù en drekleur.
      Kargañ an ivinelloù a oa karget a-raok a adkarg an ivinelloù a oa karget pa oa bet serret OpenTubeX hag a zalc'h ar re all diskarget.
      Kargañ an ivinell oberiant diwezhañ a assav an estez kent gant an ivinelloù all digor met diskarget; karget e vezont pa glikit warno.
      Loc'hañ gant un estez goullo a laosk an ivinelloù enrollet a-gostez hag a zigor ur prenestr nevez.
    Remember Tab Navigation History: "Enrollet ha graet e vez assav eus istor merdeiñ war-raok ha war-gil pep ivinell pa vez adloc'het OpenTubeX."
  Proxy Settings:
    IP Block Recovery Script Path: "Hent ar restr skript da erounit pa vez dinoet ur stankadur IP. Gortoz a ra OpenTubeX ma vo echu, hag adkargañ a ra ar video. Ma vez gweredekaet an diskoulm erlec'hiañ ne vez erounit ar skript nemet pa c'hwit an diskoulm-se ivez."
  Player Settings:
    Enable Caption Translations: "Pa vez gweredekaet e tibab bouton an istitloù hag ar verradenn C ur roudenn troet ent emgefreek er yezh istitloù gwellañ-garet, ma ne bourchas ket ar video ur roudenn orin o klotañ."
    Use Quick Playback Speed Bar: "Diskouez ur varrenn prim evit an tizh lenn e reolerezhioù al lenner war an tu dehou. Ma vez gweredekaet enrollañ tizh lenn pep chadenn gant an dorn, enderc'hel a ra ar varrenn ivez ar bouton da enrollañ an tizh evit ar chadenn vremanel."
    Multiply Seek Interval by Playback Rate: "Pa vez gweredekaet e vez lieskementet etrevezioù ar mont en-dro, gant ar birioù ha J/L, dre an tizh lenn bremanel. Pa vez diweredekaet e chom digemm an etrevezioù forzh an tizh lenn."
    Show Playback Rate Adjusted Timestamp: "Pa vez gweredekaet ha disheñvel an tizh lenn diouzh 1x, diskouez a ra al lenner mareoù reizhet diouzh an tizh lenn goude ar mare reizh."
    Use YouTube-style Shorts: "Diskouez ar videoioù berr (Shorts) en ur gael a-serzh war pajennoù ar c'houmanantoù hag ar chadennoù hag implijout al lenner videoioù berr doare YouTube."
    Loop Shorts: "Pa vez gweredekaet e adkrog ar videoioù berr (Shorts) ent emgefreek. Pa vez diweredekaet e paouezont en dibenn hag e tiskouezont ur bouton adlenn."
    Show Skip Silence Toggle: "Diskouez un afell enaouiñ pe lazhañ al lamm dre ar sioulder e lañser arventennoù al lenner."
    Enable Skip Silence by Default: "Gweredekaat al lamm dre ar sioulder evit an ivinelloù nevez. Kemmañ anezhañ en un ivinell ne cheñch ket an ivinelloù all."
    Enable Video Zoom: "Diskouez ar reoler Zoum e lañser arventennoù al lenner ha gweredekaat e verradennoù klavier hag e reolerezhioù zilec'hiañ."
    Voice-over Translation: "Kas naoudi ar video, e badelezh hag ar yezh diuzet da wazerezh troidigezh ar vouezh dieub Yandex pa c'houlennit un droidigezh. Diweredekaet eo dre ziouer."
    Hold to Double Playback Speed: "Dalc'hit ar varrenn esaouiñ pe bouton kleiz al logodenn war al lenner evit daougementiñ an tizh lenn bremanel evit ur pennad."
    Ambient Mode: "Meskañ livioù ar video gant an takad tro-dro d'al lenner."
    Default Volume: "Diweredekaet eo pa vez gweredekaet Derc'hel soñj eus live ar son. Diweredekait anezhañ evit termenañ ul live son loc'hañ digemm evit pep video."
    Parallel Segment Loading: |
      Niver a rannoù video ha son da gargañ war un dro a-raok al lenn.
      Gallout a ra gwerzhioù uheloc'h sikour gant kennaskoù gorrek pe distabil, met muioc'h a ledander-bann hag a vemor a vez implijet ganto.
      Gallout a reont ivez lakaat ar mod Emgefreek da briziañ tizh ar c'hennask re izel ha da zibab ur berzhded izeloc'h.
      Ar gwazhioù bevennet d'un azgoulenn war un dro ne zalc'hont ket kont eus an arventenn-mañ.
    Preload Upcoming Videos: "Kargañ ha krubuilhañ a ra liammoù yt-dlp ar videoioù da-heul. Ar steudad a zo kentoc’h eget ar rolloù lenn hag an erbedadennoù."
    Upcoming Videos to Preload: "Niver brasañ a videoioù da-heul a vez karget o liammoù yt-dlp en drekleur."
  Download Settings:
    Download Folder: "Enrollet e vez ar videoioù en teuliad-mañ. Laoskit goullo evit implijout teuliad Pellgargadennoù ho reizhiad."
    Global Additional yt-dlp Arguments: "Arventennoù arc'had ouzhpenn tremenet da yt-dlp evit pep pellgargadenn, da skouer --cookies-from-browser firefox."
    Concurrent Downloads: "Niver brasañ a labourioù yt-dlp a c'hall bezañ erounit war un dro."
    Bandwidth Limit: "Bevenniñ a ra fonnder treuzkas bodaet al lost en ur rannañ ar vevenn-mañ etre al labourioù war un dro. Lakait 0 evit chom hep bevenn."
  External Software Settings:
    yt-dlp Source: "Gallout a ra OpenTubeX implijout yt-dlp staliet war ho reizhiad, pe bellgargañ ha merañ e eiladenn dezhañ e-unan. Kadavet e vez e teuliad roadennoù an implijer."
    yt-dlp Channel: "Dibabit kanol stummoù yt-dlp pellgarget ha meret gant OpenTubeX. Ar ganol stabil zo erbedet evit an darn vrasañ eus an implijerien."
    FFmpeg Source: "Gallout a ra OpenTubeX implijout FFmpeg ha FFprobe staliet war ho reizhiad, pe bellgargañ ha merañ e stummoù statek dezhañ e-unan. Kadavet e vezont e teuliad roadennoù an implijer."
    Managed Tool Updates: "Dibabit ma vez hizivaet an ostilhoù meret ent emgefreek, ma vez goulennet a-raok hizivaat, pe ma vezont hizivaet gant ar boutonoù dorn hepken. Pellgarget e vez an ostilhoù a vank pa vezont rekis."
    yt-dlp Executable Path: "Dre ziouer e soñj OpenTubeX e c'haller kavout yt-dlp dre argemmenn endro PATH. Gallout a reer lakaat un hent personelaet amañ ma vez ezhomm."
    Cookie Source: "Dibabit ma rank yt-dlp lenn ur restr toupinoù Netscape pe toupinoù eus ur merdeer staliet evit al lenn dilesaet."
    Cookie File: "Dibabit ur restr toupinoù er mentrezh Netscape evit al lenn dilesaet."
    Browser for Cookies: "Lennet e vez skor ar merdeer diwar erounezadus yt-dlp diuzet. OpenTubeX a c'houlenn digant yt-dlp lenn ar merdeer-mañ pa vez goulennet al lenn dilesaet."
    Browser Profile: "Anv pe deuliad profil merdeer diret. Laoskit goullo evit implijout ar profil haeziñ diwezhañ."
    Always Use Cookies: "Implijout an toupinoù kefluniet bep tro ma eztenn yt-dlp gwazhioù. Ne cheñch ket an dra-mañ an doare eztennañ gwazhioù da yt-dlp. Gant yt-dlp diuzet e c'hall mentrezhioù miret d'ar c'hontoù bezañ hegerz, en o zouez fonnder gwell YouTube Premium pa vez aotreet ar gont."
    FFmpeg Executable Path: "Rekis eo FFmpeg evit kendeuziñ gwazhioù video ha son distag hag evit amdreiñ ar son. Dre ziouer e soñj OpenTubeX e c'haller kavout FFmpeg dre argemmenn endro PATH. Gallout a reer lakaat un hent personelaet amañ ma vez ezhomm."
  Distraction Free Settings:
    Shorten View Counts: "Diskouez niver ar selladennoù ha plijadennoù an evezhiadennoù er stumm berr rontaet dija gant YouTube, da skouer 14K e-lec'h 14 000. Diskouezet e vez an niver resis en e bezh bepred."
  Subscription Settings:
    Fetch Feed on Startup: "Pa vez gweredekaet e adtap OpenTubeX gwazh ho koumanantoù ent emgefreek el loc'hañ ha pa vez digoret ur prenestr nevez."
    Show New Content Feed: "Diskouez un ivinell Nevez gant elfennoù eus gwazh ar c'houmanantoù na oant ket aze en adtapout kent."
    Show New Content Indicators: "Diskouez ur pik bihan e-kichen elfennoù eus gwazh ar c'houmanantoù na oant ket aze en adtapout kent."
    Show Scheduled Live Streams / Premieres First: "Derc'hel ar skignadoù war-eeun hag ar c'hentañ skignadennoù da zont e penn gwazh ar c'houmanantoù. Pa vez diweredekaet e chomont el lec'h ma oant bet embannet betek ma krogont. Adkargit gwazh ar c'houmanantoù ur wech goude diweredekaat evit adtapout deiziadoù embann an elfennoù rakluniet a zo anezho dija."
    Auto Refresh Interval: "Alies ma adkarg OpenTubeX gwazh ho koumanantoù ent emgefreek pa vez digor an arload."
  Theme Settings:
    Show Progress as Notification: "Diskouez ur rebuad padus gant araokadur diouzhtu evit an oberoù en drekleur, evel adkargañ ar c'houmanantoù ha pellgargañ ostilhoù meret, e-lec'h implijout ar varrenn araokadur hollek."
    Always Show Scrollbars: "Derc'hel ar barrennoù dibunañ gwelus bepred. Pa vez diweredekaet e steuziont nebeut goude ma paouezit da zilec'hiañ al logodenn hag e tistroont kerkent ha ma tilec'hiit anezhi en-dro."
    Scroll Speed: "Kemmañ ar pellder dibunañ gant rod al logodenn ha jestroù rod ar c'horreenn-stok."
    Use Fixed Tab Width: "Reiñ ar memes ledander da bep ivinell er varrenn ivinelloù a-blaen e-lec'h azasaat anezho diouzh o zitl."
    Use Grid Player Menu: "Aozadur lañser arventennoù al lenner video evel ur gael karrelloù e-lec'h ur roll linennoù."
