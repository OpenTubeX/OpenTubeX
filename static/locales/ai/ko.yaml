    Clear Tab Image Cache Confirmation: 탭 썸네일과 채널 아바타를 지우시겠습니까?
    Tab Image Cache Effect: 탭 이미지가 잠시 사라질 수 있으며 해당 탭을 사용하면 다시 생성됩니다.
