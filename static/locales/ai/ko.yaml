    HTTP Cache Description: Electron은 같은 데이터를 다시 다운로드하지 않고 반복 요청을 불러올 수 있도록 네트워크 응답을 디스크에 저장합니다. OpenTubeX는 필요할 때 이 캐시를 다시 만듭니다.
    Managed By Electron: Electron에서 관리
    Clear HTTP Cache: HTTP 캐시 지우기
    Clear HTTP Cache Confirmation: Electron의 HTTP 캐시를 지우시겠습니까?
    HTTP Cache Effect: 캐시를 다시 만드는 동안 이미지와 기타 네트워크 리소스를 한 번 느리게 불러올 수 있습니다.
    Tab Image Cache: 탭 썸네일 및 채널 아바타
    Tab Image Cache Description: 열려 있거나 복원된 탭의 미리보기 이미지와 채널 아바타를 저장합니다. 탭을 사용하면 OpenTubeX가 다시 만듭니다.
