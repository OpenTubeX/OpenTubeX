Tooltips:
  General Settings:
    Use AI Translation Completions: 사람이 번역하지 않은 부분을 AI 생성 텍스트로 채웁니다. 사람의 번역을 항상 우선합니다.
    Update Relative Timestamps: 페이지가 열려 있는 동안 앱 전체의 상대 시간 표시를 업데이트합니다. 비활성화하면 페이지를 다시 불러오거나 다시 방문할 때만 업데이트합니다.
    Stream Extraction Method: |
      OpenTubeX에서 동영상 스트림을 가져오는 방법을 선택하세요. yt-dlp를 선택하면 yt-dlp를 사용할 수 있어야 합니다.
      yt-dlp를 사용하면 동영상 재생을 시작하는 데 시간이 더 걸릴 수 있습니다.
      내장 방식은 실시간 스트림과 최초 공개에서 탐색을 지원하지 않습니다.
    Avoid translation: |
      YouTube의 동영상 제목, 설명 및 챕터 자동 번역을 비활성화합니다.
      목록의 동영상 제목을 가져오는 등 요청이 너무 많으면 일시적으로
      앱의 안정성에 영향을 줄 수 있습니다.
    Show Thumbnail Previews: 동영상 썸네일에 마우스를 올리면 움직이는 미리보기를 표시합니다.
    Startup Behavior: |
      OpenTubeX를 시작할 때 수행할 작업을 선택하세요.
      모든 탭 불러오기는 저장된 탭을 즉시 모두 복원하지만 백그라운드 탭의 동영상은 자동 재생하지 않습니다.
      이전에 불러온 탭 불러오기는 OpenTubeX를 닫을 때 불러온 탭을 다시 불러오고 나머지는 언로드된 상태로 유지합니다.
      마지막 활성 탭 불러오기는 다른 탭을 열려 있지만 언로드된 상태로 두고 이전 세션을 복원합니다. 탭을 클릭하면 불러옵니다.
      빈 세션으로 시작은 저장된 탭을 건너뛰고 새 창을 엽니다.
    Open Deep Links In New Window: 리디렉션 브라우저 확장 프로그램이나 명령줄 인수 등을 통해 OpenTubeX에 전달된 URL을 새 창에서 엽니다.
    Remember Tab Navigation History: 각 탭의 뒤로 및 앞으로 탐색 기록을 저장하고 OpenTubeX를 다시 시작할 때 복원합니다.
  Proxy Settings:
    IP Block Recovery Script Path: IP 차단이 감지될 때 실행할 스크립트 파일 경로입니다. OpenTubeX는 실행이 끝날 때까지 기다린 후 동영상을 다시 불러옵니다. 대체 사용이 활성화된 경우 대체 방식도 실패했을 때만 실행합니다.
  Player Settings:
    Use Document Picture-in-Picture: "앱의 플레이어 컨트롤과 자막을 화면 속 화면에 표시합니다. 시스템의 동영상 화면 속 화면 창을 사용하려면 이 옵션을 끄세요."
    Continue Playback When Screen Is Locked: '백그라운드에서 오디오를 계속 재생하고 Android 미디어 컨트롤을 제공합니다. 앱이 더 이상 보이지 않을 때 일시중지하려면 이 옵션을 끄세요.'
    Enable Caption Translations: 활성화하면 동영상에 선호 자막 언어와 일치하는 원본 트랙이 없을 때 자막 버튼과 C 단축키가 자동 번역된 트랙을 우선 사용합니다.
    Use Quick Playback Speed Bar: 오른쪽 플레이어 컨트롤에 빠른 재생 속도 표시줄을 표시합니다. 채널별 재생 속도 수동 저장이 활성화된 경우 현재 채널의 속도를 저장하는 버튼도 표시됩니다.
    Multiply Seek Interval by Playback Rate: 활성화하면 탐색 간격에 현재 재생 속도를 곱합니다. 화살표 키와 J/L에 적용됩니다. 비활성화하면 재생 속도와 관계없이 탐색 간격이 일정합니다.
    Show Playback Rate Adjusted Timestamp: 활성화하고 재생 속도가 1배속이 아니면 일반 시간 표시 뒤의 괄호 안에 재생 속도가 반영된 시간을 표시합니다.
    Use YouTube-style Shorts: 구독 및 채널 페이지에서 Shorts를 세로형 격자로 표시하고 YouTube 스타일 Shorts 플레이어를 사용합니다.
    Loop Shorts: 활성화하면 Shorts를 자동으로 다시 시작합니다. 비활성화하면 끝에서 멈추고 다시 재생 버튼을 표시합니다.
    Show Skip Silence Toggle: 플레이어 설정 메뉴에 무음 구간 건너뛰기 켜기/끄기 전환 버튼을 표시합니다.
    Enable Skip Silence by Default: 새 탭에서 무음 구간 건너뛰기를 활성화합니다. 한 탭에서 변경해도 다른 탭에는 영향을 주지 않습니다.
    Enable Video Zoom: 플레이어 설정 메뉴에 확대/축소 컨트롤을 표시하고 키보드 단축키와 화면 이동 컨트롤을 활성화합니다.
    Voice-over Translation: 번역을 요청하면 동영상 ID, 재생 시간 및 선택한 언어를 비공식 Yandex 음성 번역 서비스로 전송합니다. 기본적으로 비활성화되어 있습니다.
    Hold to Double Playback Speed: 플레이어 위에서 스페이스바 또는 마우스 왼쪽 버튼을 길게 누르면 현재 재생 속도가 일시적으로 두 배가 됩니다.
    Ambient Mode: 동영상 색상을 플레이어 주변 영역에 혼합합니다.
    Default Volume: 음량 기억이 활성화된 동안에는 사용할 수 없습니다. 각 동영상의 시작 음량을 고정하려면 음량 기억을 끄세요.
    Parallel Segment Loading: |
      재생할 동영상 및 오디오 구간을 한 번에 미리 불러올 개수입니다.
      값이 높으면 느리거나 불안정한 연결에서 도움이 될 수 있지만 대역폭과 메모리를 더 많이 사용합니다.
      또한 자동 설정이 연결 속도를 실제보다 낮게 판단하여 더 낮은 화질을 선택할 수 있습니다.
      한 번에 하나의 요청으로 제한된 스트림에는 이 설정이 적용되지 않습니다.
    Preload Upcoming Videos: "다음에 재생할 동영상의 yt-dlp URL을 가져와 캐시합니다. 대기열이 재생목록과 추천보다 우선합니다."
    Upcoming Videos to Preload: "백그라운드에서 yt-dlp URL을 가져올 다음 동영상의 최대 개수입니다."
    Concurrent Preloads: "동시에 동영상을 미리 로드하는 데 사용할 yt-dlp 프로세스의 최대 개수입니다. 값이 높을수록 CPU, 메모리 및 네트워크 대역폭을 더 많이 사용합니다."
  External Player Settings:
    Ignore Default Arguments: 동영상 URL 외의 기본 인수를 외부 플레이어에 보내지 않습니다. 예를 들어 재생 속도와 재생목록 URL이 해당됩니다. 사용자 지정 인수는 계속 전달됩니다.
  Download Settings:
    Download Folder: 동영상을 이 폴더에 저장합니다. 시스템의 다운로드 폴더를 사용하려면 비워 두세요.
    Global Additional yt-dlp Arguments: 모든 다운로드에서 yt-dlp에 전달할 추가 명령줄 인수입니다. 예를 들면 --cookies-from-browser firefox입니다.
    Concurrent Downloads: 동시에 실행할 수 있는 yt-dlp 작업의 최대 개수입니다.
    Bandwidth Limit: 이 제한을 동시 작업 간에 나누어 대기열의 총 전송 속도를 제한합니다. 제한하지 않으려면 0을 입력하세요.
  External Software Settings:
    yt-dlp Source: OpenTubeX는 시스템에 설치된 yt-dlp를 사용하거나 자체 yt-dlp 사본을 다운로드하여 관리할 수 있습니다. 자체 사본은 사용자 데이터 디렉터리에 저장됩니다.
    yt-dlp Channel: OpenTubeX에서 다운로드하고 관리할 yt-dlp 릴리스 채널을 선택하세요. 대부분의 사용자에게 안정 버전을 권장합니다.
    FFmpeg Source: OpenTubeX는 시스템에 설치된 FFmpeg 및 FFprobe를 사용하거나 자체 정적 빌드를 다운로드하여 관리할 수 있습니다. 자체 빌드는 사용자 데이터 디렉터리에 저장됩니다.
    Managed Tool Updates: 관리되는 도구를 자동으로 업데이트할지, 업데이트 전에 확인할지, 수동 버튼으로만 업데이트할지 선택하세요. 누락된 도구는 필요할 때 계속 다운로드합니다.
    yt-dlp Executable Path: 기본적으로 OpenTubeX는 PATH 환경 변수에서 yt-dlp를 찾습니다. 필요하면 여기서 사용자 지정 경로를 설정할 수 있습니다.
    Cookie Source: 인증된 재생을 위해 yt-dlp에서 Netscape 쿠키 파일을 읽을지 설치된 브라우저의 쿠키를 읽을지 선택하세요.
    Cookie File: 인증된 재생에 사용할 Netscape 형식 쿠키 파일을 선택하세요.
    Browser for Cookies: 선택한 yt-dlp 실행 파일에서 지원하는 브라우저를 확인합니다. 인증된 재생을 요청하면 OpenTubeX가 yt-dlp에 이 브라우저의 쿠키를 읽도록 요청합니다.
    Browser Profile: 선택 사항인 브라우저 프로필 이름 또는 폴더입니다. 가장 최근에 사용한 프로필을 사용하려면 비워 두세요.
    Always Use Cookies: yt-dlp에서 스트림을 추출할 때마다 설정된 쿠키를 사용합니다. 스트림 추출 방법이 yt-dlp로 전환되지는 않습니다. yt-dlp를 선택하면 계정에 접근 권한이 있을 때 YouTube Premium의 향상된 비트 전송률을 포함한 계정 전용 형식을 사용할 수 있습니다.
    FFmpeg Executable Path: 별도의 동영상 및 오디오 스트림을 병합하고 오디오를 변환하려면 FFmpeg가 필요합니다. 기본적으로 OpenTubeX는 PATH 환경 변수에서 FFmpeg를 찾습니다. 필요하면 여기서 사용자 지정 경로를 설정할 수 있습니다.
  Distraction Free Settings:
    Shorten View Counts: YouTube에서 이미 반올림해 줄여 표시한 조회수와 댓글 좋아요 수를 표시합니다. 예를 들어 14,000 대신 14K로 표시합니다. 정확한 수치는 항상 전체 자릿수로 표시합니다.
    Hide Subscriptions Live: 이 설정은 "{settingsSection}"의 "{subsection}" 섹션에 있는 앱 전체 "{appWideSetting}" 설정으로 재정의됩니다
    Hide Videos, Playlists and Channels Containing Text: 단어, 단어 일부 또는 구문을 입력하면 원본 제목에 해당 텍스트가 포함된 모든 동영상, 재생목록 및 채널을 OpenTubeX 전체에서 숨깁니다. 대소문자를 구분하지 않습니다. 시청 기록, 내 재생목록 및 재생목록 안의 동영상은 제외됩니다.
    Hide Videos on Watch: 구독 및 채널 페이지의 동영상, Shorts 및 실시간 탭에서 시청한 동영상을 숨깁니다. 채널 페이지의 홈 탭에는 영향을 주지 않습니다
  Subscription Settings:
    Fetch Feed on Startup: 활성화하면 OpenTubeX를 시작하거나 새 창을 열 때 구독 피드를 자동으로 가져옵니다.
    Show New Content Feed: 이전에 가져올 때 없었던 구독 피드 항목이 포함된 신규 탭을 표시합니다.
    Show New Content Indicators: 이전에 가져올 때 없었던 구독 피드 항목 옆에 작은 점을 표시합니다.
    Show Scheduled Live Streams / Premieres First: 예정된 실시간 스트림과 최초 공개를 구독 피드 맨 위에 유지합니다. 비활성화하면 시작될 때까지 공지된 위치에 유지됩니다. 비활성화한 후 구독 피드를 한 번 새로 고쳐 기존 예정 항목의 공지 날짜를 가져오세요.
    Auto Refresh Interval: "앱이 열려 있는 동안 OpenTubeX에서 구독 피드를 자동으로 새로 고칠 간격입니다. Android에서는 0이 아닌 간격을 선택하면 앱이 닫혀 있을 때도 피드를 새로 고칩니다."
    Refresh Subscriptions While App Is Closed: "OpenTubeX가 닫혀 있을 때 Android가 선택한 간격으로 구독 피드를 새로 고칠 수 있도록 합니다. 앱이 열려 있을 때만 자동으로 새로 고치려면 이 옵션을 끄세요."
  Theme Settings:
    Show Progress as Notification: 전체 진행률 표시줄 대신 구독 새로 고침 및 관리되는 도구 다운로드 같은 백그라운드 작업의 실시간 진행률을 지속 알림으로 표시합니다.
    Always Show Scrollbars: 스크롤바를 항상 표시합니다. 비활성화하면 마우스 움직임을 멈춘 직후 서서히 사라지고 다시 움직이면 즉시 나타납니다.
    Scroll Speed: 마우스 휠 및 터치패드 휠 동작의 스크롤 거리를 변경합니다.
    Use Fixed Tab Width: 가로 탭 표시줄의 각 탭 너비를 제목에 맞추는 대신 모두 같은 너비로 설정합니다.
    Use Grid Player Menu: 동영상 플레이어의 설정 메뉴를 행 목록 대신 타일 격자로 배치합니다.
  Experimental Settings:
    Replace HTTP Cache: Electron의 디스크 기반 HTTP 캐시를 비활성화하고 사용자 지정 메모리 내 이미지 캐시를 활성화합니다. RAM 사용량이 늘어납니다.
