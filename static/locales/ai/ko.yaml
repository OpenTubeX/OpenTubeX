    Watch History Effect: 본 동영상 기록과 저장된 진행률이 삭제됩니다. 시청 통계는 유지됩니다.
    Clear Watch Statistics Confirmation: 모든 시청 통계를 삭제하시겠습니까?
    Watch Statistics Effect: 일별 시청 합계가 삭제됩니다. 시청 기록은 유지됩니다.
