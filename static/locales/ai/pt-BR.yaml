    Search History Description: Guarda as pesquisas que escolheu memorizar.
    Delete Search History: Excluir histórico de pesquisas
    Delete Search History Confirmation: Excluir todo o histórico de pesquisas salvo?
    Search History Effect: As sugestões de pesquisa salvas das pesquisas anteriores desaparecerão. A cache da sessão atual será mantida.
