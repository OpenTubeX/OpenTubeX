Tooltips:
  General Settings:
    Use AI Translation Completions: Preenche as lacunas das traduções humanas com texto gerado por IA. As traduções humanas têm sempre prioridade.
    Update Relative Timestamps: Atualiza as marcas temporais relativas em todo o aplicativo enquanto uma página permanece aberta. Quando esta opção está desativada, só são atualizadas após recarregar ou voltar a visitar a página.
    Stream Extraction Method: |
      Escolha como o OpenTubeX obtém as transmissões de vídeo. O yt-dlp tem de estar disponível quando for selecionado.
      Os vídeos podem demorar mais a começar quando utiliza o yt-dlp.
      O método integrado não permite avançar ou recuar em emissões ao vivo e estreias.
    Avoid translation: |
      Desativa a tradução automática do título, da descrição e dos capítulos de um vídeo feita pelo YouTube.
      Um número excessivo de pedidos, como a obtenção de títulos de vídeos em várias listas, pode afetar
      temporariamente a fiabilidade do aplicativo.
    Show Thumbnail Previews: Mostra pré-visualizações animadas ao passar o cursor sobre as miniaturas dos vídeos.
    Startup Behavior: |
      Escolha o que o OpenTubeX faz ao iniciar.
      Carregar todas as guias restaura imediatamente todas as guias salvas, mas as guias em segundo plano não reproduzem vídeos automaticamente.
      Carregar as guias anteriores recarrega as que estavam carregadas quando o OpenTubeX foi fechado e mantém as demais descarregadas da memória.
      Carregar a última guia ativa restaura a sessão anterior com as demais guias abertas, mas descarregadas da memória. Elas são carregadas quando você clica nelas.
      Iniciar com uma sessão vazia ignora as guias salvas e abre uma nova janela.
    Remember Tab Navigation History: O histórico de navegação para trás e para a frente de cada guia é salvo e restaurado quando o OpenTubeX reinicia.
  Proxy Settings:
    IP Block Recovery Script Path: Caminho do arquivo de script executando quando é detectado um bloqueio de IP. O OpenTubeX aguarda que termine e depois recarrega o vídeo. Se o método alternativo estiver ativado, o script só é executado quando esse método também falha.
  Player Settings:
    Enable Caption Translations: Quando esta opção está ativada e o vídeo não fornece uma faixa original no idioma de legendas preferido, o botão de legendas e o atalho C dão preferência a uma faixa traduzida automaticamente para esse idioma.
    Use Quick Playback Speed Bar: Mostra uma barra de acesso rápido à velocidade de reprodução nos controlos do lado direito do reprodutor. Se a gravação manual da velocidade por canal estiver ativada, a barra também inclui o botão para salvar a velocidade do canal atual.
    Multiply Seek Interval by Playback Rate: Quando esta opção está ativada, os intervalos para avançar ou recuar, através das teclas de seta e J/L, são multiplicados pela velocidade de reprodução atual. Quando está desativada, os intervalos permanecem constantes independentemente da velocidade de reprodução.
    Show Playback Rate Adjusted Timestamp: Quando esta opção está ativada e a velocidade de reprodução é diferente de 1x, o reprodutor mostra entre parênteses as marcas temporais ajustadas à velocidade de reprodução após as marcas temporais normais.
    Use YouTube-style Shorts: Mostra os Shorts numa grelha vertical nas páginas de inscrições e canais e utiliza o reprodutor de Shorts ao estilo do YouTube.
    Loop Shorts: Quando esta opção está ativada, os Shorts recomeçam automaticamente. Quando está desativada, param no fim e mostram um botão para os reproduzir novamente.
    Show Skip Silence Toggle: Mostra no menu de configurações do reprodutor um botão para ativar ou desativar o avanço sobre períodos de silêncio.
    Enable Skip Silence by Default: Ativa o avanço sobre períodos de silêncio nas novas guias. Alterar esta opção em uma guia não afeta as demais.
    Enable Video Zoom: Mostra o controlo de ampliação no menu de configurações do reprodutor e ativa os respectivos atalhos de teclado e controlos de deslocação.
    Voice-over Translation: Quando solicita uma tradução, envia o ID e a duração do vídeo e o idioma selecionado para o serviço não oficial de tradução por voz da Yandex. Está desativado por preconfiguração.
    Hold to Double Playback Speed: Mantenha premida a barra de espaços ou o botão esquerdo do mouse sobre o reprodutor para duplicar temporariamente a velocidade de reprodução atual.
    Ambient Mode: Mistura as cores do vídeo com a área em redor do reprodutor.
    Default Volume: Esta opção fica desativada enquanto Memorizar volume estiver ativo. Desative Memorizar volume para definir um volume inicial fixo para cada vídeo.
    Parallel Segment Loading: |
      O número de segmentos de vídeo e áudio que são carregados simultaneamente antes da reprodução.
      Valores mais altos podem ajudar em conexões lentas ou instáveis, mas utilizam mais largura de banda e memória.
      Também podem fazer com que o modo Automático subestime a velocidade da conexão e selecione uma qualidade inferior.
      As transmissões limitadas a um pedido de cada vez ignoram esta configuração.
  Download Settings:
    Download Folder: Os vídeos são salvos nesta pasta. Deixe em branco para usar a pasta Downloads do sistema.
    Global Additional yt-dlp Arguments: Argumentos adicionais da linha de comandos passados ao yt-dlp em cada download, por exemplo --cookies-from-browser firefox.
    Concurrent Downloads: O número máximo de tarefas do yt-dlp que podem ser executadas em simultâneo.
    Bandwidth Limit: Limita a velocidade de download combinada da fila ao dividir este limite pelas tarefas simultâneas. Insira 0 para não aplicar qualquer limite.
  External Software Settings:
    yt-dlp Source: O OpenTubeX pode usar o yt-dlp instalado no sistema ou baixar e gerenciar uma cópia própria, salva no pasta de dados do usuário.
    yt-dlp Channel: Selecione o canal de lançamento do yt-dlp que o OpenTubeX descarrega e gere. O canal Stable é recomendado para a maioria dos usuários.
    FFmpeg Source: O OpenTubeX pode usar o FFmpeg e o FFprobe instalados no sistema ou baixar e gerenciar compilações estáticas próprias, salvas no pasta de dados do usuário.
    Managed Tool Updates: Escolha se as ferramentas gerenciadas são atualizadas automaticamente, se é pedida confirmação antes de atualizar ou se só são atualizadas através dos botões manuais. As ferramentas ausentes continuam a ser baixadas quando forem necessárias.
    yt-dlp Executable Path: Por preconfiguração, o OpenTubeX assume que o yt-dlp pode ser encontrado através da variável de ambiente PATH. Se necessário, pode definir aqui um caminho personalizado.
    Cookie Source: Escolha se o yt-dlp deve ler um arquivo de cookies Netscape ou os cookies de um navegador instalado para a reprodução autenticada.
    Cookie File: Selecione um arquivo de cookies no formato Netscape para a reprodução autenticada.
    Browser for Cookies: A compatibilidade com navegadores é obtida a partir do executável do yt-dlp selecionado. Quando é pedida a reprodução autenticada, o OpenTubeX solicita ao yt-dlp que leia os cookies deste navegador.
    Browser Profile: Nome ou pasta opcional do perfil do navegador. Deixe em branco para usar o perfil acedido mais recentemente.
    Always Use Cookies: Utiliza os cookies configurados sempre que o yt-dlp extrai transmissões. Isto não muda o método de extração da transmissão para o yt-dlp. Com o yt-dlp selecionado, podem ficar disponíveis formatos exclusivos de contas, incluindo a taxa de bits melhorada do YouTube Premium se a conta tiver acesso.
    FFmpeg Executable Path: O FFmpeg é necessário para combinar transmissões separadas de vídeo e áudio e para converter áudio. Por preconfiguração, o OpenTubeX assume que o FFmpeg pode ser encontrado através da variável de ambiente PATH. Se necessário, pode definir aqui um caminho personalizado.
  Distraction Free Settings:
    Shorten View Counts: Mostra as contagens de visualizações e gostos nos comentários que o YouTube já arredondou num formato abreviado, por exemplo 14K em vez de 14,000. As contagens exatas são sempre mostradas por extenso.
  Subscription Settings:
    Fetch Feed on Startup: Quando esta opção está ativada, o OpenTubeX obtém automaticamente o feed de inscrições ao iniciar e ao abrir uma nova janela.
    Show New Content Feed: Mostra uma guia Novos com os elementos do feed de inscrições que não estavam presentes na obtenção anterior.
    Show New Content Indicators: Mostra um pequeno ponto junto aos elementos do feed de inscrições que não estavam presentes na obtenção anterior.
    Show Scheduled Live Streams / Premieres First: Mantém as próximas emissões ao vivo e estreias no início do feed de inscrições. Quando esta opção está desativada, permanecem na posição em que foram anunciadas até começarem. Depois de desativar, atualize uma vez o feed de inscrições parcarregando as datas de anúncio das entradas agendadas existentes.
    Auto Refresh Interval: A frequência com que o OpenTubeX atualiza automaticamente o feed de inscrições enquanto o aplicativo está aberta.
  Theme Settings:
    Show Progress as Notification: Mostra uma notificação persistente com o progresso em tempo real das operações em segundo plano, como a atualização das inscrições e as downloads de ferramentas gerenciadas, em vez de usar a barra de progresso global.
    Always Show Scrollbars: Mantém as barras de deslocamento sempre visíveis. Quando esta opção está desativada, desaparecem pouco depois de parar de mover o mouse e reaparecem assim que volta a movê-lo.
    Scroll Speed: Altera a distância de rolagem dos gestos da roda do mouse e do touchpad.
    Use Fixed Tab Width: Atribui a mesma largura a todas as guias na barra horizontal, em vez de ajustar a largura ao respectivo título.
    Use Grid Player Menu: Organiza o menu de configurações do reprodutor de vídeo numa grelha de mosaicos em vez de uma lista de linhas.
