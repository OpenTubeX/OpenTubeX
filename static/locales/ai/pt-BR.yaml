    Video Metadata Description: Guarda títulos, miniaturas e descrições anteriores dos vídeos suportados. Não é possível recriar versões antigas depois de as excluir.
    Video Metadata Effect: As versões de metadados salvas serão excluídas permanentemente. Os detalhes atuais dos vídeos podem voltar a ser obtidos.
    Watch History: Histórico e estatísticas de visualização
    Watch History Description: O histórico de reprodução registra os vídeos vistos e o progresso. As estatísticas de visualização guardam os totais diários. A retenção só se aplica ao histórico de reprodução.
    Clear Watch Statistics: Limpar estatísticas de visualização
    Watch History Effect: Os registros dos vídeos vistos e o progresso salvo serão excluídos. As estatísticas de visualização serão mantidas.
    Clear Watch Statistics Confirmation: Excluir todas as estatísticas de visualização?
    Watch Statistics Effect: Os totais diários de visualização serão excluídos. O histórico de reprodução será mantido.
