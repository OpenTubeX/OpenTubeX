    Subscriptions And Profiles Description: Guarda os canais inscritos, os nomes dos perfis e a associação das inscrições aos perfis.
    Subscriptions And Profiles Effect: Todas as inscrições e perfis adicionais serão excluídos permanentemente. Os dados da cache dos feeds também serão limpos.
    Playlists Description: Guarda os nomes, as descrições e os vídeos das listas de reprodução.
    Playlists Effect: Todas as listas de reprodução e os respectivos vídeos salvos serão excluídos permanentemente. Os arquivos de mídia baixados serão mantidos.
