Tooltips:
  General Settings:
    Use AI Translation Completions: جاهای خالی ترجمه‌های انسانی را با متن تولیدشده با هوش مصنوعی پر می‌کند. ترجمه‌های انسانی همیشه اولویت دارند.
    Update Relative Timestamps: تا زمانی که صفحه باز است، زمان‌های نسبی را در سراسر برنامه به‌روز می‌کند. در صورت غیرفعال بودن، فقط پس از بارگیری دوباره یا بازدید مجدد از صفحه به‌روز می‌شوند.
    Stream Extraction Method: |
      روش دریافت جریان‌های ویدیو توسط OpenTubeX را انتخاب کنید. در صورت انتخاب yt-dlp، باید در دسترس باشد.
      با استفاده از yt-dlp ممکن است پخش ویدیوها دیرتر آغاز شود.
      روش داخلی از جابه‌جایی در پخش‌های زنده و نمایش‌های نخست پشتیبانی نمی‌کند.
    Avoid translation: |
      ترجمه خودکار عنوان، توضیحات و فصل‌های ویدیو توسط YouTube را غیرفعال می‌کند.
      درخواست‌های بیش‌ازحد، مانند دریافت عنوان ویدیوهای فهرست‌ها، ممکن است موقتاً
      بر پایداری برنامه اثر بگذارد.
    Show Thumbnail Previews: با نگه‌داشتن نشانگر روی تصاویر بندانگشتی ویدیو، پیش‌نمایش متحرک نشان می‌دهد.
    Startup Behavior: |
      عملکرد OpenTubeX هنگام راه‌اندازی را انتخاب کنید.
      «بارگیری همه زبانه‌ها» فوراً همه زبانه‌های ذخیره‌شده را بازیابی می‌کند، اما ویدیوهای زبانه‌های پس‌زمینه خودکار پخش نمی‌شوند.
      «بارگیری زبانه‌های بارگیری‌شده قبلی» زبانه‌هایی را که هنگام بسته‌شدن OpenTubeX بارگیری شده بودند دوباره بارگیری می‌کند و بقیه را بارگیری‌نشده نگه می‌دارد.
      «بارگیری آخرین زبانه فعال» نشست قبلی را با زبانه‌های دیگر به‌صورت باز اما بارگیری‌نشده بازیابی می‌کند؛ با کلیک روی آن‌ها بارگیری می‌شوند.
      «شروع با نشست خالی» زبانه‌های ذخیره‌شده را نادیده می‌گیرد و پنجره‌ای تازه باز می‌کند.
    Remember Tab Navigation History: سابقه پیمایش عقب و جلوی هر زبانه ذخیره می‌شود و با راه‌اندازی دوباره OpenTubeX بازیابی می‌شود.
  Proxy Settings:
    IP Block Recovery Script Path: مسیر فایل اسکریپتی که هنگام شناسایی مسدودشدن IP اجرا می‌شود. OpenTubeX تا پایان آن منتظر می‌ماند و سپس ویدیو را دوباره بارگیری می‌کند. اگر روش جایگزین فعال باشد، اسکریپت فقط در صورت شکست آن نیز اجرا می‌شود.
  Player Settings:
    Enable Caption Translations: در صورت فعال بودن، اگر ویدیو زیرنویس اصلی منطبق نداشته باشد، دکمه زیرنویس و میان‌بر C نسخه ترجمه‌شده خودکار به زبان زیرنویس ترجیحی را انتخاب می‌کنند.
    Use Quick Playback Speed Bar: نوار سریع سرعت پخش را در سمت راست کنترل‌های پخش‌کننده نشان می‌دهد. اگر ذخیره دستی سرعت پخش برای هر کانال فعال باشد، دکمه ذخیره سرعت برای کانال فعلی نیز در این نوار قرار می‌گیرد.
    Multiply Seek Interval by Playback Rate: در صورت فعال بودن، بازه‌های جابه‌جایی (کلیدهای جهت‌نما و J/L) در سرعت پخش فعلی ضرب می‌شوند. در صورت غیرفعال بودن، این بازه‌ها مستقل از سرعت پخش ثابت می‌مانند.
    Show Playback Rate Adjusted Timestamp: در صورت فعال بودن و تفاوت سرعت پخش با 1x، پخش‌کننده زمان تنظیم‌شده بر اساس سرعت پخش را پس از زمان عادی و داخل پرانتز نشان می‌دهد.
    Use YouTube-style Shorts: ویدیوهای کوتاه را در صفحه‌های اشتراک و کانال به‌صورت شبکه‌ای عمودی نشان می‌دهد و از پخش‌کننده ویدیوهای کوتاه به سبک YouTube استفاده می‌کند.
    Loop Shorts: در صورت فعال بودن، ویدیوهای کوتاه خودکار از ابتدا پخش می‌شوند. در صورت غیرفعال بودن، در پایان متوقف می‌شوند و دکمه پخش دوباره نمایش داده می‌شود.
    Show Skip Silence Toggle: کلید روشن/خاموشِ ردکردن سکوت را در منوی تنظیمات پخش‌کننده نشان می‌دهد.
    Enable Skip Silence by Default: ردکردن سکوت را برای زبانه‌های جدید فعال می‌کند. تغییر آن در یک زبانه بر زبانه‌های دیگر اثری ندارد.
    Enable Video Zoom: کنترل بزرگ‌نمایی را در منوی تنظیمات پخش‌کننده نشان می‌دهد و میان‌برهای صفحه‌کلید و کنترل‌های جابه‌جایی آن را فعال می‌کند.
    Voice-over Translation: هنگام درخواست ترجمه، شناسه ویدیو، مدت‌زمان و زبان انتخابی را به سرویس غیررسمی ترجمه صوتی Yandex می‌فرستد. به‌طور پیش‌فرض غیرفعال است.
    Hold to Double Playback Speed: برای دو برابرکردن موقت سرعت پخش فعلی، کلید فاصله یا دکمه چپ ماوس را روی پخش‌کننده نگه دارید.
    Ambient Mode: رنگ‌های ویدیو را در فضای اطراف پخش‌کننده پخش می‌کند.
    Default Volume: هنگام فعال بودن «به‌خاطرسپردن بلندی صدا» غیرفعال است. برای تعیین بلندی صدای ثابت هنگام شروع هر ویدیو، «به‌خاطرسپردن بلندی صدا» را خاموش کنید.
    Parallel Segment Loading: |
      تعداد قطعه‌های ویدیو و صدا که پیش از پخش هم‌زمان بارگیری می‌شوند.
      مقادیر بالاتر ممکن است به اتصال‌های کند یا ناپایدار کمک کنند، اما پهنای باند و حافظه بیشتری مصرف می‌کنند.
      همچنین ممکن است باعث شوند «خودکار» سرعت اتصال را کمتر برآورد کند و کیفیت پایین‌تری برگزیند.
      جریان‌هایی که هر بار به یک درخواست محدودند، این تنظیم را نادیده می‌گیرند.
  Download Settings:
    Download Folder: ویدیوها در این پوشه ذخیره می‌شوند. برای استفاده از پوشه «بارگیری‌ها»ی سیستم، خالی بگذارید.
    Global Additional yt-dlp Arguments: آرگومان‌های اضافی خط فرمان که برای هر بارگیری به yt-dlp فرستاده می‌شوند؛ برای مثال --cookies-from-browser firefox.
    Concurrent Downloads: بیشترین تعداد کارهای yt-dlp که می‌توانند هم‌زمان اجرا شوند.
    Bandwidth Limit: با تقسیم این حد میان کارهای هم‌زمان، نرخ انتقال مجموع صف را محدود می‌کند. برای نامحدودبودن، 0 وارد کنید.
  External Software Settings:
    yt-dlp Source: OpenTubeX می‌تواند از yt-dlp نصب‌شده روی سیستم استفاده کند یا نسخه خودش را بارگیری و مدیریت کند که در پوشه داده‌های کاربر نگهداری می‌شود.
    yt-dlp Channel: کانال انتشار yt-dlp را که OpenTubeX بارگیری و مدیریت می‌کند انتخاب کنید. کانال Stable برای بیشتر کاربران پیشنهاد می‌شود.
    FFmpeg Source: OpenTubeX می‌تواند از FFmpeg و FFprobe نصب‌شده روی سیستم استفاده کند یا نسخه‌های ایستای خودش را بارگیری و مدیریت کند که در پوشه داده‌های کاربر نگهداری می‌شوند.
    Managed Tool Updates: انتخاب کنید ابزارهای مدیریت‌شده خودکار به‌روز شوند، پیش از به‌روزرسانی اجازه بگیرند یا فقط با دکمه‌های دستی به‌روز شوند. ابزارهایی که موجود نیستند همچنان هنگام نیاز بارگیری می‌شوند.
    yt-dlp Executable Path: OpenTubeX به‌طور پیش‌فرض فرض می‌کند yt-dlp از طریق متغیر محیطی PATH پیدا می‌شود. در صورت نیاز می‌توانید اینجا مسیری سفارشی تعیین کنید.
    Cookie Source: انتخاب کنید yt-dlp برای پخش با احراز هویت، فایل کوکی Netscape را بخواند یا کوکی‌های مرورگری نصب‌شده را.
    Cookie File: یک فایل کوکی با قالب Netscape برای پخش با احراز هویت انتخاب کنید.
    Browser for Cookies: پشتیبانی از مرورگر از فایل اجرایی yt-dlp انتخاب‌شده خوانده می‌شود. هنگام درخواست پخش با احراز هویت، OpenTubeX از yt-dlp می‌خواهد کوکی‌های این مرورگر را بخواند.
    Browser Profile: نام یا پوشه نمایه مرورگر، اختیاری است. برای استفاده از آخرین نمایه‌ای که به آن دسترسی داشته‌اید، خالی بگذارید.
    Always Use Cookies: هر زمان yt-dlp جریان‌ها را استخراج می‌کند، از کوکی‌های پیکربندی‌شده استفاده شود. این گزینه روش استخراج جریان را به yt-dlp تغییر نمی‌دهد. با انتخاب yt-dlp، ممکن است قالب‌های ویژه حساب در دسترس قرار گیرند؛ از جمله نرخ بیت بهتر YouTube Premium، اگر حساب به آن دسترسی داشته باشد.
    FFmpeg Executable Path: برای ادغام جریان‌های جداگانه ویدیو و صدا و نیز تبدیل صدا، FFmpeg لازم است. OpenTubeX به‌طور پیش‌فرض فرض می‌کند FFmpeg از طریق متغیر محیطی PATH پیدا می‌شود. در صورت نیاز می‌توانید اینجا مسیری سفارشی تعیین کنید.
  Distraction Free Settings:
    Shorten View Counts: تعداد بازدید و پسندهای نظرها را که YouTube از قبل گرد کرده، به‌شکل کوتاه نشان می‌دهد؛ مثلاً 14K به‌جای 14,000. تعداد دقیق همیشه کامل نمایش داده می‌شود.
  Subscription Settings:
    Fetch Feed on Startup: در صورت فعال بودن، OpenTubeX هنگام راه‌اندازی و بازشدن پنجره‌ای جدید، خوراک اشتراک‌های شما را خودکار دریافت می‌کند.
    Show New Content Feed: زبانه «جدید» را نشان می‌دهد که حاوی مواردی از خوراک اشتراک‌هاست که هنگام دریافت قبلی وجود نداشتند.
    Show New Content Indicators: کنار مواردی از خوراک اشتراک‌ها که هنگام دریافت قبلی وجود نداشتند، نقطه‌ای کوچک نشان می‌دهد.
    Show Scheduled Live Streams / Premieres First: پخش‌های زنده و نمایش‌های نخست آینده را بالای خوراک اشتراک‌ها نگه می‌دارد. در صورت غیرفعال بودن، تا زمان شروع در جایگاه اعلام اولیه خود می‌مانند. پس از غیرفعال‌کردن، خوراک اشتراک‌ها را یک‌بار تازه‌سازی کنید تا تاریخ اعلام موارد زمان‌بندی‌شده موجود دریافت شود.
    Auto Refresh Interval: فاصله زمانی تازه‌سازی خودکار خوراک اشتراک‌ها توسط OpenTubeX در حالی که برنامه باز است.
  Theme Settings:
    Show Progress as Notification: به‌جای نوار پیشرفت سراسری، اعلان پایداری با پیشرفت زنده عملیات پس‌زمینه مانند تازه‌سازی اشتراک‌ها و بارگیری ابزارهای مدیریت‌شده نشان می‌دهد.
    Always Show Scrollbars: نوارهای پیمایش را همیشه نمایان نگه می‌دارد. در صورت غیرفعال بودن، کمی پس از توقف حرکت ماوس محو می‌شوند و با حرکت دوباره آن فوراً ظاهر می‌شوند.
    Scroll Speed: فاصلهٔ پیمایش با حرکت چرخ ماوس و صفحهٔ لمسی را تغییر می‌دهد.
    Use Fixed Tab Width: به‌جای تنظیم اندازه زبانه‌ها بر اساس عنوانشان، به همه زبانه‌های نوار افقی عرضی یکسان می‌دهد.
    Use Grid Player Menu: منوی تنظیمات پخش‌کننده ویدیو را به‌جای فهرستی از ردیف‌ها، به‌صورت شبکه‌ای از کاشی‌ها می‌چیند.
