    Description: این چند کنترل به شما کمک می‌کنند سریع‌تر با برنامه آشنا شوید.
  Navigation:
    Title: کتابخانه‌تان همیشه در دسترس است
    Description: از پیمایش برای دسترسی به اشتراک‌ها، فهرست‌های پخش، سابقه و بخش‌های دیگر استفاده کنید.
  Search:
    Title: جست‌وجو یا جای‌گذاری پیوند
    Description: ویدیوها و کانال‌ها را پیدا کنید یا نشانی یک ویدیوی پشتیبانی‌شده را مستقیماً در کادر جست‌وجو جای‌گذاری کنید.
  Tabs:
    Title: صفحه‌ها را در زبانه‌ها باز نگه دارید
    Description: چند صفحه را هم‌زمان باز کنید، بدون اینکه جای خود را گم کنید. محل مناسب زبانه‌ها را در چیدمانتان انتخاب کنید.
  Quick Settings:
    Title: مطابق سلیقهٔ شما
    Description: پوسته و کیفیت پیش‌فرض ویدیو را انتخاب کنید. این گزینه‌ها و تنظیمات دیگر را هر زمان از منوی نمایه تغییر دهید؛ برای تعویض نمایه نیز روی آن کلیک راست کنید.
  Import Data:
    Title: داده‌هایتان را همراه بیاورید
    Description: در صورت تمایل، اشتراک‌ها، سابقه، فهرست‌های پخش، سابقهٔ جست‌وجو یا تنظیمات را از برنامه‌ای پشتیبانی‌شده یا نسخهٔ پشتیبان وارد کنید.
    Action: ورود داده‌ها
    Not Now: اکنون نه
  Settings Moved:
    Title: تنظیمات جابه‌جا شده‌اند
    Description: برای کنترل‌های سریع، نمایه‌تان را در بالا سمت راست انتخاب کنید. با کلیک راست روی آن مستقیماً به انتخاب نمایه بروید. نماد چرخ‌دندهٔ این منو همهٔ تنظیمات را باز می‌کند؛ بخش‌های «درباره» و «بارگیری‌ها» نیز به این منو منتقل شده‌اند.
