Tooltips:
  General Settings:
    Use AI Translation Completions: Zapolni vrzeli v človeških prevodih z besedilom, ki ga ustvari umetna inteligenca. Človeški prevodi imajo vedno prednost.
    Update Relative Timestamps: Posodablja relativne časovne žige po vsej aplikaciji, dokler je stran odprta. Če je možnost izklopljena, se posodobijo šele po ponovnem nalaganju ali obisku strani.
    Stream Extraction Method: |
      Izberite, kako OpenTubeX pridobiva pretoke videoposnetkov. Če izberete yt-dlp, mora biti ta na voljo.
      Pri uporabi yt-dlp lahko traja dlje, da se videoposnetki začnejo predvajati.
      Vgrajeni način ne podpira iskanja po časovnici prenosov v živo in premier.
    Avoid translation: |
      Onemogoči YouTubov samodejni prevod naslova, opisa in poglavij videoposnetka.
      Preveč zahtev, na primer pridobivanje naslovov videoposnetkov na seznamih, lahko začasno
      vpliva na zanesljivost aplikacije.
    Fallback to Non-Preferred Backend on Failure: Če ima prednostni API težavo, bo OpenTubeX ob vklopljeni možnosti samodejno poskusil uporabiti neprednostni API kot nadomestni način.
    Thumbnail Preference: Vse sličice v aplikaciji OpenTubeX bodo namesto privzete sličice zamenjane s sličico iz videoposnetka, zamegljene ali skrite.
    Show Thumbnail Previews: Ob prehodu kazalca čez sličice videoposnetkov prikaže animirane predoglede.
    Startup Behavior: |
      Izberite, kaj OpenTubeX naredi ob zagonu.
      Možnost »Naloži vse zavihke« takoj obnovi vse shranjene zavihke, vendar se videoposnetki v zavihkih v ozadju ne začnejo samodejno predvajati.
      Možnost »Naloži prej naložene zavihke« znova naloži zavihke, ki so bili naloženi ob zaprtju aplikacije OpenTubeX, druge pa pusti razbremenjene.
      Možnost »Naloži zadnji dejavni zavihek« obnovi prejšnjo sejo z drugimi odprtimi, vendar razbremenjenimi zavihki; naložijo se, ko jih kliknete.
      Možnost »Začni s prazno sejo« preskoči shranjene zavihke in odpre novo okno.
    Invidious Instance: Primerek Invidious, s katerim se bo OpenTubeX povezal za klice API. Spremembe te nastavitve veljajo samo za trenutno okno, razen če ta primerek nastavite kot privzetega.
    Region for Trending: Območje priljubljenih vsebin omogoča izbiro države, katere priljubljene videoposnetke želite prikazati.
    External Link Handling: |
      Izberite privzeto vedenje ob kliku povezave, ki je ni mogoče odpreti v aplikaciji OpenTubeX.
      OpenTubeX bo kliknjeno povezavo privzeto odprl v vašem privzetem brskalniku.
    Open Deep Links In New Window: Naslovi URL, posredovani aplikaciji OpenTubeX, na primer s preusmeritvenimi razširitvami brskalnika ali argumenti ukazne vrstice, se odprejo v novem oknu.
    Remember Tab Navigation History: Zgodovina pomikanja nazaj in naprej se za vsak zavihek shrani ter obnovi ob ponovnem zagonu aplikacije OpenTubeX.
  Proxy Settings:
    IP Block Recovery Script Path: Pot do skriptne datoteke, ki se zažene ob zaznani blokadi naslova IP. OpenTubeX počaka, da se izvajanje konča, nato znova naloži videoposnetek. Če je omogočen nadomestni način, se skript zažene le, kadar tudi ta ne uspe.
  Player Settings:
    Continue Playback When Screen Is Locked: 'Nadaljuje predvajanje zvoka v ozadju in omogoča predstavnostne kontrolnike Android. Izklopite, da se predvajanje začasno ustavi, ko aplikacija ni več vidna.'
    Enable Caption Translations: Ko je možnost omogočena in videoposnetek nima ustrezne izvirne sledi, imata gumb za podnapise in bližnjica C prednostno samodejno prevedeno sled v prednostnem jeziku podnapisov.
    Proxy Videos Through Invidious: Za posredovanje videoposnetkov se poveže z Invidiousom namesto neposredno z YouTubom.
    Default Video Format: Nastavite oblike zapisa za predvajanje videoposnetkov. Oblike DASH omogočajo višjo kakovost. Starejše oblike so omejene na največ 360p, vendar porabijo manj pasovne širine. Zvočne oblike vsebujejo le zvočni pretok.
    Use Quick Playback Speed Bar: Na desni strani kontrolnikov predvajalnika prikaže vrstico za hitro spreminjanje hitrosti predvajanja. Če je omogočeno ročno shranjevanje hitrosti predvajanja za posamezne kanale, vrstica vsebuje tudi gumb za shranjevanje hitrosti trenutnega kanala.
    Scroll Playback Rate Over Video Player: Ko je kazalec nad videoposnetkom, pridržite tipko Control (tipko Command v računalnikih Mac) in zavrtite miškin kolešček naprej ali nazaj, da spremenite hitrost predvajanja. Za hitro vrnitev na privzeto hitrost predvajanja pridržite tipko Control (tipko Command v računalnikih Mac) in kliknite levi miškin gumb (1x, razen če je bila hitrost spremenjena v nastavitvah).
    Multiply Seek Interval by Playback Rate: Ko je možnost omogočena, se presledki preskakovanja (smerne tipke in J/L) pomnožijo s trenutno hitrostjo predvajanja. Ko je onemogočena, ostanejo enaki ne glede na hitrost predvajanja.
    Show Playback Rate Adjusted Timestamp: Ko je možnost omogočena in hitrost predvajanja ni 1x, predvajalnik za običajnim prikazom časovnega žiga v oklepaju prikaže časovni žig, prilagojen hitrosti predvajanja.
    Use YouTube-style Shorts: Videoposnetke Shorts prikaže v pokončni mreži na straneh naročnin in kanalov ter uporabi predvajalnik Shorts v slogu YouTuba.
    Loop Shorts: Ko je možnost omogočena, se videoposnetki Shorts samodejno začnejo znova. Ko je onemogočena, se na koncu ustavijo in prikažejo gumb za ponovno predvajanje.
    Show Skip Silence Toggle: V meniju nastavitev predvajalnika prikaže stikalo za vklop ali izklop preskakovanja tišine.
    Enable Skip Silence by Default: Omogoči preskakovanje tišine za nove zavihke. Sprememba v enem zavihku ne vpliva na druge.
    Enable Video Zoom: V meniju nastavitev predvajalnika prikaže kontrolnik za povečavo ter omogoči njegove bližnjice na tipkovnici in kontrolnike za pomikanje.
    Voice-over Translation: Ob zahtevi za prevod pošlje ID videoposnetka, trajanje in izbrani jezik neuradni Yandexovi storitvi za glasovni prevod. Privzeto je onemogočeno.
    Hold to Double Playback Speed: Pridržite preslednico ali levi miškin gumb nad predvajalnikom, da začasno podvojite trenutno hitrost predvajanja.
    Ambient Mode: Barve videoposnetka prelije v območje okoli predvajalnika.
    Default Volume: Onemogočeno, dokler je omogočena možnost »Zapomni si glasnost«. Izklopite jo, da nastavite stalno začetno glasnost za vsak videoposnetek.
    Parallel Segment Loading: |
      Koliko video- in zvočnih segmentov naj se hkrati naloži vnaprej pred predvajanjem.
      Višje vrednosti lahko pomagajo pri počasnih ali nestabilnih povezavah, vendar porabijo več pasovne širine in pomnilnika.
      Lahko tudi povzročijo, da možnost »Samodejno« podceni hitrost povezave in izbere nižjo kakovost.
      Pretoki, omejeni na eno zahtevo naenkrat, to nastavitev prezrejo.
    Preload Upcoming Videos: "Pridobi in predpomni naslove yt-dlp naslednjih videov. Čakalna vrsta ima prednost pred seznami in priporočili."
    Upcoming Videos to Preload: "Največje število naslednjih videov, katerih naslovi yt-dlp se pridobijo v ozadju."
    Concurrent Preloads: "Največje število procesov yt-dlp, ki se uporabljajo za sočasno prednalaganje videov. Višje vrednosti porabijo več procesorske moči, pomnilnika in omrežne pasovne širine."
  External Player Settings:
    External Player: Če izberete zunanji predvajalnik, se na sličici prikaže ikona za odpiranje videoposnetka oziroma seznama predvajanja, če je podprt, v zunanjem predvajalniku. Nastavitve Invidious ne vplivajo na zunanje predvajalnike.
    Custom External Player Executable: OpenTubeX privzeto predvideva, da je izbrani zunanji predvajalnik mogoče najti prek okoljske spremenljivke PATH. Po potrebi lahko tukaj nastavite pot po meri.
    Ignore Warnings: Skrij opozorila, kadar trenutni zunanji predvajalnik ne podpira trenutnega dejanja (npr. obrnjenega vrstnega reda seznamov predvajanja).
    Ignore Default Arguments: Zunanjemu predvajalniku razen naslova URL videoposnetka ne pošlji privzetih argumentov (npr. hitrosti predvajanja ali naslova URL seznama predvajanja). Argumenti po meri bodo še vedno poslani.
    Custom External Player Arguments: Argumenti ukazne vrstice po meri, ki jih želite poslati zunanjemu predvajalniku.
    DefaultCustomArgumentsTemplate: '(Privzeto: ''{defaultCustomArguments}'')'
  Download Settings:
    Download Folder: Videoposnetki se shranijo v to mapo. Če želite uporabiti sistemsko mapo Prenosi, pustite prazno.
    Global Additional yt-dlp Arguments: Dodatni argumenti ukazne vrstice, posredovani yt-dlp pri vsakem prenosu, na primer --cookies-from-browser firefox.
    Concurrent Downloads: Največje število opravil yt-dlp, ki se lahko izvajajo hkrati.
    Bandwidth Limit: Omeji skupno hitrost prenosa čakalne vrste tako, da omejitev razdeli med sočasna opravila. Za neomejeno hitrost vnesite 0.
  External Software Settings:
    yt-dlp Source: OpenTubeX lahko uporabi yt-dlp, nameščen v sistemu, ali prenese in upravlja svojo kopijo yt-dlp, shranjeno v mapi z uporabniškimi podatki.
    yt-dlp Channel: Izberite kanal izdaj yt-dlp, ki ga OpenTubeX prenaša in upravlja. Za večino uporabnikov je priporočljiv stabilni kanal.
    FFmpeg Source: OpenTubeX lahko uporabi FFmpeg in FFprobe, nameščena v sistemu, ali prenese in upravlja lastne statične graditve, shranjene v mapi z uporabniškimi podatki.
    Managed Tool Updates: Izberite, ali naj se upravljana orodja posodabljajo samodejno, pred posodobitvijo vprašajo ali posodobijo samo z ročnimi gumbi. Manjkajoča orodja se po potrebi še vedno prenesejo.
    yt-dlp Executable Path: OpenTubeX privzeto predvideva, da je yt-dlp mogoče najti prek okoljske spremenljivke PATH. Po potrebi lahko tukaj nastavite pot po meri.
    Cookie Source: Izberite, ali naj yt-dlp za overjeno predvajanje prebere datoteko s piškotki Netscape ali piškotke iz nameščenega brskalnika.
    Cookie File: Izberite datoteko s piškotki v obliki Netscape za overjeno predvajanje.
    Browser for Cookies: Podpora za brskalnike se prebere iz izbrane izvedljive datoteke yt-dlp. OpenTubeX ob zahtevanem overjenem predvajanju naroči yt-dlp, naj prebere podatke tega brskalnika.
    Browser Profile: Izbirno ime ali mapa profila brskalnika. Če želite uporabiti nazadnje uporabljeni profil, pustite prazno.
    Always Use Cookies: Uporabi nastavljene piškotke vsakič, ko yt-dlp pridobiva pretoke. S tem se način pridobivanja pretoka ne preklopi na yt-dlp. Ko je izbran yt-dlp, so lahko na voljo oblike, dostopne samo z računom, vključno z izboljšano bitno hitrostjo storitve YouTube Premium, če ima račun dostop.
    FFmpeg Executable Path: FFmpeg je potreben za združevanje ločenih video- in zvočnih pretokov ter pretvarjanje zvoka. OpenTubeX privzeto predvideva, da je FFmpeg mogoče najti prek okoljske spremenljivke PATH. Po potrebi lahko tukaj nastavite pot po meri.
  Distraction Free Settings:
    Shorten View Counts: Prikaže število ogledov in všečkov komentarjev v skrajšani obliki, ki jo je YouTube že zaokrožil, npr. 14 tis. namesto 14.000. Natančno število je vedno prikazano v celoti.
    Hide Channels: Vnesite ID kanala, da skrijete vse njegove videoposnetke in sezname predvajanja ter sam kanal iz iskanja, priljubljenih in najbolj gledanih vsebin ter priporočil. Vneseni ID kanala se mora popolnoma ujemati in razlikuje med velikimi in malimi črkami.
    Hide Subscriptions Live: To nastavitev preglasi nastavitev »{appWideSetting}« za celotno aplikacijo v podrazdelku »{subsection}« razdelka »{settingsSection}«
    Hide Videos, Playlists and Channels Containing Text: Vnesite besedo, del besede ali besedno zvezo ne glede na velikost črk, da po vsej aplikaciji OpenTubeX skrijete videoposnetke, sezname predvajanja in kanale, katerih izvirni naslovi jo vsebujejo. Izvzeti so le Zgodovina, Vaši seznami predvajanja in videoposnetki znotraj seznamov predvajanja.
    Hide Videos on Watch: Skrije ogledane videoposnetke z zavihkov Videoposnetki, Shorts in V živo na straneh naročnin in kanalov. To ne vpliva na zavihek Domov na straneh kanalov
  Subscription Settings:
    Fetch Feed on Startup: Ko je možnost omogočena, OpenTubeX samodejno pridobi vir naročnin ob zagonu in odprtju novega okna.
    Show New Content Feed: Prikaže zavihek Novo z elementi vira naročnin, ki ob prejšnjem pridobivanju še niso bili prisotni.
    Show New Content Indicators: Ob elementih vira naročnin, ki ob prejšnjem pridobivanju še niso bili prisotni, prikaže majhno piko.
    Show Scheduled Live Streams / Premieres First: Prihajajoče prenose v živo in premiere obdrži na vrhu vira naročnin. Ko je možnost onemogočena, ostanejo do začetka na mestu svoje napovedi. Po izklopu enkrat osvežite vir naročnin, da pridobite datume napovedi za obstoječe načrtovane vnose.
    Auto Refresh Interval: "Kako pogosto OpenTubeX samodejno osveži vir naročnin, ko je aplikacija odprta. V Androidu interval, ki ni nič, osvežuje vir tudi, ko je aplikacija zaprta."
    Refresh Subscriptions While App Is Closed: "Androidu omogoča osveževanje virov naročnin v izbranih intervalih, ko je OpenTubeX zaprt. Izklopite to možnost, da se samodejno osveževanje izvaja samo pri odprti aplikaciji."
  Theme Settings:
    Show Progress as Notification: Namesto splošne vrstice napredka prikaže trajno obvestilo s sprotnim napredkom opravil v ozadju, kot sta osveževanje naročnin in prenos upravljanih orodij.
    Always Show Scrollbars: Drsniki so vedno vidni. Če je ta možnost onemogočena, izginejo kmalu po tem, ko nehate premikati miško, in se znova prikažejo, ko jo premaknete.
    Scroll Speed: Spremeni razdaljo pomikanja z gibi kolesca miške in sledilne ploščice.
    Use Fixed Tab Width: Vsi zavihki v vodoravni vrstici imajo enako širino, namesto da bi se prilagajali naslovu.
    Use Grid Player Menu: Meni z nastavitvami predvajalnika videoposnetkov je razporejen v mrežo ploščic namesto v seznam vrstic.
  Experimental Settings:
    Replace HTTP Cache: Onemogoči Electronov predpomnilnik HTTP na disku in omogoči prilagojen predpomnilnik slik v pomnilniku. Poraba pomnilnika RAM bo večja.
  SponsorBlock Settings:
    UseDeArrowTitles: Naslove videoposnetkov zamenja z naslovi, ki so jih uporabniki poslali v DeArrow.
    UseDeArrowThumbnails: Sličice videoposnetkov zamenja s sličicami iz DeArrow.
