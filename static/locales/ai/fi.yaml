Tooltips:
  General Settings:
    Use AI Translation Completions: Täydennä ihmiskäännösten puuttuvat kohdat tekoälyn luomalla tekstillä. Ihmisten tekemät käännökset ovat aina etusijalla.
    Update Relative Timestamps: Päivittää suhteellisia aikaleimoja kaikkialla sovelluksessa sivun ollessa avoinna. Jos asetus on poistettu käytöstä, ne päivittyvät vasta, kun sivu ladataan uudelleen tai sillä käydään uudelleen.
    Stream Extraction Method: |
      Valitse, miten OpenTubeX hakee videovirrat. Jos yt-dlp valitaan, sen on oltava käytettävissä.
      Videoiden toiston alkaminen voi kestää kauemmin yt-dlp:tä käytettäessä.
      Sisäänrakennettu menetelmä ei tue suorien lähetysten eikä ensi-iltojen kelaamista.
    Avoid translation: |
      Estä YouTubea kääntämästä automaattisesti videon nimeä, kuvausta ja lukuja.
      Liian monet pyynnöt, kuten videoiden nimien hakeminen luetteloihin, voivat tilapäisesti
      heikentää sovelluksen toimintavarmuutta.
    Show Thumbnail Previews: Näytä animoitu esikatselu, kun osoitin viedään videon pikkukuvan päälle.
    Startup Behavior: |
      Valitse, mitä OpenTubeX tekee käynnistyessään.
      Kaikkien välilehtien lataaminen palauttaa kaikki tallennetut välilehdet heti, mutta taustavälilehtien videoita ei toisteta automaattisesti.
      Aiemmin ladattujen välilehtien lataaminen lataa uudelleen välilehdet, jotka olivat ladattuina OpenTubeX:n sulkeutuessa, ja jättää muut lataamatta.
      Viimeksi aktiivisen välilehden lataaminen palauttaa edellisen istunnon niin, että muut välilehdet avataan mutta jätetään lataamatta. Ne latautuvat, kun niitä napsautetaan.
      Tyhjän istunnon aloittaminen ohittaa tallennetut välilehdet ja avaa uuden ikkunan.
    Remember Tab Navigation History: Kunkin välilehden taakse- ja eteenpäin siirtymisen historia tallennetaan ja palautetaan, kun OpenTubeX käynnistyy uudelleen.
  Proxy Settings:
    IP Block Recovery Script Path: Komentosarjatiedosto, joka suoritetaan IP-eston havaitsemisen jälkeen. OpenTubeX odottaa suorituksen päättymistä ja lataa sitten videon uudelleen. Jos varamenetelmä on käytössä, komentosarja suoritetaan vain, jos myös varamenetelmä epäonnistuu.
  Player Settings:
    Continue Playback When Screen Is Locked: 'Jatkaa äänen toistamista taustalla ja tarjoaa Androidin mediasäätimet. Poista tämä käytöstä, jos haluat keskeyttää toiston, kun sovellus ei enää ole näkyvissä.'
    Enable Caption Translations: Kun asetus on käytössä, tekstityspainike ja C-pikanäppäin suosivat automaattisesti käännettyä tekstitysraitaa ensisijaisella tekstityskielellä, jos videossa ei ole vastaavaa alkuperäistä raitaa.
    Use Quick Playback Speed Bar: Näyttää toistonopeuden pikapalkin soittimen säätimien oikeassa reunassa. Jos kanavakohtaisen toistonopeuden manuaalinen tallennus on käytössä, palkissa on myös painike nykyisen kanavan nopeuden tallentamiseen.
    Multiply Seek Interval by Playback Rate: Kun asetus on käytössä, siirtymäväli kerrotaan nykyisellä toistonopeudella käytettäessä nuolinäppäimiä tai J/L-näppäimiä. Kun asetus on poistettu käytöstä, siirtymäväli pysyy samana toistonopeudesta riippumatta.
    Show Playback Rate Adjusted Timestamp: Kun asetus on käytössä ja toistonopeus poikkeaa nopeudesta 1x, soitin näyttää tavallisen aikaleiman jälkeen sulkeissa toistonopeuteen suhteutetun aikaleiman.
    Use YouTube-style Shorts: Näyttää Shorts-videot pystysuuntaisessa ruudukossa tilausten ja kanavien sivuilla sekä käyttää YouTube-tyylistä Shorts-soitinta.
    Loop Shorts: Kun asetus on käytössä, Shorts-videot alkavat automaattisesti alusta. Muussa tapauksessa ne pysähtyvät lopussa ja näyttävät uudelleentoistopainikkeen.
    Show Skip Silence Toggle: Näyttää hiljaisuuden ohittamisen käyttöönottokytkimen soittimen asetusvalikossa.
    Enable Skip Silence by Default: Ottaa hiljaisuuden ohittamisen käyttöön uusissa välilehdissä. Asetuksen muuttaminen yhdellä välilehdellä ei vaikuta muihin välilehtiin.
    Enable Video Zoom: Näyttää zoomaussäätimen soittimen asetusvalikossa ja ottaa sen pikanäppäimet sekä panorointisäätimet käyttöön.
    Voice-over Translation: Lähettää videon tunnuksen, keston ja valitun kielen epäviralliseen Yandexin selostuskäännöspalveluun, kun pyydät käännöstä. Oletusarvoisesti pois käytöstä.
    Hold to Double Playback Speed: Voit kaksinkertaistaa nykyisen toistonopeuden tilapäisesti pitämällä välilyöntiä tai soittimen päällä olevaa hiiren ykköspainiketta painettuna.
    Ambient Mode: Sulauttaa videon värit soitinta ympäröivään alueeseen.
    Default Volume: Ei käytettävissä, kun äänenvoimakkuuden muistaminen on käytössä. Poista äänenvoimakkuuden muistaminen käytöstä, jos haluat määrittää videoille kiinteän aloitusäänenvoimakkuuden.
    Parallel Segment Loading: |
      Samanaikaisesti ennen toistoa ladattavien video- ja äänisegmenttien määrä.
      Suuremmat arvot voivat auttaa hitailla tai epävakailla yhteyksillä, mutta ne käyttävät enemmän kaistanleveyttä ja muistia.
      Ne voivat myös saada automaattisen asetuksen aliarvioimaan yhteysnopeuden ja valitsemaan heikomman laadun.
      Tämä asetus ei vaikuta suoratoistovirtoihin, joissa sallitaan vain yksi pyyntö kerrallaan.
    Preload Upcoming Videos: "Noutaa ja tallentaa välimuistiin seuraavien videoiden yt-dlp-osoitteet. Jono on etusijalla soittolistoihin ja suosituksiin nähden."
    Upcoming Videos to Preload: "Enimmäismäärä seuraavia videoita, joiden yt-dlp-osoitteet noudetaan taustalla."
    Concurrent Preloads: "Videoiden samanaikaiseen esilataukseen käytettävien yt-dlp-prosessien enimmäismäärä. Suuremmat arvot käyttävät enemmän suoritinta, muistia ja verkon kaistanleveyttä."
  Download Settings:
    Download Folder: Videot tallennetaan tähän kansioon. Jos kenttä jätetään tyhjäksi, käytetään järjestelmän Lataukset-kansiota.
    Global Additional yt-dlp Arguments: Kaikissa latauksissa yt-dlp:lle välitettävät komentorivin lisäargumentit, esimerkiksi --cookies-from-browser firefox.
    Concurrent Downloads: Samanaikaisesti suoritettavien yt-dlp-töiden enimmäismäärä.
    Bandwidth Limit: Rajoittaa jonon yhteenlaskettua siirtonopeutta jakamalla tämän rajan samanaikaisten töiden kesken. Arvo 0 poistaa rajoituksen.
  External Software Settings:
    yt-dlp Source: OpenTubeX voi käyttää järjestelmään asennettua yt-dlp:tä tai ladata ja ylläpitää omaa yt-dlp-kopiotaan, joka tallennetaan käyttäjätietokansioon.
    yt-dlp Channel: Valitse OpenTubeX:n lataaman ja ylläpitämän yt-dlp-julkaisun kanava. Stable sopii useimmille käyttäjille.
    FFmpeg Source: OpenTubeX voi käyttää järjestelmään asennettuja FFmpeg- ja FFprobe-ohjelmia tai ladata ja ylläpitää omia staattisia koontiversioitaan, jotka tallennetaan käyttäjätietokansioon.
    Managed Tool Updates: Valitse, päivitetäänkö ylläpidetyt työkalut automaattisesti, kysytäänkö lupa ennen päivitystä vai päivitetäänkö ne vain manuaalisilla painikkeilla. Puuttuvat työkalut ladataan silti tarvittaessa.
    yt-dlp Executable Path: OpenTubeX olettaa oletusarvoisesti, että yt-dlp löytyy PATH-ympäristömuuttujan avulla. Tarvittaessa voit määrittää oman polun tässä.
    Cookie Source: Valitse, lukeeko yt-dlp Netscape-evästetiedostoa vai asennetun selaimen evästeitä tunnistautumista vaativaa toistoa varten.
    Cookie File: Valitse Netscape-muotoinen evästetiedosto tunnistautumista vaativaa toistoa varten.
    Browser for Cookies: Selaintuki luetaan valitusta yt-dlp-ohjelmatiedostosta. OpenTubeX pyytää yt-dlp:tä lukemaan tämän selaimen evästeet, kun tunnistautumista vaativaa toistoa pyydetään.
    Browser Profile: Valinnainen selainprofiilin nimi tai kansio. Jos kenttä jätetään tyhjäksi, käytetään viimeksi avattua profiilia.
    Always Use Cookies: Käytä määritettyjä evästeitä aina, kun yt-dlp hakee suoratoistovirtoja. Tämä ei vaihda suoratoistovirtojen hakumenetelmäksi yt-dlp:tä. Kun yt-dlp on valittu, vain tilille tarkoitetut muodot voivat tulla saataville. Niihin kuuluu YouTube Premiumin parannettu bittinopeus, jos tilillä on sen käyttöoikeus.
    FFmpeg Executable Path: FFmpeg tarvitaan erillisten video- ja äänivirtojen yhdistämiseen sekä äänen muuntamiseen. OpenTubeX olettaa oletusarvoisesti, että FFmpeg löytyy PATH-ympäristömuuttujan avulla. Tarvittaessa voit määrittää oman polun tässä.
  Distraction Free Settings:
    Shorten View Counts: Näyttää katselu- ja kommenttien tykkäysmäärät YouTuben valmiiksi pyöristämässä lyhyessä muodossa, esimerkiksi 14 t. 14 000:n sijaan. Tarkat määrät näytetään aina kokonaisina.
  Subscription Settings:
    Fetch Feed on Startup: Kun asetus on käytössä, OpenTubeX hakee tilausnäkymän automaattisesti käynnistyessään ja uuden ikkunan avautuessa.
    Show New Content Feed: Näyttää Uudet-välilehden, joka sisältää tilausnäkymän kohteet, joita ei ollut edellisellä hakukerralla.
    Show New Content Indicators: Näyttää pienen pisteen niiden tilausnäkymän kohteiden vieressä, joita ei ollut edellisellä hakukerralla.
    Show Scheduled Live Streams / Premieres First: Pitää tulevat suorat lähetykset ja ensi-illat tilausnäkymän alussa. Kun asetus on poistettu käytöstä, ne pysyvät ilmoitusajankohdan mukaisella paikallaan alkamiseensa asti. Päivitä tilausnäkymä kerran asetuksen poistamisen jälkeen, jotta olemassa olevien ajastettujen kohteiden ilmoituspäivät haetaan.
    Auto Refresh Interval: "Kuinka usein OpenTubeX päivittää tilausnäkymän automaattisesti sovelluksen ollessa avoinna. Androidissa nollasta poikkeava aikaväli päivittää syötteen myös sovelluksen ollessa suljettuna."
    Refresh Subscriptions While App Is Closed: "Sallii Androidin päivittää tilaussyötteet valituin aikavälein, kun OpenTubeX on suljettuna. Poista tämä käytöstä, jos haluat automaattiset päivitykset vain sovelluksen ollessa avoinna."
  Theme Settings:
    Show Progress as Notification: Näyttää taustatoimintojen, kuten tilausten päivityksen ja ylläpidettyjen työkalujen latausten, etenemisen jatkuvassa ilmoituksessa yleisen edistymispalkin sijaan.
    Always Show Scrollbars: Pitää vierityspalkit aina näkyvissä. Kun asetus on poistettu käytöstä, ne häipyvät pian hiiren liikkeen pysähdyttyä ja tulevat uudelleen näkyviin heti, kun hiirtä liikutetaan.
    Scroll Speed: Muuttaa hiiren rullan ja kosketuslevyn vierityseleiden vieritysmatkaa.
    Use Fixed Tab Width: Tekee vaakasuuntaisen välilehtipalkin kaikista välilehdistä yhtä leveitä sen sijaan, että leveys määräytyisi nimen mukaan.
    Use Grid Player Menu: Järjestää videosoittimen asetusvalikon ruudukoksi riviluettelon sijaan.
