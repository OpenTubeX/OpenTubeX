Tooltips:
  General Settings:
    Use AI Translation Completions: Omple els buits de les traduccions humanes amb text generat per IA. Les traduccions humanes sempre tenen prioritat.
    Update Relative Timestamps: Actualitza les marques horàries relatives de tota l'aplicació mentre la pàgina estigui oberta. Si es desactiva, només s'actualitzen en tornar a carregar o visitar la pàgina.
    Stream Extraction Method: |
      Trieu com obté l'OpenTubeX els fluxos de vídeo. Si seleccioneu yt-dlp, ha d'estar disponible.
      Els vídeos poden trigar més a començar quan s'utilitza yt-dlp.
      El motor integrat no permet fer salts a les emissions en directe ni a les estrenes.
    Avoid translation: |
      Desactiva la traducció automàtica de YouTube del títol, la descripció i els capítols dels vídeos.
      Massa sol·licituds, com ara obtenir els títols dels vídeos de les llistes, poden afectar
      temporalment la fiabilitat de l'aplicació.
    Preferred API Backend: Trieu el motor que l'OpenTubeX utilitza per obtenir dades. L'API local és un extractor integrat. L'API d'Invidious requereix un servidor d'Invidious al qual connectar-se.
    Fallback to Non-Preferred Backend on Failure: Si l'API preferida té un problema i aquesta opció està activada, l'OpenTubeX intentarà utilitzar automàticament l'API no preferida com a alternativa.
    Thumbnail Preference: Totes les miniatures de l'OpenTubeX se substituiran per un fotograma del vídeo, es difuminaran o s'ocultaran en lloc de mostrar la miniatura predeterminada.
    Show Thumbnail Previews: Mostra previsualitzacions animades en passar per sobre de les miniatures dels vídeos.
    Startup Behavior: |
      Trieu què fa l'OpenTubeX quan s'inicia.
      Carrega totes les pestanyes restaura immediatament totes les pestanyes desades, però les del segon pla no reproduiran vídeos automàticament.
      Carrega les pestanyes carregades anteriorment torna a carregar les pestanyes que estaven carregades en tancar l'OpenTubeX i manté les altres descarregades.
      Carrega la darrera pestanya activa restaura la sessió anterior amb les altres pestanyes obertes però descarregades; es carreguen quan hi feu clic.
      Inicia una sessió buida omet les pestanyes desades i obre una finestra nova.
    Invidious Instance: La instància d'Invidious a la qual es connectarà l'OpenTubeX per fer crides a l'API. Els canvis d'aquesta opció només s'apliquen a la finestra actual, tret que definiu la instància com a predeterminada.
    Region for Trending: La regió de tendències us permet triar de quin país voleu veure els vídeos en tendència.
    External Link Handling: |
      Trieu el comportament predeterminat en fer clic en un enllaç que no es pot obrir a l'OpenTubeX.
      De manera predeterminada, l'OpenTubeX obrirà l'enllaç al navegador predeterminat.
    Open Deep Links In New Window: Els URL passats a l'OpenTubeX, per exemple mitjançant extensions de redirecció del navegador o arguments de la línia d'ordres, s'obren en una finestra nova.
    Remember Tab Navigation History: L'historial de navegació enrere i endavant de cada pestanya es desa i es restaura en reiniciar l'OpenTubeX.
  Proxy Settings:
    IP Block Recovery Script Path: Camí de l'script que s'executa quan es detecta un bloqueig d'IP. L'OpenTubeX espera que acabi i després torna a carregar el vídeo. Si l'alternativa està activada, només s'executa quan també falla.
  Player Settings:
    Continue Playback When Screen Is Locked: 'Manté l’àudio reproduint-se en segon pla i proporciona controls multimèdia d’Android. Desactiveu-ho per posar en pausa quan l’aplicació deixi de ser visible.'
    Enable Caption Translations: Si s'activa i el vídeo no proporciona cap pista original coincident, el botó de subtítols i la drecera C prefereixen una pista traduïda automàticament a la llengua de subtítols preferida.
    Proxy Videos Through Invidious: Es connecta a Invidious per servir els vídeos en lloc de connectar-se directament a YouTube.
    Default Video Format: Defineix els formats utilitzats en reproduir un vídeo. Els formats DASH poden reproduir qualitats més altes. Els formats antics estan limitats a 360p com a màxim, però utilitzen menys amplada de banda. Els formats d'àudio només contenen fluxos d'àudio.
    Use Quick Playback Speed Bar: Mostra una barra ràpida de velocitat de reproducció als controls de la dreta del reproductor. Si està activat el desament manual de la velocitat per canal, la barra també inclou el botó per desar la velocitat del canal actual.
    Scroll Playback Rate Over Video Player: Amb el cursor sobre el vídeo, manteniu premuda la tecla Control (Ordre al Mac) i gireu la roda del ratolí endavant o enrere per controlar la velocitat de reproducció. Manteniu premuda la tecla Control (Ordre al Mac) i feu clic amb el botó esquerre per tornar ràpidament a la velocitat predeterminada (1x, tret que s'hagi canviat a la configuració).
    Skip by Scrolling Over Video Player: Utilitzeu la roda de desplaçament per saltar pel vídeo, a l'estil de MPV.
    Multiply Seek Interval by Playback Rate: Si s'activa, els intervals de salt (tecles de fletxa i J/L) es multipliquen per la velocitat de reproducció actual. Si es desactiva, els intervals es mantenen constants independentment de la velocitat.
    Show Playback Rate Adjusted Timestamp: Si s'activa i la velocitat de reproducció és diferent d'1x, el reproductor mostra entre parèntesis les marques de temps ajustades a la velocitat després de les normals.
    Use YouTube-style Shorts: Mostra els vídeos curts en una quadrícula vertical a les pàgines de subscripcions i canals i utilitza el reproductor de vídeos curts a l'estil de YouTube.
    Loop Shorts: Si s'activa, els vídeos curts es reinicien automàticament. Si es desactiva, s'aturen al final i mostren un botó per tornar-los a reproduir.
    Show Skip Silence Toggle: Mostra un commutador per ometre silencis al menú de configuració del reproductor.
    Enable Skip Silence by Default: Activa l'omissió de silencis a les pestanyes noves. Canviar-ho en una pestanya no afecta les altres.
    Enable Video Zoom: Mostra el control de zoom al menú de configuració del reproductor i n'activa les dreceres de teclat i els controls de panoràmica.
    Voice-over Translation: Envia l'ID, la durada i la llengua seleccionada del vídeo al servei no oficial de traducció de veu en off de Yandex quan sol·liciteu una traducció. Està desactivat de manera predeterminada.
    Hold to Double Playback Speed: Manteniu premuda la barra espaiadora o el botó esquerre del ratolí sobre el reproductor per duplicar temporalment la velocitat de reproducció actual.
    Ambient Mode: Barreja els colors del vídeo amb l'àrea que envolta el reproductor.
    Default Volume: Està desactivat mentre Recorda el volum estigui activat. Desactiveu Recorda el volum per definir un volum inicial fix per a cada vídeo.
    Parallel Segment Loading: |
      Nombre de segments de vídeo i àudio que es carreguen alhora per avançat.
      Els valors més alts poden ajudar amb connexions lentes o inestables, però utilitzen més amplada de banda i memòria.
      També poden fer que Automàtic subestimi la velocitat de connexió i seleccioni una qualitat inferior.
      Els fluxos limitats a una sol·licitud alhora ignoren aquesta opció.
    Preload Upcoming Videos: "Obté i desa a la memòria cau els URL de yt-dlp dels vídeos següents. La cua té prioritat sobre les llistes i les recomanacions."
    Upcoming Videos to Preload: "Nombre màxim de vídeos següents els URL de yt-dlp dels quals s’obtenen en segon pla."
    Concurrent Preloads: "El nombre màxim de processos yt-dlp que s'utilitzen per precàrregar vídeos alhora. Els valors més alts utilitzen més CPU, memòria i amplada de banda de xarxa."
  External Player Settings:
    External Player: En triar un reproductor extern, es mostrarà a la miniatura una icona per obrir-hi el vídeo o, si s'admet, la llista de reproducció. La configuració d'Invidious no afecta els reproductors externs.
    Custom External Player Executable: De manera predeterminada, l'OpenTubeX suposa que el reproductor extern triat es pot trobar mitjançant la variable d'entorn PATH. Si cal, podeu definir aquí un camí personalitzat.
    Ignore Warnings: Suprimeix els avisos quan el reproductor extern actual no admet l'acció actual, com ara invertir llistes de reproducció.
    Ignore Default Arguments: No envia cap argument predeterminat al reproductor extern tret de l'URL del vídeo, com ara la velocitat de reproducció o l'URL de la llista. Els arguments personalitzats se seguiran passant.
    Custom External Player Arguments: Arguments personalitzats de la línia d'ordres que voleu passar al reproductor extern.
    DefaultCustomArgumentsTemplate: '(Predeterminat: ''{defaultCustomArguments}'')'
  Download Settings:
    Download Folder: Els vídeos es desen en aquesta carpeta. Deixeu-ho en blanc per utilitzar la carpeta Baixades del sistema.
    Global Additional yt-dlp Arguments: Arguments addicionals de la línia d'ordres que es passen a yt-dlp per a cada baixada, per exemple --cookies-from-browser firefox.
    Concurrent Downloads: Nombre màxim de tasques de yt-dlp que es poden executar alhora.
    Bandwidth Limit: Limita la velocitat de transferència combinada de la cua dividint aquest límit entre les tasques simultànies. Introduïu 0 per no limitar-la.
  External Software Settings:
    yt-dlp Source: L'OpenTubeX pot utilitzar el yt-dlp instal·lat al sistema o baixar i gestionar-ne una còpia pròpia, que es desa al directori de dades de l'usuari.
    yt-dlp Channel: Seleccioneu quin canal de versions de yt-dlp baixa i gestiona l'OpenTubeX. Es recomana Estable per a la majoria d'usuaris.
    FFmpeg Source: L'OpenTubeX pot utilitzar FFmpeg i FFprobe instal·lats al sistema o baixar i gestionar-ne compilacions estàtiques pròpies, que es desen al directori de dades de l'usuari.
    Managed Tool Updates: Trieu si les eines gestionades s'actualitzen automàticament, pregunten abans d'actualitzar o només s'actualitzen amb els botons manuals. Les eines que falten es baixen quan són necessàries.
    yt-dlp Executable Path: De manera predeterminada, l'OpenTubeX suposa que es pot trobar yt-dlp mitjançant la variable d'entorn PATH. Si cal, podeu definir aquí un camí personalitzat.
    Cookie Source: Trieu si yt-dlp ha de llegir un fitxer de galetes de Netscape o les galetes d'un navegador instal·lat per a la reproducció autenticada.
    Cookie File: Seleccioneu un fitxer de galetes amb format de Netscape per a la reproducció autenticada.
    Browser for Cookies: La compatibilitat amb navegadors es consulta a l'executable yt-dlp seleccionat. L'OpenTubeX demana a yt-dlp que llegeixi aquest navegador quan se sol·licita una reproducció autenticada.
    Browser Profile: Nom o carpeta opcional del perfil del navegador. Deixeu-ho en blanc per utilitzar el perfil al qual s'ha accedit més recentment.
    Always Use Cookies: Utilitza les galetes configurades sempre que yt-dlp extregui fluxos. Això no canvia a yt-dlp el mètode d'extracció dels fluxos. Amb yt-dlp seleccionat, poden estar disponibles formats exclusius del compte, inclosa la taxa de bits millorada de YouTube Premium quan el compte hi tingui accés.
    FFmpeg Executable Path: FFmpeg és necessari per combinar fluxos de vídeo i àudio separats i per convertir àudio. De manera predeterminada, l'OpenTubeX suposa que es pot trobar FFmpeg mitjançant la variable d'entorn PATH. Si cal, podeu definir aquí un camí personalitzat.
  Distraction Free Settings:
    Shorten View Counts: Mostra en format abreujat els recomptes de visualitzacions i de m'agrades dels comentaris que YouTube ja ha arrodonit, p. ex. 14K en lloc de 14.000. Els recomptes exactes sempre es mostren sencers.
    Hide Channels: Introduïu un ID de canal per ocultar tots els seus vídeos i llistes de reproducció, així com el canal mateix, de la cerca, les tendències, els més populars i les recomanacions. L'ID introduït ha de coincidir completament i distingeix entre majúscules i minúscules.
    Hide Subscriptions Live: L'opció general "{appWideSetting}", de la secció "{subsection}" de "{settingsSection}", substitueix aquesta opció
    Hide Videos, Playlists and Channels Containing Text: Introduïu una paraula, un fragment de paraula o una frase, sense distinció entre majúscules i minúscules, per ocultar a tot l'OpenTubeX els vídeos, les llistes de reproducció i els canals que la continguin al títol original. Només s'exclouen Historial, Les vostres llistes de reproducció i els vídeos dins de llistes.
    Hide Videos on Watch: Oculta els vídeos vistos de les pestanyes Vídeos, Vídeos curts i En directe de les pàgines de subscripcions i canals. No afecta la pestanya Inici de les pàgines dels canals
  Subscription Settings:
    Fetch Feeds from RSS: Si s'activa, l'OpenTubeX utilitza RSS en lloc del mètode predeterminat per obtenir el canal de subscripcions. RSS és més ràpid i evita els bloqueigs d'IP, però no proporciona algunes dades, com ara la durada dels vídeos, l'estat en directe o les publicacions
    Fetch Feed on Startup: Si s'activa, l'OpenTubeX obté automàticament el canal de subscripcions en iniciar-se i en obrir una finestra nova.
    Show New Content Feed: Mostra una pestanya Nou amb els elements del canal de subscripcions que no hi eren en l'obtenció anterior.
    Show New Content Indicators: Mostra un punt petit al costat dels elements del canal de subscripcions que no hi eren en l'obtenció anterior.
    Show Scheduled Live Streams / Premieres First: Manté les properes emissions en directe i estrenes a dalt del canal de subscripcions. Si es desactiva, romanen a la posició de l'anunci fins que comencen. Després de desactivar-ho, actualitzeu el canal una vegada per obtenir les dates d'anunci de les entrades programades existents.
    Auto Refresh Interval: "Freqüència amb què l'OpenTubeX actualitza automàticament el canal de subscripcions mentre l'aplicació està oberta. A Android, un interval diferent de zero també actualitza el canal quan l’aplicació està tancada."
    Refresh Subscriptions While App Is Closed: "Permet que Android actualitzi els canals de subscripcions als intervals seleccionats mentre l'OpenTubeX està tancat. Desactiveu aquesta opció per limitar les actualitzacions automàtiques als moments en què l'aplicació està oberta."
  Theme Settings:
    Show Progress as Notification: Mostra una notificació persistent amb el progrés en directe de les operacions en segon pla, com ara actualitzar les subscripcions i baixar eines gestionades, en lloc d'utilitzar la barra de progrés general.
    Always Show Scrollbars: Manté les barres de desplaçament sempre visibles. Si es desactiva, s'esvaeixen poc després que deixeu de moure el ratolí i reapareixen quan el torneu a moure.
    Scroll Speed: Canvia la distància de desplaçament dels gestos de roda del ratolí i del ratolí tàctil.
    Use Fixed Tab Width: Dóna la mateixa amplada a totes les pestanyes de la barra horitzontal en lloc d'ajustar-les al títol.
    Use Grid Player Menu: Organitza el menú de configuració del reproductor de vídeo com una quadrícula de rajoles en lloc d'una llista de files.
  Experimental Settings:
    Replace HTTP Cache: Desactiva la memòria cau HTTP al disc d'Electron i activa una memòria cau d'imatges personalitzada a la memòria. Augmentarà l'ús de RAM.
  SponsorBlock Settings:
    UseDeArrowTitles: Substitueix els títols dels vídeos pels títols enviats pels usuaris de DeArrow.
    UseDeArrowThumbnails: Substitueix les miniatures dels vídeos per miniatures de DeArrow.
