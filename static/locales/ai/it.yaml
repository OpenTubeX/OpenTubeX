Tooltips:
  General Settings:
    Use AI Translation Completions: Completa le parti mancanti delle traduzioni umane con testo generato dall'IA. Le traduzioni umane hanno sempre la precedenza.
    Update Relative Timestamps: Aggiorna gli orari relativi in tutta l'app mentre una pagina rimane aperta. Se disabilitato, si aggiornano solo dopo aver ricaricato o riaperto la pagina.
    Stream Extraction Method: |
      Scegli come OpenTubeX ottiene i flussi video. Se selezioni yt-dlp, deve essere disponibile.
      Con yt-dlp l'avvio dei video potrebbe richiedere più tempo.
      Il metodo integrato non supporta lo spostamento nella riproduzione di dirette e première.
    Avoid translation: |
      Disabilita la traduzione automatica di YouTube per titolo, descrizione e capitoli di un video.
      Troppe richieste, ad esempio per recuperare i titoli dei video negli elenchi, possono ridurre
      temporaneamente l'affidabilità dell'app.
    Show Thumbnail Previews: Mostra anteprime animate al passaggio del puntatore sulle miniature dei video.
    Startup Behavior: |
      Scegli cosa deve fare OpenTubeX all'avvio.
      Carica tutte le schede ripristina subito ogni scheda salvata, ma quelle in background non riproducono automaticamente i video.
      Carica le schede già caricate in precedenza ricarica quelle che erano caricate alla chiusura di OpenTubeX e lascia le altre scaricate dalla memoria.
      Carica l'ultima scheda attiva ripristina la sessione precedente con le altre schede aperte ma scaricate dalla memoria; vengono caricate quando fai clic su di esse.
      Avvia con una sessione vuota ignora le schede salvate e apre una nuova finestra.
    Remember Tab Navigation History: La cronologia di navigazione avanti e indietro di ogni scheda viene salvata e ripristinata al riavvio di OpenTubeX.
  Proxy Settings:
    IP Block Recovery Script Path: Percorso del file di script da eseguire quando viene rilevato un blocco IP. OpenTubeX ne attende il completamento, quindi ricarica il video. Se è abilitato il metodo di riserva, lo script viene eseguito solo quando anche questo non riesce.
  Player Settings:
    Enable Caption Translations: Se abilitato, il pulsante dei sottotitoli e la scorciatoia C preferiscono una traccia tradotta automaticamente nella lingua scelta quando il video non offre una traccia originale corrispondente.
    Use Quick Playback Speed Bar: Mostra una barra rapida della velocità di riproduzione tra i controlli a destra del lettore. Se è abilitato il salvataggio manuale della velocità per canale, la barra include anche il pulsante per salvare la velocità del canale corrente.
    Multiply Seek Interval by Playback Rate: Se abilitato, gli intervalli di spostamento nella riproduzione, con i tasti freccia e J/L, vengono moltiplicati per la velocità corrente. Se disabilitato, restano costanti indipendentemente dalla velocità.
    Show Playback Rate Adjusted Timestamp: Se abilitato e la velocità di riproduzione è diversa da 1x, il lettore mostra tra parentesi i tempi adattati alla velocità dopo quelli normali.
    Use YouTube-style Shorts: Mostra gli Shorts in una griglia verticale nelle pagine delle iscrizioni e dei canali e usa il lettore di Shorts in stile YouTube.
    Loop Shorts: Se abilitato, gli Shorts ricominciano automaticamente. Se disabilitato, si fermano alla fine e mostrano un pulsante per riprodurli di nuovo.
    Show Skip Silence Toggle: Mostra nel menu delle impostazioni del lettore un interruttore per attivare o disattivare il salto dei silenzi.
    Enable Skip Silence by Default: Abilita il salto dei silenzi nelle nuove schede. La modifica in una scheda non influisce sulle altre.
    Enable Video Zoom: Mostra il controllo Zoom nel menu delle impostazioni del lettore e abilita le relative scorciatoie da tastiera e i controlli di panoramica.
    Voice-over Translation: Quando richiedi una traduzione, invia l'ID e la durata del video e la lingua selezionata al servizio non ufficiale di traduzione vocale Yandex. Disabilitato per impostazione predefinita.
    Hold to Double Playback Speed: Tieni premuta la barra spaziatrice o il pulsante sinistro del mouse sul lettore per raddoppiare temporaneamente la velocità di riproduzione corrente.
    Ambient Mode: Sfuma i colori del video nell'area circostante il lettore.
    Default Volume: Non disponibile quando Ricorda il volume è abilitato. Disattiva Ricorda il volume per impostare un volume iniziale fisso per ogni video.
    Parallel Segment Loading: |
      Numero di segmenti video e audio da caricare contemporaneamente prima della riproduzione.
      Valori più alti possono essere utili con connessioni lente o instabili, ma usano più banda e memoria.
      Possono anche indurre la modalità Automatica a sottostimare la velocità della connessione e scegliere una qualità inferiore.
      I flussi limitati a una richiesta alla volta ignorano questa impostazione.
  Download Settings:
    Download Folder: I video vengono salvati in questa cartella. Lascia vuoto per usare la cartella Download del sistema.
    Global Additional yt-dlp Arguments: Argomenti aggiuntivi della riga di comando passati a yt-dlp per ogni download, ad esempio --cookies-from-browser firefox.
    Concurrent Downloads: Numero massimo di processi yt-dlp eseguibili contemporaneamente.
    Bandwidth Limit: Limita la velocità di trasferimento complessiva della coda dividendo questo valore tra i processi simultanei. Inserisci 0 per non imporre limiti.
  External Software Settings:
    yt-dlp Source: OpenTubeX può usare yt-dlp installato nel sistema oppure scaricarne e gestirne una copia, salvata nella cartella dei dati utente.
    yt-dlp Channel: Seleziona il canale di rilascio di yt-dlp che OpenTubeX deve scaricare e gestire. Stabile è consigliato per la maggior parte degli utenti.
    FFmpeg Source: OpenTubeX può usare FFmpeg e FFprobe installati nel sistema oppure scaricare e gestire le proprie build statiche, salvate nella cartella dei dati utente.
    Managed Tool Updates: Scegli se aggiornare automaticamente gli strumenti gestiti, chiedere prima dell'aggiornamento o aggiornarli solo con i pulsanti manuali. Gli strumenti mancanti vengono comunque scaricati quando servono.
    yt-dlp Executable Path: Per impostazione predefinita, OpenTubeX presume che yt-dlp sia disponibile tramite la variabile d'ambiente PATH. Se necessario, puoi impostare qui un percorso personalizzato.
    Cookie Source: Scegli se yt-dlp deve leggere un file di cookie Netscape o i cookie di un browser installato per la riproduzione autenticata.
    Cookie File: Seleziona un file di cookie in formato Netscape per la riproduzione autenticata.
    Browser for Cookies: Il supporto dei browser viene rilevato dall'eseguibile yt-dlp selezionato. OpenTubeX chiede a yt-dlp di leggere i cookie da questo browser quando viene richiesta la riproduzione autenticata.
    Browser Profile: Nome o cartella facoltativi del profilo del browser. Lascia vuoto per usare il profilo aperto più di recente.
    Always Use Cookies: Usa i cookie configurati ogni volta che yt-dlp estrae i flussi. Non cambia il metodo di estrazione in yt-dlp. Se yt-dlp è selezionato, potrebbero essere disponibili formati riservati all'account, inclusa la velocità in bit migliorata di YouTube Premium se l'account vi ha accesso.
    FFmpeg Executable Path: FFmpeg è necessario per unire flussi video e audio separati e per convertire l'audio. Per impostazione predefinita, OpenTubeX presume che FFmpeg sia disponibile tramite la variabile d'ambiente PATH. Se necessario, puoi impostare qui un percorso personalizzato.
  Distraction Free Settings:
    Shorten View Counts: Mostra in forma abbreviata i conteggi delle visualizzazioni e dei Mi piace ai commenti già arrotondati da YouTube, ad esempio 14 mila invece di 14.000. I conteggi esatti vengono sempre mostrati per intero.
  Subscription Settings:
    Fetch Feed on Startup: Se abilitato, OpenTubeX recupera automaticamente il feed delle iscrizioni all'avvio e all'apertura di una nuova finestra.
    Show New Content Feed: Mostra una scheda Nuovi con gli elementi del feed delle iscrizioni assenti durante il recupero precedente.
    Show New Content Indicators: Mostra un puntino accanto agli elementi del feed delle iscrizioni assenti durante il recupero precedente.
    Show Scheduled Live Streams / Premieres First: Mantiene le prossime dirette e première all'inizio del feed delle iscrizioni. Se disabilitato, restano nella posizione dell'annuncio fino all'inizio. Dopo la disattivazione, aggiorna una volta il feed per recuperare le date degli annunci delle voci programmate esistenti.
    Auto Refresh Interval: Frequenza con cui OpenTubeX aggiorna automaticamente il feed delle iscrizioni mentre l'app è aperta.
  Theme Settings:
    Show Progress as Notification: Mostra una notifica persistente con l'avanzamento in tempo reale delle operazioni in background, come l'aggiornamento delle iscrizioni e il download degli strumenti gestiti, al posto della barra di avanzamento globale.
    Always Show Scrollbars: Mantiene le barre di scorrimento sempre visibili. Se disabilitato, scompaiono poco dopo che smetti di muovere il mouse e riappaiono non appena lo muovi di nuovo.
    Scroll Speed: Modifica la distanza di scorrimento dei gesti della rotellina del mouse e del touchpad.
    Use Fixed Tab Width: Assegna la stessa larghezza a tutte le schede nella barra orizzontale, invece di adattarle al titolo.
    Use Grid Player Menu: Dispone il menu delle impostazioni del lettore video come una griglia di riquadri invece di un elenco di righe.
