Tooltips:
  General Settings:
    Use AI Translation Completions: Bete giza itzulpenetan falta diren zatiak adimen artifizialak sortutako testuarekin. Giza itzulpenek beti dute lehentasuna.
    Update Relative Timestamps: Denbora-marka erlatiboak aplikazio osoan eguneratzen ditu orria irekita dagoen bitartean. Desgaituta dagoenean, orria berriro kargatu edo bisitatu ondoren soilik eguneratzen dira.
    Stream Extraction Method: |
      Aukeratu OpenTubeX aplikazioak bideo-korronteak nola eskuratuko dituen. yt-dlp erabilgarri egon behar da hautatuta dagoenean.
      Baliteke bideoek denbora gehiago behar izatea hasteko yt-dlp erabiltzean.
      Motor integratuak ez du onartzen zuzeneko emankizunetan eta estreinaldietan denbora jakin batera joatea.
    Avoid translation: |
      Desgaitu YouTube-k bideo baten izenburua, deskribapena eta kapituluak automatikoki itzultzea.
      Eskaera gehiegik, hala nola zerrendetako bideoen izenburuak eskuratzeak,
      aplikazioaren fidagarritasuna aldi baterako murriztu dezakete.
    Show Thumbnail Previews: Erakutsi aurrebista animatuak bideoen koadro txikiak seinalatzean.
    Startup Behavior: |
      Aukeratu OpenTubeX aplikazioak zer egingo duen abiaraztean.
      Kargatu fitxa guztiak aukerak berehala leheneratzen ditu gordetako fitxa guztiak, baina atzeko planoko fitxek ez dituzte bideoak automatikoki erreproduzituko.
      Kargatu aurretik kargatutako fitxak aukerak OpenTubeX itxi zenean kargatuta zeuden fitxak berriro kargatzen ditu eta gainerakoak memoriatik kenduta mantentzen ditu.
      Kargatu aktibo egon den azken fitxa aukerak aurreko saioa leheneratzen du beste fitxak irekita baina memoriatik kenduta dituela; haietan klik egitean kargatuko dira.
      Hasi saio huts batekin aukerak gordetako fitxak saltatu eta leiho berri bat irekitzen du.
    Remember Tab Navigation History: Fitxa bakoitzaren atzerako eta aurrerako nabigazio-historia gorde eta leheneratzen da OpenTubeX berrabiaraztean.
  Proxy Settings:
    IP Block Recovery Script Path: IP blokeoa hautematean exekutatuko den script-fitxategiaren bide-izena. OpenTubeX aplikazioak amaitu arte itxaroten du eta gero bideoa berriro kargatzen du. Ordezko motorra gaituta badago, hark ere huts egiten duenean soilik exekutatzen da.
  Player Settings:
    Continue Playback When Screen Is Locked: 'Audioa atzeko planoan erreproduzitzen mantentzen du eta Android multimedia-kontrolak eskaintzen ditu. Desaktibatu aplikazioa ikusgai ez dagoenean erreprodukzioa pausatzeko.'
    Enable Caption Translations: Gaituta dagoenean, azpitituluen botoiak eta C lasterbideak hobetsitako azpititulu-hizkuntzara automatikoki itzulitako pista aukeratzen dute, bideoak hizkuntza horretako jatorrizko pistarik ez badu.
    Use Quick Playback Speed Bar: Erreprodukzio-abiaduraren barra azkar bat erakusten du eskuineko erreproduzigailu-kontroletan. Kanal bakoitzaren erreprodukzio-abiadura eskuz gordetzea gaituta badago, barrak uneko kanalerako abiadura gordetzeko botoia ere izango du.
    Multiply Seek Interval by Playback Rate: Gaituta dagoenean, bilaketa-tarteak (gezi-teklak eta J/L) uneko erreprodukzio-abiadurarekin biderkatzen dira. Desgaituta dagoenean, tarteak ez dira aldatzen erreprodukzio-abiadura edozein dela ere.
    Show Playback Rate Adjusted Timestamp: Gaituta dagoenean eta erreprodukzio-abiadura 1x ez denean, erreproduzigailuak abiadurara doitutako denbora-markak erakusten ditu parentesi artean denbora-marka arruntaren ondoren.
    Use YouTube-style Shorts: Shorts bideoak sareta bertikalean erakusten ditu harpidetzen eta kanalen orrietan, eta YouTube estiloko Shorts erreproduzigailua erabiltzen du.
    Loop Shorts: Gaituta dagoenean, Shorts bideoak automatikoki hasten dira berriro. Desgaituta dagoenean, amaieran gelditzen dira eta berriro erreproduzitzeko botoia erakusten dute.
    Show Skip Silence Toggle: Isiluneak saltatzea aktibatzeko edo desaktibatzeko etengailua erakusten du erreproduzigailuaren ezarpen-menuan.
    Enable Skip Silence by Default: Isiluneak saltatzea gaitzen du fitxa berrietarako. Fitxa batean aldatzeak ez die beste fitxei eragiten.
    Enable Video Zoom: Zoom kontrola erakusten du erreproduzigailuaren ezarpen-menuan eta teklatuko lasterbideak eta desplazamendu-kontrolak gaitzen ditu.
    Voice-over Translation: Itzulpena eskatzean bideoaren IDa, iraupena eta hautatutako hizkuntza bidaltzen dizkio Yandexen ahots bidezko itzulpen-zerbitzu ez-ofizialari. Modu lehenetsian desgaituta dago.
    Hold to Double Playback Speed: Eduki sakatuta zuriune-barra edo saguaren ezkerreko botoia erreproduzigailuaren gainean uneko erreprodukzio-abiadura aldi baterako bikoizteko.
    Ambient Mode: Bideoaren koloreak erreproduzigailuaren inguruan hedatzen ditu.
    Default Volume: Desgaituta dago Gogoratu bolumena aukera gaituta dagoenean. Desgaitu aukera hori bideo bakoitzerako hasierako bolumen finko bat ezartzeko.
    Parallel Segment Loading: |
      Erreproduzitu aurretik zenbat bideo- eta audio-segmentu kargatuko diren aldi berean.
      Balio handiagoek konexio motel edo ezegonkorretan lagun dezakete, baina banda-zabalera eta memoria gehiago erabiltzen dituzte.
      Baliteke Automatikoa aukerak konexioaren abiadura txikiagoa dela kalkulatzea eta kalitate txikiagoa hautatzea ere.
      Aldiko eskaera bakarrera mugatutako korronteek ezarpen hau baztertzen dute.
    Preload Upcoming Videos: "Hurrengo bideoen yt-dlp URLak eskuratu eta cachean gordetzen ditu. Ilarak lehentasuna du zerrenden eta gomendioen aurretik."
    Upcoming Videos to Preload: "Atzeko planoan yt-dlp URLak eskuratuko zaizkien hurrengo bideoen gehieneko kopurua."
    Concurrent Preloads: "Bideoak aldi berean aurrekargatzeko erabilitako yt-dlp prozesuen gehieneko kopurua. Balio handiagoek PUZ, memoria eta sareko banda-zabalera gehiago erabiltzen dute."
  Download Settings:
    Download Folder: Bideoak karpeta honetan gordetzen dira. Utzi hutsik sistemako Deskargak karpeta erabiltzeko.
    Global Additional yt-dlp Arguments: Deskarga bakoitzean yt-dlp-ri emandako komando-lerroko argumentu gehigarriak; adibidez, --cookies-from-browser firefox.
    Concurrent Downloads: Aldi berean exekuta daitezkeen yt-dlp lanen gehieneko kopurua.
    Bandwidth Limit: Ilararen transferentzia-tasa bateratua mugatzen du balio hau aldibereko lanen artean zatituta. Idatzi 0 mugarik ez ezartzeko.
  External Software Settings:
    yt-dlp Source: OpenTubeX aplikazioak sisteman instalatutako yt-dlp erabil dezake, edo yt-dlp-ren berezko kopia deskargatu eta kudeatu. Kopia hori erabiltzaile-datuen direktorioan gordetzen da.
    yt-dlp Channel: Hautatu OpenTubeX aplikazioak deskargatu eta kudeatuko duen yt-dlp argitalpen-kanala. Stable kanala gomendatzen da erabiltzaile gehienentzat.
    FFmpeg Source: OpenTubeX aplikazioak sisteman instalatutako FFmpeg eta FFprobe erabil ditzake, edo haien konpilazio estatikoak deskargatu eta kudeatu. Konpilazioak erabiltzaile-datuen direktorioan gordetzen dira.
    Managed Tool Updates: Aukeratu kudeatutako tresnak automatikoki eguneratuko diren, eguneratu aurretik galdetuko den edo eskuzko botoiekin soilik eguneratuko diren. Falta diren tresnak behar direnean deskargatuko dira hala ere.
    yt-dlp Executable Path: Modu lehenetsian, OpenTubeX aplikazioak yt-dlp PATH ingurune-aldagaiaren bidez aurki daitekeela joko du. Behar izanez gero, bide-izen pertsonalizatu bat ezar daiteke hemen.
    Cookie Source: Aukeratu yt-dlp-k Netscape cookie-fitxategi bat edo instalatutako arakatzaile baten cookieak irakurriko dituen autentifikatutako erreprodukziorako.
    Cookie File: Hautatu Netscape formatuko cookie-fitxategi bat autentifikatutako erreprodukziorako.
    Browser for Cookies: Hautatutako yt-dlp exekutagarriak adierazten du zein arakatzaile onartzen diren. Autentifikatutako erreprodukzioa eskatzean, OpenTubeX aplikazioak arakatzaile hau irakurtzeko eskatzen dio yt-dlp-ri.
    Browser Profile: Arakatzailearen aukerako profil-izena edo karpeta. Utzi hutsik azkena erabilitako profila erabiltzeko.
    Always Use Cookies: Erabili konfiguratutako cookieak yt-dlp-k korronteak erauzten dituen bakoitzean. Honek ez du korronteak erauzteko metodoa yt-dlp aukerara aldatzen. yt-dlp hautatuta dagoenean, kontuarekin soilik erabil daitezkeen formatuak egon daitezke erabilgarri, YouTube Premium-en bit-tasa hobetua barne kontuak sarbidea badu.
    FFmpeg Executable Path: FFmpeg beharrezkoa da bideo- eta audio-korronte bereiziak bateratzeko eta audioa bihurtzeko. Modu lehenetsian, OpenTubeX aplikazioak FFmpeg PATH ingurune-aldagaiaren bidez aurki daitekeela joko du. Behar izanez gero, bide-izen pertsonalizatu bat ezar daiteke hemen.
  Distraction Free Settings:
    Shorten View Counts: YouTube-k dagoeneko biribildu dituen ikustaldi- eta iruzkinetako atsegite-kopuruak modu laburtuan erakusten ditu; adibidez, 14K, 14.000 ordez. Kopuru zehatzak osorik erakusten dira beti.
  Subscription Settings:
    Fetch Feed on Startup: Gaituta dagoenean, OpenTubeX aplikazioak harpidetza-jarioa automatikoki eskuratuko du abioan eta leiho berri bat irekitzean.
    Show New Content Feed: Berria fitxa erakusten du, aurreko eskuratzean ez zeuden harpidetza-jarioko elementuekin.
    Show New Content Indicators: Puntu txiki bat erakusten du aurreko eskuratzean ez zeuden harpidetza-jarioko elementuen ondoan.
    Show Scheduled Live Streams / Premieres First: Laster hasiko diren zuzeneko emankizunak eta estreinaldiak harpidetza-jarioaren goialdean mantentzen ditu. Desgaituta dagoenean, iragarpenaren kokapenean geratzen dira hasi arte. Desgaitu ondoren, freskatu behin harpidetza-jarioa lehendik programatutako elementuen iragarpen-datak eskuratzeko.
    Auto Refresh Interval: "OpenTubeX aplikazioak harpidetza-jarioa automatikoki freskatuko duen maiztasuna, aplikazioa irekita dagoen bitartean. Androiden, zero ez den tarte batek jarioa freskatzen du aplikazioa itxita dagoenean ere."
    Refresh Subscriptions While App Is Closed: "Androidi aukera ematen dio harpidetza-jarioak hautatutako tarteetan freskatzeko OpenTubeX itxita dagoenean. Desaktibatu aukera hau freskatze automatikoak aplikazioa irekita dagoenean soilik egiteko."
  Theme Settings:
    Show Progress as Notification: Jakinarazpen iraunkor batean erakusten du atzeko planoko eragiketen uneko aurrerapena, hala nola harpidetzen freskatzea eta kudeatutako tresnen deskargak, aurrerapen-barra globala erabili beharrean.
    Always Show Scrollbars: Korritze-barrak ikusgai mantentzen ditu beti. Desgaituta dagoenean, sagua mugitzeari utzi eta handik gutxira desagertzen dira, eta berriro mugitu bezain laster agertzen.
    Scroll Speed: Saguaren gurpileko eta ukipen-paneleko keinuek zenbat korritzen duten aldatzen du.
    Use Fixed Tab Width: Fitxa horizontalen barrako fitxa guztiei zabalera bera ematen die, izenburuaren arabera tamainatu beharrean.
    Use Grid Player Menu: Erreproduzigailuaren ezarpen-menua lauzaz osatutako sareta batean antolatzen du, errenkada-zerrenda baten ordez.
