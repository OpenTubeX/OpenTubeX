Tooltips:
  General Settings:
    Use AI Translation Completions: Дополняет недостающие фрагменты переводов, сделанных людьми, текстом от ИИ. Переводы людей всегда имеют приоритет.
    Update Relative Timestamps: Обновляет относительные отметки времени во всём приложении, пока страница открыта. Если отключено, они обновляются только после перезагрузки страницы или повторного перехода на неё.
    Stream Extraction Method: |
      Выберите, как OpenTubeX получает потоки видео. При выборе yt-dlp он должен быть доступен.
      При использовании yt-dlp запуск видео может занимать больше времени.
      Встроенный способ не поддерживает перемотку прямых трансляций и премьер.
    Avoid translation: |
      Отключает автоматический перевод названия, описания и глав видео на YouTube.
      Слишком много запросов, например при получении названий видео из списков, может временно
      нарушить стабильную работу приложения.
    Show Thumbnail Previews: Показывает анимированный предпросмотр при наведении на миниатюры видео.
    Startup Behavior: |
      Выберите, что OpenTubeX делает при запуске.
      «Загрузить все вкладки» сразу восстанавливает все сохранённые вкладки, но не запускает видео автоматически в фоновых вкладках.
      «Загрузить ранее загруженные вкладки» снова загружает вкладки, которые были загружены при закрытии OpenTubeX, а остальные оставляет незагруженными.
      «Загрузить последнюю активную вкладку» восстанавливает предыдущий сеанс, оставляя другие вкладки открытыми, но незагруженными. Они загрузятся после нажатия.
      «Начать с пустого сеанса» пропускает сохранённые вкладки и открывает новое окно.
    Remember Tab Navigation History: История переходов назад и вперёд сохраняется для каждой вкладки и восстанавливается после перезапуска OpenTubeX.
  Proxy Settings:
    IP Block Recovery Script Path: Путь к файлу скрипта, который запускается при обнаружении блокировки IP-адреса. OpenTubeX дожидается его завершения, а затем перезагружает видео. Если включён резервный способ, скрипт запускается только в случае его сбоя.
  Player Settings:
    Enable Caption Translations: Если включено и в видео нет подходящей оригинальной дорожки, кнопка субтитров и клавиша C отдают предпочтение автоматически переведённой дорожке на выбранном языке субтитров.
    Use Quick Playback Speed Bar: Показывает панель быстрого выбора скорости воспроизведения справа среди элементов управления проигрывателем. Если включено ручное сохранение скорости для отдельных каналов, на панели также отображается кнопка сохранения скорости для текущего канала.
    Multiply Seek Interval by Playback Rate: Если включено, интервалы перемотки (клавиши со стрелками и J/L) умножаются на текущую скорость воспроизведения. Если отключено, интервалы остаются неизменными независимо от скорости.
    Show Playback Rate Adjusted Timestamp: Если включено и скорость воспроизведения отличается от 1x, проигрыватель показывает после обычной отметки времени в скобках отметку с поправкой на скорость.
    Use YouTube-style Shorts: Показывает Shorts в вертикальной сетке на страницах подписок и каналов и использует проигрыватель Shorts в стиле YouTube.
    Loop Shorts: Если включено, Shorts автоматически запускаются заново. Если отключено, Shorts останавливаются в конце и показывают кнопку повтора.
    Show Skip Silence Toggle: Показывает переключатель пропуска тишины в меню настроек проигрывателя.
    Enable Skip Silence by Default: Включает пропуск тишины для новых вкладок. Изменение в одной вкладке не влияет на остальные.
    Enable Video Zoom: Показывает элемент управления масштабом в меню настроек проигрывателя и включает соответствующие сочетания клавиш и перемещение изображения.
    Voice-over Translation: При запросе перевода отправляет идентификатор и длительность видео, а также выбранный язык в неофициальный сервис закадрового перевода Яндекса. По умолчанию отключено.
    Hold to Double Playback Speed: Удерживайте пробел или левую кнопку мыши над проигрывателем, чтобы временно удвоить текущую скорость воспроизведения.
    Ambient Mode: Добавляет вокруг проигрывателя подсветку в цветах видео.
    Default Volume: Недоступно, пока включено запоминание громкости. Отключите его, чтобы задать фиксированную начальную громкость для каждого видео.
    Parallel Segment Loading: |
      Сколько сегментов видео и аудио одновременно загружать заранее.
      Высокие значения могут помочь при медленном или нестабильном соединении, но требуют больше пропускной способности и памяти.
      Из-за них режим «Авто» также может занизить скорость соединения и выбрать более низкое качество.
      Этот параметр не влияет на потоки, ограниченные одним запросом за раз.
  Download Settings:
    Download Folder: Видео сохраняются в эту папку. Оставьте поле пустым, чтобы использовать системную папку «Загрузки».
    Global Additional yt-dlp Arguments: Дополнительные аргументы командной строки, передаваемые yt-dlp при каждой загрузке, например --cookies-from-browser firefox.
    Concurrent Downloads: Максимальное количество одновременно выполняемых заданий yt-dlp.
    Bandwidth Limit: Ограничивает общую скорость передачи очереди, распределяя указанное значение между одновременными заданиями. Введите 0, чтобы снять ограничение.
  External Software Settings:
    yt-dlp Source: OpenTubeX может использовать установленный в системе yt-dlp либо загрузить собственную копию yt-dlp, управлять ею и хранить её в каталоге пользовательских данных.
    yt-dlp Channel: Выберите канал выпусков yt-dlp, который OpenTubeX будет загружать и обновлять. Для большинства пользователей рекомендуется Stable.
    FFmpeg Source: OpenTubeX может использовать установленные в системе FFmpeg и FFprobe либо загрузить собственные статические сборки, управлять ими и хранить их в каталоге пользовательских данных.
    Managed Tool Updates: Управляемые инструменты могут обновляться автоматически, после подтверждения или только вручную с помощью кнопок. Отсутствующие инструменты по-прежнему загружаются при необходимости.
    yt-dlp Executable Path: По умолчанию OpenTubeX предполагает, что yt-dlp доступен через переменную среды PATH. При необходимости здесь можно указать другой путь.
    Cookie Source: Выберите, должен ли yt-dlp читать файл cookie Netscape или файлы cookie из установленного браузера для воспроизведения с авторизацией.
    Cookie File: Выберите файл cookie в формате Netscape для воспроизведения с авторизацией.
    Browser for Cookies: Список поддерживаемых браузеров предоставляется выбранным исполняемым файлом yt-dlp. При запросе воспроизведения с авторизацией OpenTubeX поручает yt-dlp прочитать файлы cookie из этого браузера.
    Browser Profile: Необязательное имя профиля браузера или папка. Оставьте поле пустым, чтобы использовать последний открытый профиль.
    Always Use Cookies: Использует настроенные файлы cookie при каждом извлечении потоков через yt-dlp. Это не переключает способ извлечения потоков на yt-dlp. Если выбран yt-dlp, могут стать доступны форматы только для учётной записи, включая повышенный битрейт YouTube Premium при наличии доступа.
    FFmpeg Executable Path: FFmpeg необходим для объединения отдельных потоков видео и аудио, а также преобразования аудио. По умолчанию OpenTubeX предполагает, что FFmpeg доступен через переменную среды PATH. При необходимости здесь можно указать другой путь.
  Distraction Free Settings:
    Shorten View Counts: Показывает количество просмотров и отметок «Нравится» у комментариев в сокращённом виде, если YouTube уже округлил его, например 14 тыс. вместо 14 000. Точные значения всегда показываются полностью.
  Subscription Settings:
    Fetch Feed on Startup: Если включено, OpenTubeX автоматически получает ленту подписок при запуске и открытии нового окна.
    Show New Content Feed: Показывает вкладку «Новое» с элементами ленты подписок, которых не было при предыдущем получении.
    Show New Content Indicators: Показывает небольшую точку рядом с элементами ленты подписок, которых не было при предыдущем получении.
    Show Scheduled Live Streams / Premieres First: Оставляет предстоящие прямые трансляции и премьеры в верхней части ленты подписок. Если отключено, до начала они остаются на месте первоначального объявления. После отключения один раз обновите ленту подписок, чтобы получить даты объявления для уже существующих запланированных записей.
    Auto Refresh Interval: Как часто OpenTubeX автоматически обновляет ленту подписок, пока приложение открыто.
  Theme Settings:
    Show Progress as Notification: Показывает постоянное уведомление с текущим ходом фоновых операций, например обновления подписок и загрузки управляемых инструментов, вместо общей полосы выполнения.
    Always Show Scrollbars: Всегда показывает полосы прокрутки. Если отключено, они исчезают вскоре после того, как вы перестанете двигать мышь, и появляются при следующем движении.
    Scroll Speed: Изменяет расстояние прокрутки жестами колеса мыши и сенсорной панели.
    Use Fixed Tab Width: Устанавливает одинаковую ширину всех вкладок на горизонтальной панели вместо подгонки под заголовок.
    Use Grid Player Menu: Располагает меню настроек проигрывателя видео в виде сетки плиток вместо списка строк.
