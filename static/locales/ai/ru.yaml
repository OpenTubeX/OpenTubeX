    Clear Playback Caches: Очистить кеши воспроизведения
    Clear Playback Caches Confirmation: Очистить кеши yt-dlp и проигрывателя?
    Playback Caches Effect: Следующий запрос на локальное воспроизведение может занять больше времени, пока данные потока и проигрывателя загружаются заново.
    Clear Cache: Очистить кеш
    History Data: Сохранённая история
    Video Metadata Description: Хранит прежние названия, миниатюры и описания поддерживаемых видео. После удаления старые версии нельзя будет восстановить.
    Video Metadata Effect: Сохранённые версии метаданных будут удалены безвозвратно. Текущие сведения о видео можно будет загрузить снова.
    Watch History: История и статистика просмотров
    Watch History Description: История просмотров хранит просмотренные видео и прогресс воспроизведения, а статистика просмотров — итоговые показатели за каждый день. Срок хранения применяется только к истории просмотров.
    Clear Watch Statistics: Очистить статистику просмотров
    Watch History Effect: Записи о просмотренных видео и сохранённый прогресс будут удалены. Статистика просмотров сохранится.
    Clear Watch Statistics Confirmation: Удалить всю статистику просмотров?
    Watch Statistics Effect: Итоговые показатели просмотров за каждый день будут удалены. История просмотров сохранится.
    Search History: История поиска
    Search History Description: Хранит поисковые запросы, которые вы решили запомнить.
    Delete Search History: Удалить историю поиска
    Delete Search History Confirmation: Удалить всю сохранённую историю поиска?
    Search History Effect: Сохранённые подсказки на основе предыдущих поисковых запросов исчезнут. Кеш текущего сеанса сохранится.
    Other User Data: Другие данные пользователя
    Other Profile Files: Другие файлы профиля
    Other Profile Files Hint: Резервные копии, временные файлы и пока не распознанные OpenTubeX записи профиля.
    Subscriptions And Profiles: Подписки и профили
    Subscriptions And Profiles Description: Хранит каналы, на которые вы подписаны, названия профилей и состав профилей.
    Subscriptions And Profiles Effect: Все подписки и дополнительные профили будут удалены безвозвратно. Данные кеша ленты также будут очищены.
    Playlists Description: Хранит названия и описания плейлистов, а также сохранённые видео.
    Playlists Effect: Все плейлисты и списки сохранённых в них видео будут удалены безвозвратно. Загруженные медиафайлы сохранятся.
    Settings And Sessions: Настройки, сеансы вкладок и напоминания
    Settings And Sessions Description: Хранит настройки приложения, восстанавливаемые вкладки и напоминания о прямых трансляциях. Откройте папку профиля, чтобы просмотреть эти файлы или создать их резервную копию. Эта страница их не удаляет.
