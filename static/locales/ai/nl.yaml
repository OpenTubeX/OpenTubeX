      Kies hoe OpenTubeX videostreams ophaalt. yt-dlp moet beschikbaar zijn als je deze optie selecteert.
      Met yt-dlp kan het langer duren voordat video's beginnen.
      De ingebouwde methode ondersteunt zoeken in livestreams en premières niet.
    Avoid translation: |
      Schakel de automatische vertaling door YouTube van de titel, beschrijving en hoofdstukken van een video uit.
      Te veel aanvragen, bijvoorbeeld om videotitels in lijsten op te halen, kunnen de
      betrouwbaarheid van de app tijdelijk verminderen.
    Show Thumbnail Previews: Toon bewegende voorbeelden wanneer je de aanwijzer boven videominiaturen houdt.
    Startup Behavior: |
      Kies wat OpenTubeX bij het opstarten doet.
      Alle tabbladen laden herstelt elk opgeslagen tabblad direct, maar video's op achtergrondtabbladen worden niet automatisch afgespeeld.
      Eerder geladen tabbladen laden herlaadt de tabbladen die geladen waren toen OpenTubeX werd afgesloten en laat de overige tabbladen uit het geheugen verwijderd.
      Laatst actieve tabblad laden herstelt de vorige sessie met de andere tabbladen geopend, maar uit het geheugen verwijderd. Ze worden geladen wanneer je erop klikt.
      Met een lege sessie beginnen slaat de opgeslagen tabbladen over en opent een nieuw venster.
    Remember Tab Navigation History: De navigatiegeschiedenis voor vooruit en achteruit van elk tabblad wordt opgeslagen en hersteld wanneer OpenTubeX opnieuw wordt gestart.
  Proxy Settings:
    IP Block Recovery Script Path: Pad naar het scriptbestand dat wordt uitgevoerd wanneer een IP-blokkade wordt gedetecteerd. OpenTubeX wacht tot het klaar is en laadt daarna de video opnieuw. Als terugvallen is ingeschakeld, wordt het alleen uitgevoerd wanneer ook dat mislukt.
  Player Settings:
    Enable Caption Translations: Als dit is ingeschakeld en de video geen overeenkomend oorspronkelijk ondertitelingsspoor heeft, geven de ondertitelingsknop en sneltoets C de voorkeur aan een automatisch vertaald spoor in de voorkeurstaal voor ondertiteling.
    Use Quick Playback Speed Bar: Toont rechts in de spelerbediening een balk om snel de afspeelsnelheid te kiezen. Als het handmatig opslaan van afspeelsnelheid per kanaal is ingeschakeld, bevat de balk ook een knop om de snelheid voor het huidige kanaal op te slaan.
    Multiply Seek Interval by Playback Rate: Als dit is ingeschakeld, worden zoekintervallen van de pijltoetsen en J/L vermenigvuldigd met de huidige afspeelsnelheid. Als dit is uitgeschakeld, blijven zoekintervallen gelijk, ongeacht de afspeelsnelheid.
    Show Playback Rate Adjusted Timestamp: Als dit is ingeschakeld en de afspeelsnelheid afwijkt van 1x, toont de speler na de normale tijdsaanduiding tussen haakjes een tijd die aan de afspeelsnelheid is aangepast.
    Use YouTube-style Shorts: Toont Shorts in een staand raster op abonnements- en kanaalpagina's en gebruikt de Shorts-speler in YouTube-stijl.
    Loop Shorts: Als dit is ingeschakeld, beginnen Shorts automatisch opnieuw. Als dit is uitgeschakeld, stoppen Shorts aan het einde en verschijnt een knop om ze opnieuw af te spelen.
    Show Skip Silence Toggle: Toont in het instellingenmenu van de speler een aan-uitschakelaar om stiltes over te slaan.
    Enable Skip Silence by Default: Schakelt het overslaan van stiltes in voor nieuwe tabbladen. Een wijziging in één tabblad heeft geen invloed op andere tabbladen.
    Enable Video Zoom: Toont de zoombediening in het instellingenmenu van de speler en schakelt de bijbehorende sneltoetsen en bediening voor verschuiven in.
    Voice-over Translation: Stuurt de video-ID, duur en geselecteerde taal naar de onofficiële voice-oververtaaldienst van Yandex wanneer je om een vertaling vraagt. Standaard uitgeschakeld.
    Hold to Double Playback Speed: Houd de spatiebalk of linkermuisknop boven de speler ingedrukt om de huidige afspeelsnelheid tijdelijk te verdubbelen.
    Ambient Mode: Laat de kleuren van de video overvloeien in het gebied rond de speler.
    Default Volume: Uitgeschakeld zolang Volume onthouden is ingeschakeld. Schakel Volume onthouden uit om voor elke video een vast beginvolume in te stellen.
    Parallel Segment Loading: |
      Hoeveel video- en audiosegmenten vóór het afspelen tegelijk moeten worden geladen.
      Hogere waarden kunnen helpen bij langzame of instabiele verbindingen, maar gebruiken meer bandbreedte en geheugen.
      Hierdoor kan Automatisch de verbindingssnelheid ook onderschatten en een lagere kwaliteit kiezen.
      Streams die tot één aanvraag tegelijk zijn beperkt, negeren deze instelling.
  Download Settings:
    Download Folder: Video's worden in deze map opgeslagen. Laat dit leeg om de downloadmap van je systeem te gebruiken.
    Global Additional yt-dlp Arguments: Aanvullende opdrachtregelargumenten die bij elke download aan yt-dlp worden doorgegeven, bijvoorbeeld --cookies-from-browser firefox.
    Concurrent Downloads: Het maximale aantal yt-dlp-taken dat tegelijk mag worden uitgevoerd.
    Bandwidth Limit: Beperkt de totale overdrachtssnelheid van de wachtrij door deze limiet over gelijktijdige taken te verdelen. Voer 0 in voor geen limiet.
  External Software Settings:
    yt-dlp Source: OpenTubeX kan de yt-dlp-installatie op je systeem gebruiken of een eigen exemplaar van yt-dlp downloaden en beheren. Dit exemplaar wordt in de map met gebruikersgegevens bewaard.
    yt-dlp Channel: Selecteer welk releasekanaal van yt-dlp OpenTubeX downloadt en beheert. Stable wordt voor de meeste gebruikers aanbevolen.
    FFmpeg Source: OpenTubeX kan de FFmpeg- en FFprobe-installaties op je systeem gebruiken of eigen statische builds downloaden en beheren. Deze worden in de map met gebruikersgegevens bewaard.
    Managed Tool Updates: Kies of beheerde hulpprogramma's automatisch worden bijgewerkt, vóór het bijwerken om bevestiging vragen of alleen via de handmatige knoppen worden bijgewerkt. Ontbrekende hulpprogramma's worden nog steeds gedownload wanneer ze nodig zijn.
    yt-dlp Executable Path: OpenTubeX gaat er standaard van uit dat yt-dlp via de omgevingsvariabele PATH kan worden gevonden. Je kunt hier zo nodig een aangepast pad instellen.
    Cookie Source: Kies of yt-dlp voor geverifieerd afspelen een Netscape-cookiebestand of cookies uit een geïnstalleerde browser moet lezen.
    Cookie File: Selecteer een cookiebestand in Netscape-indeling voor geverifieerd afspelen.
    Browser for Cookies: Browserondersteuning wordt uit het geselecteerde uitvoerbare bestand van yt-dlp gelezen. OpenTubeX vraagt yt-dlp om deze browser te lezen wanneer geverifieerd afspelen wordt aangevraagd.
    Browser Profile: Optionele naam of map van het browserprofiel. Laat dit leeg om het laatst gebruikte profiel te gebruiken.
    Always Use Cookies: Gebruik de ingestelde cookies wanneer yt-dlp streams extraheert. Dit wijzigt de methode voor stream-extractie niet in yt-dlp. Als yt-dlp is geselecteerd, kunnen indelingen die alleen voor accounts beschikbaar zijn worden aangeboden, waaronder de verbeterde bitsnelheid van YouTube Premium als het account daar toegang toe heeft.
    FFmpeg Executable Path: FFmpeg is vereist om afzonderlijke video- en audiostreams samen te voegen en audio te converteren. OpenTubeX gaat er standaard van uit dat FFmpeg via de omgevingsvariabele PATH kan worden gevonden. Je kunt hier zo nodig een aangepast pad instellen.
  Distraction Free Settings:
    Shorten View Counts: Toont aantallen weergaven en vind-ik-leuks bij reacties die YouTube al verkort heeft afgerond, bijvoorbeeld 14K in plaats van 14.000. Exacte aantallen worden altijd volledig weergegeven.
  Subscription Settings:
    Fetch Feed on Startup: Als dit is ingeschakeld, haalt OpenTubeX je abonnementsfeed automatisch op bij het opstarten en wanneer een nieuw venster wordt geopend.
    Show New Content Feed: Toont een tabblad Nieuw met items uit de abonnementsfeed die bij de vorige ophaalactie nog niet aanwezig waren.
    Show New Content Indicators: Toont een klein puntje naast items uit de abonnementsfeed die bij de vorige ophaalactie nog niet aanwezig waren.
    Show Scheduled Live Streams / Premieres First: Houdt aankomende livestreams en premières bovenaan de abonnementsfeed. Als dit is uitgeschakeld, blijven ze tot hun start op de positie van hun aankondiging staan. Vernieuw na het uitschakelen de abonnementsfeed eenmaal om de aankondigingsdatums van bestaande geplande items op te halen.
    Auto Refresh Interval: Hoe vaak OpenTubeX je abonnementsfeed automatisch vernieuwt terwijl de app geopend is.
  Theme Settings:
    Show Progress as Notification: Toont een blijvende melding met actuele voortgang voor achtergrondbewerkingen, zoals het vernieuwen van abonnementen en downloaden van beheerde hulpprogramma's, in plaats van de algemene voortgangsbalk.
    Always Show Scrollbars: Houdt de schuifbalken altijd zichtbaar. Als dit is uitgeschakeld, verdwijnen ze kort nadat je stopt met het bewegen van de muis en verschijnen ze weer zodra je de muis beweegt.
    Scroll Speed: Wijzigt hoe ver muiswiel- en touchpadbewegingen scrollen.
    Use Fixed Tab Width: Geeft elk tabblad in de horizontale tabbladbalk dezelfde breedte in plaats van de breedte aan de titel aan te passen.
    Use Grid Player Menu: Rangschikt het instellingenmenu van de videospeler als een raster met tegels in plaats van een lijst met rijen.
