Tooltips:
  General Settings:
    Use AI Translation Completions: Täida inimeste tehtud tõlgete lüngad tehisaru loodud tekstiga. Inimeste tehtud tõlkeid eelistatakse alati.
    Update Relative Timestamps: Uuendab suhtelisi ajamärke kogu rakenduses, kuni leht on avatud. Kui see on välja lülitatud, uuendatakse neid alles pärast lehe uuesti laadimist või sellele naasmist.
    Stream Extraction Method: |
      Vali, kuidas OpenTubeX videovooge hangib. Valimise korral peab yt-dlp olema saadaval.
      yt-dlp kasutamisel võib videote käivitumine kauem aega võtta.
      Sisseehitatud meetod ei toeta otseülekannetes ega esilinastustes ajas liikumist.
    Avoid translation: |
      Keela YouTube'i video pealkirja, kirjelduse ja peatükkide automaattõlge.
      Liiga palju päringuid, näiteks loendites olevate videote pealkirjade hankimine, võib ajutiselt
      vähendada rakenduse töökindlust.
    Show Thumbnail Previews: Kuva videote pisipiltidele kursori viimisel animeeritud eelvaated.
    Startup Behavior: |
      Vali, mida OpenTubeX käivitumisel teeb.
      Kõigi vahelehtede laadimine taastab kohe kõik salvestatud vahelehed, kuid taustal olevatel vahelehtedel ei käivitata videoid automaatselt.
      Varem laaditud vahelehtede laadimine laadib uuesti vahelehed, mis olid OpenTubeX-i sulgemisel laaditud, ja jätab teised laadimata.
      Viimati aktiivse vahelehe laadimine taastab eelmise seansi nii, et teised vahelehed on avatud, kuid laadimata; need laaditakse klõpsamisel.
      Tühja seansiga alustamine jätab salvestatud vahelehed vahele ja avab uue akna.
    Remember Tab Navigation History: Iga vahelehe edasi- ja tagasiliikumise ajalugu salvestatakse ning taastatakse OpenTubeX-i taaskäivitamisel.
  Proxy Settings:
    IP Block Recovery Script Path: Skriptifaili asukoht, mida kasutatakse IP-blokeeringu tuvastamisel. OpenTubeX ootab skripti lõppemist ja laadib seejärel video uuesti. Kui varumeetod on lubatud, käivitatakse skript ainult siis, kui ka varumeetod nurjub.
  Player Settings:
    Enable Caption Translations: Kui see on lubatud ja videol pole eelistatud subtiitrikeeles sobivat originaalrada, eelistavad subtiitrinupp ja kiirklahv C automaatselt tõlgitud rada.
    Use Quick Playback Speed Bar: Kuvab paremal asuvates pleieri juhtelementides esituskiiruse kiirvalikuriba. Kui esituskiiruse kanalipõhine käsitsi salvestamine on lubatud, sisaldab riba ka praeguse kanali kiiruse salvestamise nuppu.
    Multiply Seek Interval by Playback Rate: Kui see on lubatud, korrutatakse kerimissammud (nooleklahvid ja J/L) praeguse esituskiirusega. Kui see on välja lülitatud, jäävad kerimissammud esituskiirusest olenemata samaks.
    Show Playback Rate Adjusted Timestamp: Kui see on lubatud ja esituskiirus erineb 1x kiirusest, kuvab pleier tavapärase ajamärgi järel sulgudes esituskiirusele kohandatud ajamärgi.
    Use YouTube-style Shorts: Kuvab Shortsid tellimuste ja kanalite lehtedel püstpaigutusega ruudustikus ning kasutab YouTube'i laadis Shortsi pleierit.
    Loop Shorts: Kui see on lubatud, käivituvad Shortsid automaatselt uuesti. Kui see on välja lülitatud, peatuvad Shortsid lõpus ja kuvatakse uuesti esitamise nupp.
    Show Skip Silence Toggle: Kuvab pleieri seadete menüüs vaikuse vahelejätmise lüliti.
    Enable Skip Silence by Default: Lubab uutel vahelehtedel vaikuse vahelejätmise. Selle muutmine ühel vahelehel ei mõjuta teisi vahelehti.
    Enable Video Zoom: Kuvab pleieri seadete menüüs suumi juhtelemendi ning lubab selle kiirklahvid ja panoraamimise juhtelemendid.
    Voice-over Translation: Tõlkepäringu tegemisel saadab video ID, kestuse ja valitud keele mitteametlikule Yandexi pealelugemise tõlketeenusele. Vaikimisi välja lülitatud.
    Hold to Double Playback Speed: Praeguse esituskiiruse ajutiseks kahekordistamiseks hoia pleieri kohal all tühikuklahvi või hiire vasakut nuppu.
    Ambient Mode: Sulandab video värvid pleieri ümbrusega.
    Default Volume: Pole kasutatav, kui helitugevuse meeldejätmine on lubatud. Iga video kindla algse helitugevuse määramiseks lülita helitugevuse meeldejätmine välja.
    Parallel Segment Loading: |
      Mitu video- ja helisegmenti enne esitamist korraga laadida.
      Suuremad väärtused võivad aidata aeglase või ebastabiilse ühenduse korral, kuid kasutavad rohkem ribalaiust ja mälu.
      Samuti võivad need panna automaatvaliku ühenduse kiirust alahindama ja madalamat kvaliteeti valima.
      Vood, mida saab laadida ainult ühe päringu kaupa, eiravad seda seadet.
  Download Settings:
    Download Folder: Videod salvestatakse sellesse kausta. Süsteemi allalaadimiste kausta kasutamiseks jäta väli tühjaks.
    Global Additional yt-dlp Arguments: Täiendavad käsureaargumendid, mis edastatakse iga allalaadimise puhul yt-dlp-le, näiteks --cookies-from-browser firefox.
    Concurrent Downloads: Korraga töötavate yt-dlp tööde suurim arv.
    Bandwidth Limit: Piirab järjekorra kogu edastuskiirust, jagades selle piirangu samaaegsete tööde vahel. Piirangu eemaldamiseks sisesta 0.
  External Software Settings:
    yt-dlp Source: OpenTubeX võib kasutada süsteemi paigaldatud yt-dlp-d või laadida alla ja hallata oma yt-dlp koopiat, mida hoitakse kasutajaandmete kaustas.
    yt-dlp Channel: Vali, millise yt-dlp väljalaskekanali OpenTubeX alla laadib ja haldab. Enamikule kasutajatele on soovitatav Stable.
    FFmpeg Source: OpenTubeX võib kasutada süsteemi paigaldatud FFmpegi ja FFprobe'i või laadida alla ning hallata oma staatilisi järke, mida hoitakse kasutajaandmete kaustas.
    Managed Tool Updates: Vali, kas hallatavaid tööriistu uuendatakse automaatselt, enne uuendamist küsitakse luba või uuendatakse ainult käsitsi uuendamise nuppude kaudu. Puuduvad tööriistad laaditakse vajaduse korral siiski alla.
    yt-dlp Executable Path: Vaikimisi eeldab OpenTubeX, et yt-dlp leitakse keskkonnamuutuja PATH kaudu. Vajaduse korral saab siin määrata kohandatud asukoha.
    Cookie Source: Vali, kas yt-dlp loeb autentitud esitamiseks Netscape'i küpsisefaili või paigaldatud brauseri küpsiseid.
    Cookie File: Vali autentitud esitamiseks Netscape'i vormingus küpsisefail.
    Browser for Cookies: Brauseritugi tuvastatakse valitud yt-dlp täitmisfailist. Autenditud esituse taotlemisel käsib OpenTubeX yt-dlp-l sellest brauserist küpsiseid lugeda.
    Browser Profile: Valikuline brauseriprofiili nimi või kaust. Viimati kasutatud profiili valimiseks jäta väli tühjaks.
    Always Use Cookies: Kasuta seadistatud küpsiseid alati, kui yt-dlp vooge eraldab. See ei muuda voo eraldamise meetodiks yt-dlp-d. Kui yt-dlp on valitud, võivad saada kättesaadavaks ainult kontoga kasutatavad vormingud, sealhulgas YouTube Premiumi täiustatud bitikiirus, kui kontol on sellele juurdepääs.
    FFmpeg Executable Path: FFmpeg on vajalik eraldi video- ja helivoogude ühendamiseks ning heli teisendamiseks. Vaikimisi eeldab OpenTubeX, et FFmpeg leitakse keskkonnamuutuja PATH kaudu. Vajaduse korral saab siin määrata kohandatud asukoha.
  Distraction Free Settings:
    Shorten View Counts: Kuvab YouTube'i juba ümardatud vaatamiste arvu ja kommentaaride meeldimiste arvu lühendatud kujul, näiteks 14 000 asemel 14 tuh. Täpsed arvud kuvatakse alati täielikult.
  Subscription Settings:
    Fetch Feed on Startup: Kui see on lubatud, hangib OpenTubeX tellimuste voo automaatselt käivitumisel ja uue akna avamisel.
    Show New Content Feed: Kuvab vahelehe Uus, mis sisaldab tellimuste voo üksusi, mida eelmise hankimise ajal polnud.
    Show New Content Indicators: Kuvab väikese punkti nende tellimuste voo üksuste kõrval, mida eelmise hankimise ajal polnud.
    Show Scheduled Live Streams / Premieres First: Hoiab eelseisvad otseülekanded ja esilinastused tellimuste voo alguses. Kui see on välja lülitatud, jäävad need ülekande alguseni oma väljakuulutamise kohale. Olemasolevate ajastatud kirjete väljakuulutamise kuupäevade hankimiseks värskenda pärast väljalülitamist üks kord tellimuste voogu.
    Auto Refresh Interval: Kui tihti OpenTubeX rakenduse töötamise ajal tellimuste voogu automaatselt värskendab.
  Theme Settings:
    Show Progress as Notification: Kuvab üldise edenemisriba asemel taustatoimingute, näiteks tellimuste värskendamise ja hallatavate tööriistade allalaadimise, reaalajas edenemisega püsiva teavituse.
    Always Show Scrollbars: Hoiab kerimisribad alati nähtaval. Kui see on välja lülitatud, kaovad need veidi pärast hiire liigutamise lõpetamist ja ilmuvad uuesti kohe, kui hiirt taas liigutad.
    Scroll Speed: Muudab hiireratta ja puuteplaadi kerimisliigutuste vahemaad.
    Use Fixed Tab Width: Annab horisontaalsel vaheleheribal igale vahelehele pealkirjast sõltumata sama laiuse.
    Use Grid Player Menu: Paigutab videopleieri seadete menüü ridade loendi asemel paanide ruudustikuna.
