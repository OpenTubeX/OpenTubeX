Tooltips:
  General Settings:
    Title Lines: "فہرستوں اور گرڈز میں ویڈیو اور پلے لسٹ کے عنوانات کو تین نقطوں کے ساتھ منتخب کردہ سطروں تک مختصر کرتا ہے تاکہ کارڈز زیادہ یکساں نظر آئیں۔ پورا عنوان دیکھنے کے لیے اس پر کرسر لے جائیں۔"
    Preferred Video Codec: |
      خودکار ان کوڈیکس کو ترجیح دیتا ہے جنہیں آپ کا ڈیوائس ہارڈ ویئر میں ڈی کوڈ کر سکتا ہے۔
      AV1: کم سے کم ڈیٹا میں بہترین کوالٹی، لیکن ہر ویڈیو میں دستیاب نہیں ہوتا۔ ہارڈ ویئر ڈی کوڈنگ کے بغیر یہ بیٹری ختم کر سکتا ہے یا فریمز گرا سکتا ہے۔
      VP9: کارکردگی اور مطابقت میں توازن، عموماً سب سے زیادہ ریزولوشن تک دستیاب۔
      H.264: تقریباً ہر ڈیوائس پر ڈی کوڈ کرنا سب سے آسان، لیکن یہ زیادہ ڈیٹا استعمال کرتا ہے اور عموماً 1080p تک محدود رہتا ہے۔
      تبدیلیاں اگلی ویڈیو پر لاگو ہوتی ہیں۔ اگر ترجیحی کوڈیک دستیاب نہ ہو تو کوئی دوسرا استعمال کیا جاتا ہے۔
    Yattee Server: وہ yattee-server انسٹنس جس سے OpenTubeX ویڈیوز، چینلز، پلے لسٹس اور تلاش کے نتائج لوڈ کرتا ہے۔ صارف نام اور پاس ورڈ صرف اسی ڈیوائس پر محفوظ ہوتے ہیں۔
    Proxy Videos Through Yattee Server: ویڈیو اور آڈیو اسٹریمز کو سرور کے ذریعے منتقل کرتا ہے۔ اسے آن رکھیں جب تک سرور آپ کا انٹرنیٹ کنکشن شیئر نہ کرتا ہو، کیونکہ YouTube اسٹریمز صرف اسی ایڈریس کو فراہم کرتا ہے جس نے ان کی درخواست کی ہو۔ تھمب نیلز ہمیشہ براہ راست YouTube سے لوڈ ہوتے ہیں۔
    Enable Tabs: موجودہ صفحہ کھلا رکھتا ہے۔ دوسرے ٹیبز ایپ دوبارہ شروع ہونے تک رکھے جاتے ہیں؛ انہیں بحال کرنے کے لیے ٹیبز دوبارہ فعال کریں۔
    Data Saver Thumbnails: ڈیٹا کا استعمال کم کرنے کے لیے کم ریزولوشن والے تھمب نیلز استعمال کریں۔
    Use AI Translation Completions: انسانی ترجموں میں خالی جگہیں AI سے تیار کردہ متن سے پُر کریں۔ انسانی ترجموں کو ہمیشہ ترجیح دی جاتی ہے۔
    Update Relative Timestamps: صفحہ کھلا رہنے کے دوران پوری ایپ میں نسبتی ٹائم اسٹیمپس اپ ڈیٹ کرتا ہے۔ غیر فعال ہونے پر یہ صرف صفحہ دوبارہ لوڈ کرنے یا دوبارہ کھولنے کے بعد اپ ڈیٹ ہوتے ہیں۔
    Automatically switch stream extraction methods: اگر بلٹ ان پلے بیک ناکام ہو تو yt-dlp آزمائیں، یا اگر yt-dlp ناکام ہو تو بلٹ ان پلے بیک۔
    Stream Extraction Method: |
      منتخب کریں کہ OpenTubeX ویڈیو اسٹریمز کیسے حاصل کرے۔ منتخب کرنے پر yt-dlp کا دستیاب ہونا ضروری ہے۔
      yt-dlp استعمال کرنے پر ویڈیوز کو شروع ہونے میں زیادہ وقت لگ سکتا ہے۔
      بلٹ ان طریقہ لائیو اسٹریمز اور پریمیئرز کے لیے سیک کو سپورٹ نہیں کرتا۔
    Avoid translation: |
      ویڈیو کے عنوان، تفصیل اور چیپٹرز کا YouTube کا خودکار ترجمہ غیر فعال کریں۔
      بہت زیادہ درخواستیں، جیسے فہرستوں میں ویڈیو عنوانات حاصل کرنا، عارضی طور پر
      ایپ کی قابل اعتمادی کو متاثر کر سکتی ہیں۔
