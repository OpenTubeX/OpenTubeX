    Grayscale: "ایپ کو سرمئی رنگوں میں دکھاتا ہے، تاکہ یہ کم توجہ کھینچے۔ سونے کے وقت کے دوران سونے کے وقت کی یاد دہانی کے شیڈول کی پیروی کرتا ہے۔"
    Apply Grayscale To: "ویڈیوز اور تصاویر انٹرفیس کو رنگین رکھتا ہے اور ویڈیوز، تھمب نیلز اور اوتار جیسے مواد کو سرمئی کرتا ہے۔"
    Daily Watch Time Limit: دیکھنے کے اعداد و شمار سنک کرنے والے تمام ڈیوائسز پر آج آپ نے جو دیکھا اسے شمار کرتا ہے، بشمول شارٹس۔
    Daily Shorts Limit: آج اس ڈیوائس پر آپ کے دیکھے گئے شارٹس کو شمار کرتا ہے۔
    Take a Break Reminder: اتنی دیر دیکھنے کے بعد ویڈیو روک دیتا ہے۔ 10 منٹ یا اس سے زیادہ کا وقفہ گنتی دوبارہ شروع کر دیتا ہے۔
    Bedtime Reminder: آغاز اور اختتامی وقت کے درمیان ویڈیو روکتا ہے اور آپ کو دیکھنا بند کرنے کی یاد دہانی کراتا ہے۔
    Shorten View Counts: ویوز، کمنٹس اور کمنٹ لائکس کی وہ تعداد جو YouTube پہلے ہی گول کر چکا ہو مختصر شکل میں دکھاتا ہے، مثلاً 14,000 کے بجائے 14K۔ درست تعداد ہمیشہ مکمل دکھائی جاتی ہے۔
  Subscription Settings:
    Fetch Feed on Startup: فعال ہونے پر OpenTubeX آغاز پر اور نئی ونڈو کھلنے پر آپ کی سبسکرپشن فیڈ خود بخود حاصل کرے گا۔
    Show New Content Feed: ایک نیا ٹیب دکھاتا ہے جس میں سبسکرپشن فیڈ کے وہ آئٹمز ہوتے ہیں جو پچھلی بار حاصل کرتے وقت موجود نہیں تھے۔
    Enable RSS Feeds: سبسکرپشنز کے صفحے پر RSS یا Atom فیڈز کے آئٹمز کے ساتھ ایک RSS ٹیب دکھاتا ہے، تاکہ آپ دوسرے پلیٹ فارمز کے تخلیق کاروں کو فالو کر سکیں۔ اس کے آئٹمز yt-dlp کے ساتھ کھلتے ہیں۔
    Show New Content Indicators: سبسکرپشن فیڈ کے ان آئٹمز کے ساتھ ایک چھوٹا نقطہ دکھاتا ہے جو پچھلی بار حاصل کرتے وقت موجود نہیں تھے۔
    Show Scheduled Live Streams / Premieres First: آنے والی لائیو اسٹریمز اور پریمیئرز کو سبسکرپشن فیڈ کے اوپر رکھتا ہے۔ غیر فعال ہونے پر وہ شروع ہونے تک اپنے اعلان کی جگہ پر رہتے ہیں۔ غیر فعال کرنے کے بعد موجودہ شیڈول شدہ اندراجات کی اعلان کی تاریخیں حاصل کرنے کے لیے سبسکرپشن فیڈ ایک بار ریفریش کریں۔
    Auto Refresh Interval: ایپ کھلی رہنے کے دوران OpenTubeX کتنی بار آپ کی سبسکرپشن فیڈ خود بخود ریفریش کرے۔ Android پر صفر کے علاوہ کوئی بھی وقفہ ایپ بند ہونے پر بھی اسے ریفریش کرتا ہے۔
    Refresh Subscriptions While App Is Closed: آپ کی منتخب کردہ سیٹنگز کے ساتھ فیڈز ریفریش کرتا ہے۔ ڈیسک ٹاپ پر OpenTubeX باہر نکلنے تک سسٹم ٹرے میں رہتا ہے۔ Android کنٹرول کرتا ہے کہ پس منظر کی ریفریش کب چلے۔
    Notify About New Uploads: ان چینلز کے لیے اس ڈیوائس پر سسٹم نوٹیفکیشنز دکھاتا ہے جن کی اطلاعات آپ نے ان کی سبسکرپشن سیٹنگز میں آن کی ہیں۔ OpenTubeX سبسکرپشنز ریفریش ہونے پر نیا مواد چیک کرتا ہے، اس لیے خودکار ریفریش کا وقفہ منتخب کریں۔ ایپ بند ہونے پر اطلاع پانے کے لیے ایپ بند ہونے پر ریفریش کرنا بھی فعال کریں۔
    RSS Feeds Auto Refresh Interval: ایپ کھلی ہونے کے دوران OpenTubeX آپ کی RSS فیڈز کو کتنی بار خودکار طور پر ریفریش کرتا ہے۔
  Theme Settings:
    Only Show Important Notifications: ایپ کے اندر وہ اطلاعات چھپاتا ہے جو صرف کسی کارروائی کی تصدیق کرتی ہیں یا کسی حالت کی اطلاع دیتی ہیں۔ غلطیاں، انتباہات، آپ کی ترتیب دی ہوئی یاد دہانیاں، اور ایسی اطلاعات جو کوئی کارروائی پیش کرتی ہیں، جیسے پہلے جیسا کریں، بدستور ظاہر ہوتی ہیں۔ پس منظر کے کاموں کی پیش رفت، جیسے سبسکرپشنز کو تازہ کرنا، اطلاع کے بجائے عمومی پیش رفت بار میں دکھائی جاتی ہے۔ سسٹم کی اطلاعات متاثر نہیں ہوتیں۔
    Thumbnail Size: گرڈز اور فہرستوں میں ویڈیو تھمب نیلز کا سائز بدلتا ہے۔ مقررہ کالمز والے گرڈز یا پوری چوڑائی والا منظر ہر قطار کو بھر دیتے ہیں، اس لیے وہاں یہ صرف فہرست کے تھمب نیلز اور شارٹس کو تبدیل کرتا ہے۔ فون کے سائز کی ونڈوز گرڈ تھمب نیلز کو 100% تک محدود کرتی ہیں۔
    Playlist Thumbnail Size: پلے لسٹ صفحات پر ویڈیو تھمب نیلز کا سائز بدلتا ہے۔ مقررہ کالمز والے گرڈز یا پوری چوڑائی والا منظر ہر قطار کو بھر دیتے ہیں، اس لیے وہاں یہ صرف فہرست کے تھمب نیلز اور شارٹس کو تبدیل کرتا ہے۔ فون کے سائز کی ونڈوز گرڈ تھمب نیلز کو 100% تک محدود کرتی ہیں۔
    Show Progress as Notification: عمومی پروگریس بار استعمال کرنے کے بجائے پس منظر کی کارروائیوں، جیسے سبسکرپشن ریفریش اور منظم ٹولز کے ڈاؤن لوڈز، کی براہ راست پیش رفت کے ساتھ مستقل نوٹیفکیشن دکھاتا ہے۔
    Always Show Scrollbars: اسکرول بارز کو ہر وقت نظر آنے والا رکھتا ہے۔ غیر فعال ہونے پر وہ ماؤس روکنے کے کچھ دیر بعد غائب ہو جاتے ہیں اور ماؤس دوبارہ حرکت کرتے ہی ظاہر ہو جاتے ہیں۔
    Scroll Speed: تبدیل کرتا ہے کہ ماؤس وہیل اور ٹچ پیڈ وہیل اشارے کتنا اسکرول کریں۔
    Visible Search Suggestions: سیٹ کرتا ہے کہ فہرست اسکرول ہونے سے پہلے سرچ بار کتنے سرچ ہسٹری اندراجات اور تجاویز دکھائے۔ فہرست کبھی ونڈو کے نچلے حصے سے آگے نہیں جاتی۔
    Use Fixed Tab Width: افقی ٹیب بار کے ہر ٹیب کو ان کے عنوان کے مطابق سائز دینے کے بجائے یکساں چوڑائی دیتا ہے۔
    Use Custom Title Bar: عمودی جگہ بچانے کے لیے سسٹم ٹائٹل بار کو ٹیب بار سے، یا ٹیبز اوپر نہ ہونے پر اوپری نیویگیشن سے بدل دیتا ہے۔ ونڈو کنٹرولز اس بار کے کونے میں ظاہر ہوتے ہیں۔
    Use Grid Player Menu: ویڈیو پلیئر کے سیٹنگز مینو کو قطاروں کی فہرست کے بجائے ٹائلز کے گرڈ کی صورت میں ترتیب دیتا ہے۔
    Compact Settings Categories: تفصیلات چھپاتا ہے اور سیٹنگز کیٹیگریز کی اونچائی کم کرتا ہے۔
    Modal Backdrop: "طے کرتا ہے کہ ڈائیلاگز اور مینیوز کے پیچھے ایپ کیسی دکھائی دے۔ دھندلا کرنا کم طاقتور آلات پر سست ہو سکتا ہے۔"
  Experimental Settings:
    Faster Subscription Refresh: "پہلے ہر چینل کی RSS فیڈ چیک کرتا ہے اور صرف نئے اپ لوڈز والے چینلز کی ویڈیوز، Shorts اور لائیو اسٹریمز لوڈ کرتا ہے۔ خودکار تازہ کاریاں پچھلے 10 منٹ میں لوڈ کیے گئے چینلز کو بھی چھوڑ دیتی ہیں۔ نئے اپ لوڈز کے بغیر چینلز کے لیے، ویوز کی تعداد، ہٹائی گئی ویڈیوز اور تبدیل شدہ عنوانات صرف ہر چند گھنٹوں بعد اپ ڈیٹ ہوتے ہیں، اور RSS فیڈ پیچھے رہنے پر نئے اپ لوڈز بعد میں ظاہر ہو سکتے ہیں۔ Invidious API کے ساتھ دستیاب نہیں۔"
    Disable Hardware Acceleration: GPU ہارڈ ویئر ایکسلریشن غیر فعال کرتا ہے۔ گرافیکل مسائل حل ہو سکتے ہیں، لیکن کارکردگی غالباً کم ہو جائے گی۔
