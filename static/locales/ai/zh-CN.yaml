Tooltips:
  General Settings:
    Use AI Translation Completions: 使用 AI 生成的文本补全人工翻译中的缺失内容。始终优先使用人工翻译。
    Update Relative Timestamps: 页面保持打开时，持续更新应用各处的相对时间戳。禁用后，仅在重新加载或再次访问页面时更新。
    Stream Extraction Method: |
      选择 OpenTubeX 获取视频流的方式。选择 yt-dlp 时，系统中必须有可用的 yt-dlp。
      使用 yt-dlp 时，视频可能需要更长时间才能开始播放。
      内置方式不支持在直播和首映中跳转播放位置。
    Avoid translation: |
      禁用 YouTube 对视频标题、简介和章节的自动翻译。
      请求过多（例如获取多个列表中的视频标题）可能会暂时
      影响应用可靠性。
    Show Thumbnail Previews: 将鼠标悬停在视频缩略图上时显示动画预览。
    Startup Behavior: |
      选择 OpenTubeX 启动时执行的操作。
      加载所有标签页会立即恢复所有已保存的标签页，但后台标签页不会自动播放视频。
      加载上次已加载的标签页会重新加载 OpenTubeX 关闭时已加载的标签页，其他标签页则保持未加载状态。
      加载上次活动的标签页会恢复上一个会话，同时打开其他标签页但不加载；点击这些标签页时才会加载。
      以空会话启动会跳过已保存的标签页并打开一个新窗口。
    Remember Tab Navigation History: 保存每个标签页的前进和后退导航历史，并在 OpenTubeX 重新启动时恢复。
  Proxy Settings:
    IP Block Recovery Script Path: 检测到 IP 被封锁时要运行的脚本文件路径。OpenTubeX 会等待脚本运行完毕，然后重新加载视频。如果启用了备用方案，则仅在备用方案也失败时运行脚本。
  Player Settings:
    Enable Caption Translations: 启用后，如果视频没有与首选字幕语言匹配的原始字幕轨道，字幕按钮和 C 快捷键将优先使用自动翻译的字幕轨道。
    Use Quick Playback Speed Bar: 在播放器控件右侧显示快速播放速度栏。如果启用了手动保存每个频道的播放速度，该栏还会显示用于保存当前频道播放速度的按钮。
    Multiply Seek Interval by Playback Rate: 启用后，跳转间隔（方向键和 J/L）会乘以当前播放速度。禁用后，无论播放速度如何，跳转间隔都保持不变。
    Show Playback Rate Adjusted Timestamp: 启用后，如果播放速度不是 1x，播放器会在正常时间戳后用括号显示按播放速度调整后的时间戳。
    Use YouTube-style Shorts: 在订阅和频道页面上以纵向网格显示 Shorts，并使用 YouTube 风格的 Shorts 播放器。
    Loop Shorts: 启用后，Shorts 会自动重新播放。禁用后，Shorts 会在播放结束时停止，并显示重播按钮。
    Show Skip Silence Toggle: 在播放器的设置菜单中显示跳过静音的开关。
    Enable Skip Silence by Default: 为新标签页启用跳过静音。在一个标签页中更改此设置不会影响其他标签页。
    Enable Video Zoom: 在播放器的设置菜单中显示缩放控件，并启用其键盘快捷键和平移控件。
    Voice-over Translation: 请求翻译时，将视频 ID、时长和所选语言发送到非官方 Yandex 配音翻译服务。默认禁用。
    Hold to Double Playback Speed: 将鼠标指针置于播放器上并按住空格键或鼠标左键，可暂时将当前播放速度加倍。
    Ambient Mode: 将视频色彩融合到播放器周围区域。
    Default Volume: 启用“记住音量”时，此项不可用。关闭“记住音量”可为每个视频设置固定的初始音量。
    Parallel Segment Loading: |
      播放前同时预加载的视频和音频分段数量。
      较高的值可能有助于改善缓慢或不稳定的连接，但会占用更多带宽和内存。
      这也可能导致“自动”低估连接速度并选择较低的画质。
      对于限制为一次只能发出一个请求的流，此设置无效。
  Download Settings:
    Download Folder: 视频将保存到此文件夹。留空则使用系统的“下载”文件夹。
    Global Additional yt-dlp Arguments: 每次下载时传递给 yt-dlp 的额外命令行参数，例如 --cookies-from-browser firefox。
    Concurrent Downloads: 可同时运行的 yt-dlp 任务数上限。
    Bandwidth Limit: 限制队列的总传输速率，此限制会在并发任务之间分配。输入 0 表示不限制。
  External Software Settings:
    yt-dlp Source: OpenTubeX 可以使用系统中安装的 yt-dlp，也可以下载并管理自己的 yt-dlp 副本，该副本存储在用户数据目录中。
    yt-dlp Channel: 选择 OpenTubeX 下载并管理的 yt-dlp 发布渠道。建议大多数用户选择 Stable。
    FFmpeg Source: OpenTubeX 可以使用系统中安装的 FFmpeg 和 FFprobe，也可以下载并管理自己的静态构建版本，这些版本存储在用户数据目录中。
    Managed Tool Updates: 选择让托管工具自动更新、更新前询问，或仅通过手动按钮更新。缺少的工具仍会在需要时下载。
    yt-dlp Executable Path: 默认情况下，OpenTubeX 假定可通过 PATH 环境变量找到 yt-dlp。如有需要，可在此设置自定义路径。
    Cookie Source: 选择让 yt-dlp 读取 Netscape Cookie 文件，还是从已安装的浏览器中读取 Cookie，以进行身份验证播放。
    Cookie File: 选择用于身份验证播放的 Netscape 格式 Cookie 文件。
    Browser for Cookies: 从所选的 yt-dlp 可执行文件中读取浏览器支持信息。请求身份验证播放时，OpenTubeX 会让 yt-dlp 从此浏览器读取 Cookie。
    Browser Profile: 可选的浏览器配置文件名称或文件夹。留空则使用最近访问的配置文件。
    Always Use Cookies: 每当 yt-dlp 提取流时都使用已配置的 Cookie。这不会将流提取方式切换为 yt-dlp。选择 yt-dlp 后，可能会提供仅限账号使用的格式，包括账号有权使用时的 YouTube Premium 增强比特率。
    FFmpeg Executable Path: 合并独立的视频流和音频流以及转换音频需要 FFmpeg。默认情况下，OpenTubeX 假定可通过 PATH 环境变量找到 FFmpeg。如有需要，可在此设置自定义路径。
  Distraction Free Settings:
    Shorten View Counts: 以缩写形式显示 YouTube 已取整的观看次数和评论点赞数，例如显示 14K 而不是 14,000。精确计数始终完整显示。
  Subscription Settings:
    Fetch Feed on Startup: 启用后，OpenTubeX 会在启动时和打开新窗口时自动获取订阅动态。
    Show New Content Feed: 显示“新内容”标签页，其中包含上次获取时尚未出现的订阅动态项目。
    Show New Content Indicators: 在上次获取时尚未出现的订阅动态项目旁显示一个小圆点。
    Show Scheduled Live Streams / Premieres First: 将即将开始的直播和首映置于订阅动态顶部。禁用后，它们会保留在公告发布时的位置，直到开始。禁用后请刷新一次订阅动态，以获取现有预定项目的公告日期。
    Auto Refresh Interval: OpenTubeX 在应用打开期间自动刷新订阅动态的频率。
  Theme Settings:
    Show Progress as Notification: 以持续通知实时显示后台操作的进度（例如刷新订阅动态和下载托管工具），而不使用全局进度条。
    Always Show Scrollbars: 始终显示滚动条。禁用后，停止移动鼠标不久，滚动条便会淡出；再次移动鼠标时会立即重新出现。
    Scroll Speed: 更改鼠标滚轮和触控板滚轮手势的滚动距离。
    Use Fixed Tab Width: 让水平标签栏中的所有标签页宽度相同，而不是根据标题调整宽度。
    Use Grid Player Menu: 将视频播放器的设置菜单排列为磁贴网格，而不是行列表。
