Tooltips:
  General Settings:
    Use AI Translation Completions: Completează golurile din traducerile umane cu text generat de IA. Traducerile umane au întotdeauna prioritate.
    Update Relative Timestamps: Actualizează marcajele temporale relative în întreaga aplicație cât timp o pagină rămâne deschisă. Când opțiunea este dezactivată, acestea se actualizează numai după reîncărcarea sau revizitarea paginii.
    Stream Extraction Method: |
      Alegeți modul în care OpenTubeX obține fluxurile video. yt-dlp trebuie să fie disponibil când este selectat.
      Este posibil ca videoclipurile să pornească mai greu când folosiți yt-dlp.
      Metoda încorporată nu permite saltul în transmisiuni în direct și premiere.
    Avoid translation: |
      Dezactivează traducerea automată YouTube a titlului, descrierii și capitolelor unui videoclip.
      Prea multe solicitări, cum ar fi preluarea titlurilor videoclipurilor din liste, pot afecta
      temporar fiabilitatea aplicației.
    Show Thumbnail Previews: Afișează previzualizări animate la trecerea cursorului peste miniaturile videoclipurilor.
    Startup Behavior: |
      Alegeți ce face OpenTubeX la pornire.
      „Încarcă toate filele” restaurează imediat fiecare filă salvată, dar filele din fundal nu vor reda automat videoclipuri.
      „Încarcă filele încărcate anterior” reîncarcă filele care erau încărcate la închiderea OpenTubeX și le păstrează pe celelalte descărcate din memorie.
      „Încarcă ultima filă activă” restaurează sesiunea anterioară cu celelalte file deschise, dar descărcate din memorie; acestea se încarcă atunci când faceți clic pe ele.
      „Pornește cu o sesiune goală” omite filele salvate și deschide o fereastră nouă.
    Remember Tab Navigation History: Istoricul navigării înapoi și înainte al fiecărei file este salvat și restaurat la repornirea OpenTubeX.
  Proxy Settings:
    IP Block Recovery Script Path: Calea fișierului script care se rulează când este detectată blocarea IP-ului. OpenTubeX așteaptă finalizarea acestuia, apoi reîncarcă videoclipul. Dacă este activată sursa de rezervă, scriptul rulează numai când și aceasta eșuează.
  Player Settings:
    Continue Playback When Screen Is Locked: 'Menține redarea audio în fundal și oferă comenzi media Android. Dezactivează pentru a întrerupe redarea când aplicația nu mai este vizibilă.'
    Enable Caption Translations: Când opțiunea este activată, butonul de subtitrări și comanda rapidă C preferă o pistă tradusă automat în limba preferată dacă videoclipul nu oferă o pistă originală corespunzătoare.
    Use Quick Playback Speed Bar: Afișează o bară rapidă pentru viteza de redare în partea dreaptă a comenzilor playerului. Dacă este activată salvarea manuală a vitezei de redare pentru fiecare canal, bara include și butonul pentru salvarea vitezei canalului curent.
    Multiply Seek Interval by Playback Rate: Când opțiunea este activată, intervalele de salt (tastele săgeată și J/L) sunt înmulțite cu viteza de redare curentă. Când este dezactivată, intervalele rămân constante indiferent de viteza de redare.
    Show Playback Rate Adjusted Timestamp: Când opțiunea este activată și viteza de redare diferă de 1x, playerul afișează între paranteze marcajele temporale ajustate la viteza de redare, după afișajul temporal normal.
    Use YouTube-style Shorts: Afișează videoclipurile Shorts într-o grilă portret pe paginile de abonamente și canale și folosește playerul Shorts în stil YouTube.
    Loop Shorts: Când opțiunea este activată, videoclipurile Shorts repornesc automat. Când este dezactivată, acestea se opresc la sfârșit și afișează un buton de reluare.
    Show Skip Silence Toggle: Afișează un comutator de activare și dezactivare pentru omiterea liniștii în meniul de setări al playerului.
    Enable Skip Silence by Default: Activează omiterea liniștii pentru filele noi. Modificarea într-o filă nu afectează celelalte file.
    Enable Video Zoom: Afișează comanda Zoom în meniul de setări al playerului și activează comenzile rapide de la tastatură și comenzile de panoramare.
    Voice-over Translation: Trimite ID-ul videoclipului, durata și limba selectată serviciului neoficial Yandex de traducere vocală atunci când solicitați o traducere. Opțiunea este dezactivată implicit.
    Hold to Double Playback Speed: Țineți apăsată bara de spațiu sau butonul stâng al mouse-ului deasupra playerului pentru a dubla temporar viteza de redare curentă.
    Ambient Mode: Îmbină culorile videoclipului cu zona din jurul playerului.
    Default Volume: Opțiune dezactivată cât timp „Reține volumul” este activată. Dezactivați „Reține volumul” pentru a seta un volum inițial fix pentru fiecare videoclip.
    Parallel Segment Loading: |
      Numărul de segmente video și audio care se încarcă simultan înaintea redării.
      Valorile mai mari pot fi utile în cazul conexiunilor lente sau instabile, dar folosesc mai multă lățime de bandă și memorie.
      De asemenea, pot determina modul Automat să subestimeze viteza conexiunii și să selecteze o calitate mai scăzută.
      Fluxurile limitate la o singură solicitare simultană ignoră această setare.
    Preload Upcoming Videos: "Obține și memorează în cache adresele yt-dlp ale videoclipurilor următoare. Coada are prioritate față de liste și recomandări."
    Upcoming Videos to Preload: "Numărul maxim de videoclipuri următoare ale căror adrese yt-dlp sunt obținute în fundal."
  Download Settings:
    Download Folder: Videoclipurile sunt salvate în acest folder. Lăsați necompletat pentru a folosi folderul Descărcări al sistemului.
    Global Additional yt-dlp Arguments: Argumente suplimentare de linie de comandă transmise către yt-dlp pentru fiecare descărcare, de exemplu --cookies-from-browser firefox.
    Concurrent Downloads: Numărul maxim de activități yt-dlp care pot rula simultan.
    Bandwidth Limit: Limitează rata de transfer combinată a cozii împărțind această limită între activitățile simultane. Introduceți 0 pentru eliminarea limitei.
  External Software Settings:
    yt-dlp Source: OpenTubeX poate folosi yt-dlp instalat în sistem sau poate descărca și gestiona propria copie yt-dlp, stocată în directorul cu datele utilizatorului.
    yt-dlp Channel: Selectați canalul de lansare yt-dlp pe care OpenTubeX îl descarcă și îl gestionează. Canalul stabil este recomandat pentru majoritatea utilizatorilor.
    FFmpeg Source: OpenTubeX poate folosi FFmpeg și FFprobe instalate în sistem sau poate descărca și gestiona propriile versiuni statice, stocate în directorul cu datele utilizatorului.
    Managed Tool Updates: Alegeți dacă instrumentele gestionate se actualizează automat, solicită confirmarea înainte de actualizare sau se actualizează numai prin butoanele manuale. Instrumentele lipsă sunt descărcate în continuare atunci când sunt necesare.
    yt-dlp Executable Path: În mod implicit, OpenTubeX presupune că yt-dlp poate fi găsit prin variabila de mediu PATH. Dacă este necesar, puteți seta aici o cale personalizată.
    Cookie Source: Alegeți dacă yt-dlp trebuie să citească un fișier cookie Netscape sau cookie-uri dintr-un browser instalat pentru redarea autentificată.
    Cookie File: Selectați un fișier cookie în format Netscape pentru redarea autentificată.
    Browser for Cookies: Compatibilitatea cu browserele este citită din executabilul yt-dlp selectat. OpenTubeX solicită ca yt-dlp să citească acest browser atunci când este cerută redarea autentificată.
    Browser Profile: Numele sau folderul opțional al profilului de browser. Lăsați necompletat pentru a folosi profilul accesat cel mai recent.
    Always Use Cookies: Folosește cookie-urile configurate ori de câte ori yt-dlp extrage fluxuri. Această opțiune nu schimbă metoda de extragere a fluxului la yt-dlp. Când este selectat yt-dlp, pot deveni disponibile formate destinate exclusiv conturilor, inclusiv rata de biți îmbunătățită YouTube Premium dacă acel cont are acces.
    FFmpeg Executable Path: FFmpeg este necesar pentru îmbinarea fluxurilor video și audio separate și pentru conversia audio. În mod implicit, OpenTubeX presupune că FFmpeg poate fi găsit prin variabila de mediu PATH. Dacă este necesar, puteți seta aici o cale personalizată.
  Distraction Free Settings:
    Shorten View Counts: Afișează în formă abreviată numărul de vizionări și de aprecieri ale comentariilor pe care YouTube le-a rotunjit deja, de exemplu 14 K în loc de 14.000. Valorile exacte sunt afișate întotdeauna integral.
  Subscription Settings:
    Fetch Feed on Startup: Când opțiunea este activată, OpenTubeX preia automat fluxul de abonamente la pornire și la deschiderea unei ferestre noi.
    Show New Content Feed: Afișează o filă Nou cu elementele din fluxul de abonamente care nu existau la preluarea anterioară.
    Show New Content Indicators: Afișează un punct mic lângă elementele din fluxul de abonamente care nu existau la preluarea anterioară.
    Show Scheduled Live Streams / Premieres First: Păstrează viitoarele transmisiuni în direct și premiere în partea de sus a fluxului de abonamente. Când opțiunea este dezactivată, acestea rămân la poziția anunțului până când încep. Reîmprospătați o dată fluxul de abonamente după dezactivare pentru a prelua datele anunțurilor înregistrărilor programate existente.
    Auto Refresh Interval: "Frecvența cu care OpenTubeX reîmprospătează automat fluxul de abonamente cât timp aplicația este deschisă. Pe Android, un interval diferit de zero actualizează fluxul și când aplicația este închisă."
    Refresh Subscriptions While App Is Closed: "Permite sistemului Android să reîmprospăteze fluxurile de abonamente la intervalele selectate când OpenTubeX este închis. Dezactivați opțiunea pentru ca reîmprospătarea automată să aibă loc numai când aplicația este deschisă."
  Theme Settings:
    Show Progress as Notification: Afișează o notificare persistentă cu progresul în timp real pentru operațiunile din fundal, cum ar fi reîmprospătarea abonamentelor și descărcarea instrumentelor gestionate, în locul barei globale de progres.
    Always Show Scrollbars: Păstrează barele de derulare vizibile permanent. Când opțiunea este dezactivată, acestea dispar treptat la scurt timp după ce opriți mișcarea mouse-ului și reapar imediat ce îl mișcați din nou.
    Scroll Speed: Modifică distanța de derulare a gesturilor rotiței mouse-ului și ale touchpadului.
    Use Fixed Tab Width: Atribuie aceeași lățime fiecărei file din bara de file orizontală, în loc să o dimensioneze după titlu.
    Use Grid Player Menu: Aranjează meniul de setări al playerului video ca o grilă de dale, în locul unei liste de rânduri.
