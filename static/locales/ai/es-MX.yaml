Tooltips:
  General Settings:
    Use AI Translation Completions: Completa las partes que faltan en las traducciones humanas con texto generado por IA. Las traducciones humanas siempre tienen prioridad.
    Update Relative Timestamps: Actualiza las marcas de tiempo relativas en toda la aplicación mientras una página permanece abierta. Si se desactiva, solo se actualizan al recargar la página o volver a visitarla.
    Stream Extraction Method: |
      Elige cómo obtiene OpenTubeX las emisiones de video. yt-dlp debe estar disponible cuando se seleccione.
      Los videos pueden tardar más en empezar al usar yt-dlp.
      El método integrado no permite desplazarse por emisiones en directo ni estrenos.
    Avoid translation: |
      Desactiva la traducción automática de YouTube del título, la descripción y los capítulos de un video.
      Demasiadas solicitudes, como obtener títulos de videos en varias listas, pueden afectar
      temporalmente a la fiabilidad de la aplicación.
    Show Thumbnail Previews: Muestra vistas previas animadas al pasar el puntero sobre las miniaturas de los videos.
    Startup Behavior: |
      Elige qué hace OpenTubeX al iniciarse.
      Cargar todas las pestañas restaura de inmediato todas las pestañas guardadas, pero las que estén en segundo plano no reproducirán videos automáticamente.
      Cargar las pestañas que estaban cargadas vuelve a cargar las que lo estaban al cerrar OpenTubeX y mantiene las demás descargadas de la memoria.
      Cargar la última pestaña activa restaura la sesión anterior con las demás pestañas abiertas pero descargadas de la memoria; se cargan al hacer clic en ellas.
      Iniciar con una sesión vacía omite las pestañas guardadas y abre una ventana nueva.
    Open Deep Links In New Window: Las URL que se pasan a OpenTubeX, por ejemplo mediante la redirección de extensiones del navegador o argumentos de la línea de comandos, se abren en una ventana nueva.
    Remember Tab Navigation History: El historial de navegación hacia atrás y hacia delante de cada pestaña se guarda y restaura al reiniciar OpenTubeX.
  Proxy Settings:
    IP Block Recovery Script Path: Ruta del archivo de script que se ejecutará al detectar un bloqueo de IP. OpenTubeX espera a que termine y después recarga el video. Si la fuente alternativa está activada, solo se ejecuta cuando esta también falla.
  Player Settings:
    Enable Caption Translations: Al activarlo, el botón de subtítulos y el atajo C prefieren una pista traducida automáticamente al idioma de subtítulos elegido cuando el video no ofrece una pista original coincidente.
    Use Quick Playback Speed Bar: Muestra una barra rápida de velocidad de reproducción en los controles situados a la derecha del reproductor. Si está activado el guardado manual de la velocidad por canal, la barra también incluye un botón para guardar la velocidad del canal actual.
    Skip by Scrolling Over Video Player: Usa la rueda del mouse sobre el reproductor para desplazarte por el video, al estilo de MPV.
    Multiply Seek Interval by Playback Rate: Al activarlo, los intervalos de avance (teclas de flecha y J/L) se multiplican por la velocidad de reproducción actual. Si se desactiva, los intervalos permanecen constantes independientemente de la velocidad.
    Show Playback Rate Adjusted Timestamp: Al activarlo, si la velocidad de reproducción es distinta de 1x, el reproductor muestra entre paréntesis las marcas de tiempo ajustadas a la velocidad después de las normales.
    Use YouTube-style Shorts: Muestra los Shorts en una cuadrícula vertical en las páginas de suscripciones y canales y usa el reproductor de Shorts al estilo de YouTube.
    Loop Shorts: Al activarlo, los Shorts se reinician automáticamente. Si se desactiva, se detienen al final y muestran un botón para volver a reproducirlos.
    Show Skip Silence Toggle: Muestra un interruptor para omitir silencios en el menú de ajustes del reproductor.
    Enable Skip Silence by Default: Activa la omisión de silencios en las pestañas nuevas. Cambiarla en una pestaña no afecta a las demás.
    Enable Video Zoom: Muestra el control Zoom en el menú de ajustes del reproductor y activa sus atajos de teclado y controles de desplazamiento.
    Voice-over Translation: Cuando solicitas una traducción, envía el ID, la duración y el idioma seleccionado del video al servicio no oficial de traducción por voz superpuesta de Yandex. Está desactivado de forma predeterminada.
    Hold to Double Playback Speed: Mantén pulsada la barra espaciadora o el botón izquierdo del mouse sobre el reproductor para duplicar temporalmente la velocidad de reproducción actual.
    Ambient Mode: Mezcla los colores del video con el área que rodea al reproductor.
    Default Volume: Está desactivado mientras Recordar el volumen esté activado. Desactiva Recordar el volumen para definir un volumen inicial fijo para cada video.
    Parallel Segment Loading: |
      Cuántos segmentos de video y audio se cargarán simultáneamente antes de reproducirlos.
      Los valores más altos pueden ayudar en conexiones lentas o inestables, pero consumen más ancho de banda y memoria.
      También pueden hacer que Automático calcule una velocidad de conexión demasiado baja y seleccione una calidad inferior.
      Las emisiones limitadas a una solicitud simultánea ignoran este ajuste.
  External Player Settings:
    Ignore Default Arguments: No envíe ningún argumento predeterminado al reproductor externo aparte de la URL del video (por ejemplo, velocidad de reproducción, URL de la lista de reproducción, etc.). Los argumentos personalizados se seguirán transmitiendo.
  Download Settings:
    Download Folder: Los videos se guardan en esta carpeta. Déjala en blanco para usar la carpeta Descargas del sistema.
    Global Additional yt-dlp Arguments: Argumentos de línea de comandos adicionales que se pasan a yt-dlp en todas las descargas, por ejemplo, --cookies-from-browser firefox.
    Concurrent Downloads: Número máximo de tareas de yt-dlp que pueden ejecutarse a la vez.
    Bandwidth Limit: Limita la velocidad de transferencia combinada de la cola al dividir el límite entre las tareas simultáneas. Introduce 0 para no establecer ningún límite.
  External Software Settings:
    yt-dlp Source: OpenTubeX puede usar el yt-dlp instalado en el sistema o descargar y gestionar su propia copia, que se guarda en el directorio de datos del usuario.
    yt-dlp Channel: Selecciona el canal de versiones de yt-dlp que descargará y gestionará OpenTubeX. Se recomienda Stable para la mayoría de los usuarios.
    FFmpeg Source: OpenTubeX puede usar FFmpeg y FFprobe instalados en el sistema o descargar y gestionar sus propias compilaciones estáticas, que se guardan en el directorio de datos del usuario.
    Managed Tool Updates: Elige si las herramientas gestionadas se actualizan automáticamente, preguntan antes de hacerlo o solo se actualizan mediante los botones manuales. Las herramientas que falten se seguirán descargando cuando sean necesarias.
    yt-dlp Executable Path: De forma predeterminada, OpenTubeX presupone que yt-dlp se puede encontrar mediante la variable de entorno PATH. Si hace falta, puedes definir aquí una ruta personalizada.
    Cookie Source: Elige si yt-dlp debe leer un archivo de cookies Netscape o las cookies de un navegador instalado para la reproducción autenticada.
    Cookie File: Selecciona un archivo de cookies con formato Netscape para la reproducción autenticada.
    Browser for Cookies: La compatibilidad con navegadores se obtiene del ejecutable yt-dlp seleccionado. OpenTubeX pide a yt-dlp que lea este navegador cuando se solicita una reproducción autenticada.
    Browser Profile: Nombre o carpeta opcional del perfil del navegador. Déjalo en blanco para usar el perfil al que se accedió más recientemente.
    Always Use Cookies: Usa las cookies configuradas siempre que yt-dlp extraiga emisiones. Esto no cambia el método de extracción de emisiones a yt-dlp. Al seleccionar yt-dlp, pueden aparecer formatos exclusivos de la cuenta, incluida la tasa de bits mejorada de YouTube Premium cuando la cuenta tiene acceso.
    FFmpeg Executable Path: FFmpeg es necesario para combinar emisiones de video y audio separadas y para convertir audio. De forma predeterminada, OpenTubeX presupone que FFmpeg se puede encontrar mediante la variable de entorno PATH. Si hace falta, puedes definir aquí una ruta personalizada.
  Distraction Free Settings:
    Shorten View Counts: Muestra de forma abreviada los recuentos de visualizaciones y «Me gusta» en comentarios que YouTube ya ha redondeado, p. ej., 14K en lugar de 14.000. Los recuentos exactos siempre se muestran completos.
    Hide Channels: Introduzca un ID del canal para ocultar todos los videos, listas de reproducción y el propio canal para que no aparezcan en las búsquedas, tendencias, más populares y recomendados. El ID del canal introducido debe coincidir completamente y se debe distinguir entre mayúsculas y minúsculas.
    Hide Videos, Playlists and Channels Containing Text: Introduzca una palabra, fragmento de palabra o frase (sin distinguir mayúsculas de minúsculas) para ocultar todos los videos y listas de reproducción cuyos títulos originales la contengan en todo OpenTubeX, excluyendo únicamente Historial, Tus listas de reproducción y los videos dentro de las listas de reproducción.
    Hide Videos on Watch: Oculta los videos vistos de las pestañas de Videos, Shorts y En directo en las páginas de Suscripciones y Canales. Esto no afecta a la pestaña de inicio en las páginas de Canales
  Subscription Settings:
    Fetch Feed on Startup: Al activarlo, OpenTubeX obtiene automáticamente la fuente de suscripciones al iniciarse y al abrir una ventana nueva.
    Show New Content Feed: Muestra una pestaña Nuevo con los elementos de la fuente de suscripciones que no estaban presentes en la obtención anterior.
    Show New Content Indicators: Muestra un punto pequeño junto a los elementos de la fuente de suscripciones que no estaban presentes en la obtención anterior.
    Show Scheduled Live Streams / Premieres First: Mantiene las próximas emisiones en directo y los estrenos en la parte superior de la fuente de suscripciones. Si se desactiva, permanecen en la posición en la que se anunciaron hasta que empiezan. Actualiza una vez la fuente de suscripciones después de desactivarlo para obtener las fechas de anuncio de las entradas programadas existentes.
    Auto Refresh Interval: Frecuencia con la que OpenTubeX actualiza automáticamente la fuente de suscripciones mientras la aplicación está abierta.
  Theme Settings:
    Show Progress as Notification: Muestra una notificación persistente con el progreso en tiempo real de las operaciones en segundo plano, como la actualización de suscripciones y la descarga de herramientas gestionadas, en lugar de usar la barra de progreso global.
    Always Show Scrollbars: Mantiene las barras de desplazamiento visibles en todo momento. Si se desactiva, desaparecen poco después de dejar de mover el mouse y reaparecen en cuanto vuelves a moverlo.
    Scroll Speed: Cambia la distancia que desplazan los gestos de la rueda del mouse y del panel táctil.
    Use Fixed Tab Width: Asigna el mismo ancho a todas las pestañas de la barra horizontal en lugar de adaptarlo a su título.
    Use Grid Player Menu: Organiza el menú de ajustes del reproductor de video como una cuadrícula de mosaicos en lugar de una lista de filas.
  Experimental Settings:
    Replace HTTP Cache: Desactiva la caché HTTP basada en Electron disk y habilite una caché para la imagen en la memoria personalizada. Esto aumentará el uso de la memoria RAM.
  SponsorBlock Settings:
    UseDeArrowTitles: Sustituye los títulos de los videos por títulos enviados por los usuarios desde DeArrow.
    UseDeArrowThumbnails: Sustituye las miniaturas de video por miniaturas de DeArrow.
