Tooltips:
  General Settings:
    Use AI Translation Completions: השלמת פערים בתרגומים אנושיים באמצעות טקסט שנוצר בבינה מלאכותית. תרגומים אנושיים תמיד מקבלים עדיפות.
    Update Relative Timestamps: עדכון חותמות הזמן היחסיות בכל היישום כל עוד הדף פתוח. כשהאפשרות מושבתת, הן מתעדכנות רק לאחר טעינה מחדש או חזרה לדף.
    Stream Extraction Method: |
      בחירת הדרך שבה OpenTubeX משיג סטרימים של וידאו. בעת בחירה ב-yt-dlp, הוא חייב להיות זמין.
      השימוש ב-yt-dlp עשוי לעכב את תחילת הסרטונים.
      המנוע המובנה אינו תומך בדילוג לזמן אחר בשידורים חיים ובשידורי בכורה.
    Avoid translation: |
      השבתת התרגום האוטומטי של YouTube לכותרת, לתיאור ולפרקי הסרטון.
      ריבוי בקשות, למשל לאחזור כותרות של סרטונים ברשימות, עלול לפגוע באופן זמני
      באמינות היישום.
    Show Thumbnail Previews: הצגת תצוגה מקדימה מונפשת בעת ריחוף מעל תמונות ממוזערות של סרטונים.
    Startup Behavior: |
      בחירת הפעולה של OpenTubeX בעת ההפעלה.
      טעינת כל הכרטיסיות משחזרת מיד כל כרטיסייה שנשמרה, אך סרטונים בכרטיסיות רקע לא יופעלו אוטומטית.
      טעינת הכרטיסיות שנטענו בעבר טוענת מחדש את הכרטיסיות שהיו טעונות כש-OpenTubeX נסגר, ומשאירה את האחרות לא טעונות.
      טעינת הכרטיסייה הפעילה האחרונה משחזרת את ההפעלה הקודמת כשהכרטיסיות האחרות פתוחות אך לא טעונות; לחיצה עליהן תטען אותן.
      התחלה בהפעלה ריקה מדלגת על הכרטיסיות השמורות ופותחת חלון חדש.
    Remember Tab Navigation History: היסטוריית הניווט קדימה ואחורה של כל כרטיסייה נשמרת ומשוחזרת בעת הפעלה מחדש של OpenTubeX.
  Proxy Settings:
    IP Block Recovery Script Path: נתיב לקובץ סקריפט שיופעל כשמזוהה חסימה של כתובת IP. OpenTubeX ממתין לסיום הסקריפט ואז טוען מחדש את הסרטון. אם החלופה מופעלת, הסקריפט יופעל רק אם גם החלופה נכשלת.
  Player Settings:
    Continue Playback When Screen Is Locked: 'משאיר את השמע מתנגן ברקע ומספק פקדי מדיה של Android. יש לכבות אפשרות זו כדי להשהות כשהיישום אינו גלוי עוד.'
    Enable Caption Translations: כשהאפשרות מופעלת והסרטון אינו מספק רצועה מקורית בשפת הכתוביות המועדפת, כפתור הכתוביות והקיצור C יעדיפו רצועת כתוביות שתורגמה אליה אוטומטית.
    Use Quick Playback Speed Bar: הצגת סרגל מהיר לשליטה במהירות ההפעלה בצד הימני של פקדי הנגן. אם שמירה ידנית של מהירות ההפעלה לכל ערוץ מופעלת, הסרגל כולל גם כפתור לשמירת המהירות לערוץ הנוכחי.
    Multiply Seek Interval by Playback Rate: כשהאפשרות מופעלת, מרווחי הדילוג בזמן (מקשי החצים ו-J/L) מוכפלים במהירות ההפעלה הנוכחית. כשהיא מושבתת, המרווחים נשארים קבועים בלי קשר למהירות ההפעלה.
    Show Playback Rate Adjusted Timestamp: כשהאפשרות מופעלת ומהירות ההפעלה שונה מ-1x, הנגן מציג בסוגריים חותמות זמן המותאמות למהירות ההפעלה, אחרי חותמת הזמן הרגילה.
    Use YouTube-style Shorts: הצגת Shorts ברשת אנכית בדפי המינויים והערוצים ושימוש בנגן Shorts בסגנון YouTube.
    Loop Shorts: כשהאפשרות מופעלת, סרטוני Shorts מתחילים מחדש אוטומטית. כשהיא מושבתת, הם נעצרים בסוף ומציגים כפתור להפעלה חוזרת.
    Show Skip Silence Toggle: הצגת מתג להפעלה ולכיבוי של דילוג על שקט בתפריט ההגדרות של הנגן.
    Enable Skip Silence by Default: הפעלת דילוג על שקט בכרטיסיות חדשות. שינוי האפשרות בכרטיסייה אחת אינו משפיע על האחרות.
    Enable Video Zoom: הצגת פקד התקריב בתפריט ההגדרות של הנגן והפעלת קיצורי המקלדת ופקדי ההזזה שלו.
    Voice-over Translation: שליחת מזהה הסרטון, משך הסרטון והשפה שנבחרה לשירות התרגום הקולי הלא רשמי של Yandex בעת בקשת תרגום. האפשרות מושבתת כברירת מחדל.
    Hold to Double Playback Speed: יש להחזיק את מקש הרווח או את לחצן העכבר השמאלי מעל הנגן כדי להכפיל זמנית את מהירות ההפעלה הנוכחית.
    Ambient Mode: מיזוג צבעי הסרטון באזור שסביב הנגן.
    Default Volume: מושבת כשזכירת עוצמת הקול מופעלת. כבו את זכירת עוצמת הקול כדי להגדיר עוצמה קבועה בתחילת כל סרטון.
    Parallel Segment Loading: |
      מספר מקטעי הווידאו והשמע שייטענו מראש במקביל.
      ערכים גבוהים עשויים לעזור בחיבור איטי או לא יציב, אך צורכים יותר רוחב פס וזיכרון.
      הם גם עלולים לגרום למצב אוטומטי להעריך את מהירות החיבור בחסר ולבחור באיכות נמוכה יותר.
      זרמים המוגבלים לבקשה אחת בכל פעם מתעלמים מהגדרה זו.
    Preload Upcoming Videos: "אחזור ושמירה במטמון של כתובות yt-dlp לסרטונים הבאים. לתור יש עדיפות על רשימות השמעה והמלצות."
    Upcoming Videos to Preload: "המספר המרבי של סרטונים הבאים שכתובות yt-dlp שלהם יאוחזרו ברקע."
    Concurrent Preloads: "המספר המרבי של תהליכי yt-dlp המשמשים לטעינה מראש של סרטונים בו־זמנית. ערכים גבוהים יותר משתמשים ביותר מעבד, זיכרון ורוחב פס רשת."
  Download Settings:
    Download Folder: הסרטונים נשמרים בתיקייה זו. השאירו ריק כדי להשתמש בתיקיית ההורדות של המערכת.
    Global Additional yt-dlp Arguments: ארגומנטים נוספים לשורת הפקודה שיועברו אל yt-dlp בכל הורדה, לדוגמה --cookies-from-browser firefox.
    Concurrent Downloads: המספר המרבי של משימות yt-dlp שיכולות לפעול במקביל.
    Bandwidth Limit: מגביל את קצב ההעברה הכולל של התור ומחלק את המכסה בין משימות מקבילות. הזינו 0 ללא הגבלה.
  External Software Settings:
    yt-dlp Source: OpenTubeX יכולה להשתמש ב-yt-dlp המותקן במערכת, או להוריד ולנהל עותק משלה בתיקיית נתוני המשתמש.
    yt-dlp Channel: בחרו איזה ערוץ הפצה של yt-dlp יורד וינוהל בידי OpenTubeX. הערוץ היציב מומלץ לרוב המשתמשים.
    FFmpeg Source: OpenTubeX יכולה להשתמש ב-FFmpeg וב-FFprobe המותקנים במערכת, או להוריד ולנהל גרסאות סטטיות משלה בתיקיית נתוני המשתמש.
    Managed Tool Updates: בחרו אם הכלים המנוהלים יתעדכנו אוטומטית, יבקשו אישור לפני עדכון, או יתעדכנו רק דרך הכפתורים הידניים. כלים חסרים עדיין יורדו בעת הצורך.
    yt-dlp Executable Path: כברירת מחדל, OpenTubeX מניחה שאפשר למצוא את yt-dlp דרך משתנה הסביבה PATH. במידת הצורך אפשר להגדיר כאן נתיב מותאם אישית.
    Cookie Source: בחרו אם yt-dlp יקרא קובץ עוגיות בתבנית Netscape או עוגיות מדפדפן מותקן לצורך הפעלה מאומתת.
    Cookie File: בחרו קובץ עוגיות בתבנית Netscape לצורך הפעלה מאומתת.
    Browser for Cookies: רשימת הדפדפנים הנתמכים מתקבלת מקובץ ההפעלה הנבחר של yt-dlp. כשנדרשת הפעלה מאומתת, OpenTubeX מורה ל-yt-dlp לקרוא את העוגיות מדפדפן זה.
    Browser Profile: שם או תיקייה אופציונליים של פרופיל דפדפן. השאירו ריק כדי להשתמש בפרופיל שנפתח לאחרונה.
    Always Use Cookies: השתמשו בעוגיות שהוגדרו בכל פעם ש-yt-dlp מחלץ זרמים. אפשרות זו אינה משנה את שיטת חילוץ הזרמים ל-yt-dlp. כש-yt-dlp נבחר, ייתכן שיופיעו פורמטים הזמינים לחשבון בלבד, כולל קצב הסיביות המשופר של YouTube Premium אם החשבון זכאי לכך.
    FFmpeg Executable Path: FFmpeg נדרש למיזוג זרמי וידאו ושמע נפרדים ולהמרת שמע. כברירת מחדל, OpenTubeX מניחה שאפשר למצוא את FFmpeg דרך משתנה הסביבה PATH. במידת הצורך אפשר להגדיר כאן נתיב מותאם אישית.
  Distraction Free Settings:
    Shorten View Counts: מציג ספירות צפיות ולייקים לתגובות ש-YouTube כבר עיגלה בצורה מקוצרת, למשל 14K במקום 14,000. ספירות מדויקות תמיד מוצגות במלואן.
  Subscription Settings:
    Fetch Feed on Startup: כשהאפשרות מופעלת, OpenTubeX תטען אוטומטית את פיד המינויים עם ההפעלה ובפתיחת חלון חדש.
    Show New Content Feed: מציג לשונית בשם חדש ובה פריטים מפיד המינויים שלא היו בטעינה הקודמת.
    Show New Content Indicators: מציג נקודה קטנה לצד פריטים מפיד המינויים שלא היו בטעינה הקודמת.
    Show Scheduled Live Streams / Premieres First: משאיר שידורים חיים והקרנות בכורה עתידיים בראש פיד המינויים. כשהאפשרות מושבתת, הם נשארים במיקום ההכרזה עד שיתחילו. לאחר ההשבתה, רעננו את פיד המינויים פעם אחת כדי לאחזר את תאריכי ההכרזה של פריטים מתוזמנים קיימים.
    Auto Refresh Interval: "התדירות שבה OpenTubeX מרעננת אוטומטית את פיד המינויים כשהיישום פתוח. ב-Android, מרווח שאינו אפס מרענן את הפיד גם כשהיישום סגור."
    Refresh Subscriptions While App Is Closed: "מאפשר ל-Android לרענן את פידי המינויים במרווחים שנבחרו כאשר OpenTubeX סגור. השבתת האפשרות תגביל ריענונים אוטומטיים לזמן שבו היישום פתוח."
  Theme Settings:
    Show Progress as Notification: מציג התראה קבועה עם התקדמות בזמן אמת של פעולות רקע, כגון רענון מינויים והורדת כלים מנוהלים, במקום סרגל ההתקדמות הכללי.
    Always Show Scrollbars: משאיר את פסי הגלילה גלויים תמיד. כשהאפשרות מושבתת, הם נעלמים זמן קצר לאחר הפסקת תנועת העכבר ומופיעים שוב מיד כשמזיזים אותו.
    Scroll Speed: שינוי מרחק הגלילה של מחוות גלגלת העכבר ומשטח המגע.
    Use Fixed Tab Width: מקצה רוחב זהה לכל לשונית בסרגל הלשוניות האופקי, במקום להתאים את הרוחב לכותרת.
    Use Grid Player Menu: מסדר את תפריט ההגדרות של נגן הווידאו כרשת אריחים במקום כרשימת שורות.
