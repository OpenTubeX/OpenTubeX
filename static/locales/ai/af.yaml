  Errors:
    Invalid credentials: Die Yattee-bediener het die gebruikersnaam of wagwoord verwerp. Gaan hulle na in Instellings → Gevorderd.
    Rate limited: Die Yattee-bediener blokkeer aanmeldings na te veel mislukte pogings. Probeer later weer.
    Streams not relayed: Die Yattee-bediener het nie die strome van hierdie video deurgestuur nie. Terwyl video’s deur die bediener gestuur word, koppel OpenTubeX nie direk aan YouTube nie.
    Not configured: Voer die URL van u Yattee-bediener in Instellings → Gevorderd in.
    HTTPS required: Android kan slegs video’s speel van Yattee-bedieners wat HTTPS gebruik.
    Streams unavailable: Kon nie die strome van hierdie video van die Yattee-bediener laai nie. Gebruik Toets verbinding in Instellings → Gevorderd om die bediener na te gaan.
