Tooltips:
  General Settings:
    Limit Titles to Two Lines: "Kort video- en snitlystitels in lyste en roosters tot twee reëls met 'n ellips in, vir meer eenvormige kaarte. Hou die muis oor 'n titel om dit volledig te sien."
    Preferred Video Codec: |
      Outomaties verkies kodeks wat u toestel in hardeware kan dekodeer.
      AV1: die beste kwaliteit vir die minste data, maar nie elke video het dit nie. Sonder hardeware-dekodering kan dit die battery uitput of rame laat val.
      VP9: ’n balans tussen doeltreffendheid en versoenbaarheid, gewoonlik beskikbaar tot by die hoogste resolusie.
      H.264: die maklikste om op byna enige toestel te dekodeer, maar dit gebruik meer data en stop gewoonlik by 1080p.
      Veranderinge geld vir die volgende video. As die voorkeurkodek nie beskikbaar is nie, word ’n ander een gebruik.
    Yattee Server: Die yattee-server-instansie waarvandaan OpenTubeX video’s, kanale, afspeellyste en soekresultate laai. Die gebruikersnaam en wagwoord word slegs op hierdie toestel gestoor.
    Proxy Videos Through Yattee Server: Stuur video- en oudiostrome deur die bediener. Laat dit aan tensy die bediener u internetverbinding deel, want YouTube bedien strome slegs aan die adres wat hulle versoek het. Duimnaels laai altyd direk van YouTube.
    Enable Tabs: Hou die huidige blad oop. Ander oortjies word behou totdat die toep herbegin; aktiveer oortjies weer om hulle te herstel.
    Data Saver Thumbnails: Gebruik duimnaels met laer resolusie om datagebruik te verminder.
    Use AI Translation Completions: Vul gapings in menslike vertalings met KI-gegenereerde teks aan. Menslike vertalings kry altyd voorrang.
    Update Relative Timestamps: Werk relatiewe tydstempels regdeur die toep by terwyl ’n blad oop bly. Wanneer gedeaktiveer, word hulle slegs bygewerk nadat die blad herlaai of weer besoek is.
    Automatically switch stream extraction methods: Probeer yt-dlp as ingeboude afspeel misluk, of ingeboude afspeel as yt-dlp misluk.
    Stream Extraction Method: |
      Kies hoe OpenTubeX videostrome verkry. yt-dlp moet beskikbaar wees wanneer dit gekies is.
      Video’s kan langer neem om te begin wanneer yt-dlp gebruik word.
      Ingebou ondersteun nie spoel vir regstreekse uitsendings en premières nie.
    Avoid translation: |
      Deaktiveer YouTube se outomatiese vertaling van die titel, beskrywing en hoofstukke van ’n video.
      Te veel versoeke, soos om videotitels oor lyste heen op te haal, kan die toep se betroubaarheid
      tydelik beïnvloed.
    Always Use Backup Media Server: Stroom video’s vanaf die rugsteunbediener wat YouTube noem in plaas van die toegewysde een, byvoorbeeld wanneer u internetverskaffer se kas dikwels stadig is. Andersins skakel OpenTubeX slegs oor wanneer die toegewysde bediener nie antwoord nie.
    Show Thumbnail Previews: Wys geanimeerde voorskoue wanneer u oor videoduimnaels sweef.
    Startup Behavior: |
      Kies wat OpenTubeX doen wanneer dit begin.
      Laai alle oortjies herstel elke gestoorde oortjie onmiddellik, maar agtergrondoortjies sal nie video’s outomaties afspeel nie.
      Laai voorheen gelaaide oortjies herlaai die oortjies wat gelaai was toe OpenTubeX gesluit het en hou die ander ontlaai.
      Laai laaste aktiewe oortjie herstel die vorige sessie met die ander oortjies oop maar ontlaai; hulle laai wanneer u daarop klik.
      Begin met ’n leë sessie slaan die gestoorde oortjies oor en maak ’n nuwe venster oop.
    Close Window With Last Tab: Wanneer af, maak die sluiting van die laaste oortjie eerder ’n nuwe oortjie oop, sodat die venster oop bly totdat u dit sluit.
    Remember Tab Navigation History: Elke oortjie se terug- en vorentoe-navigasiegeskiedenis word gestoor en herstel wanneer OpenTubeX herbegin.
    Notifications: Kies hoe OpenTubeX jou van regstreekse uitsendings, nuwe oplaaie en outomatiese aflaaie in kennis stel. Met Stelsel en in die app verskyn kennisgewings in OpenTubeX terwyl jy dit gebruik, andersins as stelselkennisgewings, en die klok hou hulle. Af versteek ook die kennisgewingopsies.
  Proxy Settings:
    IP Block Recovery Script Path: Pad na skriplêer wat uitgevoer word wanneer ’n IP-blokkering bespeur word. OpenTubeX wag totdat dit klaar is en herlaai dan die video. As terugval geaktiveer is, loop dit slegs wanneer terugval ook misluk.
  Player Settings:
    Rewind on Resume: "Spring soveel sekondes terug wanneer jy ’n gepouseerde video hervat, sodat jy die laaste oomblikke weer kan sien. Stel op 0 om dit af te skakel."
    Minimum Pause Before Rewinding: "Spoel net terug wanneer die video ten minste so lank gepouseer was. Stel op 0 om na elke pouse terug te spoel."
    Enable Caption Translations: Wanneer geaktiveer, verkies die onderskrifknoppie en C-kortpad ’n outomaties vertaalde snit in die voorkeuronderskriftaal wanneer die video nie ’n ooreenstemmende oorspronklike snit verskaf nie.
    Use Quick Playback Speed Bar: Wys ’n vinnige afspeelspoedbalk aan die regterkant van die spelerkontroles. As handmatige stoor van afspeelspoed per kanaal geaktiveer is, bevat die balk ook die knoppie om die spoed vir die huidige kanaal te stoor.
    Multiply Seek Interval by Playback Rate: Wanneer geaktiveer, word spoelintervalle (pyltjiesleutels en J/L) met die huidige afspeelspoed vermenigvuldig. Wanneer gedeaktiveer, bly spoelintervalle konstant ongeag die afspeelspoed.
    Show Playback Rate Adjusted Timestamp: Wanneer geaktiveer en die afspeelspoed van 1x verskil, wys die speler tydstempels aangepas vir afspeelspoed tussen hakies ná die normale tydstempel.
    Use YouTube-style Shorts: Vertoon kortvideo’s in ’n portretrooster op intekening- en kanaalblaaie en gebruik die kortvideospeler in YouTube-styl.
    Loop Shorts: Wanneer geaktiveer, begin kortvideo’s outomaties weer. Wanneer gedeaktiveer, stop kortvideo’s aan die einde en wys ’n herspeelknoppie.
    Show Skip Silence Toggle: Wys ’n aan/af-wisselaar vir die oorslaan van stilte in die speler se instellingskieslys.
    Enable Skip Silence by Default: Aktiveer die oorslaan van stilte vir nuwe oortjies. As u dit in een oortjie verander, raak dit nie ander oortjies nie.
    Enable Video Zoom: Wys die zoemkontrole in die speler se instellingskieslys en aktiveer die sleutelbordkortpaaie en panneerkontroles daarvan.
    Enable Seek History: Onthou waarvandaan u in elke video gespring het totdat die toep sluit. Wys die spoelgeskiedenislys in die speler se instellingskieslys en aktiveer die sleutelbordkortpaaie daarvan.
    Show Seek Bar Filmstrip: "As jy die soekbalk se knop sleep, wys dit 'n strook rame rondom waar jy gaan land, en as jy daarop optrek, spoel jy presies. Wanneer gedeaktiveer, wys sleep 'n enkele duimnael, soos wanneer jy daaroor beweeg."
    Pause on Stream Recovery: Wanneer die videostroom misluk en die speler dit herlaai of na ’n ander formaat of enjin oorskakel, pouseer afspeel en hou die fout bo-aan die speler totdat u dit toemaak. Wanneer gedeaktiveer, gaan afspeel voort en verskyn die fout kortliks as ’n kennisgewing.
    Continue Playback When Screen Is Locked: Hou oudio in die agtergrond aan die speel en verskaf Android-mediakontroles. Skakel dit af om te pouseer wanneer die toep nie meer sigbaar is nie.
    Voice-over Translation: Stuur die video-ID, duur en gekose taal na die nie-amptelike Yandex-stemoorvertaaldiens wanneer u ’n vertaling versoek. By verstek gedeaktiveer.
    Hold to Double Playback Speed: Hou die spasiebalk of linkermuisknoppie oor die speler in om die huidige afspeelspoed tydelik te verdubbel.
    Ambient Mode: Meng die video se kleure in die area rondom die speler in.
    Mono Audio: Speel die linker- en regteroudiokanale in albei ore. Gebruik dit wanneer ’n video se klank slegs uit een kant van u oorfone kom.
    Default Volume: Gedeaktiveer terwyl Onthou volume geaktiveer is. Skakel Onthou volume af om ’n vaste beginvolume vir elke video te stel.
    Parallel Segment Loading: |
      Hoeveel video- en oudiosegmente gelyktydig voor afspeel gelaai word.
      Hoër waardes kan help op stadige of onstabiele verbindings, maar gebruik meer bandwydte en geheue.
      Hulle kan ook veroorsaak dat Outomaties die verbindingspoed onderskat en ’n laer kwaliteit kies.
      Strome wat tot een versoek op ’n slag beperk is, ignoreer hierdie instelling.
    Preload Upcoming Videos: Haal yt-dlp-stroom-URL’s op en kas dit vir video’s wat volgende kan speel. Die kyktou kry voorrang bo afspeellyste en aanbevelings.
    Upcoming Videos to Preload: Die maksimum aantal komende video’s waarvan die yt-dlp-stroom-URL’s in die agtergrond opgehaal word.
    Concurrent Preloads: Die maksimum aantal yt-dlp-prosesse wat gelyktydig gebruik word om video’s vooraf te laai. Hoër waardes gebruik meer SVE, geheue en netwerkbandwydte.
    Ignore System Rotation Lock for Fullscreen: Gebruik fisiese toesteldraaiing om volskerm te betree en te verlaat, selfs wanneer Android se outodraai af is.
  Download Settings:
    Download Folder: Video’s word in hierdie vouer gestoor. Laat leeg om u stelsel se Aflaaie-vouer te gebruik.
    Global Additional yt-dlp Arguments: Bykomende opdragreëlargumente wat vir elke aflaai aan yt-dlp deurgegee word, byvoorbeeld --cookies-from-browser firefox.
    Concurrent Downloads: Die maksimum aantal yt-dlp-take wat gelyktydig mag loop.
    Bandwidth Limit: Beperk die tou se gekombineerde oordragtempo deur hierdie limiet tussen gelyktydige take te verdeel. Voer 0 in vir geen limiet.
  External Software Settings:
    yt-dlp Source: OpenTubeX kan óf die yt-dlp gebruik wat op u stelsel geïnstalleer is, óf sy eie kopie van yt-dlp aflaai en bestuur, wat in die gebruikersdatagids gestoor word.
    yt-dlp Channel: Kies watter yt-dlp-vrystellingskanaal OpenTubeX aflaai en bestuur. Stable word vir die meeste gebruikers aanbeveel.
    FFmpeg Source: OpenTubeX kan óf FFmpeg en FFprobe gebruik wat op u stelsel geïnstalleer is, óf sy eie statiese bouweergawes aflaai en bestuur, wat in die gebruikersdatagids gestoor word.
    Managed Tool Updates: Kies of bestuurde gereedskap outomaties bygewerk word, vra voor bywerking, of slegs via die handmatige knoppies bygewerk word. Ontbrekende gereedskap word steeds afgelaai wanneer nodig.
    yt-dlp Executable Path: By verstek sal OpenTubeX aanvaar dat yt-dlp via die PATH-omgewingsveranderlike gevind kan word. Indien nodig, kan ’n pasgemaakte pad hier gestel word.
    Cookie Source: Kies of yt-dlp ’n Netscape-koekielêer of koekies van ’n geïnstalleerde blaaier moet lees vir geverifieerde afspeel.
    Cookie File: Kies ’n koekielêer in Netscape-formaat vir geverifieerde afspeel.
    Browser for Cookies: Blaaierondersteuning word van die gekose uitvoerbare yt-dlp-lêer gelees. OpenTubeX vra yt-dlp om hierdie blaaier te lees wanneer geverifieerde afspeel versoek word.
    Browser Profile: Opsionele blaaierprofielnaam of -vouer. Laat leeg om die mees onlangs gebruikte profiel te gebruik.
    Always Use Cookies: Gebruik die opgestelde koekies vir aflaaie, onderskrifte en wanneer yt-dlp strome onttrek. Dit skakel nie die stroomonttrekkingsmetode na yt-dlp oor nie. Met yt-dlp gekies, kan formate wat slegs vir rekeninge is beskikbaar word, insluitend YouTube Premium se verbeterde bitsnelheid wanneer die rekening toegang het.
    FFmpeg Executable Path: FFmpeg word benodig om afsonderlike video- en oudiostrome saam te voeg en vir oudio-omskakeling. By verstek sal OpenTubeX aanvaar dat FFmpeg via die PATH-omgewingsveranderlike gevind kan word. Indien nodig, kan ’n pasgemaakte pad hier gestel word.
    Use cookies for subtitles: Gebruik die opgestelde koekies vir onderskrifte en outomatiese vertalings. Ook geaktiveer deur "Gebruik altyd koekies".
  Distraction Free Settings:
    Hide Playlist Stats: Versteek die aantal video’s, die aantal kyke, die datum van die laaste opdatering en die totale duur op snitlysbladsye.
    Count Watch Time From: Alle toestelle tel elke toestel wat kykstatistieke sinkroniseer. Hierdie toestel tel slegs wat u hier kyk.
    When a Limit Is Reached: Pouseer afspeel laat u toe om 15 minute by te voeg of die limiet vir vandag te ignoreer. Met ’n instellingswagwoord kan u ’n limiet slegs in Instellings verhoog.
    Grayscale: "Wys die toep in grystinte sodat dit minder aandag trek. Tydens slaaptyd volg die skedule van die slaaptydherinnering."
    Apply Grayscale To: "Video’s en prente hou die koppelvlak in kleur en maak inhoud soos video’s, duimnaels en avatars grys."
    Daily Watch Time Limit: Tel wat u vandag gekyk het op alle toestelle wat kykstatistieke sinkroniseer, insluitend kortvideo’s.
    Daily Shorts Limit: Tel die kortvideo’s wat u vandag op hierdie toestel gekyk het.
    Take a Break Reminder: Pouseer die video na soveel kyk. ’n Pouse van 10 minute of meer begin die telling weer.
    Bedtime Reminder: Pouseer die video en herinner u om op te hou kyk tussen die begin- en eindtyd.
    Shorten View Counts: Wys getalle van kyke, kommentaar en kommentaar-hou-van’s wat YouTube reeds afgerond het in ’n verkorte vorm, bv. 14K in plaas van 14 000. Presiese getalle word altyd volledig gewys.
  Subscription Settings:
    Fetch Feed on Startup: Wanneer geaktiveer, sal OpenTubeX u intekeningvoer outomaties by opstart ophaal en wanneer ’n nuwe venster oopgemaak word.
    Show New Content Feed: Wys ’n Nuut-oortjie met intekeningvoeritems wat nie tydens die vorige ophaal teenwoordig was nie.
    Enable RSS Feeds: Wys ’n RSS-oortjie op die Intekeninge-blad met die items van RSS- of Atom-voere, sodat u skeppers op ander platforms kan volg. Die items daarvan word met yt-dlp oopgemaak.
    Show New Content Indicators: Wys ’n klein kolletjie langs intekeningvoeritems wat nie tydens die vorige ophaal teenwoordig was nie.
    Show Scheduled Live Streams / Premieres First: Hou komende regstreekse uitsendings en premières bo-aan die intekeningvoer. Wanneer gedeaktiveer, bly hulle op hul aankondigingsposisie totdat hulle begin. Verfris die intekeningvoer een keer nadat u dit gedeaktiveer het om aankondigingsdatums vir bestaande geskeduleerde inskrywings op te haal.
    Auto Refresh Interval: Hoe gereeld OpenTubeX u intekeningvoer outomaties verfris terwyl die toep oop is. Op Android verfris ’n interval wat nie nul is nie dit ook terwyl die toep gesluit is.
    Refresh Subscriptions While App Is Closed: Verfris voere met u gekose instellings. Op rekenaars bly OpenTubeX in die stelselbak totdat u dit verlaat. Android beheer wanneer agtergrondverfrissings loop.
    Notify About New Uploads: Wys stelselkennisgewings op hierdie toestel vir kanale waarvoor u kennisgewings in hul intekeninginstellings aangeskakel het. OpenTubeX kyk vir nuwe inhoud wanneer intekeninge verfris, dus kies ’n outomatiese verfrissingsinterval. Om in kennis gestel te word terwyl die toep gesluit is, aktiveer ook verfrissing terwyl die toep gesluit is.
    RSS Feeds Auto Refresh Interval: Hoe gereeld OpenTubeX jou RSS-voere outomaties verfris terwyl die toep oop is.
  Theme Settings:
    Only Show Important Notifications: Versteek kennisgewings in die app wat slegs 'n aksie bevestig of 'n status meld. Foute, waarskuwings, herinneringe wat jy opgestel het en kennisgewings met 'n aksie, soos Ontdoen, verskyn steeds. Agtergrondvordering, soos die verfris van intekeninge, word in die globale vorderingsbalk gewys in plaas van as 'n kennisgewing. Stelselkennisgewings word nie geraak nie.
    Thumbnail Size: Skaal videoduimnaels in roosters en lyste. Roosters met ’n vaste aantal kolomme of die aansigtipe Volle breedte vul eerder elke ry, dus verander dit daar slegs lysduimnaels en kortvideo’s. Vensters van foongrootte beperk roosterduimnaels tot 100%.
    Playlist Thumbnail Size: Skaal videoduimnaels op afspeellysblaaie. Roosters met ’n vaste aantal kolomme of die aansigtipe Volle breedte vul eerder elke ry, dus verander dit daar slegs lysduimnaels en kortvideo’s. Vensters van foongrootte beperk roosterduimnaels tot 100%.
    Show Progress as Notification: Wys ’n blywende kennisgewing met regstreekse voortgang vir agtergrondbewerkings, soos intekeningverfrissings en aflaaie van bestuurde gereedskap, in plaas van die globale vorderingsbalk.
    Always Show Scrollbars: Hou die rolstawe altyd sigbaar. Wanneer gedeaktiveer, verdof hulle kort nadat u ophou om die muis te beweeg en verskyn weer sodra u dit beweeg.
    Scroll Speed: Verander hoe ver muiswiel- en raakpaneelwielgebare rol.
    Visible Search Suggestions: Stel hoeveel soekgeskiedenisinskrywings en voorstelle die soekbalk wys voordat die lys rol. Die lys strek nooit verby die onderkant van die venster nie.
    Use Fixed Tab Width: Gee elke oortjie in die horisontale oortjiebalk dieselfde breedte in plaas daarvan om hulle volgens hul titel te grootte te maak.
    Use Custom Title Bar: Vervang die stelsel se titelbalk met die oortjiebalk, of met die boonste navigasie wanneer oortjies nie bo is nie, om vertikale spasie te bespaar. Die vensterkontroles verskyn in die hoek van daardie balk.
    Use Grid Player Menu: Rangskik die videospeler se instellingskieslys as ’n rooster van teëls in plaas van ’n lys rye.
    Compact Settings Categories: Versteek beskrywings en verminder die hoogte van instellingskategorieë.
  Experimental Settings:
    Disable Hardware Acceleration: Deaktiveer GPU-hardewareversnelling. Kan grafiese probleme oplos, maar sal waarskynlik swakker presteer.
