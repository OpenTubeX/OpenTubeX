Tooltips:
  General Settings:
    Use AI Translation Completions: Fyll luckor i mänskliga översättningar med AI-genererad text. Mänskliga översättningar har alltid företräde.
    Update Relative Timestamps: Uppdaterar relativa tidsangivelser i hela appen medan en sida är öppen. När funktionen är inaktiverad uppdateras de först när sidan läses in igen eller besöks på nytt.
    Stream Extraction Method: |
      Välj hur OpenTubeX hämtar videoströmmar. yt-dlp måste vara tillgängligt när det väljs.
      Det kan ta längre tid att starta videor med yt-dlp.
      Den inbyggda metoden stöder inte hoppning i liveströmmar och premiärer.
    Avoid translation: |
      Inaktivera YouTubes automatiska översättning av en videos titel, beskrivning och kapitel.
      För många förfrågningar, exempelvis när videotitlar hämtas för flera listor, kan tillfälligt
      göra appen mindre tillförlitlig.
    Show Thumbnail Previews: Visa animerade förhandsgranskningar när pekaren hålls över videominiatyrer.
    Startup Behavior: |
      Välj vad OpenTubeX ska göra vid start.
      Läs in alla flikar återställer genast alla sparade flikar, men videor spelas inte upp automatiskt i bakgrundsflikar.
      Läs in tidigare inlästa flikar läser in de flikar som var inlästa när OpenTubeX stängdes och lämnar övriga frigjorda.
      Läs in senast aktiva fliken återställer föregående session med övriga flikar öppna men frigjorda. De läses in när du klickar på dem.
      Starta med en tom session hoppar över sparade flikar och öppnar ett nytt tomt fönster.
    Remember Tab Navigation History: Varje fliks bakåt- och framåthistorik sparas och återställs när OpenTubeX startas om.
  Proxy Settings:
    IP Block Recovery Script Path: Sökväg till skriptfilen som ska köras när en IP-blockering identifieras. OpenTubeX väntar tills skriptet är klart och läser sedan in videon igen. Om reservmetoden är aktiverad körs skriptet först när även den misslyckas.
  Player Settings:
    Enable Caption Translations: När funktionen är aktiverad föredrar undertextknappen och kortkommandot C ett automatiskt översatt spår på det föredragna undertextspråket om videon saknar ett matchande originalspår.
    Use Quick Playback Speed Bar: Visar ett snabbfält för uppspelningshastighet bland spelarkontrollerna till höger. Om manuell lagring av uppspelningshastighet per kanal är aktiverad innehåller fältet även knappen som sparar hastigheten för den aktuella kanalen.
    Multiply Seek Interval by Playback Rate: När funktionen är aktiverad multipliceras hoppintervallen för piltangenterna och J/L med den aktuella uppspelningshastigheten. När den är inaktiverad förblir hoppintervallen oförändrade oavsett uppspelningshastighet.
    Show Playback Rate Adjusted Timestamp: När funktionen är aktiverad och uppspelningshastigheten skiljer sig från 1× visar spelaren tidsangivelser som justerats efter hastigheten inom parentes efter den vanliga tidsangivelsen.
    Use YouTube-style Shorts: Visar Shorts i ett stående rutnät på prenumerations- och kanalsidor och använder Shorts-spelaren i YouTube-stil.
    Loop Shorts: När funktionen är aktiverad startar Shorts om automatiskt. När den är inaktiverad stannar Shorts vid slutet och visar en knapp för att spela upp igen.
    Show Skip Silence Toggle: Visar ett på/av-reglage för att hoppa över tystnad i spelarens inställningsmeny.
    Enable Skip Silence by Default: Aktiverar överhoppning av tystnad för nya flikar. En ändring i en flik påverkar inte andra flikar.
    Enable Video Zoom: Visar zoomkontrollen i spelarens inställningsmeny och aktiverar dess kortkommandon och panoreringskontroller.
    Voice-over Translation: Skickar videons ID, längd och valt språk till Yandex inofficiella tjänst för dubbningsöversättning när du begär en översättning. Funktionen är inaktiverad som standard.
    Hold to Double Playback Speed: Håll ned mellanslagstangenten eller vänster musknapp över spelaren för att tillfälligt dubbla den aktuella uppspelningshastigheten.
    Ambient Mode: Tonar ut videons färger i området runt spelaren.
    Default Volume: Inaktiverat medan Kom ihåg volymen är aktiverat. Stäng av Kom ihåg volymen för att ange en fast startvolym för varje video.
    Parallel Segment Loading: |
      Antal video- och ljudsegment som ska läsas in samtidigt före uppspelningen.
      Högre värden kan hjälpa vid långsamma eller instabila anslutningar men använder mer bandbredd och minne.
      De kan även göra att Auto underskattar anslutningshastigheten och väljer en lägre kvalitet.
      Strömmar som är begränsade till en begäran åt gången ignorerar inställningen.
  Download Settings:
    Download Folder: Videor sparas i den här mappen. Lämna tomt för att använda systemets nedladdningsmapp.
    Global Additional yt-dlp Arguments: Extra kommandoradsargument som skickas till yt-dlp vid varje nedladdning, exempelvis --cookies-from-browser firefox.
    Concurrent Downloads: Det högsta antalet yt-dlp-jobb som får köras samtidigt.
    Bandwidth Limit: Begränsar köns sammanlagda överföringshastighet genom att dela gränsen mellan samtidiga jobb. Ange 0 för obegränsad hastighet.
  External Software Settings:
    yt-dlp Source: OpenTubeX kan antingen använda yt-dlp som är installerat på systemet eller ladda ned och hantera en egen kopia som lagras i mappen för användardata.
    yt-dlp Channel: Välj vilken utgivningskanal för yt-dlp som OpenTubeX ska ladda ned och hantera. Stabil rekommenderas för de flesta användare.
    FFmpeg Source: OpenTubeX kan antingen använda FFmpeg och FFprobe som är installerade på systemet eller ladda ned och hantera egna statiska versioner som lagras i mappen för användardata.
    Managed Tool Updates: Välj om hanterade verktyg ska uppdateras automatiskt, fråga före uppdatering eller endast uppdateras med de manuella knapparna. Verktyg som saknas laddas fortfarande ned när de behövs.
    yt-dlp Executable Path: Som standard förutsätter OpenTubeX att yt-dlp kan hittas via miljövariabeln PATH. Vid behov kan du ange en egen sökväg här.
    Cookie Source: Välj om yt-dlp ska läsa en Netscape-kakfil eller kakor från en installerad webbläsare vid autentiserad uppspelning.
    Cookie File: Välj en Netscape-formaterad kakfil för autentiserad uppspelning.
    Browser for Cookies: Stödet för webbläsare läses från den valda yt-dlp-programfilen. OpenTubeX ber yt-dlp att läsa webbläsaren när autentiserad uppspelning begärs.
    Browser Profile: Valfritt namn på eller mapp för webbläsarprofilen. Lämna tomt för att använda den senast öppnade profilen.
    Always Use Cookies: Använd de konfigurerade kakorna varje gång yt-dlp utvinner strömmar. Detta byter inte metod för strömutvinning till yt-dlp. När yt-dlp är valt kan format som kräver konto bli tillgängliga, inklusive YouTube Premiums högre bithastighet om kontot har åtkomst.
    FFmpeg Executable Path: FFmpeg krävs för att sammanfoga separata video- och ljudströmmar samt för ljudkonvertering. Som standard förutsätter OpenTubeX att FFmpeg kan hittas via miljövariabeln PATH. Vid behov kan du ange en egen sökväg här.
  Distraction Free Settings:
    Shorten View Counts: Visar antal visningar och gilla-markeringar på kommentarer i den förkortade form som YouTube redan har avrundat, exempelvis 14 tn i stället för 14 000. Exakta antal visas alltid i sin helhet.
  Subscription Settings:
    Fetch Feed on Startup: När funktionen är aktiverad hämtar OpenTubeX automatiskt ditt prenumerationsflöde vid start och när ett nytt fönster öppnas.
    Show New Content Feed: Visar en flik med namnet Nytt som innehåller poster i prenumerationsflödet som inte fanns vid föregående hämtning.
    Show New Content Indicators: Visar en liten punkt bredvid poster i prenumerationsflödet som inte fanns vid föregående hämtning.
    Show Scheduled Live Streams / Premieres First: Behåller kommande liveströmmar och premiärer högst upp i prenumerationsflödet. När funktionen är inaktiverad ligger de kvar på platsen för tillkännagivandet tills de startar. Uppdatera prenumerationsflödet en gång efter inaktiveringen för att hämta tillkännagivandedatum för befintliga schemalagda poster.
    Auto Refresh Interval: Hur ofta OpenTubeX automatiskt uppdaterar prenumerationsflödet medan appen är öppen.
  Theme Settings:
    Show Progress as Notification: Visar en beständig avisering med aktuellt förlopp för bakgrundsåtgärder, exempelvis uppdatering av prenumerationer och nedladdning av hanterade verktyg, i stället för det globala förloppsfältet.
    Always Show Scrollbars: Håller rullningslisterna synliga hela tiden. När funktionen är inaktiverad tonas de bort en kort stund efter att du slutat röra musen och visas igen så snart du rör den.
    Scroll Speed: Ändrar hur långt mushjulets och pekplattans rullgester rullar.
    Use Fixed Tab Width: Ger alla flikar i det vågräta flikfältet samma bredd i stället för att anpassa bredden efter titeln.
    Use Grid Player Menu: Ordnar videospelarens inställningsmeny som ett rutnät med rutor i stället för en lista med rader.
