Tooltips:
  General Settings:
    Use AI Translation Completions: Užpildyti žmonių vertimų spragas DI sugeneruotu tekstu. Žmonių vertimams visada teikiama pirmenybė.
    Update Relative Timestamps: Kol puslapis atvertas, visoje programoje atnaujina santykines laiko žymas. Išjungus jos atnaujinamos tik iš naujo įkėlus puslapį arba į jį sugrįžus.
    Stream Extraction Method: |
      Pasirinkite, kaip OpenTubeX gauna vaizdo srautus. Pasirinkus yt-dlp, jis turi būti pasiekiamas.
      Naudojant yt-dlp vaizdo įrašai gali būti pradedami atkurti lėčiau.
      Integruotas būdas nepalaiko tiesioginių transliacijų ir premjerų persukimo.
    Avoid translation: |
      Išjungti YouTube automatinį vaizdo įrašo pavadinimo, aprašo ir skyrių vertimą.
      Per daug užklausų, pavyzdžiui, gaunant vaizdo įrašų pavadinimus iš sąrašų, gali laikinai
      sutrikdyti programos veikimą.
    Show Thumbnail Previews: Užvedus pelės žymeklį ant vaizdo įrašų miniatiūrų rodyti animuotas peržiūras.
    Startup Behavior: |
      Pasirinkite OpenTubeX paleidimo veiksmą.
      Įkelti visas korteles iš karto atkuria visas išsaugotas korteles, bet foninėse kortelėse vaizdo įrašai automatiškai nepaleidžiami.
      Įkelti anksčiau įkeltas korteles vėl įkelia korteles, kurios buvo įkeltos uždarant OpenTubeX, o kitas palieka iškeltas.
      Įkelti paskutinę aktyvią kortelę atkuria ankstesnį seansą, o kitas korteles atveria, bet palieka iškeltas; jos įkeliamos jas spustelėjus.
      Pradėti tuščią seansą neatkuria išsaugotų kortelių ir atveria naują langą.
    Open Deep Links In New Window: OpenTubeX perduoti URL, pavyzdžiui, iš naršyklės peradresavimo plėtinių ar komandų eilutės argumentų, atveriami naujame lange.
    Remember Tab Navigation History: Kiekvienos kortelės naršymo pirmyn ir atgal istorija išsaugoma ir atkuriama iš naujo paleidus OpenTubeX.
  Proxy Settings:
    IP Block Recovery Script Path: Scenarijaus failo, paleidžiamo aptikus IP blokavimą, kelias. OpenTubeX laukia, kol jis bus baigtas, tada iš naujo įkelia vaizdo įrašą. Jei įjungtas atsarginis būdas, scenarijus paleidžiamas tik tada, kai nepavyksta ir atsarginis būdas.
  Player Settings:
    Enable Caption Translations: Įjungus subtitrų mygtukas ir spartusis klavišas C teikia pirmenybę automatiškai išverstam takeliui pageidaujama subtitrų kalba, jei vaizdo įraše nėra atitinkamo originalaus takelio.
    Use Quick Playback Speed Bar: Dešinėje leistuvo valdiklių pusėje rodo sparčiojo atkūrimo greičio juostą. Jei įjungtas rankinis atkūrimo greičio išsaugojimas kiekvienam kanalui, juostoje taip pat yra mygtukas dabartinio kanalo greičiui išsaugoti.
    Skip by Scrolling Over Video Player: Slinkimo ratuku persukti vaizdo įrašą kaip MPV.
    Multiply Seek Interval by Playback Rate: Įjungus persukimo intervalai (rodyklių klavišai ir J/L) dauginami iš dabartinio atkūrimo greičio. Išjungus persukimo intervalai nekinta, nepaisant atkūrimo greičio.
    Show Playback Rate Adjusted Timestamp: Įjungus ir atkūrimo greičiui nesant 1x, leistuvas skliaustuose po įprasta laiko žyma rodo pagal atkūrimo greitį pakoreguotą laiko žymą.
    Use YouTube-style Shorts: Prenumeratų ir kanalų puslapiuose rodo Shorts vertikaliame tinklelyje ir naudoja YouTube stiliaus Shorts leistuvą.
    Loop Shorts: Įjungus Shorts automatiškai paleidžiami iš naujo. Išjungus Shorts pabaigoje sustoja ir rodomas pakartojimo mygtukas.
    Show Skip Silence Toggle: Leistuvo nustatymų meniu rodo tylos praleidimo įjungimo ir išjungimo jungiklį.
    Enable Skip Silence by Default: Naujose kortelėse įjungia tylos praleidimą. Pakeitimas vienoje kortelėje neturi įtakos kitoms kortelėms.
    Enable Video Zoom: Leistuvo nustatymų meniu rodo mastelio valdiklį ir įjungia jo sparčiuosius klavišus bei slinkimo valdiklius.
    Voice-over Translation: Paprašius vertimo siunčia vaizdo įrašo ID, trukmę ir pasirinktą kalbą neoficialiai Yandex vertimo užkadriniu balsu paslaugai. Pagal numatymą išjungta.
    Hold to Double Playback Speed: Laikykite tarpo klavišą arba kairįjį pelės mygtuką virš leistuvo, kad laikinai padvigubintumėte dabartinį atkūrimo greitį.
    Ambient Mode: Sulieja vaizdo įrašo spalvas su sritimi aplink leistuvą.
    Default Volume: Nepasiekiama, kol įjungtas garsumo įsiminimas. Išjunkite garsumo įsiminimą, kad nustatytumėte vienodą pradinį kiekvieno vaizdo įrašo garsumą.
    Parallel Segment Loading: |
      Kiek vaizdo ir garso segmentų vienu metu iš anksto įkelti prieš atkūrimą.
      Didesnės reikšmės gali padėti esant lėtam ar nestabiliam ryšiui, bet naudoja daugiau pralaidumo ir atminties.
      Dėl jų Auto taip pat gali nepakankamai įvertinti ryšio greitį ir pasirinkti prastesnę kokybę.
      Srautai, apriboti iki vienos užklausos vienu metu, nepaiso šio nustatymo.
  External Player Settings:
    Ignore Default Arguments: Išoriniam leistuvui nesiųsti jokių numatytųjų argumentų, išskyrus vaizdo įrašo URL (pvz., atkūrimo greitį, grojaraščio URL ir kt.). Pasirinktiniai argumentai vis tiek bus perduoti.
  Download Settings:
    Download Folder: Vaizdo įrašai išsaugomi šiame aplanke. Palikite tuščią, jei norite naudoti sistemos atsisiuntimų aplanką.
    Global Additional yt-dlp Arguments: Papildomi komandų eilutės argumentai, perduodami yt-dlp kiekvienam atsisiuntimui, pavyzdžiui, --cookies-from-browser firefox.
    Concurrent Downloads: Didžiausias vienu metu vykdomų yt-dlp užduočių skaičius.
    Bandwidth Limit: Apriboja bendrą eilės perdavimo spartą, paskirstant šį limitą vienu metu vykdomoms užduotims. Jei apribojimo nereikia, įveskite 0.
  External Software Settings:
    yt-dlp Source: OpenTubeX gali naudoti sistemoje įdiegtą yt-dlp arba atsisiųsti ir tvarkyti savo yt-dlp kopiją, saugomą naudotojo duomenų kataloge.
    yt-dlp Channel: Pasirinkite, kurį yt-dlp leidimų kanalą OpenTubeX atsisiųs ir tvarkys. Daugumai naudotojų rekomenduojamas stabilus kanalas.
    FFmpeg Source: OpenTubeX gali naudoti sistemoje įdiegtus FFmpeg ir FFprobe arba atsisiųsti ir tvarkyti savo statines versijas, saugomas naudotojo duomenų kataloge.
    Managed Tool Updates: Pasirinkite, ar programos tvarkomi įrankiai bus atnaujinami automatiškai, prieš atnaujinant bus klausiama, ar jie bus atnaujinami tik rankiniais mygtukais. Trūkstami įrankiai prireikus vis tiek atsisiunčiami.
    yt-dlp Executable Path: Pagal numatymą OpenTubeX laikys, kad yt-dlp galima rasti naudojant PATH aplinkos kintamąjį. Jei reikia, čia galima nurodyti pasirinktinį kelią.
    Cookie Source: Pasirinkite, ar autentifikuotam atkūrimui yt-dlp turi skaityti Netscape slapukų failą, ar įdiegtos naršyklės slapukus.
    Cookie File: Pasirinkite Netscape formato slapukų failą autentifikuotam atkūrimui.
    Browser for Cookies: Naršyklių palaikymo informacija gaunama iš pasirinkto yt-dlp vykdomojo failo. Paprašius autentifikuoto atkūrimo, OpenTubeX nurodo yt-dlp nuskaityti šią naršyklę.
    Browser Profile: Pasirinktinis naršyklės profilio pavadinimas arba aplankas. Palikite tuščią, jei norite naudoti paskutinį atvertą profilį.
    Always Use Cookies: Naudoti sukonfigūruotus slapukus kaskart, kai yt-dlp išgauna srautus. Tai nepakeičia srautų išgavimo būdo į yt-dlp. Pasirinkus yt-dlp gali tapti pasiekiami tik paskyrai skirti formatai, įskaitant didesnę YouTube Premium spartą, jei paskyra turi prieigą.
    FFmpeg Executable Path: FFmpeg reikalingas atskiriems vaizdo ir garso srautams sujungti bei garsui konvertuoti. Pagal numatymą OpenTubeX laikys, kad FFmpeg galima rasti naudojant PATH aplinkos kintamąjį. Jei reikia, čia galima nurodyti pasirinktinį kelią.
  Distraction Free Settings:
    Shorten View Counts: Sutrumpintai rodo peržiūrų ir komentarų teigiamų įvertinimų skaičius, kuriuos YouTube jau suapvalino, pvz., 14 tūkst. vietoje 14 000. Tikslūs skaičiai visada rodomi nesutrumpinti.
    Hide Channels: Įveskite kanalo ID, kad visi vaizdo įrašai, grojaraščiai ir pats kanalas nebūtų rodomi paieškoje, tarp populiarėjančių, populiariausių ir rekomenduojamų elementų. Įvestas kanalo ID turi tiksliai sutapti, taip pat skiriamos didžiosios ir mažosios raidės.
    Hide Subscriptions Live: Šį nustatymą pakeičia visai programai taikomas nustatymas „{appWideSetting}“, esantis „{settingsSection}“ skiltyje „{subsection}“
    Hide Videos, Playlists and Channels Containing Text: Įveskite žodį, žodžio dalį arba frazę (didžiosios ir mažosios raidės neskiriamos), kad visoje OpenTubeX nebūtų rodomi vaizdo įrašai, grojaraščiai ir kanalai, kurių originaliuose pavadinimuose yra šis tekstas. Filtras netaikomas tik istorijai, jūsų grojaraščiams ir grojaraščiuose esantiems vaizdo įrašams.
    Hide Videos on Watch: Prenumeratų ir kanalų puslapių kortelėse Vaizdo įrašai, Shorts ir Tiesiogiai slepia peržiūrėtus vaizdo įrašus. Tai neturi įtakos kanalų puslapių kortelei Pradžia
  Subscription Settings:
    Fetch Feed on Startup: Įjungus OpenTubeX automatiškai gaus prenumeratų sklaidos kanalą paleidžiant programą ir atvėrus naują langą.
    Show New Content Feed: Rodo kortelę Nauja su prenumeratų sklaidos kanalo elementais, kurių nebuvo gaunant ankstesnį kartą.
    Show New Content Indicators: Šalia prenumeratų sklaidos kanalo elementų, kurių nebuvo gaunant ankstesnį kartą, rodo mažą tašką.
    Show Scheduled Live Streams / Premieres First: Būsimas tiesiogines transliacijas ir premjeras rodo prenumeratų sklaidos kanalo viršuje. Išjungus iki pradžios jos lieka ten, kur buvo paskelbtos. Išjungę vieną kartą atnaujinkite prenumeratų sklaidos kanalą, kad gautumėte esamų suplanuotų elementų paskelbimo datas.
    Auto Refresh Interval: Kaip dažnai OpenTubeX automatiškai atnaujina prenumeratų sklaidos kanalą, kol programa atverta.
  Theme Settings:
    Show Progress as Notification: Vietoje bendros eigos juostos rodo nuolatinį pranešimą su tikralaike foninių operacijų, pvz., prenumeratų atnaujinimo ir tvarkomų įrankių atsisiuntimo, eiga.
    Always Show Scrollbars: Slinkties juostos visada lieka matomos. Išjungus jos netrukus išblėsta nustojus judinti pelę ir vėl pasirodo vos ją pajudinus.
    Scroll Speed: Keičia, kiek paslenka pelės ratuko ir jutiklinio kilimėlio slinkimo gestai.
    Use Fixed Tab Width: Visoms horizontaliosios kortelių juostos kortelėms nustato vienodą plotį, užuot pritaikius jį prie pavadinimo.
    Use Grid Player Menu: Vaizdo leistuvo nustatymų meniu elementus išdėsto plytelių tinkleliu, o ne eilučių sąrašu.
  SponsorBlock Settings:
    UseDeArrowTitles: Vaizdo įrašų pavadinimus pakeisti naudotojų pateiktais DeArrow pavadinimais.
    UseDeArrowThumbnails: Vaizdo įrašų miniatiūras pakeisti DeArrow miniatiūromis.
