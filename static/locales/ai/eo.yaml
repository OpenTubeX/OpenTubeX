  API Error (Click to copy): Eraro de Yattee-servilo (alklaku por kopii)
  Errors:
    Invalid credentials: La Yattee-servilo rifuzis la uzantnomon aŭ pasvorton. Kontrolu ilin en Agordoj → Altnivela.
    Rate limited: La Yattee-servilo blokas ensalutojn post tro multaj malsukcesaj provoj. Provu denove poste.
    Streams not relayed: La Yattee-servilo ne plusendis la fluojn de ĉi tiu videaĵo. Dum videaĵoj estas prokurataj tra la servilo, OpenTubeX ne konektiĝas rekte al YouTube.
    Not configured: Enigu la URL de via Yattee-servilo en Agordoj → Altnivela.
    HTTPS required: Android povas ludi videaĵojn nur de Yattee-serviloj, kiuj uzas HTTPS.
    Streams unavailable: Ne eblis ŝargi la fluojn de ĉi tiu videaĵo el la Yattee-servilo. Uzu "Kontroli konekton" en Agordoj → Altnivela por kontroli la servilon.
  Unsupported page: Ĉi tiu paĝo ne disponeblas kun la Yattee-servilo. Ŝaltu “{fallbackSetting}” por ŝargi ĝin per la loka API.
  Posts unavailable: Yattee-serviloj ne provizas afiŝojn. Ŝaltu “{fallbackSetting}” por ŝargi ilin per la loka API.
