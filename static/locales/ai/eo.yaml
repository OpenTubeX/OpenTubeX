Tooltips:
  Experimental Settings:
    Faster Subscription Refresh: "Unue kontrolas la RSS-fluon de ĉiu kanalo kaj ŝargas videojn, Shorts kaj rektajn elsendojn nur de kanaloj kun novaj alŝutoj. Aŭtomataj aktualigoj ankaŭ preterlasas kanalojn ŝargitajn en la lastaj 10 minutoj. Por kanaloj sen novaj alŝutoj, spektokvantoj, forigitaj videoj kaj ŝanĝitaj titoloj ĝisdatiĝas nur ĉiujn kelkajn horojn, kaj novaj alŝutoj eble aperos poste, kiam la RSS-fluo malfruas. Ne disponebla kun la Invidious-API."
  General Settings:
    Built-in Streams: |
      Aŭtomata ludas la plimulton de videoj per la visionOS-kliento de YouTube, kiu komenciĝas pli rapide kaj subtenas aŭtomatan kvaliton. Rektaj elsendoj kaj videoj, kiujn ĝi ne povas ludi, uzas SABR.
      Nur SABR ĉiam uzas la retan klienton de YouTube, kiu komenciĝas pli malrapide kaj ne havas aŭtomatan kvaliton.
    Title Lines: "Mallongigas titolojn de videoj kaj ludlistoj en listoj kaj kradoj al la elektita nombro de linioj kun tripunkto, por pli unuformaj kartoj. Ŝvebigu la musmontrilon super titolo por vidi ĝin tute."
    Preferred Video Codec: |
      Aŭtomata preferas kodekojn, kiujn via aparato povas malkodi per aparataro.
      AV1: la plej bona kvalito por la malplej da datumoj, sed ne ĉiu videaĵo havas ĝin. Sen aparatara malkodado, ĝi povas malplenigi la baterion aŭ perdi bildojn.
      VP9: ekvilibro inter efikeco kaj kongrueco, kutime disponebla ĝis la plej alta distingivo.
      H.264: la plej facile malkodebla en preskaŭ ĉiu aparato, sed ĝi uzas pli da datumoj kaj kutime ĉesas je 1080p.
      Ŝanĝoj validas por la sekva videaĵo. Se la preferata kodeko ne disponeblas, alia estas uzata.
    Yattee Server: La yattee-server-servilo, el kiu OpenTubeX ŝargas videaĵojn, kanalojn, ludlistojn kaj serĉrezultojn. La uzantnomo kaj pasvorto estas konservataj nur en ĉi tiu aparato.
    Proxy Videos Through Yattee Server: Plusendas video- kaj sonfluojn tra la servilo. Lasu ĉi tion ŝaltita krom se la servilo kunhavas vian interretan konekton, ĉar YouTube servas fluojn nur al la adreso, kiu petis ilin. Bildetoj ĉiam ŝargiĝas rekte de YouTube.
    Enable Tabs: Tenas la aktualan paĝon malfermita. Aliaj langetoj estas konservataj ĝis la aplikaĵo restartas; reŝaltu langetojn por restarigi ilin.
    Data Saver Thumbnails: Uzi bildetojn kun pli malalta distingivo por malpliigi datumuzon.
    Use AI Translation Completions: Plenigi mankojn en homaj tradukoj per teksto generita de AI. Homaj tradukoj ĉiam havas prioritaton.
    Update Relative Timestamps: Ĝisdatigas relativajn tempindikojn tra la tuta aplikaĵo dum paĝo restas malfermita. Kiam malŝaltita, ili ĝisdatiĝas nur post reŝargo aŭ revizito de la paĝo.
    Automatically switch stream extraction methods: Provi yt-dlp se la integrita ludado malsukcesas, aŭ la integritan ludadon se yt-dlp malsukcesas.
    Stream Extraction Method: |
      Elektu kiel OpenTubeX akiras videofluojn. yt-dlp devas esti disponebla kiam elektita.
      Videaĵoj eble bezonos pli longe por komenciĝi kiam oni uzas yt-dlp.
    Avoid translation: |
      Malŝalti la aŭtomatan tradukadon de YouTube por titolo, priskribo kaj ĉapitroj de videaĵo.
      „Tuta aplikaĵo“ ankaŭ montras nomojn kaj priskribojn de kanaloj en ilia originala lingvo.
      Tro multaj petoj, ekzemple venigado de videaĵaj titoloj tra listoj, povas provizore
      malbonigi la fidindecon de la aplikaĵo.
    Always Use Backup Media Server: Fluigas videaĵojn el la rezerva servilo, kiun YouTube nomas, anstataŭ el la asignita, ekzemple kiam la kaŝmemoro de via interreta provizanto ofte estas malrapida. Alie OpenTubeX ŝanĝas nur kiam la asignita servilo ne respondas.
    Show Thumbnail Previews: Montri movbildajn antaŭrigardojn kiam la kursoro estas super bildetoj de videaĵoj.
    Startup Behavior: |
      Elektu kion OpenTubeX faras kiam ĝi startas.
      Ŝargi ĉiujn langetojn tuj restarigas ĉiun konservitan langeton, sed fonaj langetoj ne aŭtomate ludos videaĵojn.
      Ŝargi antaŭe ŝargitajn langetojn reŝargas la langetojn, kiuj estis ŝargitaj kiam OpenTubeX fermiĝis, kaj lasas la aliajn malŝargitaj.
      Ŝargi la lastan aktivan langeton restarigas la antaŭan seancon kun la aliaj langetoj malfermitaj sed malŝargitaj; ili ŝargiĝas kiam vi alklakas ilin.
      Komenci kun malplena seanco preterlasas la konservitajn langetojn kaj malfermas novan fenestron.
    Close Window With Last Tab: Kiam malŝaltita, fermi la lastan langeton anstataŭe malfermas novan langeton, do la fenestro restas malfermita ĝis vi fermas ĝin.
    Remember Tab Navigation History: La reena kaj antaŭena navigada historio de ĉiu langeto estas konservata kaj restarigata kiam OpenTubeX restartas.
    Notifications: Elektu kiel OpenTubeX sciigas vin pri rektaj elsendoj, novaj alŝutoj kaj aŭtomataj elŝutoj. Kun Sistemo kaj en la aplikaĵo, sciigoj aperas en OpenTubeX dum vi uzas ĝin kaj alie kiel sistemaj sciigoj, kaj la sonorilo konservas ilin. Malŝaltitaj ankaŭ kaŝas la sciigajn agordojn.
    Ignore System Haptics Setting: Vibri ĉe longaj premoj kaj gestoj, eĉ kiam tuŝa reago estas malŝaltita en la agordoj de Android.
  Proxy Settings:
    IP Block Recovery Script Path: Vojo al skriptodosiero rulota kiam IP-bloko estas detektita. OpenTubeX atendas ĝis ĝi finiĝas, poste reŝargas la videaĵon. Se retropaŝo estas ŝaltita, ĝi ruliĝas nur kiam ankaŭ la retropaŝo malsukcesas.
  Player Settings:
    Rewind on Resume: "Saltas tiom da sekundoj malantaŭen kiam vi daŭrigas paŭzitan videon, por ke vi revidu la lastajn momentojn. Agordu al 0 por malŝalti."
    Minimum Pause Before Rewinding: "Malantaŭeniras nur kiam la video estis paŭzita almenaŭ tiom longe. Agordu al 0 por malantaŭeniri post ĉiu paŭzo."
    Enable Caption Translations: Kiam ŝaltita, la apudskriba butono kaj la fulmoklavo C preferas aŭtomate tradukitan trakon en la preferata apudskriba lingvo, kiam la videaĵo ne provizas kongruan originalan trakon.
    Use Quick Playback Speed Bar: Montras breton de rapidaj ludrapidoj en la ludilaj regiloj dekstre. Se permana konservado de ludrapido po kanalo estas ŝaltita, la breto ankaŭ enhavas la butonon por konservi la rapidon por la aktuala kanalo.
    Multiply Seek Interval by Playback Rate: Kiam ŝaltita, saltintervaloj (sagoklavoj kaj J/L) estas multobligitaj per la aktuala ludrapido. Kiam malŝaltita, saltintervaloj restas konstantaj sendepende de la ludrapido.
    Show Playback Rate Adjusted Timestamp: Kiam ŝaltita kaj la ludrapido malsamas ol 1x, la ludilo montras tempindikojn alĝustigitajn laŭ ludrapido inter krampoj post la normala tempindiko.
    Use YouTube-style Shorts: Montras videaĵetojn en vertikala krado sur abonaj kaj kanalaj paĝoj kaj uzas ludilon de videaĵetoj laŭ stilo de YouTube.
    Loop Shorts: Kiam ŝaltita, videaĵetoj rekomenciĝas aŭtomate. Kiam malŝaltita, videaĵetoj haltas ĉe la fino kaj montras butonon por reludi.
    Show Skip Silence Toggle: Montras ŝaltilon por salti silenton en la agorda menuo de la ludilo.
    Enable Skip Silence by Default: Ŝaltas silento-saltadon por novaj langetoj. Ŝanĝi ĝin en unu langeto ne influas aliajn langetojn.
    Enable Video Zoom: Montras la zoman regilon en la agorda menuo de la ludilo kaj ŝaltas ĝiajn fulmoklavojn kaj panoramajn regilojn.
    Enable Seek History: Memoras de kie vi saltis en ĉiu videaĵo ĝis la aplikaĵo fermiĝas. Montras la liston de historio de saltoj en la agorda menuo de la ludilo kaj ŝaltas ĝiajn fulmoklavojn.
    Show Seek Bar Filmstrip: "Treni la tenilon de la serĉbreto montras strion de kadroj ĉirkaŭ la loko, kien vi saltos, kaj tiri supren sur ĝin ebligas precizan saltadon. Se malŝaltita, trenado montras unu bildeton, kiel dum ŝvebado."
    Pause on Stream Recovery: Kiam la videofluo malsukcesas kaj la ludilo reŝargas ĝin aŭ ŝanĝas al alia formo aŭ motoro, paŭzigi la ludadon kaj teni la eraron supre de la ludilo ĝis vi fermas ĝin. Kiam malŝaltita, la ludado daŭras kaj la eraro aperas mallonge kiel sciigo.
    Continue Playback When Screen Is Locked: Daŭrigas la sonludadon fone kaj provizas Android-aŭdvidajn regilojn. Malŝaltu ĉi tion por paŭzigi kiam la aplikaĵo ne plu estas videbla.
    Voice-over Translation: Sendas la identigilon, daŭron kaj elektitan lingvon de la videaĵo al la neoficiala voĉtraduka servo de Yandex kiam vi petas tradukon. Defaŭlte malŝaltita.
    Hold to Speed Up: Tenu premita la spacoklavon aŭ la maldekstran musbutonon super la ludilo por provizore multobligi la aktualan ludrapidon per la elektita valoro.
    Ambient Mode: Miksas la kolorojn de la videaĵo en la areon ĉirkaŭ la ludilo.
    Mono Audio: Ludas la maldekstran kaj dekstran sonkanalojn en ambaŭ oreloj. Uzu ĝin kiam la sono de videaĵo venas nur el unu flanko de viaj kapaŭskultiloj.
    Normalize Loudness: 'Mallaŭtigas videojn, kiuj estas pli laŭtaj ol la plimulto, por ke la laŭteco ne saltu inter videoj. Mallaŭtaj videoj konservas sian laŭtecon. Funkcias nur por videoj ŝargitaj per la Loka API.'
    Default Volume: Malŝaltita dum "Memori laŭtecon" estas ŝaltita. Malŝaltu "Memori laŭtecon" por difini fiksan startan laŭtecon por ĉiu videaĵo.
    Parallel Segment Loading: |
      Kiom da video- kaj sonsegmentoj ŝargi samtempe antaŭ la ludado.
      Pli altaj valoroj povas helpi ĉe malrapidaj aŭ nestabilaj konektoj, sed uzas pli da kapacito kaj memoro.
      Ili ankaŭ povas igi la aŭtomatan reĝimon subtaksi la konektan rapidon kaj elekti pli malaltan kvaliton.
      Fluoj limigitaj al unu peto samtempe ignoras ĉi tiun agordon.
    Preload Upcoming Videos: Venigas kaj kaŝmemorigas URL-ojn de yt-dlp-fluoj por videaĵoj, kiuj povas ludiĝi sekve. La spektovico havas prioritaton super ludlistoj kaj rekomendoj.
    Upcoming Videos to Preload: La maksimuma nombro de venontaj videaĵoj, kies URL-oj de yt-dlp-fluoj estas venigataj fone.
    Concurrent Preloads: La maksimuma nombro de yt-dlp-procezoj uzataj por samtempe antaŭŝargi videaĵojn. Pli altaj valoroj uzas pli da CPU, memoro kaj reta kapacito.
    Ignore System Rotation Lock for Fullscreen: Uzi fizikan rotacion de la aparato por eniri kaj eliri el plenekrana reĝimo eĉ kiam la aŭtomata rotacio de Android estas malŝaltita.
    Ask Before Preloading Large Playlists: "Petas konfirmon antaŭ antaŭŝargi ĉiujn videaĵojn de ludlisto kun pli ol {count} videaĵoj."
  Download Settings:
    Download Folder: Videaĵoj estas konservataj en ĉi tiu dosierujo. Lasu malplena por uzi la elŝutan dosierujon de via sistemo.
    Global Additional yt-dlp Arguments: Aldonaj komandliniaj argumentoj donataj al yt-dlp por ĉiu elŝuto, ekzemple --cookies-from-browser firefox.
    Concurrent Downloads: La maksimuma nombro de yt-dlp-taskoj, kiuj povas ruliĝi samtempe.
    Bandwidth Limit: Limigas la kunigitan transigan rapidon de la vico dividante ĉi tiun limon inter samtempaj taskoj. Enigu 0 por neniu limo.
  External Software Settings:
    yt-dlp Source: OpenTubeX povas aŭ uzi la yt-dlp instalitan en via sistemo aŭ elŝuti kaj administri sian propran kopion de yt-dlp, kiu estas konservata en la dosierujo de uzantaj datumoj.
    yt-dlp Channel: Elektu kiun eldonkanalon de yt-dlp OpenTubeX elŝutas kaj administras. Stabila estas rekomendata por plej multaj uzantoj.
    FFmpeg Source: OpenTubeX povas aŭ uzi FFmpeg kaj FFprobe instalitajn en via sistemo aŭ elŝuti kaj administri siajn proprajn statikajn kompilaĵojn, kiuj estas konservataj en la dosierujo de uzantaj datumoj.
    Managed Tool Updates: Elektu ĉu administrataj iloj ĝisdatiĝas aŭtomate, demandas antaŭ ĝisdatigo aŭ nur ĝisdatiĝas per la permanaj butonoj. Mankantaj iloj ankoraŭ estas elŝutataj kiam necesas.
    yt-dlp Executable Path: Defaŭlte, OpenTubeX supozas, ke yt-dlp troveblas per la ĉirkaŭaĵa variablo PATH. Se necese, eblas difini laŭmendan vojon ĉi tie.
    Cookie Source: Elektu ĉu yt-dlp legu Netscape-kuketan dosieron aŭ kuketojn el instalita retumilo por aŭtentigita ludado.
    Cookie File: Elektu kuketan dosieron en Netscape-formo por aŭtentigita ludado.
    Browser for Cookies: Retumila subteno estas legata el la elektita plenumeblo de yt-dlp. OpenTubeX petas yt-dlp legi ĉi tiun retumilon kiam aŭtentigita ludado estas petata.
    Browser Profile: Nedeviga nomo aŭ dosierujo de retumila profilo. Lasu malplena por uzi la plej lastatempe aliritan profilon.
    Always Use Cookies: Uzi la agorditajn kuketojn por elŝutoj, subtekstoj kaj ĉiam kiam yt-dlp elĉerpas fluojn. Tio ĉi ne ŝanĝas la metodon de fluelĉerpado al yt-dlp. Kun yt-dlp elektita, formoj nur por kontoj eble disponebliĝos, inkluzive de la plibonigita bitrapido de YouTube Premium kiam la konto havas aliron.
    FFmpeg Executable Path: FFmpeg necesas por kunfandi apartajn video- kaj sonfluojn kaj por sonkonvertado. Defaŭlte, OpenTubeX supozas, ke FFmpeg troveblas per la ĉirkaŭaĵa variablo PATH. Se necese, eblas difini laŭmendan vojon ĉi tie.
    Use cookies for subtitles: Uzi la agorditajn kuketojn por subtekstoj kaj aŭtomataj tradukoj. Ankaŭ ŝaltita per "Ĉiam uzi kuketojn".
  Distraction Free Settings:
    Hide Playlist Stats: Kaŝas la nombron de videoj, la nombron de spektoj, la daton de la lasta ĝisdatigo kaj la tutan daŭron en ludlistaj paĝoj.
    Count Watch Time From: Ĉiuj aparatoj kalkulas ĉiun aparaton, kiu sinkronigas spektajn statistikojn. Ĉi tiu aparato kalkulas nur tion, kion vi spektas ĉi tie.
    When a Limit Is Reached: Paŭzigi ludadon ebligas al vi aldoni 15 minutojn aŭ ignori la limon por hodiaŭ. Kun agorda pasvorto, vi povas altigi limon nur en la agordoj.
    Grayscale: "Montras la aplikaĵon en grizaj nuancoj, por ke ĝi altiru malpli da atento. Dum dormotempo sekvas la horaron de la memorigo pri dormotempo."
    Apply Grayscale To: "Videaĵoj kaj bildoj tenas la fasadon kolora kaj grizigas enhavon kiel videaĵojn, miniaturojn kaj profilbildojn."
    Daily Watch Time Limit: Kalkulas tion, kion vi spektis hodiaŭ en ĉiuj aparatoj, kiuj sinkronigas spektajn statistikojn, inkluzive de videaĵetoj.
    Daily Shorts Limit: Kalkulas la videaĵetojn, kiujn vi spektis en ĉi tiu aparato hodiaŭ.
    Take a Break Reminder: Paŭzigas la videaĵon post tiom da spektado. Paŭzo de 10 minutoj aŭ pli rekomencigas la kalkulon.
    Bedtime Reminder: Paŭzigas la videaĵon kaj memorigas vin ĉesi spekti inter la komenca kaj fina horoj.
    Shorten View Counts: Montras nombrojn de rigardoj, komentoj kaj ŝatoj de komentoj, kiujn YouTube jam rondigis, en mallongigita formo, ekz. 14K anstataŭ 14 000. Ĝustaj nombroj ĉiam estas montrataj plene.
  Subscription Settings:
    Fetch Feed on Startup: Kiam ŝaltita, OpenTubeX aŭtomate venigos vian abonfluon je startigo kaj kiam nova fenestro malfermiĝas.
    Show New Content Feed: Montras langeton "Nova" kun eroj de la abonfluo, kiuj ne ĉeestis dum la antaŭa venigo.
    Enable RSS Feeds: Montras RSS-langeton sur la paĝo de abonoj kun la eroj de RSS- aŭ Atom-fluoj, por ke vi povu sekvi kreantojn en aliaj platformoj. Ĝiaj eroj malfermiĝas per yt-dlp.
    Show New Content Indicators: Montras malgrandan punkton apud eroj de la abonfluo, kiuj ne ĉeestis dum la antaŭa venigo.
    Show Scheduled Live Streams / Premieres First: Tenas venontajn tujelsendojn kaj premierojn supre de la abonfluo. Kiam malŝaltita, ili restas ĉe sia anonca pozicio ĝis ili komenciĝas. Aktualigu la abonfluon unufoje post malŝalto por akiri anoncajn datojn de ekzistantaj planitaj eroj.
    Auto Refresh Interval: Kiom ofte OpenTubeX aŭtomate aktualigas vian abonfluon dum la aplikaĵo estas malfermita. Ĉe Android, nenula intervalo ankaŭ aktualigas ĝin dum la aplikaĵo estas fermita.
    Refresh Subscriptions While App Is Closed: Aktualigas fluojn laŭ viaj elektitaj agordoj. Ĉe labortablo, OpenTubeX restas en la taskopleto ĝis vi eliras. Android regas kiam fonaj aktualigoj ruliĝas.
    Notify About New Uploads: Montras sistemajn sciigojn en ĉi tiu aparato por kanaloj, kies sciigojn vi ŝaltis en iliaj abonaj agordoj. OpenTubeX kontrolas novan enhavon kiam abonoj aktualiĝas, do elektu intervalon de aŭtomata aktualigo. Por esti sciigita dum la aplikaĵo estas fermita, ankaŭ ŝaltu aktualigadon dum la aplikaĵo estas fermita.
    RSS Feeds Auto Refresh Interval: Kiom ofte OpenTubeX aŭtomate aktualigas viajn RSS-fluojn dum la aplikaĵo estas malfermita.
  Theme Settings:
    Only Show Important Notifications: Kaŝas sciigojn en la aplikaĵo, kiuj nur konfirmas agon aŭ raportas staton. Eraroj, avertoj, memorigoj, kiujn vi agordis, kaj sciigoj, kiuj proponas agon, ekzemple Malfari, ankoraŭ aperas. Fona progreso, ekzemple aktualigo de abonoj, montriĝas en la ĝenerala progresbreto anstataŭ kiel sciigo. Sistemaj sciigoj ne estas tuŝitaj.
    Thumbnail Size: Skalas bildetojn de videaĵoj en kradoj kaj listoj. Kradoj kun fiksa nombro de kolumnoj aŭ la aranĝo "Plena larĝo" anstataŭe plenigas ĉiun vicon, do tie ĝi ŝanĝas nur listajn bildetojn kaj videaĵetojn. Telefongrandaj fenestroj limigas kradajn bildetojn al 100%.
    Playlist Thumbnail Size: Skalas bildetojn de videaĵoj sur ludlistaj paĝoj. Kradoj kun fiksa nombro de kolumnoj aŭ la aranĝo "Plena larĝo" anstataŭe plenigas ĉiun vicon, do tie ĝi ŝanĝas nur listajn bildetojn kaj videaĵetojn. Telefongrandaj fenestroj limigas kradajn bildetojn al 100%.
    Show Progress as Notification: Montras daŭran sciigon kun tuja progreso por fonaj operacioj, ekzemple aktualigoj de abonoj kaj elŝutoj de administrataj iloj, anstataŭ uzi la ĝeneralan progresbreton.
    Always Show Scrollbars: Tenas la rulumbretojn ĉiam videblaj. Kiam malŝaltita, ili forvelkas baldaŭ post kiam vi ĉesas movi la muson kaj reaperas tuj kiam vi movas ĝin denove.
    Scroll Speed: Ŝanĝas kiom malproksimen rulumas gestoj de musrado kaj tuŝplato.
    Visible Search Suggestions: Difinas kiom da eroj de serĉa historio kaj proponoj la serĉobreto montras antaŭ ol ĝia listo rulumiĝas. La listo neniam etendiĝas preter la malsupro de la fenestro.
    Use Fixed Tab Width: Donas al ĉiu langeto en la horizontala langetobreto la saman larĝon anstataŭ grandigi ilin laŭ ilia titolo.
    Use Custom Title Bar: Anstataŭigas la sisteman titolbreton per la langetobreto, aŭ per la supra navigado kiam langetoj ne estas supre, por ŝpari vertikalan spacon. La fenestraj regiloj aperas en la angulo de tiu breto.
    Use Grid Player Menu: Aranĝas la agordan menuon de la videaĵa ludilo kiel kradon de kaheloj anstataŭ listo de vicoj.
    Compact Settings Categories: Kaŝas priskribojn kaj malpliigas la altecon de agordaj kategorioj.
    Modal Backdrop: "Agordas, kiel la aplikaĵo aspektas malantaŭ dialogoj kaj menuoj. Malklarigo povas esti malrapida en malpli potencaj aparatoj."
    Click Scrollbar Track to Scroll: "Klako sur rulumskalo ekster ĝia tenilo rulumas proksimume unu paĝon al la direkto de la klako. Dum ĉi tio estas ŝaltita, videbla rulumskalo kaptas klakojn celitajn al eroj sub ĝi. La rulumskalo de la langeta breto ĉiam funkcias tiel."
  SponsorBlock Settings:
    Always Show DeArrow Badge: Konservi la butonon de DeArrow videbla ĉe videaĵoj, kies titolon aŭ bildeton anstataŭigis DeArrow, anstataŭ nur kiam la kursoro estas super ili.
