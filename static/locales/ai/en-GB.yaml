Tooltips:
  General Settings:
    Use AI Translation Completions: Fill gaps in human translations with AI-generated text. Human translations always take priority.
    Update Relative Timestamps: Updates relative timestamps throughout the app while a page remains open. When disabled, they update only after reloading or revisiting the page.
    Stream Extraction Method: |
      Choose how OpenTubeX obtains video streams. yt-dlp must be available when selected.
      Videos may take longer to start when using yt-dlp.
      Built-in does not support seeking for livestreams and premieres.
    Avoid translation: |
      Disable YouTube's autotranslation of title, description and chapters of a video.
      Too many requests, such as fetching video titles across lists, may temporarily
      impact app reliability.
    Show Thumbnail Previews: Show animated previews when hovering over video thumbnails.
    Startup Behavior: |
      Choose what OpenTubeX does when it starts.
      Load all tabs restores every saved tab immediately, but background tabs will not autoplay videos.
      Load previously loaded tabs reloads the tabs that were loaded when OpenTubeX closed and keeps the others unloaded.
      Load last active tab restores the previous session with the other tabs opened but unloaded; they load when you click them.
      Start with an empty session skips the saved tabs and opens a fresh window.
    Remember Tab Navigation History: Each tab's back and forward navigation history is saved and restored when OpenTubeX restarts.
  Proxy Settings:
    IP Block Recovery Script Path: Script file path to run when an IP block is detected. OpenTubeX waits for it to finish, then reloads the video. If fallback is enabled, it runs only when fallback also fails.
  Player Settings:
    Enable Caption Translations: When enabled, the captions button and C shortcut prefer an automatically translated track in the preferred caption language when the video does not provide a matching original track.
    Use Quick Playback Speed Bar: Shows a quick playback speed bar in the player controls on the right side. If manual per-channel playback speed saving is enabled, the bar also includes the button to save the speed for the current channel.
    Multiply Seek Interval by Playback Rate: When enabled, seek intervals (arrow keys and J/L) are multiplied by the current playback rate. When disabled, seek intervals remain constant regardless of playback rate.
    Show Playback Rate Adjusted Timestamp: When enabled and playback speed differs from 1x, the player shows playback-rate-adjusted timestamps in parentheses after the normal timestamp display.
    Use YouTube-style Shorts: Displays Shorts in a portrait grid on subscription and channel pages and uses the YouTube-style Shorts player.
    Loop Shorts: When enabled, Shorts restart automatically. When disabled, Shorts stop at the end and show a replay button.
    Show Skip Silence Toggle: Shows an on/off toggle for skipping silence in the player's settings menu.
    Enable Skip Silence by Default: Enables silence skipping for new tabs. Changing it in one tab does not affect other tabs.
    Enable Video Zoom: Shows the Zoom control in the player's settings menu and enables its keyboard shortcuts and panning controls.
    Voice-over Translation: Sends the video ID, duration, and selected language to the unofficial Yandex voice-over translation service when you request a translation. Disabled by default.
    Hold to Double Playback Speed: Hold the Spacebar or left mouse button over the player to temporarily double the current playback speed.
    Ambient Mode: Blends the video's colours into the area around the player.
    Default Volume: Disabled while Remember Volume is enabled. Turn off Remember Volume to set a fixed startup volume for each video.
    Parallel Segment Loading: |
      How many video and audio segments to load at once ahead of playback.
      Higher values may help on slow or unstable connections, but use more bandwidth and memory.
      They may also make Auto underestimate the connection speed and select a lower quality.
      Streams limited to one request at a time ignore this setting.
    Preload Upcoming Videos: "Fetches and caches yt-dlp stream URLs for the videos that can play next. The queue takes priority over playlists and recommendations."
    Upcoming Videos to Preload: "The maximum number of upcoming videos whose yt-dlp stream URLs are fetched in the background."
  Download Settings:
    Download Folder: Videos are saved to this folder. Leave blank to use your system's Downloads folder.
    Global Additional yt-dlp Arguments: Additional command line arguments passed to yt-dlp for every download, for example --cookies-from-browser firefox.
    Concurrent Downloads: The maximum number of yt-dlp jobs that may run at once.
    Bandwidth Limit: Caps the queue's combined transfer rate by dividing this limit between concurrent jobs. Enter 0 for no limit.
  External Software Settings:
    yt-dlp Source: OpenTubeX can either use the yt-dlp installed on your system or download and manage its own copy of yt-dlp, which is stored in the user data directory.
    yt-dlp Channel: Select which yt-dlp release channel OpenTubeX downloads and manages. Stable is recommended for most users.
    FFmpeg Source: OpenTubeX can either use FFmpeg and FFprobe installed on your system or download and manage its own static builds, which are stored in the user data directory.
    Managed Tool Updates: Choose whether managed tools update automatically, ask before updating, or only update through the manual buttons. Missing tools are still downloaded when required.
    yt-dlp Executable Path: By default, OpenTubeX will assume that yt-dlp can be found via the PATH environment variable. If needed, a custom path can be set here.
    Cookie Source: Choose whether yt-dlp should read a Netscape cookie file or cookies from an installed browser for authenticated playback.
    Cookie File: Select a Netscape-formatted cookie file for authenticated playback.
    Browser for Cookies: Browser support is read from the selected yt-dlp executable. OpenTubeX asks yt-dlp to read this browser when authenticated playback is requested.
    Browser Profile: Optional browser profile name or folder. Leave blank to use the most recently accessed profile.
    Always Use Cookies: Use the configured cookies whenever yt-dlp extracts streams. This does not switch the stream extraction method to yt-dlp. With yt-dlp selected, account-only formats may become available, including YouTube Premium's enhanced bitrate when the account has access.
    FFmpeg Executable Path: FFmpeg is required for merging separate video and audio streams and for audio conversion. By default, OpenTubeX will assume that FFmpeg can be found via the PATH environment variable. If needed, a custom path can be set here.
  Distraction Free Settings:
    Shorten View Counts: Shows view and comment like counts that YouTube has already rounded in a shortened form, e.g. 14K instead of 14,000. Exact counts are always shown in full.
  Subscription Settings:
    Show New Content Feed: Shows a New tab containing subscription feed items that were not present during the previous fetch.
    Show New Content Indicators: Shows a small dot beside subscription feed items that were not present during the previous fetch.
    Show Scheduled Live Streams / Premieres First: Keeps upcoming live streams and premieres at the top of the subscription feed. When disabled, they remain at their announcement position until they start. Refresh the subscription feed once after disabling to retrieve announcement dates for existing scheduled entries.
    Auto Refresh Interval: "How often OpenTubeX automatically refreshes your subscription feed while the app is open. On Android, a nonzero interval also refreshes it while the app is closed."
    Refresh Subscriptions While App Is Closed: "Lets Android refresh subscription feeds at their selected intervals while OpenTubeX is closed. Turn this off to limit automatic refreshes to times when the app is open."
  Theme Settings:
    Show Progress as Notification: Shows a persistent notification with live progress for background operations, such as subscription refreshes and managed tool downloads, instead of using the global progress bar.
    Always Show Scrollbars: Keeps the scrollbars visible at all times. When disabled, they fade out shortly after you stop moving the mouse and reappear as soon as you move it again.
    Scroll Speed: Changes how far mouse-wheel and touchpad wheel gestures scroll.
    Use Fixed Tab Width: Gives every tab in the horizontal tab bar the same width instead of sizing them to their title.
    Use Grid Player Menu: Arranges the video player's settings menu as a grid of tiles instead of a list of rows.
