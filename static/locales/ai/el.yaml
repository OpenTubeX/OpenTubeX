    Subscriptions And Profiles Description: Αποθηκεύει τα κανάλια συνδρομών, τα ονόματα προφίλ και τις συμμετοχές σε προφίλ.
    Subscriptions And Profiles Effect: Όλες οι συνδρομές και τα πρόσθετα προφίλ θα διαγραφούν οριστικά. Θα εκκαθαριστούν επίσης τα δεδομένα κρυφής μνήμης ροών.
    Playlists Description: Αποθηκεύει ονόματα και περιγραφές λιστών αναπαραγωγής, καθώς και αποθηκευμένα βίντεο.
    Playlists Effect: Κάθε λίστα αναπαραγωγής και η λίστα αποθηκευμένων βίντεό της θα διαγραφούν οριστικά. Τα ληφθέντα αρχεία πολυμέσων θα διατηρηθούν.
