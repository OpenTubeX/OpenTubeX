    Playback Caches Description: Αποθηκεύει URL ροών του yt-dlp μεταξύ συνεδριών της εφαρμογής, καθώς και αρχεία του προγράμματος αναπαραγωγής YouTube. Η κρυφή μνήμη URL ισχύει μόνο για ροές που ανακτήθηκαν με το yt-dlp.
