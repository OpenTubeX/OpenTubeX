    Clear Playback Caches Confirmation: Εκκαθάριση των κρυφών μνημών yt-dlp και προγράμματος αναπαραγωγής;
    Playback Caches Effect: Το επόμενο αίτημα τοπικής αναπαραγωγής μπορεί να διαρκέσει περισσότερο, μέχρι να ανακτηθούν ξανά τα δεδομένα ροής και προγράμματος αναπαραγωγής.
