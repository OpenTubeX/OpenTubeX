Tooltips:
  General Settings:
    Use AI Translation Completions: Συμπληρώνει τα κενά στις ανθρώπινες μεταφράσεις με κείμενο παραγόμενο από AI. Οι ανθρώπινες μεταφράσεις έχουν πάντα προτεραιότητα.
    Update Relative Timestamps: Ενημερώνει τις σχετικές χρονικές ενδείξεις σε όλη την εφαρμογή όσο μια σελίδα παραμένει ανοιχτή. Όταν είναι απενεργοποιημένο, ενημερώνονται μόνο μετά από επαναφόρτωση ή νέα επίσκεψη στη σελίδα.
    Stream Extraction Method: |
      Επιλέξτε τον τρόπο με τον οποίο το OpenTubeX αποκτά τις ροές βίντεο. Αν επιλέξετε το yt-dlp, πρέπει να είναι διαθέσιμο.
      Με τη χρήση του yt-dlp, τα βίντεο μπορεί να καθυστερούν περισσότερο να ξεκινήσουν.
      Η ενσωματωμένη μέθοδος δεν υποστηρίζει μετακίνηση σε άλλο χρονικό σημείο ζωντανών μεταδόσεων και πρεμιερών.
    Avoid translation: |
      Απενεργοποιεί την αυτόματη μετάφραση του τίτλου, της περιγραφής και των κεφαλαίων ενός βίντεο από το YouTube.
      Πάρα πολλά αιτήματα, όπως η ανάκτηση τίτλων βίντεο από λίστες, μπορεί να επηρεάσουν προσωρινά
      την αξιοπιστία της εφαρμογής.
    Show Thumbnail Previews: Εμφανίζει κινούμενες προεπισκοπήσεις κατά την κατάδειξη μικρογραφιών βίντεο.
    Startup Behavior: |
      Επιλέξτε τι θα κάνει το OpenTubeX κατά την εκκίνηση.
      Η φόρτωση όλων των καρτελών επαναφέρει αμέσως κάθε αποθηκευμένη καρτέλα, αλλά τα βίντεο δεν θα αναπαράγονται αυτόματα στις καρτέλες παρασκηνίου.
      Η φόρτωση των καρτελών που ήταν ήδη φορτωμένες επαναφορτώνει όσες ήταν φορτωμένες όταν έκλεισε το OpenTubeX και διατηρεί τις υπόλοιπες αποφορτωμένες.
      Η φόρτωση της τελευταίας ενεργής καρτέλας επαναφέρει την προηγούμενη συνεδρία με τις άλλες καρτέλες ανοιχτές αλλά αποφορτωμένες. Φορτώνονται όταν κάνετε κλικ σε αυτές.
      Η έναρξη με κενή συνεδρία παραλείπει τις αποθηκευμένες καρτέλες και ανοίγει ένα νέο παράθυρο.
    Remember Tab Navigation History: Το ιστορικό πλοήγησης προς τα πίσω και προς τα εμπρός κάθε καρτέλας αποθηκεύεται και επαναφέρεται κατά την επανεκκίνηση του OpenTubeX.
  Proxy Settings:
    IP Block Recovery Script Path: Διαδρομή του αρχείου δέσμης ενεργειών που θα εκτελείται όταν εντοπίζεται αποκλεισμός IP. Το OpenTubeX περιμένει να ολοκληρωθεί και έπειτα επαναφορτώνει το βίντεο. Αν είναι ενεργοποιημένη η εφεδρική χρήση συστήματος υποστήριξης, εκτελείται μόνο όταν αποτύχει και αυτή.
  Player Settings:
    Continue Playback When Screen Is Locked: 'Διατηρεί την αναπαραγωγή ήχου στο παρασκήνιο και παρέχει στοιχεία ελέγχου πολυμέσων Android. Απενεργοποιήστε το για παύση όταν η εφαρμογή δεν είναι πλέον ορατή.'
    Enable Caption Translations: Όταν είναι ενεργοποιημένο και το βίντεο δεν παρέχει αντίστοιχο πρωτότυπο κομμάτι, το κουμπί υποτίτλων και η συντόμευση C προτιμούν ένα αυτόματα μεταφρασμένο κομμάτι στην προτιμώμενη γλώσσα υποτίτλων.
    Use Quick Playback Speed Bar: Εμφανίζει μια γραμμή γρήγορης επιλογής ταχύτητας στα στοιχεία ελέγχου του προγράμματος αναπαραγωγής, στη δεξιά πλευρά. Αν είναι ενεργοποιημένη η μη αυτόματη αποθήκευση ταχύτητας αναπαραγωγής ανά κανάλι, η γραμμή περιλαμβάνει επίσης το κουμπί αποθήκευσης της ταχύτητας για το τρέχον κανάλι.
    Multiply Seek Interval by Playback Rate: Όταν είναι ενεργοποιημένο, τα διαστήματα μετακίνησης (πλήκτρα βέλους και J/L) πολλαπλασιάζονται με την τρέχουσα ταχύτητα αναπαραγωγής. Όταν είναι απενεργοποιημένο, παραμένουν σταθερά ανεξάρτητα από την ταχύτητα αναπαραγωγής.
    Show Playback Rate Adjusted Timestamp: Όταν είναι ενεργοποιημένο και η ταχύτητα αναπαραγωγής διαφέρει από 1x, το πρόγραμμα αναπαραγωγής εμφανίζει σε παρένθεση, μετά την κανονική χρονική ένδειξη, μια ένδειξη προσαρμοσμένη στην ταχύτητα αναπαραγωγής.
    Use YouTube-style Shorts: Εμφανίζει τα σύντομα βίντεο σε κατακόρυφο πλέγμα στις σελίδες συνδρομών και καναλιών και χρησιμοποιεί το πρόγραμμα αναπαραγωγής σύντομων βίντεο τύπου YouTube.
    Loop Shorts: Όταν είναι ενεργοποιημένο, τα σύντομα βίντεο ξεκινούν ξανά αυτόματα. Όταν είναι απενεργοποιημένο, σταματούν στο τέλος και εμφανίζουν κουμπί επανάληψης.
    Show Skip Silence Toggle: Εμφανίζει διακόπτη ενεργοποίησης και απενεργοποίησης της παράλειψης σιωπής στο μενού ρυθμίσεων του προγράμματος αναπαραγωγής.
    Enable Skip Silence by Default: Ενεργοποιεί την παράλειψη σιωπής για νέες καρτέλες. Η αλλαγή της σε μία καρτέλα δεν επηρεάζει τις άλλες.
    Enable Video Zoom: Εμφανίζει το στοιχείο ελέγχου μεγέθυνσης στο μενού ρυθμίσεων του προγράμματος αναπαραγωγής και ενεργοποιεί τις συντομεύσεις πληκτρολογίου και τα στοιχεία ελέγχου μετατόπισης.
    Voice-over Translation: Όταν ζητάτε μετάφραση, αποστέλλει το αναγνωριστικό, τη διάρκεια και την επιλεγμένη γλώσσα του βίντεο στην ανεπίσημη υπηρεσία μετάφρασης εκφώνησης της Yandex. Είναι απενεργοποιημένο από προεπιλογή.
    Hold to Double Playback Speed: Κρατήστε πατημένο το πλήκτρο διαστήματος ή το αριστερό κουμπί του ποντικιού πάνω από το πρόγραμμα αναπαραγωγής για να διπλασιάσετε προσωρινά την τρέχουσα ταχύτητα αναπαραγωγής.
    Ambient Mode: Αναμειγνύει τα χρώματα του βίντεο με την περιοχή γύρω από το πρόγραμμα αναπαραγωγής.
    Default Volume: Είναι απενεργοποιημένο όσο είναι ενεργή η απομνημόνευση έντασης ήχου. Απενεργοποιήστε την απομνημόνευση έντασης ήχου για να ορίσετε σταθερή αρχική ένταση για κάθε βίντεο.
    Parallel Segment Loading: |
      Πόσα τμήματα βίντεο και ήχου θα φορτώνονται ταυτόχρονα πριν από την αναπαραγωγή.
      Οι υψηλότερες τιμές μπορεί να βοηθήσουν σε αργές ή ασταθείς συνδέσεις, αλλά χρησιμοποιούν περισσότερο εύρος ζώνης και μνήμη.
      Μπορεί επίσης να προκαλέσουν στην Αυτόματη ρύθμιση υποεκτίμηση της ταχύτητας σύνδεσης και επιλογή χαμηλότερης ποιότητας.
      Οι ροές που περιορίζονται σε ένα αίτημα κάθε φορά αγνοούν αυτήν τη ρύθμιση.
    Preload Upcoming Videos: "Ανακτά και αποθηκεύει προσωρινά τις διευθύνσεις yt-dlp των επόμενων βίντεο. Η ουρά προηγείται των λιστών και των προτάσεων."
    Upcoming Videos to Preload: "Ο μέγιστος αριθμός επόμενων βίντεο των οποίων οι διευθύνσεις yt-dlp ανακτώνται στο παρασκήνιο."
    Concurrent Preloads: "Ο μέγιστος αριθμός διεργασιών yt-dlp που χρησιμοποιούνται για την ταυτόχρονη προφόρτωση βίντεο. Οι υψηλότερες τιμές χρησιμοποιούν περισσότερη CPU, μνήμη και εύρος ζώνης δικτύου."
  Download Settings:
    Download Folder: Τα βίντεο αποθηκεύονται σε αυτόν τον φάκελο. Αφήστε το κενό για να χρησιμοποιηθεί ο φάκελος Λήψεις του συστήματός σας.
    Global Additional yt-dlp Arguments: Πρόσθετα ορίσματα γραμμής εντολών που διαβιβάζονται στο yt-dlp για κάθε λήψη, για παράδειγμα --cookies-from-browser firefox.
    Concurrent Downloads: Ο μέγιστος αριθμός εργασιών yt-dlp που μπορούν να εκτελούνται ταυτόχρονα.
    Bandwidth Limit: Περιορίζει τον συνολικό ρυθμό μεταφοράς της ουράς, διαιρώντας αυτό το όριο μεταξύ των ταυτόχρονων εργασιών. Εισαγάγετε 0 για απεριόριστο ρυθμό.
  External Software Settings:
    yt-dlp Source: Το OpenTubeX μπορεί να χρησιμοποιήσει είτε το yt-dlp που είναι εγκατεστημένο στο σύστημά σας είτε να κατεβάσει και να διαχειρίζεται δικό του αντίγραφο του yt-dlp, το οποίο αποθηκεύεται στον κατάλογο δεδομένων χρήστη.
    yt-dlp Channel: Επιλέξτε ποιο κανάλι εκδόσεων yt-dlp θα κατεβάζει και θα διαχειρίζεται το OpenTubeX. Το Stable συνιστάται για τους περισσότερους χρήστες.
    FFmpeg Source: Το OpenTubeX μπορεί να χρησιμοποιήσει είτε τα FFmpeg και FFprobe που είναι εγκατεστημένα στο σύστημά σας είτε να κατεβάσει και να διαχειρίζεται δικές του στατικές εκδόσεις, οι οποίες αποθηκεύονται στον κατάλογο δεδομένων χρήστη.
    Managed Tool Updates: Επιλέξτε αν τα διαχειριζόμενα εργαλεία θα ενημερώνονται αυτόματα, αν θα ζητείται επιβεβαίωση πριν από την ενημέρωση ή αν θα ενημερώνονται μόνο από τα κουμπιά μη αυτόματης ενημέρωσης. Η λήψη εργαλείων που λείπουν εξακολουθεί να γίνεται όταν απαιτούνται.
    yt-dlp Executable Path: Από προεπιλογή, το OpenTubeX θεωρεί ότι το yt-dlp μπορεί να βρεθεί μέσω της μεταβλητής περιβάλλοντος PATH. Αν χρειάζεται, μπορείτε να ορίσετε εδώ μια προσαρμοσμένη διαδρομή.
    Cookie Source: Επιλέξτε αν το yt-dlp θα διαβάζει ένα αρχείο cookie Netscape ή cookie από εγκατεστημένο πρόγραμμα περιήγησης για πιστοποιημένη αναπαραγωγή.
    Cookie File: Επιλέξτε ένα αρχείο cookie σε μορφή Netscape για πιστοποιημένη αναπαραγωγή.
    Browser for Cookies: Η υποστήριξη προγραμμάτων περιήγησης διαβάζεται από το επιλεγμένο εκτελέσιμο yt-dlp. Το OpenTubeX ζητά από το yt-dlp να διαβάσει αυτό το πρόγραμμα περιήγησης όταν ζητείται πιστοποιημένη αναπαραγωγή.
    Browser Profile: Προαιρετικό όνομα ή φάκελος προφίλ προγράμματος περιήγησης. Αφήστε το κενό για να χρησιμοποιηθεί το προφίλ που προσπελάστηκε πιο πρόσφατα.
    Always Use Cookies: Χρησιμοποιεί τα ρυθμισμένα cookie κάθε φορά που το yt-dlp εξάγει ροές. Δεν αλλάζει τη μέθοδο εξαγωγής ροής σε yt-dlp. Με επιλεγμένο το yt-dlp, μπορεί να γίνουν διαθέσιμες μορφές μόνο για λογαριασμούς, όπως ο βελτιωμένος ρυθμός μετάδοσης bit του YouTube Premium, όταν ο λογαριασμός έχει πρόσβαση.
    FFmpeg Executable Path: Το FFmpeg απαιτείται για τη συγχώνευση ξεχωριστών ροών βίντεο και ήχου, καθώς και για τη μετατροπή ήχου. Από προεπιλογή, το OpenTubeX θεωρεί ότι το FFmpeg μπορεί να βρεθεί μέσω της μεταβλητής περιβάλλοντος PATH. Αν χρειάζεται, μπορείτε να ορίσετε εδώ μια προσαρμοσμένη διαδρομή.
  Distraction Free Settings:
    Shorten View Counts: Εμφανίζει σε σύντομη μορφή τα πλήθη προβολών και θετικών ψήφων σχολίων που έχει ήδη στρογγυλοποιήσει το YouTube, π.χ. 14K αντί για 14.000. Τα ακριβή πλήθη εμφανίζονται πάντα ολόκληρα.
  Subscription Settings:
    Fetch Feed on Startup: Όταν είναι ενεργοποιημένο, το OpenTubeX ανακτά αυτόματα τη ροή συνδρομών κατά την εκκίνηση και όταν ανοίγει νέο παράθυρο.
    Show New Content Feed: Εμφανίζει μια καρτέλα «Νέα» με στοιχεία της ροής συνδρομών που δεν υπήρχαν κατά την προηγούμενη ανάκτηση.
    Show New Content Indicators: Εμφανίζει μια μικρή κουκκίδα δίπλα στα στοιχεία της ροής συνδρομών που δεν υπήρχαν κατά την προηγούμενη ανάκτηση.
    Show Scheduled Live Streams / Premieres First: Διατηρεί τις επερχόμενες ζωντανές μεταδόσεις και πρεμιέρες στην κορυφή της ροής συνδρομών. Όταν είναι απενεργοποιημένο, παραμένουν στη θέση ανακοίνωσής τους μέχρι να ξεκινήσουν. Μετά την απενεργοποίηση, ανανεώστε μία φορά τη ροή συνδρομών για να ανακτηθούν οι ημερομηνίες ανακοίνωσης των υπαρχουσών προγραμματισμένων καταχωρίσεων.
    Auto Refresh Interval: "Πόσο συχνά το OpenTubeX ανανεώνει αυτόματα τη ροή συνδρομών όσο η εφαρμογή είναι ανοιχτή. Στο Android, ένα μη μηδενικό διάστημα ανανεώνει τη ροή και όταν η εφαρμογή είναι κλειστή."
    Refresh Subscriptions While App Is Closed: "Επιτρέπει στο Android να ανανεώνει τις ροές συνδρομών στα επιλεγμένα διαστήματα όταν το OpenTubeX είναι κλειστό. Απενεργοποιήστε το για να γίνονται αυτόματες ανανεώσεις μόνο όταν η εφαρμογή είναι ανοιχτή."
  Theme Settings:
    Show Progress as Notification: Εμφανίζει μια μόνιμη ειδοποίηση με ζωντανή πρόοδο για λειτουργίες παρασκηνίου, όπως ανανεώσεις συνδρομών και λήψεις διαχειριζόμενων εργαλείων, αντί για την καθολική γραμμή προόδου.
    Always Show Scrollbars: Διατηρεί τις γραμμές κύλισης πάντα ορατές. Όταν είναι απενεργοποιημένο, εξαφανίζονται λίγο αφού σταματήσετε να κινείτε το ποντίκι και επανεμφανίζονται μόλις το κινήσετε ξανά.
    Scroll Speed: Αλλάζει την απόσταση κύλισης με τη ροδέλα του ποντικιού και τις χειρονομίες ροδέλας της επιφάνειας αφής.
    Use Fixed Tab Width: Δίνει σε κάθε καρτέλα της οριζόντιας γραμμής καρτελών το ίδιο πλάτος, αντί να προσαρμόζει το μέγεθός της στον τίτλο.
    Use Grid Player Menu: Διατάσσει το μενού ρυθμίσεων του προγράμματος αναπαραγωγής βίντεο ως πλέγμα πλακιδίων αντί για λίστα γραμμών.
The playlist is at the beginning. Enable loop to continue playing: Η λίστα αναπαραγωγής βρίσκεται στην αρχή. Ενεργοποιήστε την επανάληψη για να συνεχιστεί η αναπαραγωγή
External link opening has been disabled in Settings → Privacy: Το άνοιγμα εξωτερικών συνδέσμων έχει απενεργοποιηθεί στις Ρυθμίσεις → Απόρρητο
