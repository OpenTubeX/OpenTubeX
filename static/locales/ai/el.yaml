    Clear HTTP Cache: Εκκαθάριση κρυφής μνήμης HTTP
    Clear HTTP Cache Confirmation: Εκκαθάριση της κρυφής μνήμης HTTP του Electron;
    HTTP Cache Effect: Οι εικόνες και άλλοι πόροι δικτύου μπορεί να φορτωθούν πιο αργά μία φορά, μέχρι να αναδημιουργηθεί η κρυφή μνήμη.
