    Playback URL Cache Entry Size Tooltip: Ορίζει το μέγιστο μέγεθος κάθε προσωρινά αποθηκευμένης καταχώρισης ροής yt-dlp. Ορίστε το σε 0 MB για να απενεργοποιήσετε τη μόνιμη προσωρινή αποθήκευση ροών yt-dlp.
