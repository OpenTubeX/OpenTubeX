    Video Metadata Description: Αποθηκεύει παλαιότερους τίτλους, μικρογραφίες και περιγραφές για υποστηριζόμενα βίντεο. Οι παλιές αναθεωρήσεις δεν μπορούν να αναδημιουργηθούν μετά τη διαγραφή.
    Video Metadata Effect: Οι αποθηκευμένες αναθεωρήσεις μεταδεδομένων θα διαγραφούν οριστικά. Τα τρέχοντα στοιχεία βίντεο μπορούν να ανακτηθούν ξανά.
    Watch History: Ιστορικό και στατιστικά παρακολούθησης
    Watch History Description: Το ιστορικό παρακολούθησης καταγράφει τα προβεβλημένα βίντεο και την πρόοδο. Τα στατιστικά παρακολούθησης αποθηκεύουν τα ημερήσια σύνολα προβολής. Η διατήρηση ισχύει μόνο για το ιστορικό παρακολούθησης.
    Clear Watch Statistics: Εκκαθάριση στατιστικών παρακολούθησης
    Watch History Effect: Οι καταχωρίσεις προβεβλημένων βίντεο και η αποθηκευμένη πρόοδος θα διαγραφούν. Τα στατιστικά παρακολούθησης θα διατηρηθούν.
    Clear Watch Statistics Confirmation: Διαγραφή όλων των στατιστικών παρακολούθησης;
    Watch Statistics Effect: Τα ημερήσια σύνολα προβολής θα διαγραφούν. Το ιστορικό παρακολούθησης θα διατηρηθεί.
