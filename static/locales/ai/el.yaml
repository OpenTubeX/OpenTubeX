    Settings And Sessions Description: Αποθηκεύει τις προτιμήσεις εφαρμογής, τις καρτέλες με δυνατότητα επαναφοράς και τις υπενθυμίσεις ζωντανών μεταδόσεων. Ανοίξτε τον κατάλογο προφίλ για να εξετάσετε ή να δημιουργήσετε αντίγραφα ασφαλείας αυτών των αρχείων. Αυτή η σελίδα δεν τα διαγράφει.
