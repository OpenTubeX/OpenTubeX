    Tab Image Cache Description: Αποθηκεύει εικόνες προεπισκόπησης και εικόνες προφίλ καναλιών για ανοιχτές καρτέλες και καρτέλες που έχουν επαναφερθεί. Το OpenTubeX τις αναδημιουργεί καθώς χρησιμοποιούνται οι καρτέλες.
    Clear Tab Image Cache: Εκκαθάριση κρυφής μνήμης εικόνων καρτελών
    Clear Tab Image Cache Confirmation: Εκκαθάριση μικρογραφιών καρτελών και εικόνων προφίλ καναλιών;
    Tab Image Cache Effect: Οι εικόνες καρτελών μπορεί να εξαφανιστούν για λίγο και θα αναδημιουργηθούν καθώς χρησιμοποιούνται οι καρτέλες τους.
