    Session Search Cache Effect: Οι προσωρινά αποθηκευμένες σελίδες αποτελεσμάτων θα απορριφθούν. Το αποθηκευμένο ιστορικό αναζητήσεων δεν θα αλλάξει.
    HTTP Cache: Κρυφή μνήμη HTTP
    HTTP Cache Description: Το Electron αποθηκεύει τις αποκρίσεις δικτύου στον δίσκο, ώστε τα επαναλαμβανόμενα αιτήματα να φορτώνονται χωρίς νέα λήψη των ίδιων δεδομένων. Το OpenTubeX αναδημιουργεί αυτήν την κρυφή μνήμη όταν χρειάζεται.
