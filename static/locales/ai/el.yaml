    Search History Description: Αποθηκεύει τις αναζητήσεις που επιλέξατε να απομνημονεύονται.
    Delete Search History: Διαγραφή ιστορικού αναζητήσεων
    Delete Search History Confirmation: Διαγραφή όλου του αποθηκευμένου ιστορικού αναζητήσεων;
    Search History Effect: Οι αποθηκευμένες προτάσεις από προηγούμενες αναζητήσεις θα εξαφανιστούν. Η κρυφή μνήμη της τρέχουσας συνεδρίας θα διατηρηθεί.
