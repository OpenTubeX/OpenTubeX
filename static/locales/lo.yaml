    Cache Video Metadata: ປະຫວັດຂໍ້ມູນເສີມ
    Cache Video Metadata Tooltip: ເກັບຮັກສາຂໍ້ມູນເສີມທຸກເວີຊັນຂອງວິດີໂອທີ່ທ່ານເຂົ້າເບິ່ງ, ລວມທັງຊື່, ຮູບຕົວຢ່າງ ແລະ ຄຳອະທິບາຍ. ປິດການໃຊ້ງານໄວ້ໂດຍເລີ່ມຕົ້ນ ເພາະການເກັບປະຫວັດຂໍ້ມູນເສີມຈະໃຊ້ເນື້ອທີ່ຈັດເກັບຂໍ້ມູນຫຼາຍຂຶ້ນ.
    Save Watched Progress: ບັນທຶກຄວາມຄືບໜ້າການເບິ່ງ
    Watched Percentage Threshold: ເກນເປີເຊັນການເບິ່ງ
    Watched Percentage Threshold Tooltip: ວິດີໂອຈະຖືກໝາຍວ່າເບິ່ງແລ້ວຫຼັງຈາກເບິ່ງຮອດເປີເຊັນທີ່ເລືອກ ແລະ ເຫຼືອເວລາບໍ່ເກີນ 2 ນາທີ. ທີ່ 0% ຈະຖືກໝາຍເມື່ອເລີ່ມຫຼິ້ນ, ທີ່ 100% ຈະຖືກໝາຍເມື່ອຫຼິ້ນຈົບ.
    Watched Progress Saving Mode:
      Modes:
        Auto: ອັດຕະໂນມັດ
        Semi-auto: ເຄິ່ງອັດຕະໂນມັດ
        Never: ບໍ່ຕ້ອງ
      Tooltip: ອັດຕະໂນມັດ = ບັນທຶກທຸກໆ 2 ວິນາທີໃນຂະນະທີ່ຫຼິ້ນ, ເມື່ອອອກຈາກໜ້າວິດີໂອ, ເມື່ອຢຸດ ຫຼື ວິດີໂອຈົບ. ເຄິ່ງອັດຕະໂນມັດ = ຈະບໍ່ບັນທຶກທຸກໆ 2 ວິນາທີ ຫຼື ເມື່ອອອກຈາກໜ້າ, ແຕ່ສາມາດບັນທຶກດ້ວຍຕົນເອງຜ່ານປຸ່ມ 'ບັນທຶກຄວາມຄືບໜ້າການເບິ່ງ' ທີ່ຢູ່ລຸ່ມຕົວຫຼິ້ນ.
