    Stream Extraction Method: |
      ເລືອກວິທີທີ່ OpenTubeX ໃຊ້ດຶງຂໍ້ມູນການສະຕຣີມວິດີໂອ. ຕ້ອງມີ yt-dlp ຫາກເລືອກໃຊ້ມັນ.
      ວິດີໂອອາດໃຊ້ເວລາເລີ່ມຕົ້ນດົນຂຶ້ນເມື່ອໃຊ້ yt-dlp.
      ລະບົບພາຍໃນບໍ່ຮອງຮັບການເລື່ອນເວລາສຳລັບໄລຟ໌ ແລະ ວິດີໂອພຣີເມຍ.
    Avoid translation: |
      ປິດການແປອັດຕະໂນມັດຂອງ YouTube ສຳລັບຊື່, ຄຳອະທິບາຍ ແລະ ບົດຂອງວິດີໂອ.
      ການຮ້ອງຂໍຂໍ້ມູນຫຼາຍເກີນໄປ ອາດສົ່ງຜົນກະທົບຕໍ່ຄວາມສະຖຽນ
      ຂອງແອັບຊົ່ວຄາວ.
    Preferred API Backend: ເລືອກ Backend ທີ່ OpenTubeX ໃຊ້ເພື່ອດຶງຂໍ້ມູນ. Local API ແມ່ນຕົວດຶງຂໍ້ມູນພາຍໃນ. Invidious API ຕ້ອງມີການເຊື່ອມຕໍ່ກັບເຊີບເວີ Invidious.
    Fallback to Non-Preferred Backend on Failure: ເມື່ອ API ທີ່ທ່ານເລືອກມີບັນຫາ, OpenTubeX ຈະພະຍາຍາມໃຊ້ API ອື່ນເປັນຕົວສຳຮອງໂດຍອັດຕະໂນມັດ ຫາກເປີດໃຊ້ງານນີ້ໄວ້.
    Thumbnail Preference: ຮູບຕົວຢ່າງທັງໝົດໃນ OpenTubeX ຈະຖືກແທນທີ່ດ້ວຍເຟຣມຂອງວິດີໂອ, ເຮັດໃຫ້ມົວ ຫຼື ເຊື່ອງໄວ້ ແທນທີ່ຈະໃຊ້ຮູບຕົວຢ່າງເລີ່ມຕົ້ນ.
    Show Thumbnail Previews: ສະແດງພາບຕົວຢ່າງທີ່ເຄື່ອນໄຫວໄດ້ເມື່ອວາງເມົາສ໌ເທິງຮູບຕົວຢ່າງວິດີໂອ.
    Startup Behavior: |
      ເລືອກສິ່ງທີ່ OpenTubeX ຈະເຮັດເມື່ອເລີ່ມຕົ້ນ.
      ໂຫຼດແທັບທັງໝົດ: ກູ້ຄືນທຸກແທັບທັນທີ, ແຕ່ແທັບພື້ນຫຼັງຈະບໍ່ຫຼິ້ນວິດີໂອອັດຕະໂນມັດ.
      ໂຫຼດແທັບທີ່ເຄີຍໂຫຼດ: ໂຫຼດສະເພາະແທັບທີ່ເຄີຍຖືກໂຫຼດກ່ອນປິດແອັບ.
      ໂຫຼດແທັບທີ່ໃຊ້ງານລ່າສຸດ: ກູ້ຄືນເຊດຊັນກ່ອນໜ້າໂດຍເປີດແທັບອື່ນໄວ້ແຕ່ຍັງບໍ່ໂຫຼດ; ພວກມັນຈະໂຫຼດເມື່ອທ່ານຄລິກ.
      ເລີ່ມຕົ້ນເຊດຊັນຫວ່າງເປົ່າ: ຂ້າມແທັບທີ່ບັນທຶກໄວ້ ແລະ ເປີດໜ້າຕ່າງໃໝ່.
    Invidious Instance: Invidious instance ທີ່ OpenTubeX ຈະເຊື່ອມຕໍ່ເພື່ອຮ້ອງຂໍ API. ການປ່ຽນແປງນີ້ຈະມີຜົນສະເພາະໜ້າຕ່າງປັດຈຸບັນ ເວັ້ນເສຍແຕ່ທ່ານຈະຕັ້ງຄ່າໃຫ້ມັນເປັນຄ່າເລີ່ມຕົ້ນ.
