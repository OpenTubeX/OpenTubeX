    External Link Handling: |
      ເລືອກການເຮັດວຽກເລີ່ມຕົ້ນເມື່ອຄລິກລິ້ງທີ່ບໍ່ສາມາດເປີດໃນ OpenTubeX ໄດ້.
      ໂດຍປົກກະຕິ OpenTubeX ຈະເປີດລິ້ງນັ້ນໃນບຣາວເຊີເລີ່ມຕົ້ນຂອງທ່ານ.
    Open Deep Links In New Window: URL ທີ່ສົ່ງມາໃຫ້ OpenTubeX (ເຊັ່ນຈາກສ່ວນເສີມບຣາວເຊີ) ຈະຖືກເປີດໃນໜ້າຕ່າງໃໝ່.
    Remember Tab Navigation History: ປະຫວັດການເຂົ້າເບິ່ງໄປໜ້າ ແລະ ຖອຍຫຼັງຂອງແຕ່ລະແທັບຈະຖືກບັນທຶກ ແລະ ກູ້ຄືນເມື່ອ OpenTubeX ເລີ່ມໃໝ່.
