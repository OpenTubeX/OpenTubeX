    Automatic Downloads Description: ເລືອກຮູບແບບການດາວໂຫຼດ ແລະ ຕົວຕອງສຳລັບແຕ່ລະຊ່ອງທີ່ທ່ານຕິດຕາມ. ວິດີໂອທີ່ກົງກັບເງື່ອນໄຂຈະຖືກດາວໂຫຼດໄວ້ໃນພື້ນຫຼັງເມື່ອມີການອັບເດດ.
    Automatic Downloads New Only: ການເປີດໃຊ້ງານຈະເລີ່ມຈາກວິດີໂອທີ່ອັບໂຫຼດໃໝ່ຖັດໄປ. ວິດີໂອທີ່ມີຢູ່ແລ້ວ ແລະ ວິດີໂອເກົ່າຈະບໍ່ຖືກດາວໂຫຼດ.
    Automatic Downloads No Channels: ກະລຸນາຕິດຕາມຊ່ອງກ່ອນທີ່ຈະຕັ້ງຄ່າການດາວໂຫຼດອັດຕະໂນມັດ.
    No Matching Automatic Download Channels: ບໍ່ພົບຊ່ອງທີ່ກົງກັບການຄົ້ນຫາຂອງທ່ານ.
    Automatic Downloads Livestreams: ໄລ້ສົດ (Livestreams)
