  Welcome:
    Title: ຍິນດີຕ້ອນຮັບສູ່ OpenTubeX
    Description: ນີ້ຄືປຸ່ມຄວບຄຸມບາງຢ່າງທີ່ຈະຊ່ວຍໃຫ້ທ່ານຄຸ້ນເຄີຍກັບການໃຊ້ງານ.
  Navigation:
    Title: ຄັງສະສົມຂອງທ່ານຢູ່ໃກ້ຕົວສະເໝີ
    Description: ໃຊ້ການນຳທາງເພື່ອໄປຫາການຕິດຕາມ, ເພລລິສ, ປະຫວັດ ແລະ ອື່ນໆ.
  Search:
    Title: ຄົ້ນຫາ ຫຼື ວາງລີ້ງ
    Description: ຄົ້ນຫາວິດີໂອ ແລະ ຊ່ອງ, ຫຼື ວາງ URL ວິດີໂອທີ່ຮອງຮັບລົງໃນຊ່ອງຄົ້ນຫາໂດຍກົງ.
  Tabs:
    Title: ເປີດໜ້າຕ່າງໆໄວ້ໃນແທັບ
    Description: ເປີດຫຼາຍໜ້າພ້ອມກັນໄດ້ໂດຍບໍ່ເສຍຕຳແໜ່ງທີ່ທ່ານເບິ່ງຢູ່. ເລືອກບ່ອນຈັດວາງແທັບທີ່ເໝາະສົມກັບຮູບແບບຂອງທ່ານ.
  Quick Settings:
    Title: ປັບແຕ່ງໃນແບບຂອງທ່ານ
    Description: ເລືອກທີມ (Theme) ແລະ ຄຸນນະພາບວິດີໂອເລີ່ມຕົ້ນ. ທ່ານສາມາດປ່ຽນການຕັ້ງຄ່າໄດ້ຈາກເມນູໂປຣໄຟລ໌ ຫຼື ຄລິກຂວາເພື່ອສະຫຼັບໂປຣໄຟລ໌.
  Import Data:
    Title: ນຳຂໍ້ມູນຂອງທ່ານຕິດຕົວໄປນຳ
    Description: ສາມາດເລືອກນຳເຂົ້າການຕິດຕາມ, ປະຫວັດ, ເພລລິສ ຈາກແອັບອື່ນທີ່ຮອງຮັບ ຫຼື ຈາກໄຟລ໌ສຳຮອງ.
    Action: ນຳເຂົ້າຂໍ້ມູນ
    Not Now: ຍັງບໍ່ແມ່ນຕອນນີ້
  Settings Moved:
    Title: ການຕັ້ງຄ່າຖືກຍ້າຍແລ້ວ
    Description: ເລືອກໂປຣໄຟລ໌ຂອງທ່ານຢູ່ມຸມຂວາເທິງເພື່ອການຄວບຄຸມທີ່ວ່ອງໄວ. ຄລິກຂວາໃສ່ເພື່ອໄປຫາໜ້າການເລືອກໂປຣໄຟລ໌ໂດຍກົງ. ໄອຄອນຟັນເຟືອນໃນເມນູນັ້ນຈະເປີດການຕັ້ງຄ່າທັງໝົດ, ສ່ວນໜ້າ 'ກ່ຽວກັບ' ແລະ 'ການດາວໂຫຼດ' ກໍໄດ້ຍ້າຍມາຢູ່ໃນເມນູນີ້ຄືກັນ.
