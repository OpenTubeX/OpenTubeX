    Session Search Cache Effect: Zwischengespeicherte Ergebnisseiten werden verworfen. Der gespeicherte Suchverlauf wird nicht geändert.
    HTTP Cache: HTTP-Cache
    HTTP Cache Description: Electron speichert Netzwerkantworten auf der Festplatte, damit wiederholte Anfragen ohne erneutes Herunterladen derselben Daten geladen werden können. OpenTubeX erstellt diesen Cache bei Bedarf neu.
    Managed By Electron: Von Electron verwaltet
    Clear HTTP Cache: HTTP-Cache leeren
    Clear HTTP Cache Confirmation: HTTP-Cache von Electron leeren?
    HTTP Cache Effect: Bilder und andere Netzwerkressourcen können einmalig langsamer laden, während der Cache neu erstellt wird.
    Tab Image Cache: Tab-Vorschaubilder und Kanalavatare
    Tab Image Cache Description: Speichert Vorschaubilder und Kanalavatare für geöffnete und wiederhergestellte Tabs. OpenTubeX erstellt sie bei der Nutzung der Tabs neu.
    Clear Tab Image Cache: Tab-Bildcache leeren
    Clear Tab Image Cache Confirmation: Tab-Vorschaubilder und Kanalavatare löschen?
    Tab Image Cache Effect: Tab-Bilder können kurzzeitig verschwinden und werden bei der Nutzung ihrer Tabs neu erstellt.
    Playback Caches: Wiedergabe-Caches
    Playback Caches Description: Speichert yt-dlp-Stream-URLs sitzungsübergreifend sowie YouTube-Playerdateien. Der URL-Cache gilt nur für Streams, die mit yt-dlp abgerufen werden.
    Playback URL Cache Entry Size: Cache-Limit für yt-dlp-Stream-URLs
    Playback URL Cache Entry Size Tooltip: Legt die maximale Größe eines zwischengespeicherten yt-dlp-Stream-Eintrags fest. Setze den Wert auf 0 MB, um die dauerhafte Zwischenspeicherung von yt-dlp-Streams zu deaktivieren.
    Clear Playback Caches: Wiedergabe-Caches leeren
    Clear Playback Caches Confirmation: yt-dlp- und Player-Caches leeren?
    Playback Caches Effect: Die nächste lokale Wiedergabe kann länger dauern, während Stream- und Playerdaten erneut abgerufen werden.
    Clear Cache: Cache leeren
    History Data: Gespeicherte Verläufe
    Video Metadata Description: Speichert frühere Titel, Vorschaubilder und Beschreibungen unterstützter Videos. Alte Versionen können nach dem Löschen nicht wiederhergestellt werden.
    Video Metadata Effect: Gespeicherte Metadatenversionen werden dauerhaft gelöscht. Aktuelle Videodetails können weiterhin erneut abgerufen werden.
    Watch History: Wiedergabeverlauf und -statistiken
    Watch History Description: Im Wiedergabeverlauf werden angesehene Videos und der Fortschritt gespeichert. Wiedergabestatistiken enthalten die täglichen Wiedergabezeiten. Die Aufbewahrungsdauer gilt nur für den Wiedergabeverlauf.
    Clear Watch Statistics: Wiedergabestatistiken löschen
    Watch History Effect: Einträge angesehener Videos und gespeicherter Fortschritt werden gelöscht. Wiedergabestatistiken bleiben erhalten.
    Clear Watch Statistics Confirmation: Alle Wiedergabestatistiken löschen?
    Watch Statistics Effect: Tägliche Wiedergabezeiten werden gelöscht. Der Wiedergabeverlauf bleibt erhalten.
    Search History: Suchverlauf
    Search History Description: Speichert Suchanfragen, die du behalten möchtest.
    Delete Search History: Suchverlauf löschen
    Delete Search History Confirmation: Den gesamten gespeicherten Suchverlauf löschen?
    Search History Effect: Gespeicherte Suchvorschläge aus früheren Suchanfragen verschwinden. Der Cache der aktuellen Sitzung bleibt erhalten.
    Other User Data: Andere Benutzerdaten
    Other Profile Files: Andere Profildateien
    Other Profile Files Hint: Sicherungen, temporäre Dateien und Profileinträge, die OpenTubeX noch nicht erkennt.
    Subscriptions And Profiles: Abos und Profile
    Subscriptions And Profiles Description: Speichert abonnierte Kanäle, Profilnamen und Profilzugehörigkeiten.
    Subscriptions And Profiles Effect: Alle Abos und zusätzlichen Profile werden dauerhaft gelöscht. Feed-Cache-Daten werden ebenfalls gelöscht.
    Playlists Description: Speichert Namen und Beschreibungen von Playlists sowie darin gespeicherte Videos.
    Playlists Effect: Jede Playlist und ihre gespeicherten Videos werden dauerhaft gelöscht. Heruntergeladene Mediendateien bleiben erhalten.
    Settings And Sessions: Einstellungen, Tab-Sitzungen und Erinnerungen
    Settings And Sessions Description: Speichert Anwendungseinstellungen, wiederherstellbare Tabs und Livestream-Erinnerungen. Öffne das Profilverzeichnis, um diese Dateien zu prüfen oder zu sichern; auf dieser Seite werden sie nicht gelöscht.
