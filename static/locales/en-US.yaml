#Tooltips
Tooltips:
  General Settings:
    Update Relative Timestamps: Updates relative timestamps throughout the app while a page remains open. When disabled, they update only after reloading or revisiting the page.
    Stream Extraction Method: |
      Choose how OpenTubeX obtains video streams. yt-dlp must be available when selected.
      Built-in does not support seeking for livestreams and premieres.
    Avoid translation: |
      Disable YouTube's autotranslation of title, description and chapters of a video.
      Too many requests, such as fetching video titles across lists, may temporarily
      impact app reliability.
    Preferred API Backend: Choose the backend that OpenTubeX uses to obtain data. The
      local API is a built-in extractor. The Invidious API requires an Invidious server
      to connect to.
    Fallback to Non-Preferred Backend on Failure: When your preferred API has a problem,
      OpenTubeX will automatically attempt to use your non-preferred API as a fallback
      method when enabled.
    Thumbnail Preference: All thumbnails throughout OpenTubeX will be replaced with
      a frame of the video, blurred or hidden instead of the default thumbnail.
    Startup Behavior: |
      Choose what OpenTubeX does when it starts.
      Load all tabs restores every saved tab immediately, but background tabs will not autoplay videos.
      Load previously loaded tabs reloads the tabs that were loaded when OpenTubeX closed and keeps the others unloaded.
      Load last active tab restores the previous session with the other tabs opened but unloaded; they load when you click them.
      Start with an empty session skips the saved tabs and opens a fresh window.
    Invidious Instance: The Invidious instance that OpenTubeX will connect to for API
      calls.
    Region for Trending: The region of trends allows you to pick which country's trending
      videos you want to have displayed.
    External Link Handling: |
      Choose the default behavior when a link, which cannot be opened in OpenTubeX, is clicked.
      By default OpenTubeX will open the clicked link in your default browser.
    Open Deep Links In New Window: URLs passed to OpenTubeX, such as by redirect
      browser extensions or command line arguments, are opened in a new window.
    Remember Tab Navigation History: Each tab's back and forward navigation history
      is saved and restored when OpenTubeX restarts.
  Proxy Settings:
    IP Block Recovery Script Path: Script file path to run when an IP block is detected. OpenTubeX waits for it to finish, then reloads the video. If fallback is enabled, it runs only when fallback also fails.
  Player Settings:
    Enable Caption Translations: When enabled, the captions button and C shortcut prefer an automatically translated track in the preferred caption language when the video does not provide a matching original track.
    Proxy Videos Through Invidious: Will connect to Invidious to serve videos instead
      of making a direct connection to YouTube.
    Default Video Format: Set the formats used when a video plays. DASH formats can
      play higher qualities. Legacy formats are limited to a max of 360p but use less
      bandwidth. Audio formats are audio only streams.
    Use Quick Playback Speed Bar: Shows a quick playback speed bar in the player controls on the right side. If manual per-channel playback speed saving is enabled, the bar also includes the button to save the speed for the current channel.
    Scroll Playback Rate Over Video Player: While the cursor is over the video, press and
      hold the Control key (Command Key on Mac) and scroll the mouse wheel forwards or backwards to control
      the playback rate. Press and hold the Control key (Command Key on Mac) and left click the mouse
      to quickly return to the default playback rate (1x unless it has been changed in the settings).
    Skip by Scrolling Over Video Player: Use the scroll wheel to skip through the video, MPV style.
    Multiply Seek Interval by Playback Rate: When enabled, seek intervals (arrow keys and J/L) are multiplied by the current playback rate. When disabled, seek intervals remain constant regardless of playback rate.
    Show Playback Rate Adjusted Timestamp: When enabled and playback speed differs from 1x, the player shows playback-rate-adjusted timestamps in parentheses after the normal timestamp display.
    Use YouTube-style Shorts: Displays Shorts in a portrait grid on subscription and channel pages and uses the YouTube-style Shorts player.
    Loop Shorts: When enabled, Shorts restart automatically. When disabled, Shorts stop at the end and show a replay button.
    Show Fast-Forward Through Silence Toggle: Shows an on/off toggle for fast-forwarding through silence in the player's settings menu.
    Enable Video Zoom: Shows the Zoom control in the player's settings menu and enables its keyboard shortcuts and panning controls.
    Voice-over Translation: Sends the video ID, duration, and selected language to the unofficial Yandex voice-over translation service when you request a translation. Disabled by default.
    Hold to Double Playback Speed: Hold the Spacebar or left mouse button over the player to temporarily double the current playback speed.
    Ambient Mode: Blends the video's colors into the area around the player.
    Default Volume: Disabled while Remember Volume is enabled. Turn off Remember Volume to set a fixed startup volume for each video.
    Parallel Segment Loading: |
      How many video and audio segments to load at once ahead of playback.
      Higher values may help on slow or unstable connections, but use more bandwidth and memory.
      They may also make Auto underestimate the connection speed and select a lower quality.
      Streams limited to one request at a time ignore this setting.
  External Player Settings:
    External Player: Choosing an external player will display an icon, for opening the
      video (playlist if supported) in the external player, on the thumbnail. Warning, Invidious settings do not affect external players.
    Custom External Player Executable: By default, OpenTubeX will assume that the chosen external
      player can be found via the PATH environment variable. If needed, a custom path can
      be set here.
    Ignore Warnings: Suppress warnings for when the current external player does not support
      the current action (e.g. reversing playlists, etc.).
    Ignore Default Arguments: Do not send any default arguments to the external player
      aside from the video URL (e.g. playback rate, playlist URL, etc.).
      Custom arguments will still be passed on.
    Custom External Player Arguments: Any custom command line arguments you want to be passed on to the external player.
    DefaultCustomArgumentsTemplate: "(Default: '{defaultCustomArguments}')"
  Download Settings:
    Download Folder: Videos are saved to this folder. Leave blank to use your system's Downloads folder.
  External Software Settings:
    yt-dlp Source: OpenTubeX can either use the yt-dlp installed on your system or download
      and manage its own copy of yt-dlp, which is stored in the user data directory.
    yt-dlp Channel: Select which yt-dlp release channel OpenTubeX downloads and manages.
      Stable is recommended for most users.
    FFmpeg Source: OpenTubeX can either use FFmpeg and FFprobe installed on your system or
      download and manage its own static builds, which are stored in the user data directory.
    yt-dlp Executable Path: By default, OpenTubeX will assume that yt-dlp can be found via
      the PATH environment variable. If needed, a custom path can be set here.
    FFmpeg Executable Path: FFmpeg is required for merging separate video and audio streams
      and for audio conversion. By default, OpenTubeX will assume that FFmpeg can be found
      via the PATH environment variable. If needed, a custom path can be set here.
  Distraction Free Settings:
    Shorten View Counts: Shows view counts that YouTube has already rounded in a shortened form, e.g. 14K instead of 14,000. Exact view counts are always shown in full.
    Hide Channels: Enter a channel ID to hide all videos, playlists and the channel itself from appearing in search, trending, most popular and recommended.
       The channel ID entered must be a complete match and is case sensitive.
    Hide Subscriptions Live: 'This setting is overridden by the app-wide "{appWideSetting}" setting, in the "{subsection}" section of the "{settingsSection}"'
    Hide Videos, Playlists and Channels Containing Text: Enter a word, word fragment, or phrase (case insensitive) to hide all videos, playlists and channels whose original titles contain it throughout all of OpenTubeX, excluding only History, Your Playlists, and videos inside of playlists.
    Hide Videos on Watch: 'Hides watched videos from the Videos, Shorts, and Live tabs on the Subscription and Channel pages. This does not affect the Home tab on Channel pages'
  Subscription Settings:
    Fetch Feeds from RSS: When enabled, OpenTubeX will use RSS instead of its default
      method for grabbing your subscription feed. RSS is faster and prevents IP blocking,
      but doesn't provide certain information like video duration, live status or posts
    Fetch Feed on Startup: When enabled, OpenTubeX will automatically fetch
      your subscription feed on startup and when a new window is opened.
    Show New Content Feed: Shows a New tab containing subscription feed items that were not present during the previous fetch.
    Show New Content Indicators: Shows a small dot beside subscription feed items that were not present during the previous fetch.
    Auto Refresh Interval: How often OpenTubeX automatically refreshes your subscription feed while the app is open.
  Theme Settings:
    Show Progress as Notification: Shows a persistent notification with live progress for background operations, such as subscription refreshes and managed tool downloads, instead of using the global progress bar.
    Always Show Scrollbars: Keeps the scrollbars visible at all times. When disabled, they fade out shortly after you stop moving the mouse and reappear as soon as you move it again.
    Use Fixed Tab Width: Gives every tab in the horizontal tab bar the same width instead of sizing them to their title.
    Use Grid Player Menu: Arranges the video player's settings menu as a grid of tiles instead of a list of rows.
  Experimental Settings:
    Replace HTTP Cache: Disables Electron's disk based HTTP cache and enables a custom in-memory image cache. Will lead to increased RAM usage.
  SponsorBlock Settings:
    UseDeArrowTitles: Replace video titles with user-submitted titles from DeArrow.
    UseDeArrowThumbnails: Replace video thumbnails with thumbnails from DeArrow.

