# OpenTubeX web app with its own Invidious server.
#
# 1. Put two different random 16-character keys in a .env file next to this file:
#      INVIDIOUS_HMAC_KEY=...
#      INVIDIOUS_COMPANION_KEY=...
#    For example, generate each with `openssl rand -hex 8`.
# 2. Run `docker compose up -d` and open http://localhost:8080.
#
# Browsers only store app data on secure origins. To use OpenTubeX from other
# devices, serve it over HTTPS, for example with Tailscale Serve, Cloudflare
# Tunnel, or your own reverse proxy.

services:
  opentubex:
    image: ghcr.io/opentubex/opentubex-web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPENTUBEX_PORT:-8080}:80"
    depends_on:
      invidious:
        condition: service_healthy

  invidious:
    image: quay.io/invidious/invidious:latest
    restart: unless-stopped
    environment:
      # Leave `domain` unset so Invidious returns relative URLs, which resolve
      # to whatever address OpenTubeX is opened on.
      INVIDIOUS_CONFIG: |
        db:
          dbname: invidious
          user: kemal
          password: kemal
          host: invidious-db
          port: 5432
        check_tables: true
        invidious_companion:
          - private_url: "http://companion:8282/companion"
        invidious_companion_key: "${INVIDIOUS_COMPANION_KEY:?Set INVIDIOUS_COMPANION_KEY in .env}"
        hmac_key: "${INVIDIOUS_HMAC_KEY:?Set INVIDIOUS_HMAC_KEY in .env}"
        login_enabled: false
    healthcheck:
      test: wget -nv --tries=1 --spider http://127.0.0.1:3000/api/v1/trending || exit 1
      interval: 30s
      timeout: 5s
      retries: 2
      start_period: 60s
    depends_on:
      invidious-db:
        condition: service_healthy

  companion:
    image: quay.io/invidious/invidious-companion:latest
    restart: unless-stopped
    environment:
      SERVER_SECRET_KEY: "${INVIDIOUS_COMPANION_KEY:?Set INVIDIOUS_COMPANION_KEY in .env}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - companion-cache:/var/tmp/youtubei.js:rw

  invidious-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: invidious
      POSTGRES_USER: kemal
      POSTGRES_PASSWORD: kemal
    volumes:
      - invidious-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  companion-cache: {}
  invidious-db: {}
